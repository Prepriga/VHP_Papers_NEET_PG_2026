n**A 30-year-old male presents with a high fever, generalized lymphadenopathy, and a distinct, black, necrotic eschar at the site of a recent mite bite on his leg. A Weil-Felix test shows positive OX-K agglutination. What is the SINGLE BEST treatment?**\nA) Azithromycin\nB) Chloramphenicol\nC) Doxycycline\nD) Ciprofloxacin\n\n**Answer: C** — **Scrub Typhus** (Orientia tsutsugamushi)—Transmitted by chiggers (mite larvae). The pathognomonic sign is the black eschar. **Doxycycline** is the highly effective, gold-standard therapy for all rickettsial diseases.\n\n---\n\n### Q7. \n**A 65-year-old female presents with a sudden onset of severe, unilateral throbbing headache, jaw pain when chewing (claudication), and proximal muscle stiffness (polymyalgia rheumatica). Her temporal artery is visibly engorged and tender to the touch. What is the SINGLE BEST, most urgent management to prevent permanent, irreversible blindness?**\nA) NSAIDs (e.g., Indomethacin)\nB) High-dose systemic Corticosteroids (e.g., Prednisone)\nC) Temporal artery biopsy before initiating any therapy\nD) Methotrexate\n\n**Answer: B** — **Giant Cell (Temporal) Arteritis**—A medical emergency. Ischemic optic neuropathy can cause sudden, irreversible blindness. **High-dose Corticosteroids** must be started immediately based on clinical suspicion, *before* obtaining the confirmatory biopsy.\n\n---\n\n### Q8. \n**A 55-year-old male with known Graves' disease presents to the ER with a towering fever (40°C), extreme tachycardia (HR 170 bpm), profound agitation, and delirium. He has prominent exophthalmos and a diffuse goiter. What is the SINGLE BEST first-line anti-thyroid medication for this life-threatening crisis?**\nA) Radioactive Iodine ablation\nB) Methimazole monotherapy\nC) Propylthiouracil (PTU)\nD) Saturated Solution of Potassium Iodide (SSKI) given first\n\n**Answer: C** — **Thyroid Storm**—**PTU** is the specific drug of choice because it not only blocks new thyroid hormone synthesis but crucially *also inhibits the peripheral conversion of T4 to the more active T3* (unlike Methimazole).\n\n---\n\n### Q9. \n**A 28-year-old female with a long history of systemic lupus erythematosus (SLE) presents with a sudden onset of severe headache, visual hallucinations, confusion, and a generalized seizure. MRI reveals diffuse cerebral vasculitis. What is the SINGLE BEST, definitive induction immunosuppressive therapy?**\nA) Rituximab monotherapy\nB) High-dose intravenous Corticosteroids combined with Cyclophosphamide\nC) Mycophenolate mofetil (MMF)\nD) Azathioprine\n\n**Answer: B** — **Severe CNS Lupus (Cerebral Vasculitis)**—Life-threatening organ involvement in SLE requires the most potent, aggressive induction therapy available: **Intravenous pulse Cyclophosphamide combined with high-dose Corticosteroids**.\n\n---\n\n### Q10. \n**A 65-year-old male with poorly controlled type 2 diabetes presents with excruciating, deep-seated left ear pain, purulent discharge, and a swollen, erythematous pinna. Examination reveals granulation tissue on the floor of the external auditory canal. Cranial nerve VII palsy is developing. What is the MOST LIKELY causative organism?**\nA) Staphylococcus aureus\nB) Aspergillus niger\nC) Pseudomonas aeruginosa\nD) Proteus mirabilis\n\n**Answer: C** — **Malignant (Necrotizing) Otitis Externa**—An aggressive osteomyelitis of the skull base occurring almost exclusively in elderly diabetics, virtually 100% caused by **Pseudomonas aeruginosa**.\n\n---\n\n### Q11. \n**A 30-year-old female presents with a sudden onset of unilateral blurred vision, painful eye movements, and a clumsy, uncoordinated gait. MRI shows distinct T2 hyperintensities (Dawson's fingers) in the periventricular white matter. CSF reveals oligoclonal IgG bands. Following resolution of this acute attack with steroids, what is the classic FIRST-LINE disease-modifying therapy to prevent future relapses?**\nA) Intravenous Immunoglobulin (IVIG)\nB) Interferon-beta\nC) Natalizumab\nD) High-dose oral Prednisone\n\n**Answer: B** — **Relapsing-Remitting Multiple Sclerosis (RRMS)**—**Interferon-beta** (or Glatiramer acetate) is the foundational, classic first-line disease-modifying therapy to reduce the frequency of clinical exacerbations.\n\n---\n\n### Q12. \n**A 70-year-old male with severe hypertension and diabetes presents with acute onset of vertigo, severe nausea, and diplopia. Neurological exam reveals a classic crossed sensory loss (loss of pain/temperature on the right side of the face, and left side of the body), hoarseness, and an ipsilateral right Horner's syndrome. What is the MOST LIKELY vascular territory affected?**\nA) Middle Cerebral Artery (MCA)\nB) Anterior Cerebral Artery (ACA)\nC) Posterior Inferior Cerebellar Artery (PICA)\nD) Basilar Artery\n\n**Answer: C** — **Lateral Medullary (Wallenberg) Syndrome**—Caused by occlusion of the vertebral artery or the **Posterior Inferior Cerebellar Artery (PICA)**. The hallmark is the \"crossed\" sensory loss and ipsilateral Horner's.\n\n---\n\n### Q13. \n**A 40-year-old male with a history of recurrent calcium phosphate kidney stones presents with profound muscle weakness. Labs reveal a serum potassium of 2.8 mEq/L, a serum bicarbonate of 14 mEq/L, and a strictly Normal Anion Gap. Urine pH is abnormally high at 6.8. What is the MOST LIKELY diagnosis?**\nA) Diabetic Ketoacidosis\nB) Type II (Proximal) Renal Tubular Acidosis\nC) Type I (Distal) Renal Tubular Acidosis\nD) Type IV Renal Tubular Acidosis\n\n**Answer: C** — **Type I (Distal) RTA**—Characterized by a Normal Anion Gap Metabolic Acidosis (NAGMA), severe hypokalemia, the inability to acidify urine (pH >5.5), and a high propensity for forming **calcium phosphate kidney stones**.\n\n---\n\n### Q14. \n**A 55-year-old male with severe psoriasis has been taking high-dose Methotrexate. He develops a severe, dry cough, fever, and progressive dyspnea. Chest X-ray shows diffuse bilateral interstitial infiltrates. What is the SINGLE BEST pharmacological rescue agent to reverse severe methotrexate toxicity and bone marrow suppression?**\nA) Folic acid\nB) N-acetylcysteine (NAC)\nC) Leucovorin (Folinic acid)\nD) Vitamin B12\n\n**Answer: C** — **Methotrexate Toxicity**—Methotrexate irreversibly binds dihydrofolate reductase. **Leucovorin (Folinic acid)** provides the active, fully reduced form of folate that entirely bypasses the blocked enzyme, rescuing normal cells.\n\n---\n\n### Q15. \n**A 35-year-old male presents with a high fever, severe myalgia, rigidity, and altered sensorium following a mosquito bite during a rural trip to Southeast Asia. A serum sample is positive for specific IgM antibodies against a Flavivirus. What is the SINGLE BEST management strategy for Japanese Encephalitis?**\nA) Immediate administration of Intravenous Ribavirin\nB) Intensive supportive care (airway protection, seizure control, ICP management)\nC) High-dose Interferon-alpha\nD) Systemic Corticosteroids\n\n**Answer: B** — **Japanese Encephalitis**—There is absolutely no specific antiviral therapy available for JE. Treatment is entirely focused on **aggressive supportive care** in an ICU setting.\n\n---\n\n### Q16. \n**A 28-year-old female with known systemic lupus erythematosus (SLE) presents with severe fatigue and jaundice. Labs confirm a profound Autoimmune Hemolytic Anemia (AIHA) with a strongly positive Direct Coombs test. She is initially stabilized on high-dose Prednisone. What is the SINGLE BEST classic, long-term, steroid-sparing immunosuppressant agent to maintain remission?**\nA) Azathioprine\nB) Hydroxychloroquine\nC) Cyclophosphamide\nD) Methotrexate\n\n**Answer: A** — **SLE-associated AIHA**—To avoid the catastrophic long-term side effects of chronic high-dose steroids, **Azathioprine** is the classic, highly effective steroid-sparing agent utilized to maintain hematological remission in SLE.\n\n---\n\n### Q17. \n**A 45-year-old male with a long history of severe alcohol abuse is admitted to the ICU with acute necrotizing pancreatitis. On day 3, he develops severe muscle cramping, perioral tingling, and a prolonged QT interval on his ECG. Chvostek's sign is positive. What is the SINGLE BEST underlying pathophysiological mechanism for this specific electrolyte derangement?**\nA) Malabsorption of Vitamin D from the inflamed gut\nB) Saponification (Binding of circulating serum calcium to free fatty acids released by pancreatic lipase into the retroperitoneum)\nC) Sudden destruction of the parathyroid glands\nD) Massive renal wasting of calcium\n\n**Answer: B** — **Hypocalcemia in Acute Pancreatitis**—Pancreatic lipase digests peripancreatic fat into free fatty acids, which rapidly bind and precipitate circulating calcium (a process called **saponification**), severely depleting serum calcium levels.\n\n---\n\n### Q18. \n**A 25-year-old male with asthma is prescribed an oral methylxanthine (Theophylline). He presents to the ER with severe nausea, intractable vomiting, intense tremors, and a tachyarrhythmia. Serum theophylline level is critically toxic at 35 mcg/mL. What is the SINGLE BEST, most effective immediate decontamination management?**\nA) Emergency Hemodialysis\nB) Administration of Intravenous Flumazenil\nC) Administration of multiple doses of Oral Activated Charcoal\nD) Intravenous administration of Diazepam alone\n\n**Answer: C** — **Theophylline Toxicity**—Because theophylline undergoes significant enterohepatic recirculation, **multiple-dose activated charcoal** acts as a \"gut dialysis\" system, effectively pulling the drug out of the bloodstream and binding it in the gut.\n\n---\n\n### Q19. \n**A 60-year-old female with end-stage renal disease (ESRD) on hemodialysis presents with severe secondary hyperparathyroidism. Labs show a serum phosphate of 8.0 mg/dL and a serum calcium of 9.5 mg/dL. Her nephrologist prescribes Sevelamer. What is the SINGLE BEST physiological advantage of this specific drug over traditional binders?**\nA) It is vastly cheaper and better tolerated by the GI tract\nB) It actively dissolves existing bone calcifications\nC) It contains no calcium, thereby avoiding the massive risk of metastatic vascular and cardiac calcification\nD) It simultaneously acts as an active Vitamin D analog\n\n**Answer: C** — **Sevelamer**—A purely synthetic polymer that binds phosphate in the gut. Because it **contains absolutely zero calcium**, it perfectly avoids the deadly complication of widespread vascular calcification seen with calcium-carbonate binders in CKD patients.\n\n---\n\n### Q20. \n**A 30-year-old male presents to the ER with sudden, massive, terrifying swelling of his lips, tongue, and larynx, threatening his airway. He has no urticaria (hives) and denies any allergies. His father died of a similar episode. Labs reveal profoundly low levels of C4 and C1-esterase inhibitor. What is the SINGLE BEST, most definitive acute pharmacological treatment?**\nA) Intramuscular Epinephrine\nB) Intravenous high-dose Corticosteroids\nC) Intravenous C1-inhibitor concentrate (plasma-derived or recombinant)\nD) Intravenous Diphenhydramine (Antihistamines)\n\n**Answer: C** — **Hereditary Angioedema (HAE)**—Driven entirely by a massive overproduction of Bradykinin, not histamine. Therefore, epinephrine, steroids, and antihistamines are completely useless. The only definitive, life-saving treatment is replacing the missing enzyme via **C1-inhibitor concentrate** or using a bradykinin-receptor antagonist (Icatibant).\n\n---\n\n### Q21. \n**A 50-year-old male with chronic Hepatitis C is started on a potent, curative Direct-Acting Antiviral (DAA) regimen containing Sofosbuvir. A week later, he is rushed to the ER after experiencing a massive syncopal episode, and his ECG shows severe, life-threatening symptomatic bradycardia. Which specific cardiac medication was MOST LIKELY in his home pillbox, causing this deadly drug-drug interaction?**\nA) Amiodarone\nB) Metoprolol\nC) Digoxin\nD) Verapamil\n\n**Answer: A** — **Sofosbuvir Drug Interaction**—Co-administration of Sofosbuvir-containing regimens with the antiarrhythmic **Amiodarone** causes a highly specific, idiosyncratic, and potentially fatal **severe symptomatic bradycardia**, making this combination absolutely contraindicated.\n\n---\n\n### Q22. \n**A 40-year-old male recently discharged after a prolonged ICU stay for sepsis (treated with Clindamycin and Cephalosporins) presents with a high fever, severe abdominal cramping, and profuse, foul-smelling, watery diarrhea. A stool toxin assay confirms the diagnosis. What is the SINGLE BEST, gold-standard oral antibiotic treatment?**\nA) Oral Metronidazole\nB) Oral Vancomycin or Fidaxomicin\nC) Intravenous Vancomycin\nD) Oral Ciprofloxacin\n\n**Answer: B** — **Clostridioides difficile Colitis**—Current guidelines have relegated Metronidazole to secondary status. The undisputed first-line therapy is **Oral Vancomycin** (which stays entirely in the gut lumen to kill the bacteria) or oral **Fidaxomicin**.\n\n---\n\n### Q23. \n**A 40-year-old male from the Ohio River Valley presents with a 4-week history of low-grade fever, productive cough, and warty, verrucous skin lesions on his face and arms. Sputum microscopy and skin biopsy both reveal distinct, large, broad-based budding yeast cells. What is the SINGLE BEST definitive treatment for this disseminated systemic infection?**\nA) Itraconazole\nB) Intravenous Amphotericin B\nC) Oral Fluconazole\nD) Terbinafine\n\n**Answer: B** — **Blastomycosis (Disseminated/Severe)**—The pathognomonic finding is the **broad-based budding yeast**. While mild/moderate pulmonary disease can be treated with oral Itraconazole, severe or widely disseminated disease absolutely requires systemic **Intravenous Amphotericin B**.\n\n---\n\n### Q24. \n**A 28-year-old female presents in the middle of summer with a severe headache, photophobia, a stiff neck, and a low-grade fever. CSF analysis reveals a mild lymphocytic pleocytosis (250 cells/μL), normal protein, and a strictly normal glucose level. Gram stain is perfectly negative. What is the MOST LIKELY causative group of organisms?**\nA) Enteroviruses (e.g., Coxsackievirus, Echovirus)\nB) Mycobacterium tuberculosis\nC) Cryptococcus neoformans\nD) Treponema pallidum\n\n**Answer: A** — **Viral (Aseptic) Meningitis**—The most common cause of meningitis overall, peaking in the summer months. The classic CSF profile features a lymphocytic predominance with a **strictly normal glucose level**, overwhelmingly caused by the **Enterovirus** family.\n\n---\n\n### Q25. \n**A 45-year-old male with a history of long-standing diabetes and a recent prolonged urinary catheterization presents with fever, chills, and a new, harsh systolic murmur. Echocardiography confirms a large vegetation on the mitral valve. Blood cultures grow Gram-positive cocci in pairs and short chains that are remarkably resistant to cephalosporins. What is the SINGLE BEST, synergistic antibiotic regimen?**\nA) Intravenous Ceftriaxone alone\nB) Intravenous Vancomycin monotherapy\nC) Intravenous Ampicillin combined with Gentamicin\nD) Oral Linezolid\n\n**Answer: C** — **Enterococcal Endocarditis**—Enterococci are inherently highly resistant to many drugs (including all cephalosporins). The gold standard, curative regimen relies entirely on the powerful synergy between a cell-wall active agent (**Ampicillin**) which cracks the wall open, allowing the aminoglycoside (**Gentamicin**) to enter and destroy the ribosome.\n\n---\n\n### Q26. \n**A 60-year-old male with severe, chronic malnutrition is brought to the ER seizing. Labs reveal a terrifyingly low serum sodium of 109 mEq/L. The physician aggressively administers 3% Hypertonic Saline to halt the seizures. To prevent the devastating, irreversible neurological complication of Osmotic Demyelination Syndrome (Central Pontine Myelinolysis), what is the MAXIMUM safe limit for serum sodium correction in the first 24 hours?**\nA) No more than 4-6 mEq/L in 24 hours\nB) No more than 8-10 mEq/L in 24 hours\nC) No more than 15-20 mEq/L in 24 hours\nD) Exactly 1-2 mEq/L per hour continuously for 24 hours\n\n**Answer: B** — **Severe Hyponatremia Correction**—Rapidly correcting chronic hyponatremia violently sucks water out of brain cells, destroying the myelin sheath in the pons. The strict, absolute upper safety limit is correcting **no more than 8 to 10 mEq/L in the first 24 hours**.\n\n---\n\n### Q27. \n**A 35-year-old male pet-store owner presents with a 2-week history of severe, dry, hacking cough, a spiking fever, and a splitting headache. Chest X-ray reveals patchy, bilateral interstitial pulmonary infiltrates. He mentions he recently received a large shipment of imported parrots. What is the MOST LIKELY organism?**\nA) Mycoplasma pneumoniae\nB) Legionella pneumophila\nC) Chlamydia psittaci\nD) Coxiella burnetii\n\n**Answer: C** — **Psittacosis (Parrot Fever)**—Caused by **Chlamydia psittaci**. The classic clinical vignette is an atypical pneumonia in a patient with a strong occupational or recreational exposure to infected birds (parrots, macaws, pigeons).\n\n---\n\n### Q28. \n**A 50-year-old female presents with severe palpitations, profound weight loss, and heat intolerance. Physical examination reveals an irregularly enlarged, nodular thyroid gland. A radioactive iodine uptake scan demonstrates multiple, distinct, blazing \"hot\" nodules suppressing the rest of the gland. What is the SINGLE BEST, definitive curative treatment?**\nA) Radioactive Iodine (I-131) ablation\nB) Total surgical thyroidectomy\nC) Lifelong Methimazole therapy\nD) Increasing her dietary iodine intake\n\n**Answer: A** — **Toxic Multinodular Goiter**—Multiple autonomous nodules producing massive amounts of T3/T4. Because the healthy thyroid tissue is suppressed, **Radioactive Iodine** perfectly, selectively targets and destroys only the hyperactive, diseased nodules, providing an excellent, non-invasive cure.\n\n---\n\n### Q29. \n**A 60-year-old male with advanced Parkinson's disease has been maintained on Carbidopa/Levodopa. He now experiences highly frustrating \"wearing-off\" phenomenon, where his severe rigidity returns hours before his next dose is due. The neurologist adds a medication that strictly inhibits the peripheral breakdown of Levodopa. What is the specific name of this COMT-inhibitor?**\nA) Selegiline\nB) Amantadine\nC) Entacapone\nD) Ropinirole\n\n**Answer: C** — **Entacapone**—A potent Catechol-O-methyltransferase (COMT) inhibitor that acts exclusively in the periphery, blocking the degradation of Levodopa into 3-OMD, vastly prolonging its half-life and brain penetration to smooth out motor fluctuations.\n\n---\n\n### Q30. \n**A 45-year-old male with poorly controlled type 2 diabetes presents to the ER with a high fever, severe right thigh pain, and an intensely swollen, woody, erythematous calf. There is no history of trauma. MRI reveals multiple large, deep abscesses entirely contained *within* the belly of the quadriceps muscle. What is the SINGLE MOST common causative organism of this primary Pyomyositis?**\nA) Streptococcus pyogenes (Group A Strep)\nB) Escherichia coli\nC) Staphylococcus aureus\nD) Clostridium perfringens\n\n**Answer: C** — **Primary Pyomyositis**—A deep bacterial infection of skeletal muscle, predominantly seen in the tropics or in immunocompromised (diabetic/HIV) patients. **Staphylococcus aureus** is overwhelmingly the most common responsible pathogen.\n\n---\n\n### Q31. \n**A 25-year-old female with a known history of severe Antiphospholipid Antibody Syndrome (APS) and recurrent miscarriages is now pregnant. She is placed on a prophylactic regimen of Aspirin and Low Molecular Weight Heparin (LMWH). If the hematologist wished to specifically monitor the pharmacological efficacy and blood levels of her LMWH therapy, which specific laboratory assay MUST be used?**\nA) The standard Activated Partial Thromboplastin Time (aPTT)\nB) The Prothrombin Time (PT) and INR\nC) An Anti-Factor Xa (Anti-Xa) activity assay\nD) A standard Bleeding Time test\n\n**Answer: C** — **LMWH Monitoring**—Unlike Unfractionated Heparin (which is monitored by aPTT), LMWH has a highly predictable pharmacokinetic profile and primarily inhibits Factor Xa over Thrombin. It does not alter the aPTT significantly; it can only be accurately measured using a specific **Anti-Xa assay**.\n\n---\n\n### Q32. \n**A 55-year-old male with hyperlipidemia is prescribed a high-dose statin (Atorvastatin). One month later, he returns complaining of severe, diffuse muscle aching (myalgia) and dark urine. His Creatine Kinase (CK) is massive at 5,000 U/L. The statin is immediately discontinued. What is the SINGLE BEST alternative class of medication to powerfully lower his LDL cholesterol by blocking absorption at the intestinal brush border?**\nA) Ezetimibe\nB) Fibrates (e.g., Fenofibrate)\nC) Niacin\nD) PCSK9 Inhibitors (e.g., Alirocumab)\n\n**Answer: A** — **Statin Intolerance / Ezetimibe**—When statins cause severe myopathy/rhabdomyolysis, **Ezetimibe** is the classic next-line agent. It powerfully lowers LDL by blocking the Niemann-Pick C1-Like 1 (NPC1L1) cholesterol transport protein in the small intestine.\n\n---\n\n### Q33. \n**A 40-year-old male, 2 years post-kidney transplant, is maintained on a regimen of Tacrolimus, Mycophenolate, and Prednisone. He develops a severe community-acquired pneumonia and is prescribed a course of the macrolide antibiotic Erythromycin by a careless urgent-care doctor. Within days, he develops acute, severe nephrotoxicity. What specific pharmacokinetic drug-drug interaction caused his Tacrolimus levels to spike to toxic, lethal levels?**\nA) Erythromycin completely displaces Tacrolimus from its binding sites on serum albumin\nB) Erythromycin is a potent inhibitor of the Cytochrome P450 3A4 (CYP3A4) enzyme system in the liver\nC) Erythromycin blocks the renal excretion of Tacrolimus at the proximal tubule\nD) Erythromycin massively induces the P-glycoprotein efflux pump\n\n**Answer: B** — **Macrolide-Calcineurin Inhibitor Interaction**—Tacrolimus is heavily metabolized by the liver enzyme **CYP3A4**. Erythromycin (and Clarithromycin) are infamous, powerful inhibitors of this enzyme, causing Tacrolimus blood levels to skyrocket, resulting in acute, devastating nephrotoxicity.\n\n---\n\n### Q34. \n**A 28-year-old male with generalized epilepsy is well-controlled on Valproic Acid. He presents to the ER with new-onset, profound lethargy, severe tremor (asterixis), and vomiting. His liver transaminases are strictly normal, but his serum Ammonia level is terrifyingly elevated at 200 μmol/L. What is the SINGLE BEST immediate management for this idiosyncratic drug reaction?**\nA) Initiate immediate hemodialysis\nB) Administer high-dose L-carnitine\nC) Immediately discontinue the Valproic Acid\nD) Administer oral Lactulose and Rifaximin\n\n**Answer: C** — **Valproate-Induced Hyperammonemic Encephalopathy (VHE)**—A rare, dangerous, and sometimes fatal idiosyncratic reaction that can occur even with normal LFTs and normal valproate levels. The absolute first, mandatory step is to **immediately discontinue the offending drug** (L-carnitine can be given as a supportive antidote).\n\n---\n\n### Q35. \n**A 35-year-old female presents with a classic migraine. She experiences a unilateral, fiercely throbbing headache accompanied by debilitating photophobia, phonophobia, and severe nausea. The pain is preventing her from working. She has already tried high-dose NSAIDs with zero relief. What is the SINGLE BEST, most specific acute abortive pharmacological treatment?**\nA) Intravenous Morphine\nB) Ergotamine tartrate\nC) A 5-HT 1B/1D receptor agonist (e.g., Sumatriptan)\nD) Oral Propranolol\n\n**Answer: C** — **Migraine Abortive Therapy**—When simple analgesics fail, **Triptans (Sumatriptan)** are the absolute gold standard, specific abortive therapy. They act as serotonin (5-HT 1B/1D) agonists, causing powerful vasoconstriction of the dilated cranial blood vessels.\n\n---\n\n### Q36. \n**A 60-year-old male recently diagnosed with active pulmonary tuberculosis is started on the standard four-drug RIPE regimen. Two weeks later, he returns to the clinic in a panic, stating that his urine, tears, and sweat have all turned a terrifying, bright red-orange color, permanently staining his contact lenses. Which specific medication in his regimen is exclusively responsible for this harmless side effect?**\nA) Isoniazid\nB) Rifampicin\nC) Pyrazinamide\nD) Ethambutol\n\n**Answer: B** — **Rifampicin Side Effects**—A powerful inducer of CYP enzymes that is famous for causing a completely benign, but visually alarming, **red-orange discoloration of all body fluids** (urine, tears, sweat, saliva).\n\n---\n\n# SECTION B — SURGERY & ORTHOPEDICS (36 Questions)\n\n---\n\n### Q37. \n**A 35-year-old male presents to the ER with a 24-hour history of severe anorexia, nausea, and periumbilical pain that has now distinctly migrated and localized sharply to the right lower quadrant. Examination reveals severe rebound tenderness at McBurney's point. His temperature is 38.2°C, and WBC count is 14,000/μL with a left shift. His calculated Alvarado score is a definitive 8. What is the SINGLE BEST, most appropriate definitive management?**\nA) Discharge with a 7-day course of oral antibiotics\nB) Perform an emergency Appendectomy (Laparoscopic or Open)\nC) Order an immediate MRI of the abdomen\nD) Admit for 48 hours of strict observation and IV fluids\n\n**Answer: B** — **Acute Appendicitis**—An **Alvarado score of 7 or higher** strongly indicates acute appendicitis. The gold standard, definitive treatment to prevent gangrene and perforation is an **emergency appendectomy**.\n\n---\n\n### Q38. \n**A 70-year-old female with a long, untreated history of symptomatic gallstones presents with a 4-day history of colicky abdominal pain, intractable vomiting, and absolute constipation. Erect abdominal X-ray reveals massively dilated loops of small bowel with multiple air-fluid levels. Crucially, the radiologist notes distinct, branching lucencies over the liver shadow, representing air in the biliary tree (Pneumobilia), and a faint, 3 cm calcified mass lodged in the right lower quadrant. What is the MOST LIKELY diagnosis?**\nA) Acute severe ascending cholangitis\nB) Gallstone Ileus\nC) Primary choledocholithiasis\nD) Emphysematous cholecystitis\n\n**Answer: B** — **Gallstone Ileus**—The classic presentation features **Rigler's Triad**: 1) Small Bowel Obstruction, 2) Pneumobilia (air in the biliary tree due to a cholecystoenteric fistula), and 3) An ectopic radiopaque gallstone impacted at the narrow ileocecal valve.\n\n---\n\n### Q39. \n**A 2-year-old boy presents to the ER screaming in severe, episodic, colicky pain, drawing his knees up to his chest. Between episodes, he is utterly exhausted but pain-free. He recently passed a stool consisting of dark red, gelatinous mucus (\"currant jelly\" stool). An ultrasound of the right lower quadrant demonstrates a distinct \"Target\" or \"Donut\" sign. He has no signs of peritonitis, and his vitals are perfectly stable. What is the SINGLE BEST initial therapeutic management?**\nA) Image-guided, controlled pneumatic (Air) or hydrostatic enema reduction\nB) Immediate emergency exploratory laparotomy\nC) High-dose intravenous corticosteroids\nD) Manual disimpaction under general anesthesia\n\n**Answer: A** — **Intussusception (Uncomplicated)**—In a stable child without signs of bowel perforation or peritonitis, the absolute first-line, definitive treatment is an **Air or Hydrostatic enema**, which safely and gently pushes the telescoped bowel back into place in >80% of cases.\n\n---\n\n### Q40. \n**A 5-year-old boy presents to the ER with massive, painless, bright red bleeding from his rectum, soaking his clothes in blood. He is pale and tachycardic. A technetium-99m pertechnetate scan is performed, revealing a fierce, bright focal spot of uptake in the right lower quadrant, entirely separate from the stomach. What specific abnormal tissue within the Meckel's diverticulum is directly responsible for this massive bleeding?**\nA) Ectopic Gastric Mucosa\nB) Ectopic Pancreatic Mucosa\nC) Ectopic Splenic tissue\nD) Malignant Carcinoid tumor cells\n\n**Answer: A** — **Bleeding Meckel's Diverticulum**—The bleeding is caused exclusively by the presence of **ectopic gastric mucosa** within the diverticulum. This tissue secretes pure hydrochloric acid, causing severe, painless ulceration and erosion into the adjacent normal ileal mucosa, leading to massive hemorrhage.\n\n---\n\n### Q41. \n**A 45-year-old male motorcyclist is brought to the trauma center after a high-speed collision. He has a visibly deformed, unstable pelvis. His blood pressure is a terrifying 70/40 mmHg, and his heart rate is 140 bpm. He is entirely unresponsive to 2 liters of aggressive IV fluid resuscitation. A FAST ultrasound of the abdomen demonstrates massive, accumulating anechoic fluid in the hepatorenal and splenorenal recesses. What is the SINGLE BEST, immediate life-saving management?**\nA) Immediate transfer to the CT scanner to identify the bleeding source\nB) Emergency Exploratory Laparotomy\nC) Interventional Radiology for Angioembolization\nD) Application of a tight pelvic binder and transfer to the ICU\n\n**Answer: B** — **Hemodynamically UNSTABLE Blunt Abdominal Trauma with a Positive FAST**—This is the absolute cardinal rule of trauma surgery: A patient actively bleeding to death (unstable, non-responder) with blood in the belly on FAST goes directly to the Operating Room for an **emergency exploratory laparotomy**. (CT is only for *stable* patients).\n\n---\n\n### Q42. [Image-Based — X-ray]\n**A 75-year-old osteoporotic female trips on a rug and falls directly onto her right hip. She is in agonizing pain, and her right leg is visibly shortened and severely externally rotated. An AP Pelvis X-ray is obtained (Image: A distinct fracture line running diagonally from the greater trochanter down to the lesser trochanter, completely outside the joint capsule). What is the SINGLE BEST, standard surgical management for this specific extracapsular fracture?**\nA) Internal fixation with a Dynamic Hip Screw (DHS) or Cephalomedullary Nail\nB) Total Hip Arthroplasty (Replacement)\nC) Bipolar Hemiarthroplasty\nD) Strict bed rest with heavy skeletal traction for 8 weeks\n\n**Answer: A** — **Intertrochanteric Femoral Fracture**—Because the fracture is extracapsular, the blood supply to the femoral head is perfectly preserved. The gold standard treatment is strong internal fixation using a **Dynamic Hip Screw (DHS)** or an intramedullary nail to allow the fracture to compress and heal.\n\n---\n\n### Q43. \n**A 60-year-old male with a 40-pack-year smoking history presents with a chronic, severe cough, progressive right arm weakness, and severe, unremitting pain radiating down the ulnar aspect of his right arm into his pinky finger. Examination reveals right-sided ptosis, miosis, and anhidrosis (Horner's syndrome). A chest X-ray shows a massive, dense opacity utterly destroying the very apex of the right lung. What is the MOST LIKELY histological diagnosis of this specific tumor?**\nA) Small Cell Lung Carcinoma\nB) Squamous Cell Carcinoma (or Adenocarcinoma)\nC) Typical Carcinoid Tumor\nD) Malignant Mesothelioma\n\n**Answer: B** — **Pancoast Tumor (Superior Sulcus Tumor)**—The classic presentation of a tumor invading the C8-T1 brachial plexus roots and the cervical sympathetic ganglion. The vast majority of Pancoast tumors are Non-Small Cell Lung Cancers, most commonly **Squamous Cell Carcinoma** or Adenocarcinoma.\n\n---\n\n### Q44. \n**A 45-year-old female presents with a rapidly growing, painless, 4 cm nodule in the right lobe of her thyroid. FNAC is performed, and the cytology report explicitly notes the presence of abundant, large, granular, eosinophilic cells (\"Hürthle cells\"). Because Hürthle cell neoplasms behave similarly to follicular neoplasms and carry a distinct risk of malignancy, what is the SINGLE BEST, safest surgical management?**\nA) Total Thyroidectomy\nB) Simple nodule enucleation\nC) Subtotal (partial) thyroidectomy\nD) High-dose Radioactive Iodine ablation without surgery\n\n**Answer: A** — **Hürthle Cell Neoplasm**—These are aggressive variants of follicular neoplasms. Because FNAC cannot differentiate a benign Hürthle cell adenoma from a malignant Hürthle cell carcinoma (which requires examining the entire capsule for invasion), the safest, standard surgical approach is a diagnostic lobectomy or a definitive **Total Thyroidectomy**.\n\n---\n\n### Q45. \n**A 60-year-old obese female with a 20-year history of massive, tortuous varicose veins presents to the clinic. She has a large, irregularly shaped, shallow, weeping, heavily exudative ulcer situated exactly just above her left medial malleolus. The surrounding skin is severely hyperpigmented, thickened, and tough (lipodermatosclerosis). Assuming no signs of arterial disease, what is the SINGLE BEST, most critical non-surgical management to heal this specific ulcer?**\nA) Multilayered, firm, graduated compression therapy (e.g., Four-layer compression bandages)\nB) Broad-spectrum systemic intravenous antibiotics\nC) Application of potent topical Corticosteroids\nD) Prolonged dangling of the legs over the side of the bed\n\n**Answer: A** — **Venous Stasis Ulcer**—The root cause is severe venous hypertension due to incompetent valves. The absolute gold standard, most critical therapy to reverse the hypertension and physically force the fluid out of the leg to allow the ulcer to heal is **graduated compression therapy**.\n\n---\n\n### Q46. \n**A 30-year-old male is rushed to the ER following a vicious knife fight. He sustained a deep, penetrating stab wound just to the left of the sternum in the 4th intercostal space. His blood pressure crashes to 70/40 mmHg. His neck veins are massively, visibly distended, and his heart sounds are so faint they are almost imperceptible on auscultation. What is the SINGLE BEST, immediate, life-saving bedside intervention?**\nA) Immediate, ultrasound-guided (or blind) emergency Pericardiocentesis\nB) Insertion of a massive 36F chest tube into the left pleural space\nC) Intravenous administration of high-dose Vasopressors\nD) Emergency intubation with high Positive End-Expiratory Pressure (PEEP)\n\n**Answer: A** — **Cardiac Tamponade**—The classic presentation of Beck's Triad (Hypotension, Distended Neck Veins, Muffled Heart Sounds) following penetrating chest trauma. The blood is crushing the heart. **Immediate Pericardiocentesis** (draining the pericardial sac) is the only rapid way to restore cardiac output and save the patient's life.\n\n---\n\n### Q47. \n**A 68-year-old male with a history of severe hypertension and smoking presents for a routine physical. An ultrasound detects a completely asymptomatic infrarenal Abdominal Aortic Aneurysm (AAA). Careful measurement confirms the maximum diameter is exactly 4.2 cm. According to established vascular surgery guidelines, what is the SINGLE BEST management plan?**\nA) Immediate Endovascular Aneurysm Repair (EVAR)\nB) Immediate Open Surgical Repair with a synthetic graft\nC) Strict surveillance with a repeat ultrasound every 6 to 12 months\nD) Initiation of systemic anticoagulation with Warfarin\n\n**Answer: C** — **AAA measuring 4.0 - 5.4 cm**—The risk of surgery far outweighs the risk of rupture at this size. The standard of care is **strict surveillance with an ultrasound every 6 to 12 months**, reserving surgical repair (EVAR/Open) strictly for when the aneurysm hits 5.5 cm in men (5.0 cm in women) or grows rapidly (>0.5 cm in 6 months).\n\n---\n\n### Q48. \n**A 22-year-old college athlete dislocates his right shoulder for the fourth time in two years while simply reaching backwards for a ball. MRI of the shoulder confirms a severe, chronic tear of the anterior-inferior glenoid labrum. To permanently stabilize the joint and prevent further recurrent dislocations, what is the SINGLE BEST, definitive surgical procedure?**\nA) An arthroscopic or open Bankart Repair\nB) Complete replacement of the humeral head (Hemiarthroplasty)\nC) A total Acromioclavicular (AC) joint reconstruction\nD) Prolonged immobilization in a rigid shoulder spica cast for 12 weeks\n\n**Answer: A** — **Recurrent Anterior Shoulder Dislocation (Bankart Lesion)**—The repeated trauma has permanently torn the anchoring labrum (Bankart lesion) from the glenoid rim. The definitive, curative surgical procedure is a **Bankart Repair**, where the labrum and capsule are securely anchored back onto the bone.\n\n---\n\n### Q49. \n**A 75-year-old female is recovering in the orthopedic ward 4 days after a total hip replacement. She suddenly develops severe, terrifying shortness of breath, sharp pleuritic chest pain, and tachycardia (HR 120). Her oxygen saturation drops to 85% on room air. The physician strongly suspects a massive Pulmonary Embolism (PE). Given that she has totally normal renal function, what is the SINGLE BEST, gold-standard diagnostic imaging test?**\nA) CT Pulmonary Angiography (CTPA)\nB) Ventilation/Perfusion (V/Q) Scan\nC) Lower extremity venous Doppler ultrasound\nD) A serum D-Dimer test\n\n**Answer: A** — **Pulmonary Embolism**—In a patient with a high clinical pre-test probability (recent major orthopedic surgery) and normal kidney function, the **CT Pulmonary Angiogram (CTPA)** is the undisputed gold standard, providing rapid, definitive visualization of the clot in the pulmonary vasculature.\n\n---\n\n### Q50. \n**A 35-year-old male unrestrained passenger is involved in a severe motor vehicle collision. He has a massive, deep purple, horizontal bruise running violently across his entire abdomen (the \"seatbelt sign\"). He develops increasing diffuse abdominal pain and peritonitis over the next 12 hours. CT scan reveals free air and a complete, full-thickness, ragged perforation of the mid-jejunum with massive fecal contamination. What is the SINGLE BEST surgical management for the bowel?**\nA) Simple, single-layer primary suture closure of the ragged hole\nB) Complete resection of the severely damaged bowel segment followed by primary anastomosis (or stoma if highly unstable)\nC) Placement of a percutaneous drainage catheter into the bowel\nD) Extensive lavage with antibiotics and observation\n\n**Answer: B** — **Blunt Small Bowel Perforation**—Because the tissue is ragged, crushed, and severely damaged by the immense blunt force, simple suturing will fail and leak. The definitive standard is **complete resection of the damaged segment**. (An anastomosis is performed if stable; a stoma is created if the patient is in severe shock).\n\n---\n\n### Q51. \n**A 50-year-old female presents to the oncology clinic 2 years after undergoing a mastectomy and radiation for breast cancer. She now complains of a new, firm, painless, 2 cm mass in her right supraclavicular fossa. A fine needle aspiration (FNAC) confirms metastatic adenocarcinoma identical to her original breast primary. According to staging guidelines, what is the SINGLE BEST, most appropriate treatment strategy for this specific stage of disease?**\nA) Immediate initiation of aggressive systemic therapy (Chemotherapy, Hormonal, or Targeted therapy)\nB) A radical surgical neck dissection to clear the lymph nodes\nC) High-dose external beam radiotherapy focused purely on the neck\nD) Simple observation with palliative pain control\n\n**Answer: A** — **Supraclavicular Lymph Node Metastasis (Stage IV or N3 Breast Cancer)**—The presence of disease in the supraclavicular nodes indicates that the cancer has escaped local control and is now a systemic disease. Surgery and radiation are local treatments; **aggressive systemic therapy** is the required, life-prolonging standard of care.\n\n---\n\n### Q52. \n**A 28-year-old male presents to the urology clinic complaining of a dull, heavy, dragging ache in his left scrotum that worsens significantly after standing all day at work. Physical examination reveals a mass of dilated, tortuous veins superior to the left testicle that feels exactly like a \"bag of worms.\" The mass completely collapses when the patient lies down flat. What is the SINGLE BEST anatomical explanation for why this condition occurs almost exclusively on the left side?**\nA) The left testicular vein inserts completely vertically at a sharp, 90-degree right angle directly into the high-pressure left renal vein\nB) The left testicular vein lacks all internal venous valves\nC) The left testicle is significantly larger and heavier than the right\nD) The left testicular vein drains directly into the low-pressure Inferior Vena Cava\n\n**Answer: A** — **Varicocele Anatomy**—Occurs almost exclusively on the left because the **left testicular vein drains perpendicularly (at a 90-degree angle) directly into the left renal vein**, creating immense hydrostatic pressure and sluggish flow. (The right testicular vein drains smoothly at an acute angle directly into the IVC).\n\n---\n\n### Q53. \n**A 65-year-old male undergoes a routine screening colonoscopy. The gastroenterologist discovers a large, 3 cm, highly frond-like, velvety mass in the sigmoid colon. The mass is completely removed using an endoscopic snare. The pathology report confirms it is a Villous Adenoma containing distinct foci of High-Grade Dysplasia, but crucially, the dysplasia does NOT breach the muscularis mucosae, and the excision margins are completely clear. What is the SINGLE BEST management plan?**\nA) Radical surgical sigmoid colectomy with lymph node dissection\nB) Six months of systemic adjuvant chemotherapy (e.g., FOLFOX)\nC) Complete colonoscopy surveillance in 1 to 3 years\nD) Immediate prophylactic total abdominal colectomy\n\n**Answer: C** — **High-Grade Dysplasia in a Colonic Adenoma**—Because the dysplasia has not penetrated the muscularis mucosae (it is not invasive cancer) and the margins are clear, the endoscopic **polypectomy is entirely curative**. The standard of care is simply **strict colonoscopy surveillance** in 1-3 years.\n\n---\n\n### Q54. \n**A 22-year-old male is struck by a car and suffers a severely comminuted fracture of the right tibial shaft. Eight hours later in the orthopedic ward, he complains of agonizing, unrelenting pain in his calf that is entirely unresponsive to massive doses of IV Morphine. The pain is worst when the nurse passively stretches his toes upward. The calf is tense and swollen like wood. A needle manometer measures the intracompartmental pressure at a terrifying 55 mmHg (Normal <10). What is the SINGLE BEST, immediate definitive management?**\nA) Emergency four-compartment fasciotomy\nB) Elevation of the leg high above the level of the heart\nC) Immediate removal of all casts and tight dressings followed by observation\nD) Administration of a high-dose IV Heparin bolus\n\n**Answer: A** — **Acute Compartment Syndrome**—A true surgical emergency where pressure within the fascial sheath exceeds capillary perfusion pressure, leading to rapid, irreversible muscle and nerve necrosis. An **immediate, extensive four-compartment fasciotomy** is the absolute only way to decompress the leg and save the limb.\n\n---\n\n### Q55. \n**A 48-year-old male with a long history of severe chronic alcoholic pancreatitis presents with a massive, 10 cm pancreatic pseudocyst. Three days ago, he developed a high fever, severe abdominal pain, and an elevated WBC count. A stat CT scan of the abdomen reveals that the massive fluid collection now contains multiple pockets of distinct air bubbles (gas). What is the SINGLE BEST, life-saving management?**\nA) Immediate surgical (or endoscopic) drainage and necrosectomy of the infected collection\nB) High-dose intravenous antibiotics and strict observation\nC) Administration of oral Pancreatic Enzyme Replacement Therapy\nD) Total Parenteral Nutrition (TPN) to rest the gut\n\n**Answer: A** — **Infected Pancreatic Pseudocyst/Necrosis**—The presence of gas bubbles on a CT scan is the absolute hallmark of infection by gas-forming organisms. This is a lethal complication. **Immediate aggressive drainage (surgical, endoscopic, or large-bore percutaneous)** combined with IV antibiotics is mandatory.\n\n---\n\n### Q56. \n**A 68-year-old female presents to the clinic with a massive, rock-hard, rapidly enlarging mass in her anterior neck. She has developed a severe, raspy, hoarse voice and complains of terrifying shortness of breath and stridor when lying flat. FNAC of the fixed, immobile mass reveals wildly undifferentiated, highly pleomorphic giant cells and spindle cells. What is the SINGLE BEST management strategy for this specific, catastrophic malignancy?**\nA) Aggressive palliative external beam radiotherapy and securing the airway (Tracheostomy)\nB) Immediate emergency total thyroidectomy\nC) High-dose Radioactive Iodine (I-131) ablation\nD) Prolonged suppression therapy with high-dose Levothyroxine\n\n**Answer: A** — **Anaplastic Thyroid Carcinoma**—The most malignant, rapidly lethal solid tumor known. It extensively invades the trachea and esophagus, making curative surgery impossible. It does not take up iodine. Management is entirely **palliative**, relying on **radiotherapy to shrink the mass and a tracheostomy to prevent suffocation**.\n\n---\n\n### Q57. \n**A 2-day-old neonate with Down Syndrome presents with bilious (green) vomiting, absolute feeding intolerance, and mild epigastric distension. An abdominal X-ray is performed. It dramatically reveals two massive, distinct pockets of air: one in the stomach and one right next to it in the proximal duodenum, separated by the pyloric valve. There is absolutely no gas visible in the rest of the abdomen. What is the SINGLE BEST, definitive surgical procedure to correct this anomaly?**\nA) A diamond-shaped Duodenoduodenostomy\nB) A Ramstedt Pyloromyotomy\nC) A Ladd's procedure (detorsion of the bowel and division of Ladd's bands)\nD) Creation of a temporary diverting ileostomy\n\n**Answer: A** — **Duodenal Atresia**—The pathognomonic \"Double Bubble\" sign with no distal gas. The classic, highly successful surgical correction is a **Duodenoduodenostomy**, where the obstructed segment is bypassed by opening and connecting the proximal and distal segments of the duodenum.\n\n---\n\n### Q58. \n**A 45-year-old obese female underwent a difficult, complicated open cholecystectomy 3 weeks ago for severe gangrenous cholecystitis. She now returns to the ER with spiking fevers, severe jaundice, and dark urine. An MRCP reveals a complete, dense, fibrotic stricture (scarring) completely blocking the mid-portion of the Common Bile Duct (CBD), clearly resulting from an iatrogenic surgical injury. What is the SINGLE BEST, most durable definitive surgical management?**\nA) Formation of a Roux-en-Y Hepaticojejunostomy\nB) Repeated endoscopic balloon dilation and plastic stenting via ERCP\nC) Primary end-to-end surgical suturing (anastomosis) of the injured bile duct\nD) Percutaneous transhepatic biliary drainage (PTBD) for life\n\n**Answer: A** — **Major Iatrogenic Bile Duct Injury (Stricture)**—Directly suturing a damaged, scarred bile duct back together guarantees a failed, re-stricturing disaster. The absolute gold-standard, definitive, durable repair is a **Roux-en-Y Hepaticojejunostomy** (sewing the healthy upper bile duct directly into a dedicated loop of jejunum).\n\n---\n\n### Q59. \n**A 60-year-old male construction worker presents to the clinic complaining of a bulge in his right groin that pops out when he lifts heavy bags of cement. On physical examination, the physician identifies a distinct, reducible mass located strictly *above* the medial half of the inguinal ligament. To permanently fix this defect and minimize the chance of recurrence, what is the SINGLE BEST, gold-standard surgical technique?**\nA) A tension-free Lichtenstein Mesh Repair (Hernioplasty)\nB) A classic Bassini tissue repair\nC) A Shouldice multi-layer tissue repair\nD) Simple primary closure of the deep inguinal ring\n\n**Answer: A** — **Inguinal Hernia**—Regardless of whether it is direct or indirect, the modern, absolute gold-standard surgical approach worldwide is the **tension-free Lichtenstein mesh repair**, which dramatically reduces recurrence rates compared to old-fashioned, painful tissue-stretching repairs (like Bassini).\n\n---\n\n### Q60. \n**A 25-year-old male is brought to the trauma center after a vicious knife fight. He sustained a massive, deep slash across his abdomen. As the paramedics undress him, several loops of pink, viable small intestine rapidly spill out of the wound and rest on the surface of his abdomen. What is the SINGLE BEST, most immediate action the trauma team MUST take before rushing him to the OR?**\nA) Cover the exposed bowel entirely with sterile dressings soaked in warm, sterile saline\nB) Forcefully push the bowel back into the abdominal cavity using bare hands\nC) Apply a tight, dry, sterile compression bandage to stop bleeding\nD) Administer high-dose oral antibiotics\n\n**Answer: A** — **Abdominal Evisceration**—A surgical emergency. You must absolutely NEVER attempt to forcefully shove the bowel back into the abdomen in the ER, as this guarantees massive trauma and contamination. The absolute first step is to **protect the bowel from drying out and dying by covering it with warm, sterile, saline-soaked dressings** while rushing to the OR.\n\n---\n\n### Q61. \n**A 3-year-old toddler is playing with a bowl of peanuts. He suddenly starts choking violently, turns blue, and gasps for air. The episode passes, but he is left with a persistent, severe, unilateral wheeze localized entirely to the right lung base. A chest X-ray shows hyperinflation of the right lung due to a \"ball-valve\" effect. What is the SINGLE BEST, definitive diagnostic and therapeutic management?**\nA) Rigid Bronchoscopy under general anesthesia for immediate visualization and extraction\nB) Administration of a high-dose nebulized bronchodilator (Albuterol) to relax the airway\nC) Immediate blind finger-sweep of the child's throat\nD) Observation with a follow-up chest X-ray in 24 hours\n\n**Answer: A** — **Aspirated Foreign Body**—The peanut is lodged in the right mainstem bronchus. A **rigid bronchoscopy** is the absolute gold standard; it provides a massive, stable airway, allows the surgeon to actually see the object, and provides the large instruments necessary to safely grip and extract the peanut.\n\n---\n\n### Q62. \n**A 58-year-old female, 5 years out from a lumpectomy and radiation for breast cancer, presents to the ER with agonizing, sudden pain in her right upper arm after simply lifting a bag of groceries. An X-ray reveals a massive, destructive lytic lesion completely eating away the mid-shaft of her humerus, resulting in a complete, displaced transverse fracture. What is the SINGLE BEST, most functional surgical management?**\nA) Intramedullary nailing (internal fixation) to stabilize the bone, followed by local palliative radiotherapy\nB) Immediate amputation of the arm at the shoulder joint\nC) Initiation of high-dose systemic chemotherapy and placing the arm in a sling\nD) External fixation with a massive halo device\n\n**Answer: A** — **Pathological Fracture due to Metastasis**—The bone is destroyed by cancer and will not heal in a cast. The goal is rapid pain relief and restoration of function. **Strong internal fixation (like an intramedullary nail)** stabilizes the limb instantly, and **post-operative radiotherapy** halts the local tumor growth.\n\n---\n\n### Q63. \n**A 22-year-old professional football player is running down the field, plants his right foot firmly in the turf, and violently twists his knee to change direction. He hears a loud, sickening \"pop\" and collapses in agony. Within 2 hours, his knee swells to the size of a melon (massive hemarthrosis). The anterior drawer test is wildly positive. What is the MOST LIKELY, devastating injury?**\nA) A complete tear of the Anterior Cruciate Ligament (ACL)\nB) A severe tear of the Medial Meniscus\nC) A complete rupture of the Posterior Cruciate Ligament (PCL)\nD) A severe sprain of the Medial Collateral Ligament (MCL)\n\n**Answer: A** — **Anterior Cruciate Ligament (ACL) Tear**—The absolute classic triad: A non-contact twisting/pivoting injury, an audible \"pop,\" and the extraordinarily rapid development of a massive, tense bloody effusion (hemarthrosis). The positive anterior drawer (or Lachman) test confirms the tibia sliding forward without restraint.\n\n---\n\n### Q64. \n**A 45-year-old male presents to the ER writhing in agony, unable to sit still. He complains of excruciating, colicky, stabbing pain radiating from his left flank straight down into his left testicle. A non-contrast CT scan of the abdomen clearly visualizes a dense, bright white, 12 mm calculus impacted tightly at the left vesicoureteric junction (VUJ). He has intractable vomiting. What is the SINGLE BEST, definitive surgical management?**\nA) Rigid or flexible Ureteroscopy with laser lithotripsy and stone extraction\nB) A trial of medical expulsive therapy with Tamsulosin for 4 weeks\nC) Extracorporeal Shock Wave Lithotripsy (ESWL)\nD) Percutaneous Nephrolithotomy (PCNL)\n\n**Answer: A** — **Large Distal Ureteral Stone (12 mm)**—Stones >10 mm will not pass spontaneously, making medical therapy useless. For stones trapped deep in the pelvis (distal ureter/VUJ), ESWL struggles to target them through the pelvic bones. **Ureteroscopy** (going up through the bladder) is the gold standard, highly successful definitive treatment.\n\n---\n\n### Q65. \n**A 55-year-old male with a 30-year history of heavy smoking and alcohol abuse presents with a chronically hoarse, raspy voice. Direct laryngoscopy reveals a thick, distinct, adherent, pure white patch (plaque) sitting squarely on his right true vocal cord. The patch cannot be scraped off. A microscopic biopsy reveals severe, high-grade squamous dysplasia (a critical pre-malignant state). What is the SINGLE BEST management?**\nA) Complete, precise surgical excision (e.g., via vocal cord micro-stripping or laser)\nB) A 6-week aggressive course of external beam radiotherapy\nC) Systemic, high-dose chemotherapy\nD) Reassurance and strict observation with a repeat biopsy in 1 year\n\n**Answer: A** — **Leukoplakia with High-Grade Dysplasia**—This is the direct precursor to invasive squamous cell carcinoma of the larynx. Leaving it alone is extremely dangerous. The absolute gold standard is **complete surgical excision (micro-laryngoscopy)** to definitively eradicate the pre-cancerous tissue and preserve the voice.\n\n---\n\n### Q66. \n**A 22-year-old female presents to the breast clinic extremely anxious. She discovered a 2 cm, perfectly smooth, rubbery, fiercely mobile, painless lump in the upper outer quadrant of her left breast (\"breast mouse\"). An ultrasound demonstrates a perfectly circumscribed, homogeneous, hypoechoic oval mass. A core biopsy conclusively confirms a benign Fibroadenoma. What is the SINGLE BEST management for this highly anxious patient?**\nA) Firm reassurance and simple clinical observation (unless it rapidly grows or causes pain)\nB) Immediate, wide local surgical excision with clean margins\nC) Prophylactic simple mastectomy\nD) A 6-month course of high-dose Tamoxifen to shrink the mass\n\n**Answer: A** — **Fibroadenoma**—The most common benign breast tumor in young women. Once malignancy is definitively ruled out by biopsy (or classic ultrasound in a young patient), surgery is entirely unnecessary. **Reassurance and observation** is the absolute standard of care, as many shrink or remain stable for life.\n\n---\n\n### Q67. \n**A 65-year-old male with a long history of severe diabetes, hypertension, and heavy smoking presents complaining of agonizing, burning pain in his right foot that wakes him up every night (rest pain). Hanging his foot off the side of the bed provides mild relief. Physical exam reveals a cold, pale foot with totally absent pedal and popliteal pulses. Ankle-Brachial Index (ABI) is an abysmal 0.35. Angiography reveals a massive, long-segment (15 cm), complete occlusion of the superficial femoral artery. What is the SINGLE BEST, limb-saving definitive management?**\nA) Surgical Femoral-Popliteal arterial bypass grafting (using the great saphenous vein)\nB) A 6-month trial of supervised exercise therapy and oral Cilostazol\nC) Immediate, elective Below-Knee Amputation\nD) Long-term, high-dose systemic Warfarin therapy\n\n**Answer: A** — **Critical Limb Ischemia with Long-Segment Occlusion**—The presence of rest pain and an ABI <0.4 indicates imminent gangrene. For extensive, long-segment blockages that are completely hostile to endovascular stenting, a formal open **Surgical Bypass** (using the patient's own vein) is the absolute gold standard to restore pulsatile flow and save the leg.\n\n---\n\n### Q68. \n**A 40-year-old female presents to the endocrinology clinic with a slowly enlarging, completely painless, 3 cm nodule located on the right lobe of her thyroid gland. She has no hoarseness, dysphagia, or radiation exposure history. Her serum TSH level is strictly normal. To accurately rule out malignancy and guide potential surgery, what is the SINGLE BEST, most critical initial diagnostic test?**\nA) Fine Needle Aspiration Cytology (FNAC)\nB) A high-resolution contrast CT scan of the neck\nC) A Technetium-99m Radioactive Thyroid Uptake Scan\nD) Immediate open surgical diagnostic lobectomy\n\n**Answer: A** — **Solitary Euthyroid Nodule**—The absolute bedrock of thyroid nodule evaluation. If the TSH is normal (ruling out a hyperfunctioning \"hot\" nodule), a **Fine Needle Aspiration (FNAC)** guided by ultrasound is the cheapest, safest, and most definitive way to determine if the nodule is benign or malignant.\n\n---\n\n### Q69. \n**A 14-year-old boy is rushed to the ER at 3:00 AM with a sudden, explosive, agonizing pain in his left testicle. The testicle is riding extremely high in the scrotum, is lying horizontally, and the cremasteric reflex is completely absent. He is rushed to the operating room where the surgeon successfully untwists (detorses) the spermatic cord, returning excellent, pink blood flow to the salvaged testicle. Before closing the incision, what is the SINGLE MOST IMPORTANT, absolutely mandatory surgical step the surgeon MUST perform?**\nA) A bilateral Orchiopexy (permanently anchoring both the affected AND the healthy contralateral testicle to the scrotal wall)\nB) An immediate radical orchiectomy of the affected testicle to prevent auto-immunity\nC) Administration of a massive dose of intra-scrotal antibiotics\nD) Creation of a temporary diverting scrotal drain\n\n**Answer: A** — **Testicular Torsion (Bell-Clapper Deformity)**—The underlying anatomical defect (the lack of normal fixation to the tunica vaginalis) is almost always bilateral. To prevent a catastrophic torsion of the remaining good testicle later in life, a **bilateral orchiopexy** (stitching them down) is an absolute, non-negotiable surgical mandate.\n\n---\n\n### Q70. \n**A 65-year-old male with a history of chronic constipation undergoes a routine screening colonoscopy. The gastroenterologist discovers a large, 4 cm, highly frond-like, velvety, \"cauliflower-appearing\" polyp in the descending colon. The polyp is completely resected via endoscopic mucosal resection. The pathology report conclusively identifies it as a Villous Adenoma. Compared to a standard tubular adenoma, what is the SINGLE MOST critical risk associated with this specific histological subtype?**\nA) It carries a massively higher risk of harboring occult, high-grade dysplasia and transforming into invasive colorectal adenocarcinoma\nB) It has a 100% chance of causing a massive, fatal lower gastrointestinal hemorrhage\nC) It is definitively caused by an underlying infection with Entamoeba histolytica\nD) It is an entirely benign, hyperplastic lesion with absolutely zero malignant potential\n\n**Answer: A** — **Villous Adenoma**—Of all the adenomatous polyps, the **Villous** subtype (villainous) is the most dangerous. Because of its massive, sprawling surface area, it carries the absolute **highest risk of malignant transformation** to colon cancer, making complete excision and strict surveillance mandatory.\n\n---\n\n### Q71. \n**A 22-year-old male is playing rugby and sustains a massive, direct, blunt-force blow to his right flank from an opponent's knee. He arrives at the ER in severe pain with gross, visible blood in his urine (macroscopic hematuria). His blood pressure is a rock-solid 120/80 mmHg, and his heart rate is 80 bpm. A contrast CT scan of the abdomen reveals a distinct, 2 cm laceration in the cortex of the right kidney, but crucially, it does NOT extend into the collecting system. There is no active arterial extravasation (bleeding) seen. What is the SINGLE BEST management?**\nA) Strict conservative management (bed rest, serial hematocrit monitoring, and close observation)\nB) Immediate emergency open nephrectomy to remove the damaged kidney\nC) Immediate Interventional Radiology (IR) angioembolization\nD) Surgical exploration to suture the laceration\n\n**Answer: A** — **Grade II Renal Laceration (Hemodynamically Stable)**—The kidney is incredibly resilient and enveloped in a tight, self-tamponading capsule (Gerota's fascia). In a perfectly stable patient without active arterial spurting or urine leak, **strict conservative management** is incredibly successful and the undisputed standard of care.\n\n---\n\n### Q72. \n**A 50-year-old obese female presents to the ER with severe, colicky right upper quadrant pain, high fevers, and noticeable yellowing of her eyes (jaundice). Her alkaline phosphatase and direct bilirubin are markedly elevated. An abdominal ultrasound confirms the presence of gallstones in the gallbladder and reveals a massively dilated Common Bile Duct (CBD) measuring 14 mm, but the radiologist cannot definitively visualize a stone inside the duct due to bowel gas obscuring the view. To conclusively confirm the diagnosis of choledocholithiasis BEFORE planning a therapeutic intervention, what is the SINGLE BEST, most sensitive, non-invasive imaging modality?**\nA) Magnetic Resonance Cholangiopancreatography (MRCP)\nB) Endoscopic Retrograde Cholangiopancreatography (ERCP)\nC) A standard non-contrast CT scan of the abdomen\nD) A plain, upright abdominal X-ray\n\n**Answer: A** — **Suspected Choledocholithiasis**—When ultrasound strongly hints at a CBD stone but fails to see it, the absolute gold-standard, highly sensitive, **non-invasive** diagnostic test is an **MRCP**. (ERCP is highly invasive and carries a 5% risk of severe pancreatitis, so it is strictly reserved for *therapeutic* stone extraction once the stone is confirmed).\n\n---\n\n# SECTION C — OBSTETRICS & GYNECOLOGY (36 Questions)\n\n---\n\n### Q73. \n**A 28-year-old G2P1 female at 38 weeks gestation is in active labor. Suddenly, the fetal heart rate monitor plummets to 60 bpm and stays there. The physician performs an immediate vaginal exam and feels a soft, pulsating, rope-like structure bulging completely through the cervix into the vagina, ahead of the fetal head. While the team frantically prepares the operating room for an emergency crash Cesarean section, what is the SINGLE BEST, most critical, life-saving physical maneuver the physician MUST perform immediately?**\nA) Manually elevate the fetal presenting part off the prolapsed cord and instruct the mother to assume a knee-chest or steep Trendelenburg position\nB) Vigorously attempt to shove the prolapsed cord back up into the uterine cavity\nC) Administer a massive intravenous bolus of Oxytocin to force the baby out vaginally\nD) Perform an immediate amniotomy to drain the remaining fluid\n\n**Answer: A** — **Umbilical Cord Prolapse**—A lethal emergency. The fetal head acts as a devastating crushing weight, pinching off the umbilical blood supply against the pelvis. The physician MUST keep their hand inside the vagina to physically **push the baby's head up and off the cord**, maintaining this exhausting position while the mother is flipped upside-down, until the baby is surgically delivered.\n\n---\n\n### Q74. \n**A 30-year-old female, G3P2, at 32 weeks gestation, presents to the ER in agony. She has a history of a previous classical (vertical) Cesarean section. She complains of a sudden, tearing, catastrophic abdominal pain. Her contractions, which were previously strong, have completely and suddenly stopped. She is bleeding heavily from the vagina. The fetal heart monitor shows a terminal bradycardia. Physical exam reveals the fetal parts are shockingly easily palpable directly beneath the abdominal skin. What is the MOST LIKELY diagnosis?**\nA) Complete Uterine Rupture\nB) Severe Placental Abruption\nC) Complete Placenta Previa\nD) Vasa Previa\n\n**Answer: A** — **Uterine Rupture**—The absolute nightmare scenario. The classic presentation includes a history of a high-risk scar (classical C-section), the sudden sensation of \"tearing\" pain, the **instant cessation of uterine contractions**, and the terrifying ability to feel the fetus floating freely in the maternal abdomen because it has blasted through the uterine wall.\n\n---\n\n### Q75. \n**A 35-year-old multiparous female has just delivered a massive, 9 lb 5 oz baby via a rapid, precipitous vaginal delivery. The placenta delivers intact 10 minutes later. However, she begins to experience a steady, relentless, bright red trickle of blood from the vagina. The physician aggressively palpates her abdomen and notes that the uterine fundus is rock-hard, firmly contracted, and sits perfectly at the umbilicus. What is the MOST LIKELY underlying cause of this postpartum hemorrhage?**\nA) A deep, bleeding laceration of the cervix, vagina, or perineum\nB) Severe, refractory Uterine Atony\nC) A massive, retained placental cotyledon\nD) A catastrophic consumptive coagulopathy (DIC)\n\n**Answer: A** — **Postpartum Hemorrhage with a FIRM uterus**—If the uterus is beautifully contracted and hard as a rock, uterine atony (the most common cause of PPH) is ruled out. A steady, bright red trickle of blood in this setting following a rapid delivery of a huge baby is a **genital tract laceration** until proven otherwise by a thorough speculum exam.\n\n---\n\n### Q76. \n**A 25-year-old female, currently pregnant at 16 weeks gestation, has a tragic history of a previous spontaneous preterm birth at 24 weeks. Her obstetrician orders a transvaginal ultrasound today, which surprisingly reveals a critically shortened cervical length of exactly 1.5 cm. She has no contractions and the cervix is closed. To significantly reduce her massive risk of delivering prematurely again, what is the SINGLE BEST, evidence-based prophylactic management?**\nA) Immediate daily administration of Vaginal Progesterone suppositories\nB) Immediate emergency placement of a McDonald Cervical Cerclage\nC) Strict, prophylactic, absolute bed rest in the hospital until 36 weeks\nD) Daily administration of oral Nifedipine\n\n**Answer: A** — **Short Cervix with a History of Preterm Birth**—The absolute first-line, proven pharmacological intervention to maintain cervical integrity and prevent preterm birth is **Vaginal Progesterone**. (If the cervix continues to shorten *despite* progesterone, or drops below 10mm, a cerclage is then strongly indicated).\n\n---\n\n### Q77. \n**A 60-year-old female with a history of early-stage, estrogen-receptor positive breast cancer has been strictly compliant with her daily Tamoxifen therapy for 4 years. She now presents in a panic with a 2-week history of heavy, bright red vaginal bleeding. An immediate in-office endometrial biopsy is performed. The pathology report confirms a terrifying diagnosis: Complex Atypical Endometrial Hyperplasia. What is the SINGLE BEST, definitive surgical management?**\nA) Total Abdominal Hysterectomy with Bilateral Salpingo-Oophorectomy (TAH+BSO)\nB) Insertion of a high-dose Levonorgestrel-releasing IUD (Mirena)\nC) Complete Hysteroscopic Endometrial Ablation\nD) Immediate, aggressive pelvic external beam radiotherapy\n\n**Answer: A** — **Tamoxifen-induced Complex Atypical Hyperplasia**—This specific lesion in a postmenopausal woman carries an unacceptable ~30% to 40% risk of harboring an underlying, concurrent invasive endometrial adenocarcinoma. Hormonal therapy is useless here; the only safe, definitive cure is a **Total Hysterectomy (TAH+BSO)**.\n\n---\n\n### Q78. \n**A 30-year-old female, G2P1 (previous Cesarean section), is currently at 36 weeks gestation. A routine third-trimester ultrasound confirms a complete Placenta Previa, with the placenta totally carpeting the internal cervical os. She is currently entirely asymptomatic, having experienced absolutely zero bleeding throughout her entire pregnancy. To prevent a catastrophic, fatal hemorrhage from the onset of spontaneous labor, what is the SINGLE BEST, evidence-based management plan?**\nA) Schedule an elective, controlled Cesarean section between 36 0/7 and 37 0/7 weeks\nB) Allow her to progress to 40 weeks and attempt a trial of vaginal delivery in the operating room\nC) Admit her for strict bed rest and perform a C-section the moment her water breaks\nD) Administer high-dose Oxytocin immediately to induce labor while the baby is small\n\n**Answer: A** — **Asymptomatic Complete Placenta Previa**—Spontaneous labor and cervical dilation will physically tear the placenta in half, resulting in massive maternal and fetal exsanguination. To perfectly balance fetal maturity against the terrifying risk of unpredictable labor, international guidelines mandate an **elective Cesarean section strictly between 36 and 37 weeks**.\n\n---\n\n### Q79. \n**A 25-year-old primigravida is pregnant with Monochorionic-Diamniotic (MoDi) twins. At 22 weeks gestation, an ultrasound reveals a terrifying discrepancy: Twin A is severely growth-restricted, wrapped tightly in a totally fluid-less sac (oligohydramnios / \"stuck twin\"), while Twin B is massively overgrown, suffering from heart failure, and swimming in a massive ocean of fluid (severe polyhydramnios). The diagnosis is severe Twin-Twin Transfusion Syndrome (TTTS). What is the SINGLE BEST, definitive, life-saving in-utero surgical intervention?**\nA) Fetoscopic Laser Photocoagulation of the abnormal connecting placental vessels\nB) Aggressive, daily serial amnioreduction (draining the fluid from Twin B)\nC) Immediate, emergency delivery of both premature fetuses via C-section\nD) Selective administration of Digoxin to Twin B to treat the heart failure\n\n**Answer: A** — **Severe Twin-Twin Transfusion Syndrome (TTTS)**—The root cause is an abnormal, unbalanced network of shared blood vessels on the single placenta, acting as a massive AV fistula pumping blood from one twin to the other. The definitive, curative treatment is to insert a laser through the abdomen and **burn (photocoagulate) the connecting vessels**, permanently separating their circulations.\n\n---\n\n### Q80. \n**A 55-year-old female presents to the gynecology clinic visibly anxious. She went through menopause exactly 4 years ago, but for the past 3 days, she has been experiencing a steady, unprovoked, painless flow of bright red vaginal blood. A transvaginal ultrasound is performed and shows an abnormally thick endometrial stripe measuring 9 mm. What is the SINGLE BEST, absolute mandatory next diagnostic test?**\nA) An immediate, in-office Endometrial Biopsy (e.g., using a Pipelle catheter)\nB) A radical Diagnostic Laparoscopy\nC) A screening Pap smear\nD) Reassurance and a repeat ultrasound in 6 months\n\n**Answer: A** — **Postmenopausal Bleeding**—This is the absolute cardinal rule of gynecology: ANY bleeding in a postmenopausal woman is Endometrial Cancer until unequivocally proven otherwise by histology. An ultrasound thickness >4 mm demands an immediate, tissue-yielding **Endometrial Biopsy**.\n\n---\n\n### Q81. \n**A 30-year-old obese female with a long, frustrating history of Polycystic Ovarian Syndrome (PCOS) and severe anovulatory infertility is seeking to become pregnant. Her reproductive endocrinologist decides to bypass her anovulation by prescribing Letrozole, which successfully induces the development of a dominant follicle. What is the exact, specific pharmacological mechanism of action of Letrozole?**\nA) It is a highly potent, reversible Aromatase Inhibitor that drastically drops systemic estrogen, forcing the pituitary to pump out massive amounts of FSH\nB) It directly and aggressively stimulates the ovaries by mimicking human Luteinizing Hormone (LH)\nC) It is a Selective Estrogen Receptor Modulator (SERM) that blocks estrogen receptors purely in the hypothalamus\nD) It acts as a powerful Dopamine agonist, shutting down prolactin production\n\n**Answer: A** — **Letrozole**—The undisputed modern first-line ovulation induction agent for PCOS. It works by **inhibiting the Aromatase enzyme**, stopping the conversion of androgens to estrogens. The resulting plummet in estrogen eliminates negative feedback on the pituitary, causing a massive, natural surge in endogenous FSH that forces the ovary to ovulate.\n\n---\n\n### Q82. \n**A 28-year-old female presents to a recurrent pregnancy loss clinic entirely devastated after suffering her fourth consecutive first-trimester miscarriage. Her hormonal, genetic, and autoimmune workups are perfectly normal. A 3D pelvic ultrasound and subsequent diagnostic hysteroscopy reveal a massive, thick, avascular, fibrous wall completely dividing her uterine cavity in half down the middle. What is the SINGLE BEST, definitive surgical procedure to resolve this defect and allow her to carry a child to term?**\nA) Hysteroscopic Metroplasty (Surgical resection/clipping of the septum)\nB) Open abdominal surgery to physically reconstruct and sew the two halves of the uterus together\nC) Placement of a permanent cervical cerclage\nD) Laparoscopic Bilateral Salpingectomy\n\n**Answer: A** — **Uterine Septum**—The most common congenital Müllerian anomaly causing repeated, tragic miscarriages (because embryos implant on the bloodless septum and die). The definitive, minimally invasive cure is a **Hysteroscopic Metroplasty**, where the surgeon simply snips the avascular septum with scissors or a laser, instantly creating a single, normal, healthy cavity.\n\n---\n\n### Q83. \n**A 35-year-old female presents for her first prenatal visit at 8 weeks gestation. Her history is notable: during her last pregnancy 3 years ago, she developed severe Gestational Diabetes Mellitus (GDM) requiring high doses of insulin, and delivered a massive 10.5 lb baby. Given her extreme high-risk status, what is the SINGLE BEST screening protocol the obstetrician MUST implement for this specific pregnancy?**\nA) Perform a definitive 75-gram, 2-hour Oral Glucose Tolerance Test (OGTT) immediately at this very first prenatal visit\nB) Wait to perform the standard 50-gram screening test strictly between 24 and 28 weeks\nC) Rely entirely on her fasting blood glucose level taken today\nD) Start her immediately on empirical Metformin without any testing\n\n**Answer: A** — **High-Risk GDM Screening**—While normal-risk women are screened at 24-28 weeks, women with massive risk factors (prior severe GDM, extreme obesity, prior macrosomia) MUST be tested **immediately at the first prenatal visit** to catch undiagnosed pre-existing Type 2 diabetes or massive early-onset insulin resistance.\n\n---\n\n### Q84. \n**A 25-year-old female recently underwent a suction D&C for a confirmed complete hydatidiform molar pregnancy. Six weeks later, her serial quantitative β-hCG levels, which had been falling beautifully, suddenly violently reverse course, skyrocketing to 150,000 mIU/mL. She develops a severe, hacking cough and begins coughing up bright red blood (hemoptysis). A stat Chest X-ray reveals multiple, dense \"cannonball\" nodules scattered across both lung fields. She is diagnosed with high-risk Gestational Choriocarcinoma. What is the SINGLE BEST, highly curative systemic treatment regimen?**\nA) Multi-agent EMA-CO chemotherapy (Etoposide, Methotrexate, Actinomycin-D, Cyclophosphamide, Oncovin/Vincristine)\nB) Single-agent intramuscular Methotrexate therapy\nC) Immediate, emergency radical total abdominal hysterectomy\nD) High-dose external beam whole-lung radiotherapy\n\n**Answer: A** — **High-Risk Gestational Trophoblastic Neoplasia (Choriocarcinoma)**—Because she has pulmonary metastases and a wildly high hCG, she is classified as high-risk. Single-agent methotrexate will fail. The gold-standard, brilliantly curative regimen is the aggressive multi-agent **EMA-CO chemotherapy protocol**.\n\n---\n\n### Q85. \n**A 40-year-old female undergoes a routine Pap smear, which reveals severe abnormalities. A subsequent colposcopy and biopsy confirm invasive Squamous Cell Carcinoma of the cervix. A comprehensive clinical staging workup, including a pelvic MRI, demonstrates a 3.5 cm tumor strictly confined entirely to the cervix, with absolutely no parametrial invasion, no vaginal involvement, and no enlarged lymph nodes. She is staged at FIGO IB2. She strongly desires definitive surgical cure. What is the SINGLE BEST surgical procedure?**\nA) Radical Hysterectomy combined with a bilateral pelvic lymphadenectomy\nB) Simple, extra-fascial Total Abdominal Hysterectomy\nC) Loop Electrosurgical Excision Procedure (LEEP)\nD) Bilateral Salpingo-Oophorectomy alone\n\n**Answer: A** — **Stage IB Cervical Cancer**—Because the tumor is invasive but still confined to the cervix, it is perfectly amenable to surgical cure. However, a simple hysterectomy is inadequate; the standard of care is a **Radical Hysterectomy** (removing the cervix, uterus, parametrium, and upper vagina) alongside a **pelvic lymph node dissection** to ensure total clearance.\n\n---\n\n### Q86. \n**A 30-year-old female, G4P3 (all previous cesarean sections), is scheduled for an elective repeat C-section at 38 weeks. During the surgery, the obstetrician delivers the baby safely but encounters a terrifying complication: the placenta is absolutely, inextricably fused and invading deeply into the uterine myometrium, entirely failing to detach. Despite massive hemorrhage, the surgeon realizes it cannot be scraped off. What is the MOST LIKELY pathological diagnosis forcing an immediate, life-saving peripartum hysterectomy?**\nA) Placenta Accreta Spectrum\nB) Severe Uterine Atony\nC) Retained placental cotyledon\nD) A massive, undiagnosed bleeding disorder (DIC)\n\n**Answer: A** — **Placenta Accreta**—The invasion of trophoblastic tissue directly into the myometrium (due to a lack of the intervening decidua basalis, usually destroyed by previous C-sections). It is currently the **single most common indication for an emergency peripartum hysterectomy** to prevent the mother from bleeding to death on the table.\n\n---\n\n### Q87. \n**A 28-year-old primigravida at 37 weeks presents in labor with a confirmed frank breech presentation. The obstetrician discusses the risks and benefits of an External Cephalic Version (ECV) to manually rotate the baby from the outside into a head-down (vertex) position. To maximize the success of this difficult, forceful maneuver by deeply relaxing the uterine muscle, what is the SINGLE BEST pharmacological agent commonly administered just prior to the procedure?**\nA) A short-acting Beta-2 agonist Tocolytic (e.g., subcutaneous Terbutaline)\nB) High-dose intravenous Oxytocin\nC) A continuous Magnesium Sulfate infusion\nD) Intravenous Labetalol\n\n**Answer: A** — **External Cephalic Version (ECV) Tocolysis**—The uterus must be completely flaccid to allow the physician to violently spin the baby. A rapid, powerful, short-actin
