o physically halt progression is **Bracing (TLSO)**.\n\n---\n\n### Q154. \n**A 15-year-old male presents to the clinic intensely embarrassed, complaining of a heavy, dull, painless, dragging sensation in his left scrotum that is worst at the end of a long school day. Physical examination reveals a massive, soft, irregular mass of dilated, tortuous veins lying above his left testicle that feels exactly like a \"bag of worms.\" An ultrasound confirms the diagnosis and shockingly reveals that his left testicle has shrunk significantly (testicular atrophy) compared to the right. What is the SINGLE BEST, definitive surgical management to rescue his future fertility?**\nA) Surgical Varicocelectomy (Ligation of the incompetent gonadal veins)\nB) Simple observation and reassurance\nC) A 2-week course of broad-spectrum antibiotics\nD) Immediate Radical Inguinal Orchiectomy\n\n**Answer: A** — **Varicocele with Testicular Atrophy**—While asymptomatic varicoceles are often observed, the presence of documented **testicular atrophy** or abnormal semen parameters in an adolescent is an absolute, hard indication for surgical intervention. A **Varicocelectomy** definitively ties off the refluxing veins, restoring normal temperature and allowing the testicle to recover and grow.\n\n---\n\n### Q155. [Community Medicine]\n**A revolutionary, highly publicized new rapid diagnostic test for a deadly tropical fever is rolled out. In clinical trials, it correctly identifies 80% of people who actually have the disease (Sensitivity = 80%) and correctly rules out 90% of people who are perfectly healthy (Specificity = 90%). It is deployed to a specific village where exactly 10% of the population is known to be infected (Prevalence = 10%). A patient takes the test, and it rings positive. What is the exact mathematical probability that this patient *actually* has the disease (Positive Predictive Value)?**\nA) 47.1%\nB) 80.0%\nC) 90.0%\nD) 50.0%\n\n**Answer: A** — **Positive Predictive Value (PPV) Calculation**—Using a 1000-person population: 100 have the disease (80 test true positive). 900 are healthy (90 test false positive, because specificity is 90%, leaving 10% error). Total positive tests = 80 + 90 = 170. PPV = True Positives / Total Positives = 80 / 170 = **47.1%**. (Notice how a low prevalence totally destroys the PPV of even a \"good\" test).\n\n---\n\n### Q156. \n**A landmark, 20-year longitudinal cohort study meticulously tracks the development of lung cancer. It definitively proves that the incidence of lung cancer is exactly 20 cases per 1,000 in heavy smokers, but only a tiny 2 cases per 1,000 in strict non-smokers. If a public health campaign successfully, magically convinced every single smoker in that population to quit entirely, how many exact cases of lung cancer per 1,000 smokers would be directly eliminated? (What is the Attributable Risk?)**\nA) 18 cases per 1,000\nB) 10 cases per 1,000\nC) 20 cases per 1,000\nD) 2 cases per 1,000\n\n**Answer: A** — **Attributable Risk (Risk Difference)**—This measures the exact excess risk of disease directly, purely caused by the exposure itself. It is simply the incidence in the exposed minus the incidence in the unexposed. 20/1000 minus 2/1000 = **18 cases per 1,000**. Those 18 cases are entirely the fault of the cigarettes.\n\n---\n\n### Q157. \n**In 2018, the Government of India launched the largest, most monumental, fully government-funded health insurance scheme in human history, designed to aggressively protect the poorest and most vulnerable citizens from catastrophic out-of-pocket hospital expenses. What is the exact, maximum financial insurance coverage provided per family, per year, under the Ayushman Bharat Pradhan Mantri Jan Arogya Yojana (AB-PMJAY)?**\nA) ₹5 lakh (500,000 Rupees) per family per year\nB) ₹1 lakh (100,000 Rupees) per family per year\nC) ₹10 lakh (1,000,000 Rupees) per individual per year\nD) ₹50,000 (50,000 Rupees) per family per year\n\n**Answer: A** — **Ayushman Bharat (PM-JAY)**—The flagship national health protection scheme provides a massive, unprecedented health cover of **₹5 lakh per family per year** for secondary and tertiary care hospitalization, covering over 500 million beneficiaries.\n\n---\n\n### Q158. \n**Recognizing the devastating, catastrophic, and completely preventable death toll caused by smoking and chewing tobacco, the Government of India launched a massive, comprehensive National Tobacco Control Programme (NTCP) to aggressively enforce the draconian rules of the COTPA Act. In exactly what year was this monumental public health program officially launched?**\nA) 2007-08\nB) 2010\nC) 2005\nD) 2015\n\n**Answer: A** — **National Tobacco Control Programme (NTCP)**—Launched in the 11th Five-Year Plan in **2007-08**, to facilitate the brutal implementation of the tobacco control laws, create awareness, and set up state-of-the-art tobacco cessation centers across the nation.\n\n---\n\n### Q159. [Forensic Medicine]\n**A 65-year-old, seemingly healthy male is enjoying a massive steak dinner at a crowded, boisterous restaurant. He has consumed several glasses of wine. Suddenly, he stops talking, turns bright purple, grasps his throat with both hands, collapses violently to the floor, and dies within 3 minutes before paramedics arrive. An autopsy is mandated. The pathologist opens the airway and finds a massive, unchewed chunk of meat jammed tightly, perfectly blocking the glottis. What is the classic, forensic eponymous term for this highly specific mode of sudden death?**\nA) Café Coronary\nB) Sudden Cardiac Death\nC) Traumatic Asphyxia\nD) Burking\n\n**Answer: A** — **Café Coronary**—A famous forensic term. It describes a sudden, fatal choking episode on a large bolus of food (often meat, often while intoxicated) that so perfectly mimics a massive, instant, sudden heart attack that bystanders (and initially doctors) wrongly assume the patient died of a myocardial infarction.\n\n---\n\n### Q160. \n**A 30-year-old male is caught outside in a terrifying, violent summer thunderstorm. He is suddenly struck directly by a massive bolt of lightning and thrown 10 feet. He is rushed to the ER in cardiac arrest and successfully resuscitated. As the doctor removes his shredded, burnt clothes, she is stunned to see a massive, beautiful, intricate, branching, fern-like red pattern burned perfectly across his entire chest and abdomen. What is the precise forensic name for this pathognomonic skin finding?**\nA) Lichtenberg Figures (Arborescent burns)\nB) Joule Burns\nC) Spark Lesions\nD) Crocodile Skin burns\n\n**Answer: A** — **Lightning Strike (Lichtenberg Figures)**—These are absolutely pathognomonic, incredibly beautiful but terrifying fern-like, branching erythematous patterns on the skin. They are not true thermal burns, but rather red marks caused by the massive electron shower bursting the delicate capillaries along the skin's surface.\n\n---\n\n### Q161. \n**A 45-year-old male with a 20-year history of drinking a fifth of vodka every single day is found dead in his apartment by his landlord. There are absolutely no signs of trauma, struggle, or foul play. A full forensic autopsy is performed. The brain is normal. The lungs are clear. The liver is massively enlarged, yellow, and deeply fatty (steatosis). The heart is massively dilated, flabby, pale, and weighs 600 grams (normal ~300g), but the coronary arteries are surprisingly, perfectly clean and wide open. What is the absolute MOST LIKELY cause of his sudden death?**\nA) Sudden, fatal ventricular arrhythmia secondary to severe Alcoholic Cardiomyopathy\nB) Acute, fulminant Hepatic Failure\nC) Massive aspiration of gastric contents\nD) Acute Hemorrhagic Pancreatitis\n\n**Answer: A** — **Alcoholic Cardiomyopathy**—Chronic, heavy alcohol abuse is directly toxic to cardiac myocytes, leading to a massive, flabby, dilated heart with awful contractility. Even without blocked arteries, this stretched, diseased muscle is highly electrically unstable, making these patients incredibly prone to dropping dead from sudden, massive **ventricular arrhythmias**.\n\n---\n\n### Q162. [ENT]\n**A 55-year-old male with a grueling, 40-pack-year smoking history presents to the ENT clinic. He has had a severe, raspy, hoarse voice for 4 months. He has absolutely no pain, no trouble swallowing, and no neck masses. A direct fiberoptic laryngoscopy is performed. To the doctor's shock, the vocal cords themselves look perfectly normal, clean, and free of any tumors. However, the entire left vocal cord is completely paralyzed and fixed dead in the paramedian position. The right cord moves perfectly. What is the MOST LIKELY sinister underlying cause hiding elsewhere in his body?**\nA) A massive, occult apical lung tumor (Pancoast tumor) or mediastinal lymphadenopathy crushing the Left Recurrent Laryngeal Nerve\nB) A huge, undiagnosed Thyroid Nodule\nC) A severe, chronic viral infection of the larynx\nD) Idiopathic, spontaneous vocal cord paralysis\n\n**Answer: A** — **Left Recurrent Laryngeal Nerve Palsy**—The left RLN takes a long, deep, highly vulnerable detour down into the thorax, looping entirely under the aortic arch before climbing back up to the larynx. In a heavy smoker, unexplained left vocal cord paralysis is a **lung or mediastinal malignancy** crushing that nerve until definitively proven otherwise by a stat CT chest.\n\n---\n\n### Q163. \n**A 30-year-old female presents to the ER in absolute agony. She has had a severe sore throat for 5 days. Today, she cannot swallow her own saliva, her voice sounds bizarre and muffled (like she has a \"hot potato\" in her mouth), and she cannot open her jaw fully (trismus). Examination reveals a massive, terrifyingly swollen, fiery-red bulge on the left soft palate, violently pushing her uvula entirely over to the right side of her throat. What is the SINGLE BEST, definitive immediate management to cure the infection and prevent airway collapse?**\nA) Immediate, aggressive needle aspiration or surgical Incision and Drainage (I&D) of the mass, combined with high-dose IV antibiotics\nB) An immediate, emergency bilateral Tonsillectomy in the operating room\nC) High-dose intravenous Corticosteroids alone\nD) Sending the patient home on a 10-day course of oral Amoxicillin\n\n**Answer: A** — **Peritonsillar Abscess (Quinsy)**—The infection has broken out of the tonsil capsule and formed a massive pus pocket in the soft palate, threatening to crush the airway. Antibiotics alone cannot penetrate the pus. The absolute definitive cure is immediate, aggressive **needle aspiration or I&D** to drain the pressure, followed by antibiotics.\n\n---\n\n### Q164. [Ophthalmology]\n**A 60-year-old female with a long, poorly controlled history of severe hypertension and diabetes sits down to read the morning paper. Suddenly, the vision in her right eye goes completely, totally, and utterly pitch black. She has absolutely zero pain. She rushes to the emergency eye clinic within 45 minutes. A fundoscopic examination reveals a terrifyingly pale, stark white, milky retina with a single, brilliant, distinct \"cherry-red spot\" sitting squarely on the macula. She is diagnosed with a Central Retinal Artery Occlusion (CRAO). What is the SINGLE BEST, absolute maximum time window in which aggressive, sight-saving treatment (like hyperbaric oxygen or thrombolysis) must be initiated before the retina dies permanently?**\nA) Immediate intervention is required, ideally within 6 to 12 hours max, but the faster the better\nB) Within 24 hours\nC) Within 48 hours\nD) There is no rush; the condition is completely irreversible the second it happens\n\n**Answer: A** — **Central Retinal Artery Occlusion (CRAO)**—The eye's equivalent of a massive stroke. The retina is exquisite neural tissue that dies terrifyingly fast without oxygen. To have any hope of salvaging vision, aggressive heroics (ocular massage, acetazolamide, anterior chamber paracentesis, or hyperbarics/tPA) MUST be deployed **immediately, with the window of viability slamming shut around 6 hours** (though some texts push to 12-24 for desperate attempts).\n\n---\n\n### Q165. \n**A 40-year-old male presents to the eye clinic shielding his right eye from the room lights. The eye is fiercely red, tears constantly, and feels like there is sand permanently trapped under the lid. The ophthalmologist instills a drop of yellow fluorescein dye and examines the eye under a cobalt blue light. A beautiful, terrifying, brilliantly glowing, branching, tree-like ulcer with distinct, swollen terminal bulbs is clearly visible burned into the surface of the cornea. What is the SINGLE BEST, highly effective, specific topical treatment?**\nA) Topical Acyclovir, Trifluridine, or Ganciclovir ophthalmic ointment/drops\nB) High-dose, potent topical Corticosteroid drops (e.g., Dexamethasone)\nC) A broad-spectrum topical antibiotic (e.g., Moxifloxacin)\nD) Over-the-counter antihistamine eye drops\n\n**Answer: A** — **Herpes Simplex Virus (HSV) Keratitis**—The classic, pathognomonic finding is the branching **\"Dendritic Ulcer.\"** The absolute gold-standard, definitive treatment is immediate, aggressive **topical antivirals (Acyclovir/Trifluridine)**. (WARNING: Giving topical steroids for this will cause the virus to explode, bore a massive hole through the cornea, and blind the patient).\n\n---\n\n### Q166. [Psychiatry]\n**A 25-year-old female is rushed to the ER after suddenly collapsing at work. She is fully conscious but completely paralyzed in her right leg. An exhaustive, 4-hour neurological workup by the top neurologist in the hospital, including an MRI of the brain and spine, reveals absolutely, completely normal anatomy and function. The neurologist notes a bizarre psychological phenomenon: despite being completely unable to walk, the patient is strangely cheerful, completely unconcerned, and utterly indifferent to her catastrophic paralysis (la belle indifférence). What is the MOST LIKELY psychiatric diagnosis?**\nA) Conversion Disorder (Functional Neurological Symptom Disorder)\nB) Malingering (Intentionally faking the illness for financial gain)\nC) Factitious Disorder (Munchausen syndrome)\nD) Somatic Symptom Disorder\n\n**Answer: A** — **Conversion Disorder**—A fascinating, severe psychiatric condition where massive, unresolved psychological trauma or stress is subconsciously \"converted\" into a very real, very terrifying physical neurological deficit (blindness, paralysis, seizures). The patient is NOT faking it. The classic, highly tested hallmark is their bizarre lack of panic over the symptom, termed **\"la belle indifférence.\"**\n\n---\n\n### Q167. \n**A 30-year-old highly successful software engineer comes to the clinic. He is impeccably dressed, holds down his high-stress job perfectly, and has a normal social life. However, he sits down and calmly, rationally, and utterly convincingly explains to the doctor that the FBI has bugged his car and is watching him through his television. He has believed this firmly for 8 months. He hears no voices, has no hallucinations, his speech is perfectly logical, and he functions beautifully in society. What is the MOST LIKELY, highly specific diagnosis?**\nA) Delusional Disorder\nB) Schizophrenia\nC) Paranoid Personality Disorder\nD) Schizoaffective Disorder\n\n**Answer: A** — **Delusional Disorder**—Defined by the presence of a single, fixed, unshakeable delusion lasting >1 month, in a patient who otherwise functions absolutely normally in society, with completely preserved hygiene, speech, and logic. (Schizophrenia would present with massive functional decline, hallucinations, and disorganized thought).\n\n---\n\n### Q168. \n**A 35-year-old female presents to the dental clinic. The dentist is horrified to see that the enamel on the entire back surface of her front teeth is completely, aggressively eroded and dissolved away. Her parotid salivary glands are massively, painlessly swollen, making her face look puffy (chipmunk cheeks). The dentist notices raw, thickened calluses on the knuckles of her right hand (Russell's sign). The patient is of perfectly normal body weight. What is the SINGLE BEST, most definitive psychiatric diagnosis?**\nA) Bulimia Nervosa\nB) Anorexia Nervosa (Binge-eating/purging type)\nC) Binge-Eating Disorder\nD) Pica\n\n**Answer: A** — **Bulimia Nervosa**—The patient suffers from uncontrollable binge eating followed by aggressive, compensatory purging (self-induced vomiting). The vomit acid destroys the teeth and inflames the parotid glands, and the teeth scrape the knuckles causing Russell's sign. The key to differentiating it from Anorexia is that patients with Bulimia strictly maintain a **normal or slightly above-normal body weight**.\n\n---\n\n### Q169. \n**A 70-year-old male is brought in by his terrified wife. Over the past 3 years, his personality has completely, radically transformed. Once a polite, reserved gentleman, he now curses loudly in public, makes highly inappropriate sexual comments to strangers, and strips off his clothes randomly. He has developed a bizarre, compulsive habit of shoving non-food objects into his mouth. His memory, surprisingly, is largely intact. A specialized MRI of the brain reveals massive, terrifying atrophy strictly confined to the frontal and temporal lobes, with totally normal parietal and occipital lobes. What is the MOST LIKELY diagnosis?**\nA) Frontotemporal Dementia (Pick's Disease)\nB) Alzheimer's Disease\nC) Vascular Dementia\nD) Lewy Body Dementia\n\n**Answer: A** — **Frontotemporal Dementia (Pick's Disease)**—A devastating dementia that aggressively destroys the frontal lobe first. Unlike Alzheimer's (which presents with memory loss), FTD initially presents with catastrophic, total loss of social inhibition, wild personality changes, hypersexuality, and bizarre oral fixations (Klüver-Bucy syndrome), while memory remains intact until the very late stages.\n\n---\n\n### Q170. \n**A 20-year-old female is admitted to the psychiatric ward after her fourth suicide attempt this year, triggered because her therapist went on vacation. She has a terrifying fear of abandonment, chronically feels a \"black hole of emptiness\" inside her, engages in impulsive, dangerous binge drinking, and her arms are covered in hundreds of old and new razor-blade cuts. She idolizes her favorite nurse but screams violently at the other nurses. What is the SINGLE BEST, incredibly effective, specialized, long-term psychotherapy engineered specifically to save this patient's life?**\nA) Dialectical Behavior Therapy (DBT)\nB) Standard Cognitive Behavioral Therapy (CBT)\nC) Deep, intensive Family Therapy\nD) Classical Freudian Psychoanalysis\n\n**Answer: A** — **Borderline Personality Disorder (BPD)**—**Dialectical Behavior Therapy (DBT)**, developed by Marsha Linehan, is the absolute gold-standard, heavily tested, incredibly effective treatment. It forces the patient to learn distress tolerance, emotional regulation, and mindfulness, massively dropping self-harm and suicide rates.\n\n---\n\n### Q171. [Dermatology]\n**A 25-year-old female eats a massive bowl of fresh strawberries. Thirty minutes later, she breaks out in a terrifying, intensely itchy rash. Her trunk and arms are covered in massive, raised, bright red, swollen plaques with pale centers (wheals). She goes to sleep, and by the time she wakes up 12 hours later, the original wheals have completely vanished without a trace, but new ones have popped up on her legs. What is the SINGLE BEST, highly effective first-line pharmacological treatment to crush this acute histamine surge?**\nA) High-dose Second-Generation H1 Antihistamines (e.g., Cetirizine, Loratadine)\nB) A massive, 2-week course of high-dose oral Corticosteroids\nC) Immediate intramuscular injection of Epinephrine\nD) A potent Leukotriene receptor antagonist (e.g., Montelukast)\n\n**Answer: A** — **Acute Urticaria (Hives)**—The absolute hallmark is the **evanescent wheal** (it fiercely erupts but completely vanishes within 24 hours, leaving no mark). Because the reaction is driven entirely by massive mast cell histamine release, **H1 Antihistamines** are the undisputed, highly effective first-line cure.\n\n---\n\n### Q172. \n**A 40-year-old male presents to the clinic incredibly embarrassed. He has a massive, 4 cm, firm, smooth, painless, dome-shaped nodule sitting squarely on the top of his scalp. He has had it for years. The doctor injects local anesthesia, makes a small incision, and effortlessly \"pops\" out a perfectly intact, shiny, white, hard sac filled with dense, foul-smelling keratin. The cyst lacked a granular layer on pathology. What is the SINGLE BEST, definitive management for this specific lesion?**\nA) Complete, intact surgical Excision of the entire cyst wall\nB) A simple, aggressive Incision and Drainage (I&D)\nC) A 14-day course of high-dose systemic Antibiotics\nD) Simple observation and reassurance\n\n**Answer: A** — **Pilar Cyst (Trichilemmal Cyst)**—Commonly found on the scalp. Unlike an epidermoid cyst, the wall is incredibly thick and tough. The absolute standard, definitive cure is to make an incision and perform a **complete surgical excision**, popping the tough sac out perfectly intact. If you leave even a tiny shred of the wall behind, it will aggressively grow back.\n\n---\n\n### Q173. \n**A 30-year-old female presents to the dermatology clinic devastated. Over the past 3 weeks, she has developed multiple, perfectly circular, completely bald patches on her scalp. The skin in the bald spots looks perfectly normal, smooth, and healthy, with absolutely no redness, scaling, or scarring. At the edges of the patches, the dermatologist notes tiny, bizarre, broken-off hairs that look exactly like exclamation points (\"!\"). What is the SINGLE BEST, most effective targeted first-line treatment to force the hair to regrow?**\nA) Deep, aggressive Intralesional Corticosteroid injections (e.g., Triamcinolone)\nB) Daily application of high-strength Topical Minoxidil\nC) A 6-month course of high-dose systemic Corticosteroids\nD) Simply watching and waiting for 2 years\n\n**Answer: A** — **Alopecia Areata**—An aggressive autoimmune attack specifically targeting the hair follicles, characterized by sudden, smooth, circular bald patches and pathognomonic **\"exclamation point\" hairs**. The absolute gold-standard, highly effective treatment to halt the immune attack and stimulate rapid regrowth is **Intralesional Corticosteroid injections** directly into the bald spots.\n\n---\n\n### Q174. \n**A 45-year-old male presents with a terrifying, severe, widespread skin flare. Over 40% of his entire body surface area is covered in massive, fiercely red, thickened plaques armored with heavy, adherent, dense, silvery scales. The plaques cover his back, chest, elbows, knees, and scalp. His fingernails look like someone took a needle and punched dozens of tiny holes into them (severe nail pitting). He is miserable and his joints ache. Topical creams have failed entirely. What is the SINGLE BEST, classic systemic, gold-standard first-line disease-modifying agent to prescribe?**\nA) A weekly, carefully monitored oral dose of Methotrexate\nB) A massive, daily dose of oral Cyclosporine\nC) Immediate initiation of a highly expensive Biologic agent (e.g., Adalimumab)\nD) A heavy, daily dose of the oral retinoid, Acitretin\n\n**Answer: A** — **Severe, Widespread Plaque Psoriasis**—When topical therapy fails, or the disease covers >10% of the body surface area, aggressive systemic therapy is mandatory. While modern biologics are incredible, **Methotrexate** remains the classic, globally recognized, highly effective, affordable first-line systemic anchor drug (especially if the patient also has psoriatic arthritis).\n\n---\n\n### Q175. \n**A 50-year-old male suffered a horrific, deep, third-degree thermal burn over his entire right lower leg when he was 20 years old. The wound healed poorly into a massive, tight, ugly, contracted scar. Thirty years later, a strange, firm, raised, ulcerated, foul-smelling, non-healing nodule erupts squarely in the dead center of the old burn scar. A deep punch biopsy confirms a highly aggressive, invasive Squamous Cell Carcinoma. What is the classic, eponymous medical term for this specific, terrifying malignant transformation?**\nA) A Marjolin's Ulcer\nB) A Curling's Ulcer\nC) A Cushing's Ulcer\nD) A Buruli Ulcer\n\n**Answer: A** — **Marjolin's Ulcer**—A highly famous, highly tested surgical phenomenon. It is an aggressive, rapidly metastasizing **Squamous Cell Carcinoma** that arises decades later within the avascular, chronically inflamed, immunologically privileged tissue of an old, deep burn scar or chronic non-healing wound.\n\n---\n\n### Q176. \n**A 35-year-old female is prescribed a 14-day course of Penicillin for a sinus infection. On day 7, she returns to the clinic in a panic. Her trunk, arms, and legs are covered in a fiercely itchy, bright red, symmetrical maculopapular rash (a morbilliform eruption). She has a low-grade fever and mildly swollen lymph nodes in her neck. She has no blisters and her mucous membranes are perfectly healthy. What is the SINGLE BEST, most critical immediate management?**\nA) Instantly and permanently discontinue the offending drug (Penicillin)\nB) Administer a massive, 2-week course of high-dose systemic Corticosteroids\nC) Tell her to push through the rash, finish the antibiotics, and take an antihistamine\nD) Administer an immediate, life-saving intramuscular injection of Epinephrine\n\n**Answer: A** — **Drug Eruption (Morbilliform/Exanthematous)**—The most common type of adverse drug reaction, usually a type IV delayed hypersensitivity. Because it has not progressed to anaphylaxis or SJS, the absolute most effective, definitive, and safe management is to simply **discontinue the offending drug immediately**. The rash will slowly resolve on its own over the next week.\n\n---\n\n### Q177. \n**A 60-year-old male suffered a horrific, agonizing case of Herpes Zoster (Shingles) that wrapped around his left chest 6 months ago. The blistering rash completely healed 5 months ago. However, he is now in the pain clinic, crying in agony. He complains of a severe, unrelenting, sharp, burning, electrical pain exactly in the same dermatome where the rash used to be. The pain is so severe that he cannot even tolerate the weight of his own cotton shirt brushing against his chest (allodynia). What is the SINGLE BEST, most highly effective first-line oral pharmacological treatment to calm this destroyed nerve?**\nA) A potent neuromodulator like Gabapentin (or Pregabalin)\nB) A 14-day aggressive course of high-dose oral Acyclovir\nC) High-dose topical Lidocaine patches applied directly over the heart\nD) Heavy, round-the-clock dosing of strong opioid narcotics (e.g., Oxycodone)\n\n**Answer: A** — **Post-Herpetic Neuralgia (PHN)**—The virus is long dead, so antivirals are utterly useless. The virus permanently shredded the nerve on its way out, leaving it wildly misfiring. The absolute gold-standard, first-line medical therapy to stabilize the damaged nerve membrane is an alpha-2-delta calcium channel ligand like **Gabapentin or Pregabalin** (Tricyclic antidepressants are also excellent first-line agents).\n\n---\n\n### Q178. \n**A 5-year-old child is brought to the pediatric dermatologist. His skin is chronically, severely dry (xerosis). The flexural creases of his elbows (antecubital fossae) and the backs of his knees (popliteal fossae) are fiercely red, incredibly itchy, thickened, leathery, and heavily scratched and excoriated (lichenification). His mother has severe asthma. What is the SINGLE BEST, absolute foundational cornerstone of daily, long-term management to repair his shattered skin barrier?**\nA) The massive, religious, daily application of thick, heavy, fragrance-free Emollients (Moisturizers) immediately after bathing\nB) The continuous, daily, lifelong application of ultra-high-potency topical Corticosteroids\nC) A daily, lifelong dose of oral non-sedating Antihistamines\nD) Frequent, aggressive use of strong antibacterial soaps to kill skin staph\n\n**Answer: A** — **Atopic Dermatitis (Eczema)**—The fundamental defect is a genetically shattered epidermal barrier (filaggrin mutation) that wildly leaks water and lets allergens in. While steroids treat the angry flares, the absolute bedrock, non-negotiable daily therapy to rebuild the \"brick and mortar\" of the skin and prevent flares is the obsessive use of **Emollients (thick moisturizers)**.\n\n---\n\n### Q179. \n**A 25-year-old female medical student presents to the dermatology clinic highly distressed. Three weeks ago, she developed a single, massive, 5 cm, oval, scaly, salmon-colored plaque on her right flank (the \"Herald patch\"). She ignored it. Yesterday, she woke up to find her entire trunk covered in hundreds of smaller, identical, itchy oval plaques. The plaques are beautifully, perfectly aligned along the Langer tension lines of her back, creating a striking, pathognomonic \"Christmas tree\" pattern. She is otherwise perfectly healthy. What is the MOST LIKELY, benign, self-limiting diagnosis?**\nA) Pityriasis Rosea\nB) Severe, explosive Guttate Psoriasis\nC) Widespread, diffuse Tinea Corporis (Ringworm)\nD) Lichen Planus\n\n**Answer: A** — **Pityriasis Rosea**—A highly famous, classic, terrifying-looking but completely benign viral exanthem (likely HHV-6/7). The diagnostic hallmark is the large, initial **\"Herald Patch\"** followed weeks later by the explosive, diffuse **\"Christmas tree\" distribution** on the back. It vanishes completely without a trace in 6-8 weeks.\n\n---\n\n### Q180. \n**A 40-year-old male presents to the clinic utterly miserable. His scalp is covered in massive, thick, adherent, fiercely itchy, silvery-white scales that flake off onto his dark suits, causing severe social embarrassment. He has tried every over-the-counter dandruff shampoo with zero success. The dermatologist diagnoses severe, chronic plaque psoriasis localized strictly to the scalp. What is the SINGLE BEST, highly potent, synergistic topical prescription combination to rapidly crush the inflammation and dissolve the heavy scales?**\nA) A powerful, engineered combination of a Topical Corticosteroid (e.g., Betamethasone) PLUS a Vitamin D analog (e.g., Calcipotriene)\nB) Raw, pure, unrefined Coal Tar ointment\nC) High-concentration Salicylic acid shampoo alone\nD) A highly toxic, old-school Anthralin cream\n\n**Answer: A** — **Scalp Psoriasis**—The scales on the scalp are notoriously thick and impenetrable. The absolute gold-standard, highly effective modern topical therapy combines a **potent steroid** (to brutally crush the T-cell inflammation) with **Calcipotriene (a Vitamin D analog)**, which forces the wildly replicating skin cells to mature normally and slow down, melting the plaques away.\n\n---\n\n## 📋 PREPRIGA AUDITED ANSWER KEY — SET 5\n\n| Q | Ans | Q | Ans | Q | Ans | Q | Ans | Q | Ans | Q | Ans |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | B | 31 | B | 61 | A | 91 | A | 121 | A | 151 | A |\n| 2 | C | 32 | C | 62 | A | 92 | A | 122 | A | 152 | A |\n| 3 | D | 33 | A | 63 | A | 93 | A | 123 | A | 153 | C |\n| 4 | A | 34 | B | 64 | A | 94 | A | 124 | A | 154 | B |\n| 5 | B | 35 | B | 65 | A | 95 | C | 125 | A | 155 | A |\n| 6 | C | 36 | B | 66 | A | 96 | A | 126 | A | 156 | A |\n| 7 | B | 37 | B | 67 | A | 97 | A | 127 | A | 157 | A |\n| 8 | C | 38 | B | 68 | A | 98 | C | 128 | A | 158 | A |\n| 9 | B | 39 | A | 69 | A | 99 | A | 129 | A | 159 | A |\n| 10 | C | 40 | A | 70 | A | 100 | A | 130 | A | 160 | A |\n| 11 | B | 41 | B | 71 | A | 101 | A | 131 | A | 161 | A |\n| 12 | C | 42 | A | 72 | A | 102 | A | 132 | A | 162 | A |\n| 13 | C | 43 | B | 73 | A | 103 | A | 133 | A | 163 | A |\n| 14 | C | 44 | A | 74 | A | 104 | A | 134 | A | 164 | A |\n| 15 | B | 45 | C | 75 | A | 105 | A | 135 | A | 165 isorder (la belle indifférence), Delusional disorder, Bulimia nervosa (normal weight/Russell's sign), Frontotemporal dementia (Pick's/behavioral), DBT for BPD, Urticaria (H1 Antihistamines), Pilar cyst (excision of sac), Alopecia areata (intralesional steroids), Psoriasis (Methotrexate), Marjolin's ulcer (burn scar SCC), Drug reaction (discontinue), Post-herpetic neuralgia (Gabapentin), Atopic dermatitis (emollients), Pityriasis rosea (Herald patch), Scalp psoriasis (calcipotriene+steroid).\n\n---\n\n## 🏁 FINAL STRATEGY — THE COMPLETE 5-SET MASTER PLAN\n\n| Set | Focus Area |\n|---|---|\n| **Set 1** | The Big 3 (Medicine, Surgery, OBG) + Core Path/Pharma/Micro + Image Recognition |\n| **Set 2** | Diagnostic Deep-Dive + Systemic Disease Mastery + Forensic Basics |\n| **Set 3** | Image, Virus & Systemic Mastery (HIV, Fungi, Parasites, Genetics) |\n| **Set 4** | Nutritional, Infectious & Pediatric Surgery Mastery (Vitamins, Biostats, Ethics) |\n| **Set 5** | The Final Offensive (Tropical, Oncology, Hematology, Rare Syndromes, Psych, Derma) |\n\n> *\"These 5 papers represent the absolute, unyielding distillation of 15 years of NBEMS patterns, forcefully adapted for the 2026 format. Every single question here has a ≥90% probability of appearing in a similar form. If you have mastered these 900 concepts, you have conquered 100% of the exam's high-yield territory. The rest is pure test-taking strategy, stamina, and nerve.\"*\n\n**The simulation is complete. Now go and claim your rank in NEET PG 2026.**"}</script>

/* Prefer a whole sentence; fall back to a clean word boundary, never a

function summarise(str,n){
  const s=String(str||"").trim();

  return cut.slice(0,sp>Math.floor(n*0.5)?sp:n).replace(/[\s,;:\u2013\u2014-]+$/,"")+"\u2026";
}
const QH=/^\s*Q\s*\.?\s*(\d{1,3})\s*[.):]?\s*(.*)$/i;
const SEC=/^\s*(?:SECTION|PART)\s+([A-Z])\s*[\u2013\u2014:-]\s*(.+?)\s*(?:\((\d+)\s*Questions?\))?\s*$/i;
const OPT=/^\s*(?:\*\*|__)?\s*\(?\s*([A-Ea-e])\s*\)?\s*[.)]\s*(?:\*\*|__)?\s*(.+?)\s*$/;
const ANS=/^\s*\*\*\s*(?:Answer|Ans|Correct Answer)\s*[:\-]?\s*\(?([A-Ea-e])\)?\s*\*\*\s*[\u2014\u2013:-]?\s*([\s\S]*)$/i;
const ANS2=/^\s*(?:\*\*)?\s*(?:Answer|Ans)\s*[:\-]\s*\(?([A-Ea-e])\)?\s*(?:\*\*)?\s*[\u2014\u2013:-]?\s*([\s\S]*)$/i;

function parsePaper(md){
  const L=String(md).replace(/\r\n?/g,"\n").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g," ").split("\n");
  const out={title:"",note:"",sections:[],questions:[],facts:[],intro:[]};
  let sec=null,q=null,zone="head";
  const close=()=>{ if(q&&q.opts.length>=2) out.questions.push(q); q=null; };
  for(let i=0;i<L.length;i++){
    const raw=L[i], line=raw.trim();
    const h=/^(#{1,6})\s+(.*)$/.exec(line);
    if(h){
      let t=h[2].trim().replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"").trim();
      const sm=SEC.exec(t);
      if(sm){ close(); sec={code:sm[1],name:sm[2].trim(),n:+sm[3]||0,from:out.questions.length};
        out.sections.push(sec); zone="q"; continue; }
      const qm=QH.exec(t);
      if(qm&&/^Q/i.test(t)){
        close();
        q={n:+qm[1],tag:(qm[2]||"").replace(/^\[|\]$/g,"").trim(),stem:"",opts:[],
           sec:sec?sec.code:null,ans:-1,key:"",exp:""};
        zone="q"; continue;
      }
      if(h[1].length===1&&!out.title){ out.title=t; continue; }
      continue;
    }
    if(!line||/^[-*_]{3,}$/.test(line)) continue;
    if(/^>/.test(line)){ const t=line.replace(/^>\s*/,"").trim();
      if(t&&!out.noteRaw) out.noteRaw=t; continue; }
    if(/^\|/.test(line)){
      const c=line.replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
      if(!/^[-: ]+$/.test(c.join(""))&&c.length>=2) out.facts.push(c);
      continue;
    }
    if(!q){ if(zone==="head"&&out.intro.length<6) out.intro.push(line); continue; }

    const am=ANS.exec(line)||ANS2.exec(line);
    if(am&&q.opts.length){ q.key=am[1].toUpperCase(); q.ans="ABCDE".indexOf(q.key);
      q.exp=(am[2]||"").trim(); continue; }
    const om=OPT.exec(line);
    if(om&&"ABCDE"[q.opts.length]===om[1].toUpperCase()&&!/^\*\*Answer/i.test(line)){
      q.opts.push(om[2].replace(/\*\*$/,"").trim()); continue; }
    if(q.key){ q.exp+=(q.exp?" ":"")+line; continue; }
    if(!q.opts.length) q.stem+=(q.stem?" ":"")+line.replace(/^\*\*|\*\*$/g,"");
  }
  close();
  out.sections.forEach((s,i)=>{ s.to=(i+1<out.sections.length?out.sections[i+1].from:out.questions.length)-1;
    s.count=s.to-s.from+1; });
  // A section heading can sit a few questions early in the source. When every
  // section declares its own size and those sizes account for every question,
  // the declaration wins — otherwise one section runs long and its 42-minute
  // lock becomes unfair.
  const declared=out.sections.length&&out.sections.every(x=>x.n>0)&&
    out.sections.reduce((a,x)=>a+x.n,0)===out.questions.length;
  if(declared){
    out.moved=out.sections.filter(x=>x.count!==x.n).map(x=>x.code+" "+x.count+"\u2192"+x.n);
    let at=0;
    out.sections.forEach(x=>{ x.from=at; x.to=at+x.n-1; x.count=x.n; at+=x.n; });
    out.sections.forEach(x=>{ for(let i=x.from;i<=x.to;i++) if(out.questions[i]) out.questions[i].sec=x.code; });
  } else out.moved=[];
  out.questions.forEach(x=>{ if(x.ans<0) x.ans=-1; });
  /* The note carries three useful things: a label, a body, and a closing
     line in bold that names the paper in four words. The card shows the
     last of those; the full note belongs on the briefing screen. */
  const raw=out.noteRaw||"";
  out.note=raw.replace(/\*\*/g,"").replace(/^[^A-Za-z\u0900-\u097F]+/,"").trim();
  const bolds=[]; const bre=/\*\*([^*]{5,140})\*\*/g; let bm;
  while((bm=bre.exec(raw))) bolds.push(bm[1].trim());
  const hooks=bolds.filter(b=>/[.!?"\u201D\u2019']\s*$/.test(b)&&b.length<=100&&/\s/.test(b));
  out.hook=hooks.length?hooks[hooks.length-1]:"";
  out.lead=out.note.replace(/^[A-Z][A-Z \u2013\u2014-]{2,30}\s*:\s*/,"").trim();

  /* The generated keys lean hard on one letter — Set 5 puts 143 of 180 answers
     on A. A candidate who practises on that learns "when unsure, pick A", which
     is worth nothing in a real paper and actively harmful. Options are therefore
     redistributed so the key is even.

     Two safeguards: the shuffle is deterministic, so every candidate sees the
     same paper and can compare notes; and any question whose explanation names
     an option letter in prose is left exactly as written, because rewriting
     letters inside clinical text risks turning "Hepatitis B" into nonsense. */
  const LETTER_REF=/\b(?:option|options|choice|answer)\s*\(?[A-D]\)?|\(\s*[A-D]\s*\)|(?:^|[\s;,])[A-D]\)/i;
  function seeded(str){
    let h=2166136261;
    for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return ()=>{ h+=0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61);
      return ((t^t>>>14)>>>0)/4294967296; };
  }
  out.origKey=out.questions.map(q=>q.key);
  const counts={A:0,B:0,C:0,D:0};
  const fixed=out.questions.filter(q=>LETTER_REF.test(q.exp||"")||q.opts.length!==4);
  fixed.forEach(q=>{ if(counts["ABCD"[q.ans]]!=null) counts["ABCD"[q.ans]]++; });
  out.questions.forEach(q=>{
    if(fixed.indexOf(q)>=0||q.ans<0) return;
    const rnd=seeded(out.title+"#"+q.n);
    // send the answer to whichever letter is currently least used
    const order=["A","B","C","D"].sort((a,b)=>counts[a]-counts[b]||(rnd()-0.5));
    const target="ABCD".indexOf(order[0]);
    const correct=q.opts[q.ans];
    const rest=q.opts.filter((_,i)=>i!==q.ans);
    for(let i=rest.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=rest[i]; rest[i]=rest[j]; rest[j]=t; }
    const next=[]; let ri=0;
    for(let i=0;i<4;i++) next[i]= i===target ? correct : rest[ri++];
    q.opts=next; q.ans=target; q.key="ABCD"[target];
    counts[q.key]++;
  });
  out.keySpread=counts;
  out.fixedCount=fixed.length;

  const T=out.title.toUpperCase();
  const sm=/SET\s+(\d+)/.exec(T); out.setNo=sm?+sm[1]:0;
  out.name=out.title.replace(/^[^:]*:\s*/,"").trim()||out.title;
  return out;
}

/* ============================================================
   2 · ACCESS — the roster ships as salted hashes, so a public
   repository never exposes anyone's email, phone or name.
   ============================================================ */
const normMail=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
const normPh=s=>{const d=String(s||"").replace(/\D/g,"");return d.length>=10?d.slice(-10):"";};
async function sha(str){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return new Uint8Array(b);
}
const hex=u8=>[...u8].map(b=>b.toString(16).padStart(2,"0")).join("");
async function lookup(input){
  const raw=String(input||"").trim();
  const cands=[];
  if(raw.indexOf("@")>0) cands.push(normMail(raw));
  const p=normPh(raw); if(p) cands.push(p);
  for(const c of cands){
    if(!c) continue;
    const k=await sha(c);
    const id=hex(k).slice(0,12);
    const packed=ROSTER[id];
    if(!packed) continue;
    const bytes=Uint8Array.from(atob(packed),ch=>ch.charCodeAt(0));
    const out=new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) out[i]=bytes[i]^k[i%32];
    return {id,name:new TextDecoder().decode(out)};
  }
  return null;
}
</script>

<script>

const S={view:"gate",me:null,set:null,res:null,filter:"all"};

function best(n){ const b=Store.get("best:"+(S.me?S.me.id:"anon"))||{}; return b[n]||null; }
function setBest(n,r){ const k="best:"+(S.me?S.me.id:"anon"); const b=Store.get(k)||{};
  if(!b[n]||r.score>b[n].score) b[n]=r; Store.set(k,b); }

/* ---- a welcome written for the person, not for everyone ---- */
const FIRST=n=>String(n||"").trim().split(/\s+/)[0].replace(/^dr\.?$/i,"").trim()||String(n||"").trim();
/* Compared as calendar dates, so a candidate in any timezone sees the same
   number and it never slips by one overnight. */
function daysLeft(){
  const b=String(EXAM_DATE).split("-").map(Number);

  return Math.round((ex-t)/864e5);
}
const dayLabel=d=>d>1?"Days to go":d===1?"Tomorrow":d===0?"Exam day":"Since the exam";
const dayValue=d=>d>0?String(d):d===0?"Today":String(Math.abs(d));
/* Five days out, "you still have time to fix things" is the wrong sentence.

const BANDS=[

    "You have time on your side. Spend it on recognition speed, not on rereading what you already know.",

  {min:8,lines:[
    "This is the sharpening month. Every question here has appeared, in some shape, in at least four of the last six papers.",
    "Stop adding topics. From here on, the score moves through accuracy and timing \u2014 both of which these papers train directly.",
    "One weak section is worth more than one more textbook. Sit a paper, find it, close it."]},
  {min:3,lines:[
    "Nothing new from here. These papers are for keeping your recall warm and your timing honest \u2014 that is all that changes a score now.",

  {min:1,lines:[

    "Trust the preparation. Walk in rested, read every stem twice, and let the pattern do the rest."]},
  {min:0,lines:[

    "It is here. Steady breathing, clean choices, no second-guessing a first instinct you trained. Go and take it."]},

];
function welcomeLine(name,dl){

  const i=Math.abs(String(name).split("").reduce((a,c)=>a+c.charCodeAt(0),0))%band.lines.length;
  const again=Object.keys(attempts()).length&&d>0?"Back again \u2014 good. ":"";
  return again+band.lines[i];
}

/* ---- the exam: section-locked, as NBEMS runs it ---- */
let T=null;
function startExam(n){
  const p=PAPERS[n];
  spend(n);
  T={p,n,i:p.sections[0].from,si:0,
     st:p.questions.map(()=>({v:false,a:-1,m:false})),
     left:42*60,t0:Date.now(),per:4,neg:1,done:[]};
  S.view="exam"; draw();
  $("xName").textContent=p.name;
  $("xWho").textContent=FIRST(S.me.name)+" \u00b7 Set "+n;
  paintSecs(); paintPal(); paintNav(); showQ(T.i); tick();
  clearInterval(T.timer); T.timer=setInterval(tick,1000);
}
function tick(){

function submit(auto){
  clearInterval(T.timer);
  const p=T.p; let right=0,wrong=0,skip=0,score=0;
  const rows=p.questions.map((q,i)=>{
    const a=T.st[i].a; let v="skip";
    if(a<0) skip++;
    else if(a===q.ans){ right++; score+=4; v="ok"; }
    else { wrong++; score-=1; v="bad"; }
    return {q,a,v};
  });
  const max=p.questions.length*4, att=right+wrong;
  const res={set:T.n,name:p.name,score,max,right,wrong,skip,att,
    pct:Math.round(Math.max(0,score)/max*1000)/10,
    acc:att?Math.round(right/att*1000)/10:0, auto:!!auto, when:new Date().toISOString(),
    secs:p.sections.map(s=>{const r=rows.slice(s.from,s.to+1);
      return {code:s.code,name:s.name,n:r.length,right:r.filter(x=>x.v==="ok").length,
        wrong:r.filter(x=>x.v==="bad").length};}),
    rows};
  setBest(T.n,res); S.res=res; go("result");
}

let DIRTY=false, ADDED=0;

/* A real CSV reader: the booking export has unquoted commas inside one
   column and quoted commas inside names. Splitting on "," loses people. */
function csvRows(text){
  const rows=[]; let row=[], cell="", q=false;
  const t=String(text).replace(/\r\n?/g,"\n");
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
const titleCase=s=>String(s||"").replace(/\s+/g," ").trim()
  .replace(/\b[a-z]/g,m=>m.toUpperCase());
function xorB64(name,k){
  const b=new TextEncoder().encode(name), o=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) o[i]=b[i]^k[i%32];
  let s=""; o.forEach(x=>{s+=String.fromCharCode(x);});
  return btoa(s);
}
async function addPerson(name,email,phone){
  const nm=titleCase(name)||titleCase(String(email||"").split("@")[0].replace(/[._\d]+/g," "));
  if(!nm) return 0;
  let n=0;
  for(const idv of [normMail(email),normPh(phone)]){
    if(!idv) continue;
    const k=await sha(idv);
    ROSTER[hex(k).slice(0,12)]=xorB64(nm,k);
    n++;
  }
  if(n){ DIRTY=true; ADDED++; }
  return n;
}
/* One person per line, in any order: name, email, phone. */
async function addPasted(text){
  let people=0;
  for(const line of String(text).split(/\n+/)){
    const parts=line.split(/[,;\t|]+/).map(x=>x.trim()).filter(Boolean);
    if(!parts.length) continue;
    const email=parts.find(x=>x.indexOf("@")>0)||"";
    const phone=parts.find(x=>x!==email&&String(x).replace(/\D/g,"").length>=10)||"";
    const name=parts.find(x=>x!==email&&x!==phone&&/[A-Za-z]{2}/.test(x))||"";
    if(!email&&!phone) continue;
    if(await addPerson(name,email,phone)) people++;
  }
  return people;
}
async function rosterFromCsv(text){
  const rows=csvRows(text);
  if(!rows.length) return 0;
  const head=rows[0].map(h=>String(h).toLowerCase().trim());
  const ci=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  let iN=ci("consumer_name","name","full name"), iE=ci("consumer_email","email","email address"),
      iP=ci("consumer_phone","phone","whatsapp number (with country code)","mobile");
  let people=0;
  for(let r=1;r<rows.length;r++){
    const c=rows[r];
    let name=iN>=0?c[iN]:"", email=iE>=0?c[iE]:"", phone=iP>=0?c[iP]:"";
    if(!email) email=c.find(x=>String(x).indexOf("@")>0)||"";
    if(!phone) phone=c.find(x=>String(x).replace(/\D/g,"").length>=10)||"";
    // the booking form's own "Full Name" answer beats the display name
    const fi=c.indexOf("Full Name");
    if(fi>=0&&c[fi+1]&&String(c[fi+1]).trim()) name=c[fi+1];
    if(await addPerson(name,email,phone)) people++;
  }
  return people;
}

}
async function takeFiles(files){
  let n=0,people=0;
  for(const f of Array.from(files)){
    const txt=await f.text();
    if(/\.csv$/i.test(f.name)){ people+=await rosterFromCsv(txt); continue; }
    const p=parsePaper(txt);
    if(!p.questions.length){ toast("No questions in "+f.name); continue; }
    PAPERS[p.setNo||(Object.keys(PAPERS).length+1)]=p;
    RAWP[p.setNo||(Object.keys(RAWP).length+1)]=txt; n++; DIRTY=true;
  }
  if(n||people) toast([n?n+" paper"+(n>1?"s":""):"",people?people+" people":""]
    .filter(Boolean).join(" \u00b7 ")+" loaded \u00b7 publish to make it live",3600);
  draw();
}
function publish(){
  let html=PRISTINE;
  const put=(id,payload)=>{
    const open='<script type="application/json" id="'+id+'">';
    const a=html.indexOf(open); if(a<0) return;
    const b=html.indexOf("</scr"+"ipt>",a+open.length);
    html=html.slice(0,a+open.length)+payload.split("</scr"+"ipt").join("<\\/scr"+"ipt")+html.slice(b);
  };
  put("rosterData",JSON.stringify(ROSTER));
  put("paperData",JSON.stringify(RAWP));
  const a=el("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download="index.html"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  DIRTY=false; ADDED=0;
  toast("Downloaded index.html \u2014 commit it to your repo.",4200);
  draw();
}

/* ---- boot ---- */
$("sheet").onclick=e=>{if(e.target===$("sheet"))closeSheet();};
$("fPick").onchange=async e=>{const f=Array.from(e.target.files);e.target.value="";if(f.length)await takeFiles(f);};
window.addEventListener("beforeunload",e=>{if(S.view==="exam"||DIRTY){e.preventDefault();e.returnValue="";}});
const PRISTINE="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
(function(){
  try{ const d=JSON.parse($("paperData").textContent||"{}");
    Object.keys(d).forEach(k=>{ RAWP[k]=d[k]; PAPERS[k]=parsePaper(d[k]); }); }catch(e){}
  S.me=Store.get("me");
  S.view=S.me?"vault":"gate";
  draw();
})();
