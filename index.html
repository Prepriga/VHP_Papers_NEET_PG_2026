erse, continuous, and lower on the neck).\n\n---\n\n### Q161. \n**A dead body is pulled from a lake. Autopsy shows hemorrhagic fluid in the pleural cavities, massive amounts of fine white froth at the mouth and nostrils, but absolutely no water in the stomach or lungs. What is the MOST LIKELY mechanism?**\nA) Dry drowning\nB) Wet drowning\nC) Postmortem immersion\nD) Secondary drowning\n\n**Answer: A** — **Dry drowning**—immediate intense laryngeal spasm prevents water from entering the lungs or stomach, causing death by acute asphyxia (accounting for ~10-15% of drownings).\n\n---\n\n### Q162. \n**A 35-year-old female presents with a highly pruritic skin rash on her abdomen (Image: well-circumscribed, erythematous, scaly plaque with a raised, advancing border and distinct central clearing, producing a \"ringworm\" appearance). What is the MOST LIKELY diagnosis?**\nA) Tinea corporis\nB) Tinea cruris\nC) Tinea versicolor\nD) Pityriasis rosea\n\n**Answer: A** — **Tinea corporis**—dermatophyte infection causing classic annular (ring-shaped) lesions with central clearing.\n\n---\n\n### Q163. \n**A 30-year-old male complains of intense, generalized itching that is significantly worse at night. Examination reveals small erythematous papules and thread-like burrows in the interdigital web spaces of his hands. What is the SINGLE BEST topical treatment?**\nA) Permethrin 5% cream\nB) Benzyl benzoate\nC) Crotamiton 10%\nD) Clotrimazole 1%\n\n**Answer: A** — **Scabies** (Sarcoptes scabiei)—a single overnight application of **Permethrin 5% cream** from neck to toes is the first-line curative treatment.\n\n---\n\n### Q164. \n**A 4-year-old child presents with a chronic, highly pruritic, erythematous, scaly, and excoriated rash prominently involving the flexural creases (antecubital and popliteal fossae). He has a history of allergic rhinitis. What is the MOST LIKELY diagnosis?**\nA) Atopic dermatitis (Eczema)\nB) Contact dermatitis\nC) Psoriasis\nD) Seborrheic dermatitis\n\n**Answer: A** — **Atopic dermatitis**—classic triad (asthma, allergic rhinitis, eczema) with severe pruritus and flexural involvement in older children.\n\n---\n\n### Q165. \n**A 20-year-old female presents with recurrent, sudden-onset episodes of severe room-spinning vertigo lasting 2 hours, accompanied by a roaring tinnitus, a feeling of fullness in the right ear, and fluctuating low-frequency hearing loss. What is the MOST LIKELY diagnosis?**\nA) Meniere's disease (Endolymphatic hydrops)\nB) Otosclerosis\nC) Vestibular neuritis\nD) Benign Paroxysmal Positional Vertigo (BPPV)\n\n**Answer: A** — **Meniere's disease**—the classic tetrad of episodic vertigo, sensorineural hearing loss, tinnitus, and aural fullness.\n\n---\n\n### Q166. \n**A 40-year-old female presents with progressive, bilateral conductive hearing loss over 5 years. Otoscopy reveals a perfectly normal tympanic membrane. She reports that her hearing improves in noisy environments (Paracusis Willisii). Her mother had early-onset hearing loss. What is the MOST LIKELY diagnosis?**\nA) Otosclerosis\nB) Chronic Suppurative Otitis Media (CSOM)\nC) Tympanosclerosis\nD) Presbycusis\n\n**Answer: A** — **Otosclerosis**—autosomal dominant fixation of the stapes footplate, causing progressive conductive hearing loss with normal TM.\n\n---\n\n### Q167. \n**A 55-year-old male of southern Chinese descent presents with a painless, rapidly growing neck mass, unilateral hearing loss, and epistaxis. Biopsy of the nasopharynx shows undifferentiated squamous cell carcinoma. Which viral infection is MOST STRONGLY implicated in this pathogenesis?**\nA) Epstein-Barr Virus (EBV)\nB) Human Papillomavirus (HPV)\nC) Herpes Simplex Virus (HSV)\nD) Cytomegalovirus (CMV)\n\n**Answer: A** — **Nasopharyngeal carcinoma**—endemic in Asia, highly associated with **EBV** infection and consumption of nitrosamine-rich diets.\n\n---\n\n### Q168. \n**A 60-year-old male with diabetes presents with a painless, gradual, bilateral decline in visual acuity. He notes increased glare when driving at night. Fundoscopy is difficult due to a \"ground glass\" opacity obscuring the red reflex. What is the MOST LIKELY diagnosis?**\nA) Senile Cataract\nB) Open-angle Glaucoma\nC) Age-related Macular Degeneration\nD) Proliferative Diabetic Retinopathy\n\n**Answer: A** — **Cataract**—opacification of the lens leads to painless visual decline, glare (due to light scattering), and an obscured red reflex.\n\n---\n\n### Q169. \n**A 30-year-old male with known Ankylosing Spondylitis presents with an acute, unilateral red eye, deep aching ocular pain, severe photophobia, and blurred vision. Slit-lamp exam reveals a ciliary flush and a crescent-shaped layering of white blood cells in the anterior chamber (hypopyon). What is the MOST LIKELY diagnosis?**\nA) Acute Anterior Uveitis (Iritis)\nB) Bacterial Keratitis\nC) Acute Angle-Closure Glaucoma\nD) Viral Conjunctivitis\n\n**Answer: A** — **Acute anterior uveitis**—strongly associated with HLA-B27 conditions; features intense photophobia, miosis, ciliary flush, and hypopyon.\n\n---\n\n### Q170. \n**A 5-year-old child presents with a constant inward turning of the right eye (esotropia). The red reflex is normal bilaterally. What is the MOST SEVERE, irreversible complication if this strabismus is left uncorrected past the age of 8?**\nA) Amblyopia\nB) Cortical blindness\nC) Glaucoma\nD) Cataract\n\n**Answer: A** — **Strabismus**—the brain will suppress the image from the misaligned eye to prevent diplopia, leading to permanent neural visual loss known as **amblyopia (lazy eye)**.\n\n---\n\n### Q171. [Community Medicine]\n**In a massive urban screening program, a new rapid diagnostic test has a sensitivity of 90% and a specificity of 95%. The prevalence of the targeted disease in this population is 10%. What is the Positive Predictive Value (PPV) of this test?**\nA) 66.7%\nB) 90%\nC) 95%\nD) 50%\n\n**Answer: A** — **PPV calculation:** Out of 1000 people: 100 have disease (90 test true positive), 900 are healthy (45 test false positive). PPV = True Positives / Total Positives = 90 / (90 + 45) = 90/135 = **66.7%**.\n\n---\n\n### Q172. \n**A randomized controlled trial comparing two novel antihypertensives uses a Student's t-test and reports a p-value of 0.03. What is the correct statistical interpretation of this finding?**\nA) There is exactly a 3% probability that the observed difference is due to chance (Type I error)\nB) There is a 3% probability of failing to reject a false null hypothesis (Type II error)\nC) The null hypothesis is absolutely true\nD) The results are guaranteed to be clinically significant\n\n**Answer: A** — **p-value = 0.03** means there is a **3% probability of committing a Type I error** (falsely rejecting the null hypothesis when it is actually true; concluding a difference exists when it was just random variation).\n\n---\n\n### Q173. \n**A 45-year-old male is screened at a primary health center. According to the data released by the National Family Health Survey (NFHS-5, 2019-21), what is the approximate prevalence of hypertension among the adult population in India?**\nA) 10%\nB) 25%\nC) 45%\nD) 60%\n\n**Answer: B** — **NFHS-5 Data**—The prevalence of hypertension in Indian adults (>15 years) is approximately **24% in men and 21% in women**, commonly standardized to ~25% for epidemiological estimates.\n\n---\n\n### Q174. \n**A mother brings her 6-month-old infant to a rural sub-center for routine immunization. Assuming she has followed the National Immunization Schedule (NIS) perfectly to date, which vaccines are due exactly at the 14-week (3.5 months) or 6-month equivalent milestone?**\nA) BCG + OPV + DPT\nB) Pentavalent-3 + OPV-3 + fIPV-2 + PCV-2\nC) Measles + MR\nD) Hepatitis B birth dose only\n\n**Answer: B** — **14 weeks (approx 3.5 months)**—The third doses of **Pentavalent (DPT+HepB+Hib), OPV**, and the second doses of **fIPV and PCV** are administered. (Note: Measles/MR is given at 9 months).\n\n---\n\n### Q175. \n**A 2-year-old child in a famine-struck region presents with severe acute malnutrition. Examination reveals bilateral pitting edema of the feet, severe muscle wasting, a \"flaky paint\" dermatosis, and a severely enlarged fatty liver. What is the MOST LIKELY diagnosis?**\nA) Marasmus\nB) Kwashiorkor\nC) Nutritional Dwarfism\nD) Simple Starvation\n\n**Answer: B** — **Kwashiorkor**—a severe protein deficiency leading to hypoalbuminemia (edema), fatty liver (impaired apolipoprotein synthesis), and distinct skin/hair changes (flag sign).\n\n---\n\n### Q176. \n**A 35-year-old male who has worked in stone cutting and sandblasting for 10 years presents with chronic cough and progressive dyspnea. Chest X-ray shows eggshell calcification of the hilar lymph nodes. What is the MOST LIKELY diagnosis?**\nA) Byssinosis\nB) Silicosis\nC) Asbestosis\nD) Anthracosis\n\n**Answer: B** — **Silicosis**—caused by inhalation of **silica dust** (mining, stone cutting, sandblasting) resulting in classic \"eggshell calcifications\" and upper lobe fibrotic nodules.\n\n---\n\n### Q177. \n**A 60-year-old male presents with worsening dyspnea and severe right-sided chest pain. Chest X-ray reveals calcified pleural plaques along the diaphragm. Biopsy of the pleura confirms malignant mesothelioma. What is the MOST LIKELY historical occupational exposure?**\nA) Coal mining\nB) Construction and insulation installation\nC) Textile manufacturing\nD) Agriculture and pesticide spraying\n\n**Answer: B** — **Asbestos exposure**—used historically in roofing, shipyards, and **insulation**. It directly causes calcified pleural plaques and is the primary trigger for malignant mesothelioma.\n\n---\n\n### Q178. [Psychiatry — continued]\n**A 25-year-old female presents to the clinic 3 days after witnessing a horrific mass-casualty event. She is fully conscious but describes feeling detached from her own body, as if she is watching herself in a movie, and feels the world around her is dream-like and unreal. What is the MOST LIKELY diagnosis?**\nA) Depersonalization/Derealization disorder\nB) Schizophrenia\nC) PTSD\nD) Panic disorder\n\n**Answer: A** — **Dissociative disorder**—feeling detached from self (**depersonalization**) and feeling the environment is unreal (**derealization**) without psychosis.\n\n---\n\n### Q179. \n**A 30-year-old male is brought to the emergency department unconscious. He has pinpoint (constricted) pupils, severe bradycardia, and a respiratory rate of 4 breaths per minute. Needle track marks are visible on his forearms. What is the SINGLE BEST immediate pharmacological antidote?**\nA) Naloxone\nB) Flumazenil\nC) Atropine\nD) Intravenous Diazepam\n\n**Answer: A** — **Opioid overdose**—the triad of coma, pinpoint pupils, and respiratory depression must be immediately reversed with the opioid-receptor antagonist **Naloxone**.\n\n---\n\n### Q180. \n**A 45-year-old female presents to the burn unit with a painful, erythematous, and rapidly blistering rash over her trunk and face. It began 10 days after starting Allopurinol. Examination reveals atypical target lesions and full-thickness epidermal sloughing affecting 8% of her total body surface area, with oral mucosal involvement. What is the MOST LIKELY diagnosis?**\nA) Stevens-Johnson syndrome (SJS)\nB) Erythema multiforme minor\nC) Toxic epidermal necrolysis (TEN)\nD) Staphylococcal Scalded Skin Syndrome\n\n**Answer: A** — **SJS**—a severe, drug-induced type IV hypersensitivity reaction featuring mucosal involvement and epidermal detachment. Because it involves **<10% of TBSA**, it is classified as SJS (TEN is >30%).\n\n---\n\n## 📋 PREPRIGA AUDITED ANSWER KEY — SET 2\n\n| Q | Ans | Q | Ans | Q | Ans | Q | Ans | Q | Ans | Q | Ans |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | B | 31 | B | 61 | A | 91 | B | 121 | A | 151 | A |\n| 2 | B | 32 | B | 62 | C | 92 | A | 122 | A | 152 | B |\n| 3 | B | 33 | D | 63 | B | 93 | A | 123 | B | 153 | A |\n| 4 | C | 34 | B | 64 | B | 94 | A | 124 | C | 154 | B |\n| 5 | A | 35 | A | 65 | B | 95 | B | 125 | B | 155 | A |\n| 6 | A | 36 | C | 66 | B | 96 | C | 126 | B | 156 | A |\n| 7 | C | 37 | B | 67 | B | 97 | B | 127 | A | 157 | A |\n| 8 | C | 38 | A | 68 | B | 98 | A | 128 | B | 158 | A |\n| 9 | C | 39 | B | 69 | B | 99 | A | 129 | A | 159 | A |\n| 10 | B | 40 | B | 70 | B | 100 | A | 130 | A | 160 | A |\n| 11 | B | 41 | A | 71 | B | 101 | A | 131 | A | 161 | A |\n| 12 | B | 42 | B | 72 | A | 102 | B | 132 | D | 162 | A |\n| 13 | C | 43 | A | 73 | B | 103 | A | 133 | A | 163 | A |\n| 14 | A | 44 | A | 74 | B | 104 | B | 134 | A | 164 | A |\n| 15 | A | 45 | B | 75 | A | 105 | A | 135 | B | 165 | A |\n| 16 | B | 46 | A | 76 | A | 106 | D | 136 | B | 166 | A |\n| 17 | B | 47 | B | 77 | A | 107 | A | 137 | A | 167 | A |\n| 18 | B | 48 | A | 78 | B | 108 | D | 138 | C | 168 | A |\n| 19 | A | 49 | A | 79 | C | 109 | B | 139 | C | 169 | A |\n| 20 | B | 50 | B | 80 | C | 110 | A | 140 | B | 170 | A |\n| 21 | A | 51 | B | 81 | C | 111 | A | 141 | D | 171 | A |\n| 22 | A | 52 | A | 82 | B | 112 | B | 142 | A | 172 | A |\n| 23 | B | 53 | A | 83 | A | 113 | C | 143 | A | 173 | B |\n| 24 | B | 54 | B | 84 | B | 114 | B | 144 | B | 174 | B |\n| 25 | A | 55 | A | 85 | D | 115 | A | 145 | A | 175 | B |\n| 26 | A | 56 | A | 86 | B | 116 | B | 146 | B | 176 | B |\n| 27 | B | 57 | B | 87 | A | 117 | B | 147 | A | 177 | B |\n| 28 | C | 58 | A | 88 | B | 118 | B | 148 | A | 178 | A |\n| 29 | B | 59 | B | 89 | B | 119 | D | 149 | A | 179 | A |\n| 30 | B | 60 | B | 90 | B | 120 | A | 150 | A | 180 | A |\n\n---\n\n## 🎯 KEY TAKEAWAYS — SET 2\n\n**High-Yield Clusters Covered:**\n- **Medicine:** IE, DCM, Amyloidosis, Tamponade, AS, MS, AF, Legionella, Asthma step-up, IPF, PE, Methanol poisoning, Hyperkalemia, SIADH, Nephrotic (MCD), Goodpasture's, Prerenal azotemia, Alcoholic liver, Wilson's, Hemochromatosis, Addison's, Cushing's, Central DI, AIHA, Pernicious anemia, Acute chest syndrome, Thalassemia, AML, CML, Multiple Myeloma, RA (Methotrexate), Gout, AS, Sjogren's.\n- **Surgery:** Burns, Perforated ulcer, Pancreatic CA, Choledocholithiasis, Amebic abscess, AAA, PAD, Venous ulcer, Prostate CA, Renal stone, Chronic SDH, SAH (Nimodipine), Neurogenic shock, OA, Septic arthritis, Osteosarcoma, Tension pneumothorax, Esophageal CA, RLN injury, Hyperparathyroidism, Splenic injury, Meckel's scan, Hirschsprung biopsy, Anorectal abscess, Hemorrhoids, Inguinal hernia, Breast cancer prognosis, Colles' fracture, Dermoid cyst, Appendage torsion.\n- **OBG:** Eclampsia (MgSO4), Uterine Inversion, Uterine rupture, AFE, Shoulder dystocia, Twin PROM, IUGR, GDM, Hypothyroidism in pregnancy, Ectopic (MTX), Molar follow-up, Endometrial hyperplasia, Prolapse stage IV, HRT contraindication, PID, Breech, Cerclage, Mastitis, Ovarian CA, Prolonged decels, Pre-eclampsia delivery, Uterine septum resection, Preterm tocolysis.\n- **Path/Pharma/Micro:** Alcoholic hepatitis, Autoimmune hepatitis (SMA), Hemophilia A, vWD, DIC, Falciparum malaria, Dengue, HBV (Tenofovir), Rabies, Tetanus, Aminoglycoside nephrotoxicity, Tetracycline contraindication, Acyclovir, Amphotericin B, Isoniazid (B6), Furosemide (hypokalemia), Warfarin management, Ticagrelor, Malignant hyperthermia (Dantrolene), Giardia, Pseudomonas, Klebsiella, Clostridium perfringens, Complement deficiency, Hereditary spherocytosis, CLL immunophenotype, CEA, AFP, Medullary thyroid CA, Choriocarcinoma, GIST, Paget disease, Thymoma, Candida albicans, Small Cell Lung CA.\n- **Peds/CM/Forensic/ENT/Ophth/Psych/Derma:** Neonatal sepsis (Amp+Genta), Biliary atresia, VSD, TOF spell, PDA (Indomethacin), Rheumatic fever, PSGN (Low C3), Posterior urethral valves, Intussusception (air enema), NEC (pneumatosis), MDD (SSRI), OCD (Clomipramine), PTSD, Anorexia nervosa, Alcohol withdrawal (Benzos), Hanging, Dry drowning, Tinea corporis, Scabies (Permethrin), Atopic dermatitis, Meniere's, Otosclerosis, NPC (EBV), Cataract, Uveitis, Amblyopia, PPV calculation, p-value, NFHS-5 hypertension, Immunization schedule, Kwashiorkor, Silicosis, Asbestos, Dissociative disorder, Naloxone, SJS.","3":"# Prepriga Exclusive: NEET PG 2026 — SET 3: The Image, Virus & Systemic Mastery\n\n> **⚠️ STRATEGIC NOTE:** This Set-3 is built on **the most frequently repeated high-yield concepts from the last 15 years that have NOT appeared in Sets 1 or 2**. It covers HIV/AIDS, fungal/parasitic infections, acid-base disorders, IBD, vasculitis, congenital heart diseases, genetics, immunization, contraception, biostatistics, psychopharmacology, and endocrine emergencies. **This is your \"gaps obliterator.\"**\n\n---\n\n## 📊 THE 2026 SHIFT: WHAT HAS CHANGED (Reminder)\n\n| Parameter | Pre-2026 | NEET PG 2026 |\n|-----------|----------|--------------|\n| Total Questions | 200 | **180** |\n| Total Marks | 800 | **720** |\n| Questions/Section | 40 | **36** |\n| Sections | 5 (A–E) | 5 (A–E)—**unchanged** |\n| Time/Section | 42 min | **42 min—unchanged** |\n| Total Duration | 3.5 hrs | **3.5 hrs—unchanged** |\n\n**Key Insight:** Same time, fewer questions = **~70 seconds per question** (vs ~63 sec earlier). But **each question now carries more relative weight**. Conceptual depth > speed.\n\n---\n\n## 🎯 SET 3 — FULL PAPER (180 Questions | 5 Sections | 720 Marks)\n\n---\n\n# SECTION A — MEDICINE & ALLIED (36 Questions)\n\n---\n\n### Q1. [Image-Based — HIV Western Blot]\n**A 35-year-old male with high-risk behavior presents with generalized lymphadenopathy and oral thrush. A Western blot test (Image: bands for p24, gp41, gp120/160) is positive. His CD4 count is 180 cells/μL. What is the SINGLE BEST initial antiretroviral regimen according to current guidelines?**\nA) Zidovudine + Lamivudine + Nevirapine\nB) Tenofovir + Lamivudine + Efavirenz\nC) Tenofovir + Lamivudine + Dolutegravir\nD) Abacavir + Emtricitabine + Raltegravir\n\n**Answer: C** — **HIV**—Current WHO and NACO guidelines recommend an Integrase Strand Transfer Inhibitor (INSTI)-based regimen: **Tenofovir + Lamivudine + Dolutegravir (TLD)** as the preferred first-line ART.\n\n---\n\n### Q2. \n**A 30-year-old male with HIV (CD4 50 cells/μL) presents with headache, fever, and neck stiffness. CSF India ink stain shows encapsulated yeasts. What is the SINGLE BEST induction therapy?**\nA) Fluconazole alone\nB) Voriconazole\nC) Amphotericin B alone\nD) Amphotericin B + Flucytosine\n\n**Answer: D** — **Cryptococcal meningitis**—Induction therapy requires the synergistic combination of **Amphotericin B + Flucytosine** for 2 weeks, followed by fluconazole consolidation.\n\n---\n\n### Q3. [Image-Based — CXR]\n**A 45-year-old male with fever, night sweats, and cough. Chest X-ray (Image: right upper lobe cavitary lesion with air-fluid level). Sputum AFB is positive. What is the SINGLE BEST regimen for drug-sensitive TB?**\nA) HRZE for 2 months + HR for 4 months\nB) HRZE for 2 months + HR for 7 months\nC) RIPE for 6 months\nD) HRZ for 6 months\n\n**Answer: A** — **Pulmonary TB**—Standard 6-month regimen: 2 months of intensive phase (**HRZE**) followed by 4 months of continuation phase (**HR**).\n\n---\n\n### Q4. \n**A 55-year-old male with chronic liver disease presents with ascites and sudden-onset fever. Ascitic fluid analysis shows a neutrophil count of 350 cells/mm³. What is the FIRST-LINE empirical antibiotic?**\nA) Metronidazole\nB) Cefotaxime\nC) Piperacillin-Tazobactam\nD) Ampicillin\n\n**Answer: B** — **Spontaneous Bacterial Peritonitis (SBP)**—Ascitic PMN >250 cells/mm³ is diagnostic. **Cefotaxime** (or Ceftriaxone) is the empiric drug of choice.\n\n---\n\n### Q5. \n**A 28-year-old female presents with recurrent abdominal pain, diarrhea, and weight loss. Colonoscopy shows skip lesions, cobblestone mucosa, and transmural inflammation. What is the FIRST-LINE medical therapy for mild-to-moderate ileocecal disease?**\nA) Sulfasalazine\nB) Infliximab\nC) Budesonide\nD) Mesalamine\n\n**Answer: C** — **Crohn's disease**—**Budesonide** (a locally acting corticosteroid with high first-pass metabolism) is first-line for mild-to-moderate ileocecal Crohn's. (Mesalamine/Sulfasalazine are preferred for Ulcerative Colitis).\n\n---\n\n### Q6. \n**A 35-year-old male presents with chronic diarrhea, steatorrhea, and weight loss. Anti-tissue transglutaminase (tTG) IgA is elevated. What is the SINGLE BEST diagnostic test to confirm the condition?**\nA) Anti-endomysial antibody\nB) Small bowel biopsy\nC) HLA-DQ2/DQ8 typing\nD) Capsule endoscopy\n\n**Answer: B** — **Celiac disease**—While tTG is the best screen, a **small bowel (duodenal) biopsy** showing villous atrophy and crypt hyperplasia remains the gold standard for confirmation.\n\n---\n\n### Q7. \n**A 65-year-old male with long-standing type 2 diabetes presents with a swollen, painful, erythematous right leg. He is febrile. Blood culture grows Gram-positive cocci in chains. What is the SINGLE BEST empirical antibiotic?**\nA) Vancomycin\nB) Penicillin G\nC) Piperacillin-Tazobactam\nD) Clindamycin\n\n**Answer: A** — **Cellulitis** in a diabetic/immunocompromised patient—**Vancomycin** is required to cover MRSA, while broad-spectrum agents may be added for Gram-negatives/anaerobes depending on severity.\n\n---\n\n### Q8. \n**A 40-year-old male presents with acute severe epigastric pain radiating to the back. Serum lipase is 4500 U/L. CT shows extensive pancreatic necrosis. What is the SINGLE BEST indication for starting antibiotics in this patient?**\nA) All cases of acute necrotizing pancreatitis\nB) Prophylactic use upon ICU admission\nC) Presence of infected necrosis (gas on CT or positive fine-needle aspirate)\nD) Elevated CRP > 150 mg/L\n\n**Answer: C** — **Acute pancreatitis**—Antibiotics are strictly indicated ONLY when there is proven or strongly suspected **infected necrosis** (e.g., gas bubbles on CT). Prophylactic use is not recommended.\n\n---\n\n### Q9. \n**A 60-year-old male with severe COPD presents with somnolence. Arterial blood gas shows: pH 7.34, PaCO₂ 65 mmHg, HCO₃⁻ 34 mEq/L. What is the primary acid-base disorder?**\nA) Acute respiratory acidosis\nB) Chronic respiratory acidosis\nC) Metabolic alkalosis\nD) Respiratory alkalosis\n\n**Answer: B** — **Chronic respiratory acidosis**—The pH is acidemic (7.34), PaCO₂ is highly elevated (65), and the HCO₃⁻ is significantly elevated (34), indicating renal metabolic compensation over several days.\n\n---\n\n### Q10. \n**A 45-year-old female presents with joint pain, a malar rash, and photosensitivity. ANA is positive (1:640). Which of the following antibodies is MOST SPECIFIC for confirming the diagnosis of Systemic Lupus Erythematosus (SLE)?**\nA) Anti-dsDNA\nB) Anti-Ro/SSA\nC) Anti-histone\nD) Anti-Smith (Sm)\n\n**Answer: D** — **Anti-Smith (Sm)** is the **most specific** antibody for SLE, despite having lower sensitivity than ANA or anti-dsDNA.\n\n---\n\n### Q11. \n**A 55-year-old male presents with chronic sinusitis, cavitary pulmonary nodules, and rapidly progressive hematuria. c-ANCA (PR3-ANCA) is highly positive. What is the MOST LIKELY diagnosis?**\nA) Microscopic polyangiitis\nB) Granulomatosis with polyangiitis (Wegener's)\nC) Eosinophilic granulomatosis with polyangiitis (Churg-Strauss)\nD) Goodpasture's syndrome\n\n**Answer: B** — **GPA (Wegener's)**—Classic triad of upper respiratory (sinusitis), lower respiratory (nodules/cavities), and renal (GN) involvement with positive **c-ANCA (PR3)**.\n\n---\n\n### Q12. \n**A 30-year-old male presents with acute-onset ascending weakness, areflexia, and albuminocytologic dissociation in the CSF. What is the SINGLE BEST disease-modifying treatment?**\nA) Corticosteroids\nB) Intravenous Immunoglobulin (IVIG) or Plasmapheresis\nC) Methotrexate\nD) Interferon-beta\n\n**Answer: B** — **Guillain-Barré syndrome (GBS)**—**IVIG or plasmapheresis** are equally effective first-line treatments. Corticosteroids provide absolutely no benefit in GBS.\n\n---\n\n### Q13. \n**A 25-year-old female presents with fluctuating ptosis, diplopia, and proximal muscle weakness that worsens towards the evening. What is the MOST SPECIFIC diagnostic blood test?**\nA) Edrophonium test\nB) Anti-AChR antibody\nC) Anti-MuSK antibody\nD) Repetitive nerve stimulation\n\n**Answer: B** — **Myasthenia gravis**—**Anti-AChR (Acetylcholine receptor) antibody** is highly specific and positive in ~85% of generalized MG cases.\n\n---\n\n### Q14. \n**A 35-year-old female with relapsing-remitting neurological symptoms and optic neuritis has an MRI showing periventricular white matter plaques. What is the classic FIRST-LINE disease-modifying therapy?**\nA) Interferon-beta\nB) Natalizumab\nC) Fingolimod\nD) High-dose oral prednisone\n\n**Answer: A** — **Multiple sclerosis (RRMS)**—**Interferon-beta** (or glatiramer acetate) remains the classic, first-line disease-modifying therapy for RRMS. (Steroids are for acute flares, not disease modification).\n\n---\n\n### Q15. \n**A 28-year-old male presents with acute onset of severe headache, fever, and altered sensorium. CSF shows lymphocytic pleocytosis, elevated protein, and normal glucose. MRI shows hyperintensity in the temporal lobes. What is the MOST LIKELY etiology?**\nA) Varicella-zoster virus\nB) Enterovirus\nC) Herpes simplex virus (HSV)\nD) Mycobacterium tuberculosis\n\n**Answer: C** — **HSV encephalitis**—The presence of temporal lobe involvement on MRI, combined with viral CSF findings (normal glucose), is classic for HSV-1.\n\n---\n\n### Q16. \n**A 40-year-old female on carbimazole for Graves' disease develops a sudden high fever and a severe sore throat. What is the SINGLE BEST immediate next step?**\nA) Increase the dose of carbimazole\nB) Stop carbimazole and check a complete blood count (CBC)\nC) Start broad-spectrum antibiotics and continue carbimazole\nD) Schedule immediate radioactive iodine ablation\n\n**Answer: B** — **Carbimazole-induced agranulocytosis**—A medical emergency. The drug must be **stopped immediately** and a CBC drawn to confirm absolute neutrophil count.\n\n---\n\n### Q17. \n**A 60-year-old male with known type 2 diabetes presents with severe confusion and polyuria. Serum glucose is 850 mg/dL, Na⁺ 145 mEq/L, and serum osmolality 380 mOsm/kg. Urine ketones are negative. What is the SINGLE BEST initial management?**\nA) Intravenous Regular Insulin bolus\nB) Intravenous 0.9% Normal Saline\nC) Subcutaneous Glargine insulin\nD) Sodium bicarbonate infusion\n\n**Answer: B** — **Hyperosmolar Hyperglycemic State (HHS)**—Patients are profoundly dehydrated (often 8-10L deficit). **Aggressive IV fluid resuscitation** is the most critical first step, even before insulin.\n\n---\n\n### Q18. \n**A 45-year-old male with a 20-year history of heavy alcohol use presents with new-onset atrial fibrillation. Echocardiography shows a globally dilated left ventricle with an ejection fraction of 30%. What is the MOST LIKELY diagnosis?**\nA) Ischemic heart disease\nB) Rheumatic heart disease\nC) Hypertrophic cardiomyopathy\nD) Alcoholic cardiomyopathy\n\n**Answer: D** — **Alcoholic cardiomyopathy**—A toxic non-ischemic dilated cardiomyopathy caused by chronic alcohol abuse, frequently presenting with arrhythmias like AFib.\n\n---\n\n### Q19. \n**A 55-year-old female presents with progressive dyspnea, a dry cough, and bilateral hilar lymphadenopathy. HRCT shows a \"ground glass\" appearance with distinct mid-to-upper lobe predominance. What is the MOST LIKELY diagnosis?**\nA) Idiopathic Pulmonary Fibrosis (IPF)\nB) Hypersensitivity pneumonitis\nC) Sarcoidosis\nD) Lymphangitic carcinomatosis\n\n**Answer: C** — **Sarcoidosis**—Bilateral hilar adenopathy with upper/mid-zone fibrotic changes is classic (unlike IPF, which is strictly basal and subpleural).\n\n---\n\n### Q20. \n**A 30-year-old male with a 5-year history of ulcerative colitis presents with a 2-day history of severe abdominal pain, distension, and high fever. Abdominal X-ray shows transverse colon dilatation of 7.5 cm with loss of haustral markings. What is the SINGLE BEST definitive step if medical therapy fails within 24 hours?**\nA) High-dose intravenous corticosteroids\nB) Emergency total colectomy\nC) Intravenous Cyclosporine\nD) Infliximab infusion\n\n**Answer: B** — **Toxic megacolon**—If rapid deterioration occurs or medical therapy fails, an **emergency colectomy** is life-saving to prevent perforation and fatal peritonitis.\n\n---\n\n### Q21. \n**A 45-year-old female has a 3 cm thyroid nodule. FNAC shows sheets of uniform follicular cells. Following surgical excision, the pathologist confirms Follicular Thyroid Carcinoma. What specific histological finding differentiated this from a benign adenoma?**\nA) Nuclear grooving\nB) Psammoma bodies\nC) Capsular or vascular invasion\nD) Hurthle cells\n\n**Answer: C** — **Follicular thyroid carcinoma**—Cannot be diagnosed via FNAC because the distinction between benign adenoma and malignant carcinoma relies entirely on identifying **capsular or vascular invasion** on the excised surgical specimen.\n\n---\n\n### Q22. \n**A 50-year-old male with a history of gout presents with a swollen, painful knee. Joint aspiration shows needle-shaped, negatively birefringent crystals. Once the acute flare resolves, what is the SINGLE BEST chronic therapy to lower serum uric acid?**\nA) Allopurinol\nB) Colchicine\nC) Indomethacin\nD) Pegloticase\n\n**Answer: A** — **Gout**—**Allopurinol** (xanthine oxidase inhibitor) is the first-line chronic urate-lowering therapy. (Colchicine/NSAIDs are for acute flares).\n\n---\n\n### Q23. \n**A 28-year-old female presents with Raynaud's phenomenon, tightening of the skin over her fingers (sclerodactyly), and facial telangiectasias. She complains of severe heartburn. What is the MOST LIKELY underlying autoantibody?**\nA) Anti-Scl-70 (anti-topoisomerase I)\nB) Anti-centromere antibody\nC) Anti-dsDNA\nD) Anti-Ro/SSA\n\n**Answer: B** — **CREST syndrome** (Limited cutaneous systemic sclerosis)—Highly associated with the **anti-centromere antibody**. (Anti-Scl-70 is seen in *diffuse* systemic sclerosis).\n\n---\n\n### Q24. \n**A 60-year-old male with chronic kidney disease has a serum phosphate of 7.5 mg/dL, calcium 9.5 mg/dL, and elevated PTH. What is the SINGLE BEST non-calcium-based phosphate binder to prescribe?**\nA) Calcium carbonate\nB) Aluminum hydroxide\nC) Sevelamer\nD) Lanthanum carbonate\n\n**Answer: C** — **Sevelamer**—A non-absorbable synthetic polymer that binds phosphate without risking hypercalcemia or aluminum toxicity in CKD patients.\n\n---\n\n### Q25. \n**A 45-year-old male with a family history of bronze skin and diabetes presents with heart failure. Lab tests confirm severe iron overload. What is the SINGLE BEST, most effective treatment to reduce his total body iron stores?**\nA) Deferoxamine infusion\nB) Oral Deferasirox\nC) Routine therapeutic phlebotomy\nD) Splenectomy\n\n**Answer: C** — **Hemochromatosis**—**Therapeutic phlebotomy** is the safest, most effective, and first-line treatment to deplete iron stores. (Chelators are used only if the patient has severe anemia and cannot tolerate phlebotomy).\n\n---\n\n### Q26. \n**A 35-year-old male with a history of intravenous drug use presents with severe localized back pain and fever. MRI shows L4-L5 vertebral osteomyelitis. Blood cultures grow Gram-positive cocci in clusters that are catalase and coagulase positive, but susceptible to methicillin. What is the SINGLE BEST antibiotic?**\nA) Vancomycin\nB) Nafcillin\nC) Daptomycin\nD) Linezolid\n\n**Answer: B** — **Methicillin-sensitive S. aureus (MSSA) osteomyelitis**—Anti-staphylococcal penicillins like **Nafcillin** or Oxacillin are superior to Vancomycin for MSSA infections.\n\n---\n\n### Q27. \n**A 55-year-old male presents with acute severe abdominal pain, nausea, and vomiting. Serum amylase is 1200 U/L and lipase is 4000 U/L. After 72 hours, his condition deteriorates. What is the SINGLE BEST imaging modality to assess for pancreatic necrosis?**\nA) Abdominal Ultrasound\nB) MRI Abdomen without contrast\nC) CT abdomen with IV contrast\nD) ERCP\n\n**Answer: C** — **Acute necrotizing pancreatitis**—A **contrast-enhanced CT (CECT)** performed 72-96 hours after symptom onset is the gold standard to visualize non-enhancing (necrotic) pancreatic parenchyma.\n\n---\n\n### Q28. \n**A 60-year-old male with a history of smoking presents with a persistently hoarse voice. Biopsy of a warty lesion on his vocal cord reveals laryngeal papillomatosis. What is the MOST LIKELY viral etiology?**\nA) HPV 16 and 18\nB) HPV 6 and 11\nC) Epstein-Barr Virus (EBV)\nD) Herpes Simplex Virus (HSV)\n\n**Answer: B** — **Laryngeal papillomatosis**—Caused by the low-risk Human Papillomavirus strains **HPV 6 and 11**. (Strains 16/18 cause squamous cell carcinoma).\n\n---\n\n### Q29. \n**A 45-year-old male with compensated Hepatitis C cirrhosis (Child-Pugh A) is found to have a solitary 2.5 cm mass in the right lobe of the liver. His bilirubin and portal pressures are strictly normal. What is the SINGLE BEST curative management?**\nA) Liver transplantation\nB) Surgical hepatic resection\nC) Transarterial chemoembolization (TACE)\nD) Sorafenib\n\n**Answer: B** — **Hepatocellular Carcinoma (HCC)**—In a patient with excellent liver reserve (Child-Pugh A), normal portal pressure, and a single small tumor, **surgical resection** is the first-line curative option.\n\n---\n\n### Q30. \n**A 30-year-old female with beta-thalassemia major has received regular blood transfusions since childhood. She now presents with new-onset diabetes and signs of restrictive cardiomyopathy. What is the MOST LIKELY diagnosis?**\nA) Primary Hemochromatosis\nB) Secondary Hemosiderosis (Iron overload)\nC) Wilson's disease\nD) Amyloidosis\n\n**Answer: B** — **Secondary Hemosiderosis**—Chronic transfusions bypass the body's iron regulatory mechanisms, leading to massive iron deposition in the pancreas (diabetes) and heart (cardiomyopathy).\n\n---\n\n### Q31. \n**A 25-year-old male with sickle cell disease is admitted for a vaso-occlusive crisis. On day 2, he develops acute-onset severe chest pain, dyspnea, fever, and a new lobar infiltrate on CXR. What is the SINGLE BEST initial management?**\nA) Broad-spectrum antibiotics + oxygen + incentive spirometry\nB) Immediate Exchange transfusion\nC) High-dose Hydroxyurea\nD) Corticosteroids\n\n**Answer: A** — **Acute chest syndrome**—Immediate **supportive care (oxygen, antibiotics, incentive spirometry, pain control)** is first-line. Exchange transfusion is reserved for rapid deterioration or profound hypoxia.\n\n---\n\n### Q32. \n**A 50-year-old female on chronic glucocorticoids for severe asthma presents with severe mid-back pain. A DEXA scan reveals a T-score of -3.5. She has suffered a vertebral compression fracture. What is the FIRST-LINE pharmacological treatment?**\nA) Calcium + Vitamin D alone\nB) Alendronate\nC) Estrogen replacement therapy\nD) Calcitonin\n\n**Answer: B** — **Glucocorticoid-induced severe osteoporosis**—An oral bisphosphonate like **Alendronate** is the first-line agent to halt bone resorption and prevent further fractures.\n\n---\n\n### Q33. \n**A 35-year-old male presents with unprovoked recurrent deep vein thromboses. His lab workup reveals that his plasma resists the anticoagulant effect of activated Protein C. What is the MOST LIKELY underlying genetic diagnosis?**\nA) Prothrombin G20210A mutation\nB) Factor V Leiden mutation\nC) Antithrombin III deficiency\nD) Protein C deficiency\n\n**Answer: B** — **Factor V Leiden**—A point mutation in Factor V makes it resistant to cleavage by activated Protein C, representing the most common inherited thrombophilia in white populations.\n\n---\n\n### Q34. \n**A 65-year-old male with a new diagnosis of non-valvular atrial fibrillation has a history of hypertension, diabetes, and a prior TIA. His CHA₂DS₂-VASc score is 5. What is the SINGLE BEST choice for long-term stroke prevention?**\nA) Aspirin + Clopidogrel\nB) Warfarin\nC) Direct Oral Anticoagulant (DOAC) e.g., Apixaban\nD) Enoxaparin\n\n**Answer: C** — **Non-valvular AF with CHA₂DS₂-VASc ≥2**—**DOACs** are significantly preferred over warfarin due to a lower risk of intracranial hemorrhage and no need for routine INR monitoring.\n\n---\n\n### Q35. \n**A 35-year-old male presents with recurrent peptic ulcer disease that is refractory to PPIs. Lab work reveals hypercalcemia and a high PTH. He also reports recent visual field deficits (bitemporal hemianopsia). What is the MOST LIKELY unifying genetic diagnosis?**\nA) Multiple Endocrine Neoplasia Type 1 (MEN 1)\nB) Multiple Endocrine Neoplasia Type 2A (MEN 2A)\nC) Primary Hyperparathyroidism\nD) Familial Hypocalciuric Hypercalcemia\n\n**Answer: A** — **MEN 1 (Wermer syndrome)**—The classic \"3 Ps\": **P**arathyroid hyperplasia (hypercalcemia), **P**ancreatic endocrine tumors (Zollinger-Ellison causing refractory ulcers), and **P**ituitary adenoma (bitemporal hemianopsia).\n\n---\n\n### Q36. \n**A 45-year-old female with diffuse cutaneous systemic sclerosis presents with a sudden, severe headache. Her blood pressure is 220/120 mmHg. Labs show an acute rise in creatinine to 3.5 mg/dL and schistocytes on a peripheral smear. What is the SINGLE BEST life-saving medication?**\nA) Intravenous Labetalol\nB) ACE Inhibitor (e.g., Captopril)\nC) High-dose Corticosteroids\nD) Plasmapheresis\n\n**Answer: B** — **Scleroderma Renal Crisis**—Characterized by malignant hypertension and acute renal failure. **ACE inhibitors** are uniquely life-saving in this condition and must be started immediately, even if creatinine is elevated.\n\n---\n\n# SECTION B — SURGERY & ORTHOPEDICS (36 Questions)\n\n---\n\n### Q37. \n**A 55-year-old female undergoes a difficult total thyroidectomy. Twelve hours postoperatively, she develops perioral numbness, tingling in her fingers, and a facial muscle spasm when the facial nerve is tapped (Chvostek's sign). What is the SINGLE BEST immediate treatment?**\nA) Oral calcium carbonate\nB) Vitamin D supplementation\nC) Intravenous Calcium gluconate\nD) Intravenous Magnesium sulfate\n\n**Answer: C** — **Acute symptomatic hypocalcemia** (due to inadvertent parathyroid devascularization/removal)—Requires immediate administration of **IV Calcium gluconate**.\n\n---\n\n### Q38. [Image-Based — CT Neck]\n**A 45-year-old male presents with a painless, slow-growing swelling just below the angle of the mandible. CT (Image: well-defined, enhancing lesion in the parotid tail). FNAC shows \"pleomorphic adenoma.\" What is the SINGLE BEST surgical procedure?**\nA) Total parotidectomy with facial nerve sacrifice\nB) Enucleation of the tumor\nC) Superficial parotidectomy with facial nerve preservation\nD) Radiotherapy alone\n\n**Answer: C** — **Pleomorphic adenoma** of the parotid—Simple enucleation has unacceptably high recurrence rates. **Superficial parotidectomy** is the standard to ensure negative margins while preserving the facial nerve.\n\n---\n\n### Q39. \n**A 65-year-old male with a 40-pack-year smoking history presents with a persistently hoarse voice for 3 months. Laryngoscopy shows a fungating tumor localized strictly to the true right vocal cord with normal cord mobility. What is the MOST LIKELY diagnosis?**\nA) Glottic carcinoma\nB) Supraglottic carcinoma\nC) Subglottic carcinoma\nD) Vocal cord nodule\n\n**Answer: A** — **Glottic squamous cell carcinoma**—The most common laryngeal cancer, typically presenting very early with hoarseness due to disruption of the true vocal cords.\n\n---\n\n### Q40. \n**A 60-year-old female with a history of gallstones presents with jaundice, weight loss, and right upper quadrant pain. Ultrasound shows a focal thickening of the gallbladder wall invading 1 cm into the liver bed. What is the SINGLE BEST surgical management?**\nA) Simple laparoscopic cholecystectomy\nB) Extended (Radical) cholecystectomy including wedge liver resection and lymphadenectomy\nC) Palliative biliary stenting\nD) ERCP with sphincterotomy\n\n**Answer: B** — **Gallbladder carcinoma** invading the liver—Requires an **extended (radical) cholecystectomy**, removing segments IVB and V of the liver along with regional lymph nodes.\n\n---\n\n### Q41. \n**A 50-year-old female undergoes a CT scan for vague abdominal pain. A multiloculated cystic lesion is found in the pancreatic head. It has a \"honeycomb\" microcystic appearance with a central calcified stellate scar. What is the MOST LIKELY diagnosis?**\nA) Mucinous cystadenoma\nB) Intraductal papillary mucinous neoplasm (IPMN)\nC) Serous cystadenoma\nD) Pancreatic pseudocyst\n\n**Answer: C** — **Serous cystadenoma**—A benign neoplasm classically presenting with a microcystic \"honeycomb\" pattern and a **central calcified scar**.\n\n---\n\n### Q42. \n**A 45-year-old male restrained driver presents after a high-speed collision with a distinct \"seatbelt sign\" across his abdomen. CT reveals a complete transection of the pancreas at the level of the neck. What is the SINGLE BEST surgical management?**\nA) Observation with total parenteral nutrition\nB) Pancreaticoduodenectomy (Whipple procedure)\nC) Roux-en-Y pancreaticojejunostomy\nD) Distal pancreatectomy with splenectomy\n\n**Answer: D** — **Pancreatic transection (neck/body)**—The standard management for a complete disruption to the left of the superior mesenteric vessels is a **distal pancreatectomy** (often accompanied by splenectomy).\n\n---\n\n### Q43. \n**A 60-year-old obese male with a 20-year history of severe GERD presents with progressive dysphagia to solid foods and weight loss. Endoscopy shows an ulcerated tumor precisely at the gastroesophageal junction. What is the MOST LIKELY histology?**\nA) Adenocarcinoma\nB) Squamous cell carcinoma\nC) Leiomyosarcoma\nD) Gastrointestinal stromal tumor (GIST)\n\n**Answer: A** — **Esophageal Adenocarcinoma**—Arises almost exclusively in the lower third of the esophagus/GEJ, directly driven by chronic acid reflux and Barrett's metaplasia.\n\n---\n\n### Q44. \n**A 30-year-old male who smokes 2 packs a day presents with severe rest pain in his toes and small ulcerations on his fingertips. Angiography shows \"corkscrew\" collateral vessels and segmental occlusions of the small and medium arteries of the hands and feet. What is the MOST LIKELY diagnosis?**\nA) Atherosclerosis obliterans\nB) Thromboangiitis obliterans (Buerger's disease)\nC) Raynaud's disease\nD) Polyarteritis nodosa\n\n**Answer: B** — **Buerger's disease**—A highly inflammatory, non-atherosclerotic occlusive disease of small/medium vessels strictly associated with heavy smoking in young males.\n\n---\n\n### Q45. \n**A 55-year-old female presents with severe pain and blanching of her fingers when reaching into the freezer, followed by cyanosis, and then intense reactive hyperemia (redness). She has no other systemic symptoms. What is the SINGLE BEST initial pharmacological management?**\nA) Low-dose Aspirin\nB) Oral Corticosteroids\nC) Calcium channel blockers (e.g., Nifedipine)\nD) Beta-blockers\n\n**Answer: C** — **Primary Raynaud's phenomenon**—**Calcium channel blockers** are the first-line vasodilators to prevent cold-induced vasospasm.\n\n---\n\n### Q46. \n**A 40-year-old female on oral contraceptives presents with a painful, swollen, erythematous right calf. Doppler ultrasound confirms a deep vein thrombosis (DVT) in the popliteal vein. What is the SINGLE BEST initial acute treatment?**\nA) Prophylactic-dose Unfractionated Heparin\nB) Intravenous Alteplase (tPA)\nC) Therapeutic-dose Low Molecular Weight Heparin (LMWH)\nD) Inferior Vena Cava (IVC) filter placement\n\n**Answer: C** — **Acute DVT**—Immediate anticoagulation with **therapeutic LMWH** (or a DOAC) is the standard of care to prevent pulmonary embolism and clot extension.\n\n---\n\n### Q47. \n**A 25-year-old male sustains a closed comminuted fracture of the right tibia. Twelve hours later, he develops excruciating pain out of proportion to the injury, pain on passive stretch of the toes, and a tense, swollen calf. Pedal pulses are still faintly palpable. What is the SINGLE BEST immediate management?**\nA) Emergency four-compartment fasciotomy\nB) Elevation of the leg above heart level\nC) Immediate application of a tight plaster cast\nD) Intravenous broad-spectrum antibiotics\n\n**Answer: A** — **Acute compartment syndrome**—A surgical emergency. A **fasciotomy** must be performed immediately to decompress the fascial compartments and save the limb. Pulselessness is a late and ominous sign.\n\n---\n\n### Q48. \n**A 35-year-old male suffers bilateral femoral shaft fractures in a motorcycle accident. 24 hours post-admission, he develops sudden dyspnea, confusion, and a petechial rash over his anterior chest and axillae. He is profoundly hypoxic. What is the MOST LIKELY diagnosis?**\nA) Massive Pulmonary Embolism\nB) Fat Embolism Syndrome\nC) Acute Respiratory Distress Syndrome (ARDS)\nD) Hypovolemic Shock\n\n**Answer: B** — **Fat Embolism Syndrome**—The classic triad of **hypoxemia, neurological abnormalities, and a petechial rash** occurring 24-72 hours after major long bone trauma.\n\n---\n\n### Q49. [Image-Based — X-ray]\n**A 15-year-old male presents with a persistent, dull, aching pain in the mid-shaft of his left femur. X-ray (Image: poorly marginated destructive lesion in the diaphysis with a distinct lamellated \"onion peel\" periosteal reaction). What is the MOST LIKELY diagnosis?**\nA) Osteosarcoma\nB) Ewing's sarcoma\nC) Chondrosarcoma\nD) Osteoid osteoma\n\n**Answer: B** — **Ewing's sarcoma**—Classically occurs in the diaphysis of long bones in children/teens, generating a multi-layered, lamellated **\"onion peel\"** periosteal reaction.\n\n---\n\n### Q50. \n**A 45-year-old diabetic female with a history of recurrent UTIs presents with high-grade fever, chills, and severe left flank pain. CT scan reveals a 5 cm thick-walled fluid collection in the left renal cortex. What is the SINGLE BEST management?**\nA) Intravenous antibiotics alone\nB) Immediate total nephrectomy\nC) Extracorporeal shock wave lithotripsy (ESWL)\nD) Percutaneous drainage under ultrasound/CT guidance + IV antibiotics\n\n**Answer: D** — **Renal abscess** >3 cm—Medical management alone has a high failure rate. **Percutaneous drainage** combined with IV antibiotics is the treatment of choice.\n\n---\n\n### Q51. \n**A 65-year-old male with a history of smoking presents with painless, gross hematuria. Cystoscopy shows a large, frond-like papillary tumor. Biopsy reveals transitional cell carcinoma, stage T1, high grade. What is the SINGLE BEST management?**\nA) Transurethral Resection of Bladder Tumor (TURBT) followed by intravesical BCG\nB) Immediate Radical Cystectomy\nC) Systemic Cisplatin-based chemotherapy\nD) External beam radiotherapy\n\n**Answer: A** — **High-grade T1 bladder cancer** (invades lamina propria but not muscle)—**TURBT** is performed to remove the tumor, followed by **intravesical BCG** immunotherapy to significantly reduce the high risk of recurrence and progression.\n\n---\n\n### Q52. \n**A 35-year-old sheep farmer presents with a painless, heavy sensation in his right upper abdomen. Ultrasound of the liver reveals a large, well-defined cystic lesion containing multiple internal \"daughter cysts\" and \"hydatid sand.\" What is the MOST LIKELY causative organism?**\nA) Entamoeba histolytica\nB) Taenia solium\nC) Echinococcus granulosus\nD) Clonorchis sinensis\n\n**Answer: C** — **Hydatid cyst**—Caused by the tapeworm **Echinococcus granulosus**. The presence of daughter cysts is pathognomonic.\n\n---\n\n### Q53. \n**A 60-year-old female with known metastatic breast cancer presents with sudden, severe right thigh pain after simply standing up from a chair. X-ray shows a transverse fracture straight through a large lytic lesion in the proximal femur. What is the SINGLE BEST management?**\nA) Intramedullary nailing (Internal fixation) followed by local radiotherapy\nB) Above-knee amputation\nC) High-dose systemic chemotherapy alone\nD) Skeletal traction for 6 weeks\n\n**Answer: A** — **Pathological fracture**—Requires mechanical stabilization via **internal fixation**, followed by **radiotherapy** to halt local tumor growth and promote healing.\n\n---\n\n### Q54. \n**A 25-year-old male presents with multiple pearl-like, ulcerated nodules on his face and back, confirmed via biopsy as basal cell carcinomas. He also has a history of jaw cysts (odontogenic keratocysts). What is the MOST LIKELY underlying genetic syndrome?**\nA) Gardner syndrome\nB) Gorlin syndrome (Nevoid basal cell carcinoma syndrome)\nC) Lynch syndrome\nD) Familial Adenomatous Polyposis (FAP)\n\n**Answer: B** — **Gorlin syndrome**—An autosomal dominant disorder (PTCH1 gene mutation) characterized by multiple early-onset BCCs, jaw cysts, and palmar/plantar pits.\n\n---\n\n### Q55. \n**A 55-year-old hypertensive male presents with an agonizing, sudden-onset \"tearing\" chest pain that radiates directly between his scapulae. CT angiography reveals a massive intimal flap beginning just distal to the aortic valve and extending to the aortic arch. What is the SINGLE BEST management?**\nA) Emergency open surgical replacement of the ascending aorta\nB) Strict blood pressure control with IV Labetalol alone\nC) Endovascular stent grafting of the arch\nD) Sublingual Nitroglycerin\n\n**Answer: A** — **Stanford Type A Aortic Dissection** (involves the ascending aorta)—Carries an exceptionally high mortality risk from rupture or tamponade and mandates **emergency open surgery**.\n\n---\n\n### Q56. \n**A 30-year-old male with long-standing Crohn's disease presents with exquisite pain and swelling near his anus. Examination reveals a fluctuant, exquisitely tender, erythematous perianal mass. What is the SINGLE BEST immediate management?**\nA) High-dose oral Ciprofloxacin and Metronidazole\nB) Prompt Incision and Drainage (I&D)\nC) Placement of a draining seton\nD) Fistulotomy\n\n**Answer: B** — **Perianal abscess**—Regardless of the underlying Crohn's disease, an acute abscess requires immediate **Incision and Drainage**. (A seton might be placed later if a complex fistula develops).\n\n---\n\n### Q57. \n**A 45-year-old female undergoes a laparoscopic cholecystectomy for symptomatic cholelithiasis. To absolutely minimize the risk of devastating common bile duct injury, what specific anatomical milestone MUST the surgeon achieve before clipping any structures?**\nA) Identification of the common hepatic duct\nB) Routine intraoperative cholangiogram\nC) Routine intraoperative ultrasound\nD) Achievement of the \"Critical View of Safety\"\n\n**Answer: D** — **Critical View of Safety**—Requires clearing the hepatocystic triangle of fat/fibrous tissue to conclusively identify only two structures (cystic duct and cystic artery) entering the gallbladder base.\n\n---\n\n### Q58. \n**A 65-year-old male with a history of smoking presents with a prominent, bounding pulsation behind his right knee. Ultrasound confirms a 3.5 cm popliteal artery aneurysm with mural thrombus. What is the SINGLE BEST management to prevent limb-threatening ischemia?**\nA) Routine ultrasound surveillance every 6 months\nB) Endovascular coil embolization\nC) Systemic anticoagulation with Warfarin\nD) Surgical exclusion and bypass grafting\n\n**Answer: D** — **Popliteal aneurysm >2 cm**—Carries a severe risk of distal embolization and acute limb ischemia. Symptomatic or large aneurysms require **surgical exclusion and bypass**.\n\n---\n\n### Q59. \n**A 25-year-old male presents with agonizing, colicky abdominal pain. He is observed drawing his knees to his chest. Between episodes, he appears well. He recently passed a stool consisting of dark red mucus (\"currant jelly\"). Physical exam reveals a palpable mass in the right upper quadrant. What is the SINGLE BEST initial diagnostic test?**\nA) Abdominal Ultrasound\nB) Upright Abdominal X-ray\nC) CT scan of the abdomen with contrast\nD) Diagnostic Laparoscopy\n\n**Answer: A** — **Intussusception**—**Ultrasound** is highly sensitive and specific, revealing the classic \"target\" or \"donut\" sign, making it the definitive initial diagnostic test.\n\n---\n\n### Q60. \n**A 50-year-old male with a history of severe acute pancreatitis 6 weeks ago presents with persistent early satiety and epigastric fullness. CT scan reveals a mature, 8 cm fluid collection in the lesser sac firmly compressing the posterior wall of the stomach. What is the SINGLE BEST management?**\nA) CT-guided percutaneous external drainage\nB) Endoscopic cystogastrostomy (internal drainage)\nC) Open surgical cystojejunostomy\nD) Observation and total parenteral nutrition\n\n**Answer: B** — **Symptomatic Pancreatic Pseudocyst**—Because it is mature (thick-walled), >6cm, and firmly adherent to the stomach causing gastric outlet obstruction, **endoscopic internal drainage** is the minimally invasive treatment of choice.\n\n---\n\n### Q61. \n**A 45-year-old female undergoes a routine abdominal ultrasound which incidentally reveals a 4 cm, well-demarcated, highly echogenic mass in the right lobe of the liver. A follow-up multiphasic CT shows early peripheral nodular enhancement with progressive centripetal fill-in. What is the MOST LIKELY diagnosis?**\nA) Hepatocellular Carcinoma (HCC)\nB) Focal Nodular Hyperplasia (FNH)\nC) Cavernous Hemangioma\nD) Hepatic Adenoma\n\n**Answer: C** — **Cavernous Hemangioma**—The most common benign liver tumor. The finding of \"peripheral nodular enhancement with progressive centripetal (inward) fill-in\" on dynamic CT is absolutely pathognomonic.\n\n---\n\n### Q62. \n**A 60-year-old female presents with a rapidly growing, painless, 6 cm lump in the right breast. Core needle biopsy confirms a borderline Phyllodes tumor. What is the SINGLE BEST surgical management to minimize local recurrence?**\nA) Simple enucleation (lumpectomy without margins)\nB) Modified Radical Mastectomy with axillary clearance\nC) Wide local excision with at least 1 cm clear margins\nD) Neoadjuvant chemotherapy followed by lumpectomy\n\n**Answer: C** — **Phyllodes tumor**—Known for an extremely high local recurrence rate if incompletely excised. **Wide local excision with ≥1 cm margins** is the standard of care.\n\n---\n\n### Q63. \n**A 35-year-old male is started on Allopurinol for chronic gout management. Two weeks later, he presents to the ER with a severe, painful, blistering rash involving his face and trunk, with significant mucosal ulceration in his mouth. What is the MOST LIKELY diagnosis?**\nA) Stevens-Johnson Syndrome (Allopurinol Hypersensitivity)\nB) Acute Gouty flare\nC) Pemphigus Vulgaris\nD) Staphylococcal Scalded Skin Syndrome\n\n**Answer: A** — **Allopurinol hypersensitivity**—Can precipitate life-threatening severe cutaneous adverse reactions like **Stevens-Johnson Syndrome (SJS)** or Toxic Epidermal Necrolysis (TEN), especially in patients with HLA-B*5801.\n\n---\n\n### Q64. \n**A 80-year-old institutionalized male with a history of chronic constipation presents with massive abdominal distension and obstipation. Erect X-ray shows a massively dilated, inverted U-shaped bowel loop resembling a \"coffee bean\" arising from the pelvis and aiming toward the right upper quadrant. Assuming no signs of peritonitis, what is the SINGLE BEST initial management?**\nA) Flexible sigmoidoscopy with rectal tube decompression\nB) Emergency laparotomy and Hartmann's procedure\nC) Barium enema\nD) Aggressive oral laxatives\n\n**Answer: A** — **Sigmoid volvulus**—If there are no signs of ischemia or peritonitis, **endoscopic detorsion** via flexible sigmoidoscopy and placement of a flatus tube is the highly successful first-line treatment.\n\n---\n\n### Q65. \n**A 40-year-old male presents with progressive dysphagia to both solids and liquids, accompanied by regurgitation of undigested food. Barium swallow demonstrates a dilated esophagus tapering to a smooth \"bird's beak\" at the lower esophageal sphincter (LES). What is the SINGLE BEST test to confirm the diagnosis?**\nA) High-resolution esophageal manometry\nB) Upper gastrointestinal endoscopy\nC) 24-hour ambulatory pH monitoring\nD) CT scan of the chest\n\n**Answer: A** — **Achalasia**—While barium swallow suggests the diagnosis, **esophageal manometry** showing aperistalsis and failure of LES relaxation is the absolute gold standard for confirmation.\n\n---\n\n### Q66. \n**A 65-year-old male farmer with a long history of sun exposure and pipe smoking presents with a chronic, non-healing, firm, ulcerated nodule on his lower lip. Punch biopsy confirms squamous cell carcinoma. What is the SINGLE BEST curative management for this 1.5 cm lesion?**\nA) Topical 5-Fluorouracil\nB) External beam radiotherapy\nC) Cryotherapy\nD) Surgical wedge excision with primary closure\n\n**Answer: D** — **Squamous Cell Carcinoma of the lower lip**—A standard \"V\" or **wedge excision** allowing for clear histological margins and primary cosmetic closure is the treatment of choice.\n\n---\n\n### Q67. \n**A 30-year-old male motorcyclist is brought to the trauma bay with a severe open fracture of the right tibia (Gustilo-Anderson Grade II) sustained on a clean paved highway. What is the SINGLE BEST initial antibiotic prophylaxis?**\nA) First-generation cephalosporin (e.g., Cefazolin) + Aminoglycoside (e.g., Gentamicin)\nB) Oral Amoxicillin\nC) Intravenous Vancomycin alone\nD) Intravenous Metronidazole alone\n\n**Answer: A** — **Open fractures**—Require immediate broad-spectrum prophylaxis against skin flora and environmental contaminants. A **first-generation cephalosporin (Gram-positives) plus an aminoglycoside (Gram-negatives)** is standard for Grade II/III injuries.\n\n---\n\n### Q68. \n**A 55-year-old female presents with a new, well-circumscribed, soft mass in the right breast. Biopsy reveals sheets of large, highly pleomorphic tumor cells growing in a syncytial pattern with a prominent, dense lymphoplasmacytic infiltrate at the margins. What is the MOST LIKELY diagnosis?**\nA) Medullary Carcinoma of the breast\nB) Invasive Lobular Carcinoma\nC) Tubular Carcinoma\nD) Inflammatory Breast Cancer\n\n**Answer: A** — **Medullary Carcinoma**—Despite its highly atypical, aggressive cellular appearance, the prominent lymphocytic infiltrate is a hallmark feature, and this tumor paradoxically carries a relatively *favorable* prognosis compared to standard invasive ductal carcinoma.\n\n---\n\n### Q69. \n**A 65-year-old female presents with a painful, irreducible swelling in her right groin. Examination reveals the mass is located strictly below the inguinal ligament and lateral to the pubic tubercle. What is the MOST LIKELY diagnosis?**\nA) Direct inguinal hernia\nB) Indirect inguinal hernia\nC) Femoral hernia\nD) Obturator hernia\n\n**Answer: C** — **Femoral hernia**—Anatomically emerges through the femoral ring, passing **below the inguinal ligament** and **lateral to the pubic tubercle**, carrying a very high risk of strangulation.\n\n---\n\n### Q70. \n**A 45-year-old male underwent a diagnostic cardiac catheterization via the right common femoral artery. Two days later, he presents with a painful, pulsatile mass at the puncture site and a palpable systolic bruit. Doppler confirms a swirling color flow pattern (\"yin-yang\" sign). What is the SINGLE BEST minimally invasive management?**\nA) Open surgical exploration and vessel repair\nB) Ultrasound-guided thrombin injection\nC) Application of a firm pressure dressing and discharge\nD) Intravenous systemic heparinization\n\n**Answer: B** — **Femoral artery pseudoaneurysm**—An iatrogenic complication perfectly treated with **ultrasound-guided percutaneous thrombin injection**, which safely clots the false sac within seconds.\n\n---\n\n### Q71. \n**A newborn female is found to have a massive, soft, brilliantly transilluminating cystic mass in the left posterior triangle of the neck. Genetic testing later confirms a 45,XO karyotype. What is the MOST LIKELY diagnosis of the neck mass?**\nA) Branchial Cleft Cyst\nB) Thyroglossal Duct Cyst\nC) Cystic Hygroma (Lymphangioma)\nD) Cervical Teratoma\n\n**Answer: C** — **Cystic Hygroma**—A congenital lymphatic malformation classically located in the posterior triangle, highly associated with **Turner syndrome**. It brilliantly transilluminates due to clear lymphatic fluid.\n\n---\n\n### Q72. \n**A 30-year-old male with a strong family history of recurrent kidney stones and peptic ulcers presents with severe flank pain. Ultrasound shows bilateral nephrolithiasis. Serum calcium is 11.2 mg/dL, and PTH is markedly elevated. An underlying MEN 1 syndrome is suspected. What is the SINGLE BEST definitive management for his renal stones?**\nA) Extracorporeal shock wave lithotripsy (ESWL)\nB) Subtotal Parathyroidectomy\nC) Chronic administration of Thiazide diuretics\nD) Oral Bisphosphonates\n\n**Answer: B** — **Primary Hyperparathyroidism (MEN 1)**—The root cause of the hypercalcemia and recurrent stones is parathyroid hyperplasia. **Surgical removal (subtotal parathyroidectomy)** is the only definitive, curative treatment.\n\n---\n\n# SECTION C — OBSTETRICS & GYNECOLOGY (36 Questions)\n\n---\n\n### Q73. \n**A 28-year-old female who has been taking combined oral contraceptives (COCs) for 3 years presents with a sudden, painful, and swollen left calf. Venous Doppler confirms a massive popliteal Deep Vein Thrombosis (DVT). What is the SINGLE BEST initial management?**\nA) Continue the COC but start low-dose Aspirin\nB) Stop the COC and schedule an inferior vena cava (IVC) filter placement\nC) Stop the COC and immediately initiate therapeutic Low Molecular Weight Heparin (LMWH)\nD) Switch to a progestin-only pill while applying compression stockings\n\n**Answer: C** — **DVT secondary to estrogen-containing COCs**—The offending agent (estrogen) must be **stopped immediately**, and therapeutic anticoagulation (e.g., **LMWH**) must be initiated to prevent pulmonary embolism.\n\n---\n\n### Q74. \n**A 25-year-old female presents to the clinic on Monday morning requesting emergency contraception. She reports having unprotected intercourse late Wednesday night (roughly 110 hours ago). What is the SINGLE BEST, most effective method to offer her at this time?**\nA) Levonorgestrel 1.5 mg oral pill (Plan B)\nB) Insertion of a Copper Intrauterine Device (Cu-IUD)\nC) Yuzpe regimen (high-dose COCs)\nD) Depot medroxyprogesterone acetate (DMPA) injection\n\n**Answer: B** — **Emergency Contraception**—The **Copper IUD** is the most effective form of emergency contraception overall, and crucially, it is the *only* method highly effective up to **120 hours (5 days)** post-coitus. (Levonorgestrel efficacy drops sharply after 72 hours).\n\n---\n\n### Q75. \n**A 30-year-old female who had a Copper T380A IUD inserted 6 months ago complains of severely heavy, painful periods that have caused her hemoglobin to drop to 9.5 g/dL. Ultrasound confirms the IUD is perfectly positioned in the fundus. She desires highly effective, long-term, reversible contraception. What is the SINGLE BEST management?**\nA) Remove the Copper IUD and insert a Levonorgestrel-releasing IUD (LNG-IUS)\nB) Prescribe high-dose Iron supplements and leave the Copper IUD in place\nC) Perform a hysteroscopic endometrial ablation\nD) Switch to barrier methods (condoms)\n\n**Answer: A** — **Copper IUD-induced Menorrhagia**—A well-known side effect. The best clinical choice for a patient still desiring long-acting reversible contraception (LARC) is the **LNG-IUS (Mirena)**, which profoundly reduces menstrual bleeding and dysmenorrhea.\n\n---\n\n### Q76. \n**A 25-year-old female on combined oral contraceptives develops a sudden, severe, unremitting headache, blurred vision, and focal left-sided weakness. A CT venogram confirms a thrombosis in the superior sagittal sinus. What is the SINGLE BEST initial pharmacological management?**\nA) Intravenous Alteplase (tPA)\nB) Therapeutic anticoagulation with Low Molecular Weight Heparin (LMWH)\nC) Immediate neurosurgical thrombectomy\nD) High-dose intravenous corticosteroids\n\n**Answer: B** — **Cerebral Venous Sinus Thrombosis (CVST)**—Despite the theoretical risk of intracranial hemorrhage, the international standard of care is immediate **therapeutic anticoagulation (Heparin/LMWH)** to arrest clot propagation and restore venous drainage.\n\n---\n\n### Q77. \n**A 32-year-old female with a history of two first-trimester miscarriages presents with a missed abortion at 10 weeks. Following evacuation, the histopathology report describes focal villous edema, scattered trophoblastic hyperplasia, and the presence of fetal red blood cells. What is the defining cytogenetic characteristic of this lesion?**\nA) 46,XX (Diploid, completely paternally derived)\nB) 46,XY (Diploid, biparental)\nC) 69,XXY (Triploid, containing two paternal and one maternal set of chromosomes)\nD) 45,XO (Monosomy X)\n\n**Answer: C** — **Partial Hydatidiform Mole**—Characterized by focal (not diffuse) swelling, the presence of fetal tissue, and a **triploid karyotype (69 chromosomes)** resulting from two sperm fertilizing a single normal egg.\n\n---\n\n### Q78. \n**A 60-year-old obese, diabetic female presents with postmenopausal bleeding. Transvaginal ultrasound shows a thickened endometrium of 14 mm. Office biopsy confirms Grade 1 Endometrioid Adenocarcinoma. Staging MRI shows no deep myometrial invasion or extrauterine spread. What is the SINGLE BEST definitive surgical management?**\nA) Radical hysterectomy with bilateral pelvic lymphadenectomy\nB) High-dose progestin therapy (Mirena IUD)\nC) Vaginal hysterectomy\nD) Total Extra-fascial Hysterectomy with Bilateral Salpingo-Oophorectomy (TAH+BSO)\n\n**Answer: D** — **Early-stage Endometrial Cancer**—The gold standard, curative surgical procedure is a **Total Abdominal Hysterectomy with Bilateral Salpingo-Oophorectomy**. (Radical hysterectomy is reserved for cervical cancer).\n\n---\n\n### Q79. \n**A 28-year-old primigravida at 22 weeks with an uncomplicated twin pregnancy (diamniotic dichorionic) undergoes a routine transvaginal ultrasound. Her cervical length is incidentally found to be exactly 2.0 cm. She has no contractions. What is the MOST APPROPRIATE evidence-based management?**\nA) Vaginal progesterone supplementation\nB) Immediate prophylactic cervical cerclage (McDonald)\nC) Strict bed rest for the remainder of the pregnancy\nD) Intramuscular 17-OHPC injections\n\n**Answer: A** — **Short cervix in an asymptomatic twin pregnancy**—Cerclage is not indicated (and may worsen outcomes in twins). Current guidelines suggest **vaginal progesterone** may provide modest benefit in preventing preterm birth, making it the most appropriate intervention.\n\n---\n\n### Q80. \n**A 22-year-old obese female presents with oligomenorrhea, severe cystic acne, and thick, dark hair growth on her chin and chest. Pelvic ultrasound reveals bilaterally enlarged ovaries with >20 small peripheral follicles. She is not seeking pregnancy. What is the SINGLE BEST first-line medical therapy for her hirsutism and irregular menses?**\nA) Spironolactone\nB) Combined oral contraceptives (COCs)\nC) Finasteride\nD) Metformin alone\n\n**Answer: B** — **PCOS**—**Combined oral contraceptives** are the first-line treatment. They regulate the menstrual cycle, protect the endometrium, and increase Sex Hormone-Binding Globulin (SHBG), which binds free testosterone and reduces hirsutism/acne.\n\n---\n\n### Q81. \n**A 50-year-old female presents for a routine screening mammogram, which reveals a tight cluster of pleomorphic microcalcifications in the left upper outer quadrant. Stereotactic core biopsy confirms high-grade Ductal Carcinoma In Situ (DCIS). She desires breast conservation. What is the SINGLE BEST surgical management plan?**\nA) Simple mastectomy with sentinel lymph node biopsy\nB) Excisional biopsy (Lumpectomy) followed by adjuvant whole-breast radiotherapy\nC) Excisional biopsy (Lumpectomy) alone\nD) Neoadjuvant chemotherapy followed by lumpectomy\n\n**Answer: B** — **DCIS**—If breast-conserving surgery is chosen, **lumpectomy MUST be followed by radiation therapy** to significantly decrease the risk of local recurrence and progression to invasive cancer.\n\n---\n\n### Q82. \n**A 25-year-old primigravida at 40 weeks is in active labor, dilated to 5 cm for the past 4 hours. The continuous fetal heart monitor shows repetitive, deep, uniform decelerations that begin strictly *after* the peak of each contraction and recover long after the contraction ends. Baseline variability is absent. What is the SINGLE BEST immediate management?**\nA) Artificial rupture of membranes (Amniotomy)\nB) Administer high-dose Oxytocin to accelerate labor\nC) Fetal scalp blood sampling\nD) Immediate emergency Cesarean section\n\n**Answer: D** — **Repetitive Late Decelerations with absent variability**—This indicates severe, decompensating uteroplacental insufficiency and fetal acidemia. Given the arrest of dilation, an **emergency C-section** is mandatory.\n\n---\n\n### Q83. \n**A 30-year-old female with a history of two previous cesarean deliveries presents with light vaginal bleeding and mild lower abdominal pain at 7 weeks gestation. Transvaginal ultrasound reveals an empty uterine cavity and a gestational sac implanted deep within the anterior lower uterine segment myometrium, exactly at the site of her previous incision. Fetal heart activity is present. She is hemodynamically perfectly stable. What is the SINGLE BEST management?**\nA) Systemic or local Methotrexate administration\nB) Routine sharp Dilation and Curettage (D&C)\nC) Expectant management to term\nD) Immediate emergency hysterectomy\n\n**Answer: A** — **Cesarean Scar Ectopic Pregnancy**—Carries a massive risk of catastrophic rupture and hemorrhage. Because she is early and highly stable, medical management with **Methotrexate** (systemic or intra-sac injection) is the preferred uterus-sparing first line. D&C is strictly contraindicated due to uncontrollable hemorrhage risk.\n\n---\n\n### Q84. \n**A 55-year-old postmenopausal female presents with early satiety, abdominal bloating, and a palpable right adnexal mass. Transvaginal ultrasound demonstrates a 10 cm complex cystic lesion with thick septations, solid nodular excrescences, and significant ascites. Which serum tumor marker is MOST USEFUL for tracking the response to treatment in this epithelial malignancy?**\nA) Alpha-fetoprotein (AFP)\nB) CA-125\nC) Lactate Dehydrogenase (LDH)\nD) Inhibin B\n\n**Answer: B** — **Epithelial Ovarian Carcinoma**—The classic presentation of advanced ovarian cancer. **CA-125** is the gold standard tumor marker for diagnosing, tracking response to chemotherapy, and detecting recurrence in epithelial ovarian tumors.\n\n---\n\n### Q85. \n**A 28-year-old female at 34 weeks gestation presents with intense, relentless itching, particularly severe on the palms of her hands and soles of her feet, noticeably worse at night. She has no distinct rash, only excoriations from scratching. Fasting serum bile acids are significantly elevated. What is the SINGLE BEST pharmacological treatment to reduce maternal symptoms and improve fetal outcomes?**\nA) High-dose oral antihistamines (e.g., Diphenhydramine)\nB) Topical corticosteroids\nC) Ursodeoxycholic acid (UDCA)\nD) Cholestyramine\n\n**Answer: C** — **Intrahepatic Cholestasis of Pregnancy (ICP)**—**Ursodeoxycholic acid** actively lowers serum bile acid levels, profoundly relieving maternal pruritus and reducing the risk of sudden fetal demise.\n\n---\n\n### Q86. \n**A 25-year-old female with a long-standing history of generalized epilepsy visits her neurologist for pre-conception counseling. She has been completely seizure-free on Valproic acid for 3 years. What is the SINGLE BEST management strategy to minimize the risk of major congenital malformations before she attempts to conceive?**\nA) Continue Valproic acid but add 5 mg of daily Folic Acid\nB) Switch her from Valproic acid to Lamotrigine or Levetiracetam\nC) Stop all antiepileptic drugs completely for the first trimester\nD) Reduce the Valproic acid dose by 50%\n\n**Answer: B** — **Teratogenicity of Valproic Acid**—Valproate carries the absolute highest risk of severe teratogenesis (especially neural tube defects). The best practice is to slowly **switch to a safer agent like Lamotrigine or Levetiracetam** months prior to conception.\n\n---\n\n### Q87. \n**A 32-year-old female with a past history of severe Chlamydia-induced Pelvic Inflammatory Disease (PID) presents with 3 years of primary infertility. A hysterosalpingogram (HSIL) demonstrates complete, bilateral proximal occlusion of the fallopian tubes with massive distal hydrosalpinges. Her partner's semen analysis is pristine. What is the SINGLE BEST definitive treatment to achieve pregnancy?**\nA) In vitro fertilization (IVF)\nB) Laparoscopic tubal recanalization\nC) Intrauterine insemination (IUI)\nD) Ovulation induction with Clomiphene citrate\n\n**Answer: A** — **Severe bilateral tubal factor infertility**—Tubal reconstructive surgery for massive hydrosalpinges has abysmal success rates and a high ectopic risk. **IVF** bypasses the tubes entirely and is the definitive treatment of choice.\n\n---\n\n### Q88. \n**A 30-year-old female with newly diagnosed Graves' disease Discovers she is 6 weeks pregnant. Her endocrinologist wants to initiate antithyroid medication to control her severe hyperthyroidism. Which is the SINGLE BEST medication choice for the FIRST trimester of pregnancy?**\nA) Radioactive Iodine (I-131)\nB) Propylthiouracil (PTU)\nC) Methimazole\nD) High-dose Propranolol monotherapy\n\n**Answer: B** — **Graves' disease in early pregnancy**—Methimazole is associated with severe congenital anomalies (aplasia cutis, choanal atresia). **PTU is the mandatory drug of choice strictly during the first trimester**.\n\n---\n\n### Q89. \n**A 65-year-old female presents with a 3 cm hard, ulcerated, bleeding mass on the right labium majus. Biopsy confirms invasive squamous cell carcinoma. She undergoes radical local excision with an inguinofemoral lymph node dissection. Which of the following pathological findings is the SINGLE MOST powerful prognostic factor for her overall survival?**\nA) The degree of cellular differentiation (Histological grade)\nB) The maximum tumor diameter\nC) The presence of inguinofemoral lymph node metastasis\nD) The presence of Human Papillomavirus (HPV) DNA in the tumor\n\n**Answer: C** — **Vulvar Carcinoma**—As with most gynecological malignancies, the **presence and number of positive lymph nodes** is the single most critical determinant of prognosis and survival.\n\n---\n\n### Q90. \n**A 28-year-old primigravida at 31 weeks gestation presents to the emergency department with a sudden onset of painless, bright red vaginal bleeding. Her vital signs are stable, and the fetal heart tracing is reassuring. Transabdominal ultrasound confirms a complete placenta previa covering the internal cervical os. What is the MOST APPROPRIATE immediate management plan?**\nA) Perform a digital vaginal examination to assess cervical dilation\nB) Schedule an immediate emergency Cesarean section\nC) Administer intravenous Oxytocin to induce labor\nD) Admit for expectant management and administer a course of IM Corticosteroids\n\n**Answer: D** — **Preterm Placenta Previa with mild, stable bleeding**—The goal is to prolong the pregnancy safely. **Expectant management (bed rest, observation) coupled with Corticosteroids** to accelerate fetal lung maturity is the gold standard until delivery at 36-37 weeks.\n\n---\n\n### Q91. \n**A 35-year-old female presents with severe dysmenorrhea and chronic pelvic pain. Transvaginal ultrasound reveals a 6 cm thick-walled cystic mass in the left ovary filled with homogenous, low-level echoes (\"ground glass\" appearance). She strongly desires future fertility. What is the SINGLE BEST management?**\nA) Laparoscopic ovarian cystectomy (stripping of the cyst capsule)\nB) Six-month course of GnRH agonists (e.g., Leuprolide)\nC) Ultrasound-guided needle aspiration of the cyst fluid\nD) Left salpingo-oophorectomy\n\n**Answer: A** — **Endometrioma (\"Chocolate Cyst\") >4 cm**—Medical therapy will not resolve large endometriomas. **Laparoscopic cystectomy** (carefully excising the capsule while preserving the ovarian cortex) improves pain, prevents rupture, and optimizes fertility.\n\n---\n\n### Q92. \n**A 25-year-old female presents to the clinic panicked because she missed her period by 2 weeks and had a positive home pregnancy test. She had a ruptured ectopic pregnancy treated with a salpingectomy 3 years ago and fears a recurrence. A transvaginal ultrasound today clearly visualizes a distinct gestational sac containing a yolk sac perfectly situated within the uterine cavity. She has no pain or bleeding. What is the SINGLE BEST next step?**\nA) Administer prophylactic Methotrexate immediately\nB) Reassurance and schedule routine prenatal care\nC) Draw serial quantitative β-hCG levels every 48 hours\nD) Start high-dose progesterone suppositories\n\n**Answer: B** — **Confirmed normal intrauterine pregnancy**—The visualization of a yolk sac within the uterine cavity definitively rules out an ectopic pregnancy. The patient simply needs **reassurance and routine obstetric care**.\n\n---\n\n### Q93. \n**A 30-year-old obese female at 24 weeks gestation undergoes a routine 50-gram, 1-hour Oral Glucose Challenge Test (OGCT). Her 1-hour venous plasma glucose result is 155 mg/dL (Normal <140). What is the SINGLE BEST immediate next step?**\nA) Instruct her to begin strict Medical Nutrition Therapy (Diabetic diet)\nB) Diagnose her with Gestational Diabetes and prescribe Metformin\nC) Perform a diagnostic 100-gram, 3-hour Oral Glucose Tolerance Test (OGTT)\nD) Schedule an early induction of labor at 37 weeks\n\n**Answer: C** — **Two-step GDM Screening**—The 50g OGCT is merely a screening test. A value >140 mg/dL mandates the definitive diagnostic test: the **100-gram, 3-hour OGTT**.\n\n---\n\n### Q94. \n**A 28-year-old primigravida at 36 weeks is admitted with severe pre-eclampsia (BP 175/115 mmHg). She is receiving a continuous maintenance infusion of intravenous Magnesium Sulfate and IV Labetalol. Suddenly, she develops a generalized tonic-clonic seizure. Her patellar reflexes are 2+. What is the SINGLE BEST acute management to halt the active seizure?**\nA) Administer an additional 2-gram IV bolus of Magnesium Sulfate\nB) Administer Intravenous Lorazepam or Diazepam\nC) Administer Intravenous Phenytoin\nD) Immediately initiate an emergency bedside Cesarean section\n\n**Answer: B** — **Eclampsia refractory to baseline Magnesium**—While Magnesium is the ultimate prophylactic/therapeutic agent, an active, prolonged breakthrough seizure should be rapidly terminated using a fast-acting benzodiazepine like **IV Lorazepam**.\n\n---\n\n### Q95. \n**A 55-year-old female presents with massive abdominal distension, early satiety, and a palpable rigid pelvic mass. A CT scan of the abdomen and pelvis shows a 12 cm complex right ovarian tumor, extensive ascites, massive omental caking, and multiple large metastatic implants covering the diaphragm and liver capsule. CA-125 is 1,200 U/mL. What is the SINGLE BEST initial management plan?**\nA) Neoadjuvant platinum-based chemotherapy followed by interval debulking surgery\nB) Immediate exploratory laparotomy for primary cytoreductive surgery\nC) Palliative whole-abdomen external beam radiation\nD) High-dose continuous progestin therapy\n\n**Answer: A** — **Advanced (Stage III/IV) Epithelial Ovarian Cancer with massive tumor burden**—When primary optimal cytoreduction (leaving <1 cm of tumor) is impossible due to massive upper abdominal/diaphragmatic disease, the standard of care shifts to **Neoadjuvant Chemotherapy (NACT) to shrink the tumor**, followed by surgery.\n\n---\n\n### Q96. \n**A 32-year-old female presents to the recurrent pregnancy loss clinic after her fourth consecutive first-trimester miscarriage. A parental karyotype analysis reveals that she c
