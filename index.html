NEET PG 2026 — SET 2: The Diagnostic & Systemic Deep-Dive\n\n> **⚠️ STRATEGIC NOTE:** This Set-2 is built on **non-repeating, equally high-yield concepts** that complement Set 1. It covers the **remaining 60% of the core syllabus**—valvular heart disease, acid-base, hematology, hepatobiliary surgery, burns, bone tumors, psychiatric disorders, neonatal emergencies, biostatistics, and forensic injuries. **Treat this as your \"weakness eraser.\"**\n\n---\n\n## 📊 THE 2026 SHIFT: WHAT HAS CHANGED (Reminder)\n\n| Parameter | Pre-2026 | NEET PG 2026 |\n|-----------|----------|--------------|\n| Total Questions | 200 | **180** |\n| Total Marks | 800 | **720** |\n| Questions/Section | 40 | **36** |\n| Sections | 5 (A–E) | 5 (A–E)—**unchanged** |\n| Time/Section | 42 min | **42 min—unchanged** |\n| Total Duration | 3.5 hrs | **3.5 hrs—unchanged** |\n\n**Key Insight:** Same time, fewer questions = **~70 seconds per question** (vs ~63 sec earlier). But **each question now carries more relative weight**. Conceptual depth > speed.\n\n---\n\n## 🎯 SET 2 — FULL PAPER (180 Questions | 5 Sections | 720 Marks)\n\n---\n\n# SECTION A — MEDICINE & ALLIED (36 Questions)\n\n---\n\n### Q1. [Image-Based — Echocardiography]\n**A 55-year-old male with fever and a new systolic murmur is found to have vegetations on the mitral valve on TTE. Blood cultures grow viridans group streptococci. Which of the following is the MOST APPROPRIATE antibiotic regimen?**\nA) Vancomycin + Gentamicin\nB) Penicillin G + Gentamicin\nC) Ceftriaxone alone\nD) Ampicillin + Sulbactam\n\n**Answer: B** — **Infective endocarditis** (penicillin-sensitive viridans strep) → **Penicillin G + Gentamicin** for 2 weeks (synergistic).\n\n---\n\n### Q2. \n**A 60-year-old male with dyspnea, orthopnea, and a third heart sound (S3) has an echocardiogram showing LVEF 25%, with global hypokinesia and a dilated left ventricle. What is the MOST LIKELY etiology?**\nA) Hypertrophic cardiomyopathy\nB) Dilated cardiomyopathy\nC) Restrictive cardiomyopathy\nD) Arrhythmogenic RV dysplasia\n\n**Answer: B** — **Dilated cardiomyopathy**—LVEF <40%, dilated chamber, S3 gallop.\n\n---\n\n### Q3. \n**A 65-year-old male presents with progressive dyspnea, fatigue, and ankle edema. Echocardiography shows thickened ventricular walls with a \"sparkling\" appearance and restrictive filling pattern. What is the MOST LIKELY associated condition?**\nA) Sarcoidosis\nB) Amyloidosis\nC) Hemochromatosis\nD) Hypertrophic cardiomyopathy\n\n**Answer: B** — **Restrictive cardiomyopathy**—**amyloidosis** (sparkling/granular appearance on echo).\n\n---\n\n### Q4. \n**A 45-year-old female with breast cancer presents with acute dyspnea, hypotension, and muffled heart sounds. JVP is elevated with a prominent \"y\" descent absent. What is the SINGLE BEST diagnostic test?**\nA) Chest X-ray\nB) ECG\nC) Echocardiography\nD) CT pulmonary angiography\n\n**Answer: C** — **Cardiac tamponade**—Beck's triad (hypotension, muffled heart sounds, ↑JVP with loss of y-descent). **Echocardiography** is the diagnostic test of choice.\n\n---\n\n### Q5. \n**A 70-year-old male presents with exertional syncope, angina, and dyspnea. A systolic ejection murmur is heard at the right upper sternal border that radiates to the carotids. What is the SINGLE BEST definitive treatment?**\nA) Aortic valve replacement\nB) Balloon valvuloplasty\nC) Beta-blockers\nD) ACE inhibitors\n\n**Answer: A** — **Aortic stenosis**—**Aortic valve replacement** is the definitive treatment (TAVR or surgical).\n\n---\n\n### Q6. \n**A 45-year-old female presents with progressive dyspnea and palpitations. Echocardiography shows a \"fish-mouth\" appearance of the mitral valve. What is the MOST COMMON cause of this condition?**\nA) Rheumatic heart disease\nB) Myxomatous degeneration\nC) Congenital\nD) Infective endocarditis\n\n**Answer: A** — **Mitral stenosis**—**rheumatic heart disease** is the most common cause.\n\n---\n\n### Q7. \n**A 65-year-old male with hypertension and coronary artery disease presents with palpitations. ECG shows an irregularly irregular rhythm with no P waves and a ventricular rate of 140 bpm. What is the SINGLE BEST acute rate-control medication?**\nA) Amiodarone\nB) Digoxin\nC) Metoprolol IV\nD) Diltiazem\n\n**Answer: C** — **Atrial fibrillation** with rapid ventricular response (RVR)—**IV metoprolol** or diltiazem is first-line for rate control.\n\n---\n\n### Q8. \n**A 45-year-old male with pneumonia presents with hyponatremia (Na⁺ 128 mEq/L), relative bradycardia, and confusion. Chest X-ray shows a patchy right lower lobe infiltrate. What is the MOST LIKELY organism?**\nA) Streptococcus pneumoniae\nB) Mycoplasma pneumoniae\nC) Legionella pneumophila\nD) Chlamydia psittaci\n\n**Answer: C** — **Legionella**—classic presentation features pneumonia with hyponatremia, relative bradycardia, GI, and neuropsychiatric symptoms.\n\n---\n\n### Q9. \n**A 28-year-old female with asthma is on high-dose inhaled corticosteroids and a LABA. She still has persistent symptoms. What is the NEXT STEP in management?**\nA) Add oral corticosteroids\nB) Add a leukotriene receptor antagonist\nC) Add a long-acting anticholinergic (LAMA)\nD) Consider biologic therapy (omalizumab)\n\n**Answer: C** — **Asthma Step 5**—add **LAMA** (tiotropium) before stepping up to biologics.\n\n---\n\n### Q10. \n**A 65-year-old male with COPD (FEV1 45% predicted) presents with worsening dyspnea. His BMI is 22, 6-minute walk distance is 350m, and he has had 2 exacerbations in the past year. What is his BODE score?**\nA) 2\nB) 4\nC) 6\nD) 8\n\n**Answer: B** — **BODE index**—FEV1 36-49% (1 pt), BMI >21 (0 pts), walk distance 250-349m (1 pt), MMRC dyspnea severe (2 pts). Total ≈ 4.\n\n---\n\n### Q11. [Image-Based — HRCT]\n**A 60-year-old male presents with progressive exertional dyspnea and a dry cough. HRCT (Image: subpleural reticulation, honeycombing, traction bronchiectasis with basal predominance). What is the MOST LIKELY diagnosis?**\nA) Hypersensitivity pneumonitis\nB) Idiopathic pulmonary fibrosis (IPF)\nC) Sarcoidosis\nD) Lymphangitic carcinomatosis\n\n**Answer: B** — **IPF**—**honeycombing**, basal and subpleural predominance, and traction bronchiectasis are hallmark signs of usual interstitial pneumonia (UIP).\n\n---\n\n### Q12. \n**A 55-year-old male with acute severe shortness of breath has a Wells score of 6. What is the SINGLE BEST diagnostic test?**\nA) D-dimer\nB) CTPA\nC) V/Q scan\nD) Lower extremity Doppler\n\n**Answer: B** — **Pulmonary Embolism**—High pretest probability (Wells >4) → **CTPA** is the diagnostic test of choice. Skip the D-dimer.\n\n---\n\n### Q13. \n**A 45-year-old male with an alcohol use disorder presents with a high anion gap metabolic acidosis. Serum osmolal gap is elevated. What is the MOST LIKELY cause?**\nA) Lactic acidosis\nB) Diabetic ketoacidosis\nC) Methanol poisoning\nD) Renal failure\n\n**Answer: C** — **Elevated osmolal gap** + AGMA → toxic alcohol ingestion (e.g., **methanol** or ethylene glycol).\n\n---\n\n### Q14. \n**A 60-year-old male with chronic kidney disease presents with a serum potassium of 6.8 mEq/L. ECG shows tall peaked T waves. What is the FIRST immediate management?**\nA) IV Calcium gluconate\nB) IV Insulin + Glucose\nC) IV Sodium bicarbonate\nD) Kayexalate\n\n**Answer: A** — **Hyperkalemia** with ECG changes—**Calcium gluconate** is the first step to stabilize the cardiac membrane, followed by shifting agents (Insulin/glucose).\n\n---\n\n### Q15. \n**A 65-year-old male with small cell lung cancer presents with hyponatremia (Na⁺ 118 mEq/L), is clinically euvolemic, and has low serum uric acid. What is the MOST LIKELY diagnosis?**\nA) SIADH\nB) Cerebral salt wasting\nC) Addison's disease\nD) Diuretic use\n\n**Answer: A** — **SIADH**—euvolemic hyponatremia, low uric acid, concentrated urine, commonly a paraneoplastic syndrome in SCLC.\n\n---\n\n### Q16. \n**A 4-year-old child presents with generalized edema, frothy urine, and hypoalbuminemia. Urinalysis shows 4+ protein, no RBCs. What is the MOST LIKELY histopathology?**\nA) Membranoproliferative GN\nB) Minimal change disease\nC) Focal segmental glomerulosclerosis\nD) Membranous nephropathy\n\n**Answer: B** — **Nephrotic syndrome** in children—**minimal change disease** (effacement of podocyte foot processes) is the most common cause.\n\n---\n\n### Q17. \n**A 25-year-old male presents with hemoptysis, hematuria, and rapidly progressive renal failure. Anti-GBM antibodies are positive. What is the SINGLE BEST treatment?**\nA) Pulse corticosteroids\nB) Plasmapheresis + Cyclophosphamide + Steroids\nC) Rituximab\nD) ACE inhibitors\n\n**Answer: B** — **Goodpasture's syndrome**—requires rapid removal of autoantibodies via **plasmapheresis** combined with immunosuppressants.\n\n---\n\n### Q18. \n**A 55-year-old male with recent major surgery presents with acute oliguric renal failure. Urine Na⁺ is 12 mEq/L, FENa <1%. What is the diagnosis?**\nA) ATN\nB) Prerenal azotemia\nC) Postrenal azotemia\nD) Acute interstitial nephritis\n\n**Answer: B** — **Prerenal azotemia**—tubules are intact and reabsorbing sodium to restore volume: low urine Na⁺, low FENa (<1%).\n\n---\n\n### Q19. \n**A 60-year-old male with CKD stage 4 presents with bone pain, elevated PTH, and low calcium. What is the SINGLE BEST management to reduce PTH?**\nA) Calcitriol\nB) Calcium carbonate\nC) Cinacalcet\nD) Phosphate binders\n\n**Answer: A** — **CKD-MBD (Secondary Hyperparathyroidism)**—Kidneys fail to 1-alpha-hydroxylate vitamin D. **Calcitriol** (active vitamin D) replacement directly suppresses PTH.\n\n---\n\n### Q20. \n**A 50-year-old male with chronic alcoholism presents with jaundice, ascites, and AST/ALT ratio of 2.5. What is the MOST LIKELY diagnosis?**\nA) Viral hepatitis\nB) Alcoholic liver disease\nC) Drug-induced liver injury\nD) Hemochromatosis\n\n**Answer: B** — **Alcoholic liver disease**—classic transaminitis pattern of **AST/ALT >2** (\"Scotch ratio\").\n\n---\n\n### Q21. \n**A 15-year-old male presents with tremor, dysarthria, and Kayser-Fleischer rings on slit-lamp exam. What is the SINGLE BEST screening diagnostic test?**\nA) Serum ceruloplasmin\nB) 24-hour urine copper\nC) Liver biopsy\nD) Genetic testing\n\n**Answer: A** — **Wilson's disease**—**low serum ceruloplasmin** is the key initial screening test.\n\n---\n\n### Q22. \n**A 45-year-old male presents with diabetes mellitus, bronze skin pigmentation, and hepatomegaly. What is the MOST LIKELY diagnosis?**\nA) Hemochromatosis\nB) Addison's disease\nC) Wilson's disease\nD) Porphyria\n\n**Answer: A** — **Hemochromatosis**—classic triad of **\"bronze diabetes\"** (skin pigmentation, diabetes, cirrhosis/hepatomegaly).\n\n---\n\n### Q23. \n**A 35-year-old female presents with hyperpigmentation of the skin and mucous membranes, fatigue, hypotension, and hyponatremia with hyperkalemia. What is the MOST LIKELY diagnosis?**\nA) Cushing's syndrome\nB) Addison's disease\nC) SIADH\nD) Conn's syndrome\n\n**Answer: B** — **Addison's disease** (Primary Adrenal Insufficiency)—loss of aldosterone causes hyperkalemia/hyponatremia, while ↑ACTH causes hyperpigmentation.\n\n---\n\n### Q24. \n**A 40-year-old female presents with central obesity, moon facies, and hypertension. An overnight 1 mg dexamethasone suppression test fails to suppress cortisol. What is the SINGLE BEST next step to determine the etiology?**\nA) 24-hour urinary cortisol\nB) Plasma ACTH level\nC) CRH stimulation test\nD) Adrenal CT\n\n**Answer: B** — **Cushing's syndrome**—once hypercortisolism is confirmed, checking **plasma ACTH** is the immediate next step to differentiate ACTH-dependent (pituitary/ectopic) from ACTH-independent (adrenal) causes.\n\n---\n\n### Q25. \n**A 30-year-old male presents with polyuria, polydipsia, and a normal serum glucose. Water deprivation test shows urine osmolality <300 mOsm/kg. After desmopressin, urine osmolality rises to >600. What is the diagnosis?**\nA) Central DI\nB) Nephrogenic DI\nC) Primary polydipsia\nD) Diabetes mellitus\n\n**Answer: A** — **Central Diabetes Insipidus**—failure to concentrate urine during water deprivation, but completely responds to exogenous desmopressin (ADH).\n\n---\n\n### Q26. \n**A 25-year-old female with a recent viral infection presents with jaundice and anemia. Peripheral smear shows spherocytes, and the direct Coombs test is positive. What is the diagnosis?**\nA) Autoimmune hemolytic anemia\nB) Hereditary spherocytosis\nC) G6PD deficiency\nD) Sickle cell anemia\n\n**Answer: A** — **AIHA**—Distinguished from hereditary spherocytosis by a **positive Direct Antiglobulin Test (DAT / Coombs test)**.\n\n---\n\n### Q27. \n**A 60-year-old male presents with macrocytic anemia, neuropathy, and a beefy-red tongue. Serum vitamin B12 is low, and methylmalonic acid is elevated. What is the SINGLE BEST diagnostic test to establish the etiology?**\nA) Schilling test\nB) Anti-intrinsic factor antibody\nC) Serum folate\nD) Homocysteine\n\n**Answer: B** — **Pernicious anemia**—**anti-intrinsic factor antibody** is highly specific for the autoimmune destruction of parietal cells.\n\n---\n\n### Q28. \n**A 30-year-old male with sickle cell disease presents with acute chest pain, fever, and hypoxia. Chest X-ray reveals new pulmonary infiltrates. What is the SINGLE BEST acute treatment?**\nA) Hydroxyurea\nB) Exchange transfusion\nC) Broad-spectrum antibiotics + oxygen + incentive spirometry\nD) Folic acid\n\n**Answer: C** — **Acute chest syndrome**—immediate **supportive care (oxygen, antibiotics, incentive spirometry, hydration, analgesia)**. Exchange transfusion is reserved for severe/refractory cases.\n\n---\n\n### Q29. \n**A 28-year-old female from Southeast Asia presents with microcytic anemia and target cells on smear. Hb electrophoresis shows HbA₂ of 5.5%. What is the diagnosis?**\nA) Sickle cell trait\nB) Beta-thalassemia trait\nC) Iron deficiency\nD) HbE disease\n\n**Answer: B** — **Beta-thalassemia trait (minor)**—characterized by microcytosis out of proportion to anemia and an elevated **HbA₂ (>3.5%)**.\n\n---\n\n### Q30. \n**A 45-year-old male presents with fatigue, bleeding gums, and bone pain. Peripheral smear shows blast cells with Auer rods. What is the MOST LIKELY diagnosis?**\nA) ALL\nB) AML\nC) CML\nD) CLL\n\n**Answer: B** — **Acute Myeloid Leukemia (AML)**—the presence of needle-like cytoplasmic inclusions (**Auer rods**) in myeloblasts is pathognomonic.\n\n---\n\n### Q31. \n**A 55-year-old male presents with massive splenomegaly, leukocytosis (WBC >100,000/μL), and absolute basophilia. Cytogenetics reveal a t(9;22) translocation. What is the SINGLE BEST targeted therapy?**\nA) Hydroxyurea\nB) Imatinib\nC) Interferon alpha\nD) Dasatinib\n\n**Answer: B** — **CML**—**Imatinib** (a tyrosine kinase inhibitor targeting the BCR-ABL fusion protein) is first-line.\n\n---\n\n### Q32. \n**A 65-year-old male presents with back pain, anemia, and renal failure. Serum protein electrophoresis shows a monoclonal spike. Urine shows Bence-Jones proteins. What is the FIRST-LINE treatment for a symptomatic, transplant-ineligible patient?**\nA) Lenalidomide + Dexamethasone\nB) Bortezomib + Melphalan + Prednisone\nC) Thalidomide + Dexamethasone\nD) Autologous stem cell transplant\n\n**Answer: B** — **Multiple myeloma**—The VMP regimen (**Bortezomib + Melphalan + Prednisone**) is the classic, guideline-directed therapy for older, transplant-ineligible patients.\n\n---\n\n### Q33. \n**A 50-year-old female with rheumatoid arthritis has been on methotrexate for 6 months. She now presents with elevated transaminases. What is the MOST IMPORTANT routine monitoring parameter for patients on methotrexate?**\nA) Serum creatinine\nB) Complete blood count\nC) Chest X-ray\nD) Liver function tests\n\n**Answer: D** — **Methotrexate**—a known hepatotoxin requiring routine monitoring of **LFTs** to prevent severe liver fibrosis/cirrhosis.\n\n---\n\n### Q34. \n**A 45-year-old male presents with acute onset of severe pain, redness, and swelling of the first metatarsophalangeal joint. Serum uric acid is 9.5 mg/dL. What is the MOST APPROPRIATE acute therapy?**\nA) Allopurinol\nB) Colchicine or NSAIDs\nC) Febuxostat\nD) Probenecid\n\n**Answer: B** — **Acute gout (Podagra)**—abortive therapy with **NSAIDs (Indomethacin) or Colchicine** is indicated. Urate-lowering drugs (Allopurinol) are reserved for chronic management.\n\n---\n\n### Q35. \n**A 28-year-old male presents with chronic back pain and stiffness that improves with exercise but worsens with rest. X-ray shows bamboo spine. What is the MOST LIKELY HLA association?**\nA) HLA-B27\nB) HLA-DR4\nC) HLA-DQ2\nD) HLA-A3\n\n**Answer: A** — **Ankylosing spondylitis**—strongly associated with **HLA-B27**.\n\n---\n\n### Q36. \n**A 55-year-old female presents with dry eyes, dry mouth, and fatigue. She has positive anti-SSA (Ro) and anti-SSB (La) antibodies. What is the MOST LIKELY diagnosis?**\nA) Rheumatoid arthritis\nB) Systemic lupus erythematosus\nC) Sjogren's syndrome\nD) Sarcoidosis\n\n**Answer: C** — **Sjogren's syndrome**—classic autoimmune exocrinopathy linked to anti-SSA/SSB.\n\n---\n\n# SECTION B — SURGERY & ORTHOPEDICS (36 Questions)\n\n---\n\n### Q37. \n**A 40-year-old male sustains burns to the anterior chest, anterior abdomen, and both anterior thighs. Using the Rule of Nines, what is the percentage of Total Body Surface Area (TBSA) burned?**\nA) 18%\nB) 27%\nC) 36%\nD) 45%\n\n**Answer: B** — Anterior chest (9%) + anterior abdomen (9%) + both anterior thighs (4.5% + 4.5% = 9%) → **27%**.\n\n---\n\n### Q38. \n**A 50-year-old male with a long-standing peptic ulcer presents with sudden severe epigastric pain, board-like rigidity, and peritonitis. Erect X-ray shows free air under the diaphragm. What is the SINGLE BEST surgical procedure?**\nA) Graham patch omental repair\nB) Highly selective vagotomy\nC) Antrectomy\nD) Gastrojejunostomy\n\n**Answer: A** — **Perforated peptic ulcer**—an emergent **Graham patch omental repair** is the surgical gold standard.\n\n---\n\n### Q39. \n**A 60-year-old male presents with upper abdominal pain, painless jaundice, and a palpable gallbladder. CA 19-9 is elevated. What is the MOST LIKELY diagnosis?**\nA) Choledocholithiasis\nB) Carcinoma of the head of the pancreas\nC) Gallbladder carcinoma\nD) Ampullary carcinoma\n\n**Answer: B** — **Pancreatic head cancer**—painless jaundice + palpable gallbladder (Courvoisier's law) + ↑CA 19-9.\n\n---\n\n### Q40. [Image-Based — ERCP]\n**A 55-year-old female presents with recurrent right upper quadrant pain, fever, and jaundice. ERCP (Image: multiple filling defects in the common bile duct). What is the SINGLE BEST definitive acute management?**\nA) Cholecystectomy\nB) ERCP with sphincterotomy and stone extraction\nC) Percutaneous transhepatic cholangiography\nD) Roux-en-Y hepaticojejunostomy\n\n**Answer: B** — **Ascending cholangitis secondary to choledocholithiasis**—**ERCP with sphincterotomy** for immediate biliary decompression and stone extraction.\n\n---\n\n### Q41. \n**A 45-year-old male with fever and right hypochondrial pain. Ultrasound shows a 5 cm liver abscess with a \"target\" appearance. His stool culture is positive for Entamoeba histolytica. What is the SINGLE BEST treatment?**\nA) Metronidazole + luminal amebicide\nB) Percutaneous drainage\nC) Ceftriaxone + Metronidazole\nD) Chloroquine\n\n**Answer: A** — **Amebic liver abscess**—medical management with **Metronidazole** (tissue amebicide) followed by **diloxanide/paromomycin** (luminal amebicide).\n\n---\n\n### Q42. \n**A 65-year-old male with a history of smoking presents with a pulsatile abdominal mass. CT shows an infrarenal aortic aneurysm of 6.5 cm. What is the SINGLE BEST management?**\nA) Conservative with serial ultrasound\nB) Endovascular aneurysm repair (EVAR)\nC) Open surgical repair\nD) Anti-hypertensives alone\n\n**Answer: B** — **AAA >5.5 cm**—Surgical intervention is required. **EVAR** is the preferred first-line modality assuming suitable anatomy.\n\n---\n\n### Q43. \n**A 55-year-old male with diabetes presents with intermittent claudication of the right calf after walking 100 meters. Ankle-brachial index is 0.5. What is the SINGLE BEST initial pharmacological therapy?**\nA) Aspirin\nB) Clopidogrel\nC) Cilostazol\nD) Pentoxifylline\n\n**Answer: A** — **Peripheral Arterial Disease (PAD)**—**Aspirin** (antiplatelet) is first-line to reduce cardiovascular morbidity and mortality. (Cilostazol is used for symptom relief, not first-line survival benefit).\n\n---\n\n### Q44. \n**A 50-year-old male presents with an ulcer just above the medial malleolus, with surrounding varicose veins. The ulcer is shallow, painful, and the skin is hyperpigmented (lipodermatosclerosis). What is the MOST LIKELY diagnosis?**\nA) Venous ulcer\nB) Arterial ulcer\nC) Diabetic foot ulcer\nD) Marjolin's ulcer\n\n**Answer: A** — **Venous ulcer**—classic location (gaiter area), hyperpigmentation, and chronicity.\n\n---\n\n### Q45. \n**A 65-year-old male with LUTS has a serum PSA of 4.5 ng/mL. Digital rectal exam shows a firm, nodular prostate. What is the SINGLE BEST next step?**\nA) Repeat PSA in 3 months\nB) Transrectal ultrasound-guided biopsy\nC) MRI prostate\nD) Alpha-blocker therapy\n\n**Answer: B** — **Prostate cancer suspicion**—abnormal DRE mandates a **prostate biopsy** regardless of the mild PSA elevation.\n\n---\n\n### Q46. \n**A 55-year-old male presents with acute severe flank pain radiating to the groin. CT shows a 4 mm stone at the vesicoureteric junction. What is the MOST APPROPRIATE medical management?**\nA) Tamsulosin + hydration + analgesics\nB) Ureteroscopy\nC) Shock wave lithotripsy\nD) PCNL\n\n**Answer: A** — **Distal ureteric stone <5 mm**—medical expulsive therapy with **tamsulosin** is highly effective.\n\n---\n\n### Q47. \n**A 75-year-old male with a history of falls presents with a chronic headache and mild confusion. CT head shows a crescent-shaped hypodense collection over the convexity. What is the SINGLE BEST management?**\nA) Observation\nB) Burr hole drainage\nC) Craniotomy\nD) Anticonvulsants\n\n**Answer: B** — **Chronic subdural hematoma** in an elderly, symptomatic patient—**burr hole evacuation** is the gold standard.\n\n---\n\n### Q48. \n**A 60-year-old female presents with sudden onset of the worst headache of her life. CT head shows a hyperdense blood collection in the subarachnoid space. What is the SINGLE BEST medical therapy to prevent vasospasm?**\nA) Nimodipine\nB) Mannitol\nC) Phenytoin\nD) Dexamethasone\n\n**Answer: A** — **Subarachnoid hemorrhage**—**Nimodipine** (a calcium channel blocker) significantly reduces morbidity from delayed cerebral vasospasm.\n\n---\n\n### Q49. \n**A 25-year-old male involved in a road traffic accident has a fracture of the C5 vertebra with loss of motor and sensory function below the level of injury. He is bradycardic and hypotensive despite adequate fluid resuscitation. What is the SINGLE BEST management?**\nA) Atropine + Vasopressors\nB) High-dose corticosteroids\nC) Aggressive fluid resuscitation\nD) Urgent decompression surgery\n\n**Answer: A** — **Neurogenic shock** (loss of sympathetic tone → bradycardia + hypotension) → requires **Atropine + vasopressors (e.g., phenylephrine/norepinephrine)**.\n\n---\n\n### Q50. [Image-Based — X-ray]\n**A 70-year-old female with chronic knee pain. X-ray (Image: joint space narrowing, osteophytes, subchondral sclerosis). What is the SINGLE BEST initial management?**\nA) Total knee replacement\nB) NSAIDs + physical therapy + weight loss\nC) Intra-articular corticosteroids\nD) Hyaluronic acid injection\n\n**Answer: B** — **Osteoarthritis**—**NSAIDs + PT + weight loss** is the first-line conservative management.\n\n---\n\n### Q51. \n**A 25-year-old male presents with acute knee pain, swelling, and fever. Aspiration of the knee shows purulent fluid with >50,000 WBC/μL, gram-positive cocci in clusters. What is the SINGLE BEST management?**\nA) IV antibiotics alone\nB) Emergency arthroscopic drainage + IV antibiotics\nC) Oral antibiotics\nD) Immobilization\n\n**Answer: B** — **Septic arthritis** (Staph aureus)—requires emergent **surgical drainage** (arthroscopic washout) and IV antibiotics to prevent joint destruction.\n\n---\n\n### Q52. \n**A 10-year-old child presents with fever, pain, and swelling over the distal femur. X-ray shows a lytic lesion with a \"sunburst\" appearance and Codman's triangle. What is the MOST LIKELY diagnosis?**\nA) Osteosarcoma\nB) Ewing's sarcoma\nC) Giant cell tumor\nD) Osteochondroma\n\n**Answer: A** — **Osteosarcoma**—classic metaphyseal location, sunburst periosteal reaction, and Codman's triangle.\n\n---\n\n### Q53. \n**A 55-year-old male presents with a tense right-sided chest, absent breath sounds, and tracheal deviation to the left after a penetrating injury. What is the SINGLE BEST immediate management?**\nA) Needle decompression (2nd intercostal space, mid-clavicular)\nB) Chest tube insertion (5th intercostal space, mid-axillary)\nC) Thoracotomy\nD) Oxygen therapy\n\n**Answer: A** — **Tension pneumothorax**—immediate **needle decompression** before waiting for imaging or setting up a chest tube.\n\n---\n\n### Q54. \n**A 60-year-old male with Barrett's esophagus presents with progressive dysphagia. Biopsy shows adenocarcinoma. What is the SINGLE MOST important risk factor?**\nA) Smoking\nB) Chronic GERD\nC) H. pylori\nD) Alcohol\n\n**Answer: B** — **Esophageal adenocarcinoma**—develops sequentially from **Chronic GERD** → Barrett's esophagus → dysplasia → adenocarcinoma.\n\n---\n\n### Q55. \n**A 45-year-old female undergoes a total thyroidectomy for goiter. Post-operatively, she develops hoarseness of voice and stridor. What is the MOST LIKELY nerve injured?**\nA) Recurrent laryngeal nerve\nB) Superior laryngeal nerve (external branch)\nC) Hypoglossal nerve\nD) Phrenic nerve\n\n**Answer: A** — **Recurrent laryngeal nerve injury** → unilateral injury causes hoarseness, bilateral causes severe stridor.\n\n---\n\n### Q56. \n**A 65-year-old female presents with bone pain, renal stones, and hypercalcemia. Serum PTH is elevated. What is the SINGLE BEST definitive management?**\nA) Parathyroidectomy\nB) Cinacalcet\nC) Bisphosphonates\nD) Calcium supplementation\n\n**Answer: A** — **Primary hyperparathyroidism** with end-organ symptoms (stones, bones) → **parathyroidectomy**.\n\n---\n\n### Q57. \n**A 25-year-old male presents after a motor vehicle accident with left upper quadrant pain, hypotension, and peritoneal signs. FAST ultrasound shows free fluid in the splenorenal recess. What is the SINGLE BEST management?**\nA) Observation with serial Hct\nB) Emergency laparotomy and splenectomy\nC) Angioembolization\nD) Corticosteroids\n\n**Answer: B** — **Hemodynamically unstable splenic injury** → demands immediate **laparotomy/splenectomy**.\n\n---\n\n### Q58. \n**A 2-year-old male presents with a painless, massive lower gastrointestinal bleed. A technetium-99m pertechnetate scan shows a focal area of uptake in the right lower quadrant. What is the MOST LIKELY diagnosis?**\nA) Meckel's diverticulum\nB) Intussusception\nC) Appendicitis\nD) Angiodysplasia\n\n**Answer: A** — **Meckel's diverticulum**—ectopic gastric mucosa bleeds painlessly and lights up on a Meckel's scan.\n\n---\n\n### Q59. \n**A 2-year-old child with chronic constipation and abdominal distension. Barium enema shows a transition zone at the rectosigmoid junction. What is the SINGLE BEST diagnostic test?**\nA) Abdominal X-ray\nB) Suction rectal biopsy\nC) Manometry\nD) CT scan\n\n**Answer: B** — **Hirschsprung's disease**—**suction rectal biopsy** is the gold standard (revealing absent ganglion cells in the submucosal plexus).\n\n---\n\n### Q60. \n**A 45-year-old male presents with a painful, swollen, fluctuant mass in the perianal region. He has a fever of 38.5°C. What is the SINGLE BEST treatment?**\nA) Antibiotics alone\nB) Incision and drainage\nC) Fistulectomy\nD) Conservative management\n\n**Answer: B** — **Anorectal abscess**—immediate **incision and drainage** is definitive. Antibiotics alone are insufficient.\n\n---\n\n### Q61. \n**A 50-year-old male presents with bleeding per rectum. Proctoscopy shows 2nd-degree internal hemorrhoids. What is the MOST APPROPRIATE outpatient management?**\nA) Rubber band ligation\nB) Sclerotherapy\nC) Hemorrhoidectomy\nD) Dietary modification + topical creams\n\n**Answer: A** — **Grade II internal hemorrhoids**—**rubber band ligation** is the highly effective treatment of choice.\n\n---\n\n### Q62. \n**A 55-year-old male presents with swelling in the left groin that is reducible, and on examination, it originates lateral to the pubic tubercle and descends into the scrotum. What is the MOST LIKELY diagnosis?**\nA) Femoral hernia\nB) Direct inguinal hernia\nC) Indirect inguinal hernia\nD) Obturator hernia\n\n**Answer: C** — **Indirect inguinal hernia**—passes through the deep ring (lateral to inferior epigastrics) and pubic tubercle, descending into the scrotum.\n\n---\n\n### Q63. \n**A 60-year-old female presents with a painless breast lump that is fixed to the chest wall. Biopsy shows invasive ductal carcinoma. What is the SINGLE MOST important prognostic factor?**\nA) Tumor size\nB) Axillary lymph node status\nC) HER2 status\nD) ER/PR status\n\n**Answer: B** — **Axillary lymph node status** is the single most powerful prognostic indicator for survival in early-stage breast cancer.\n\n---\n\n### Q64. \n**A 70-year-old male with a history of smoking presents with a painless, hard neck mass in the posterior triangle. Biopsy shows squamous cell carcinoma. What is the MOST LIKELY primary site?**\nA) Nasopharynx\nB) Tonsil/base of tongue\nC) Lung\nD) Esophagus\n\n**Answer: B** — **Head and neck SCC**—the tonsils and base of the tongue are the most common occult primary sites for cervical lymphatic metastasis.\n\n---\n\n### Q65. \n**A 35-year-old male presents with a painful, swollen right wrist after a fall on an outstretched hand. X-ray shows a displaced fracture of the distal radius with dorsal angulation (dinner fork deformity). What is the SINGLE BEST treatment?**\nA) Cast immobilization\nB) Closed reduction and cast\nC) ORIF\nD) External fixation\n\n**Answer: B** — **Colles' fracture**—if uncomplicated, **closed reduction and cast application** is the standard treatment.\n\n---\n\n### Q66. \n**A 25-year-old male presents with a painless swelling of the upper outer thigh since childhood. Ultrasound shows a cyst containing hair, teeth, and sebaceous material. What is the MOST LIKELY diagnosis?**\nA) Lipoma\nB) Dermoid cyst\nC) Sebaceous cyst\nD) Epidermoid cyst\n\n**Answer: B** — **Dermoid cyst** (Teratoma)—a congenital lesion containing ectodermal/mesodermal derivatives (hair, teeth, sebum).\n\n---\n\n### Q67. \n**A 40-year-old male presents with acute scrotal pain and swelling. Examination reveals a localized tender nodule at the upper pole of the testis with a \"blue dot\" sign visible through the skin. What is the MOST LIKELY diagnosis?**\nA) Testicular torsion\nB) Torsion of the testicular appendage\nC) Epididymitis\nD) Varicocele\n\n**Answer: B** — **Torsion of testicular appendage (Hydatid of Morgagni)**—classic \"blue dot\" sign indicating infarction.\n\n---\n\n### Q68. \n**A 50-year-old male with varicose veins presents with a positive Trendelenburg test (rapid venous filling from above upon release of the tourniquet). What does this indicate?**\nA) Deep venous incompetence\nB) Saphenofemoral junction incompetence\nC) Perforator incompetence\nD) Arteriovenous fistula\n\n**Answer: B** — **Trendelenburg test**—rapid retrograde filling from above confirms **Saphenofemoral junction (SFJ) incompetence**.\n\n---\n\n### Q69. \n**A 55-year-old male presents with a non-healing ulcer over the lateral malleolus. The ulcer is punched-out, painful, with a pale, necrotic base. Foot pulses are absent. What is the MOST LIKELY diagnosis?**\nA) Venous ulcer\nB) Arterial ulcer\nC) Neuropathic ulcer\nD) Pressure ulcer\n\n**Answer: B** — **Arterial ischemic ulcer**—lateral malleolus location, punched-out borders, severe pain, and pale base.\n\n---\n\n### Q70. \n**A 45-year-old female presents with a rapidly growing breast mass. Ultrasound shows a well-circumscribed, hypoechoic lesion with a leaf-like architecture. What is the MOST LIKELY diagnosis?**\nA) Fibroadenoma\nB) Phyllodes tumor\nC) Lipoma\nD) Hamartoma\n\n**Answer: B** — **Phyllodes tumor**—a large, rapid-growing fibroepithelial tumor with a classic leaf-like (phyllodes) architecture.\n\n---\n\n### Q71. \n**A 30-year-old male athlete presents with a swollen, painful knee and a \"pop\" sound after a pivoting injury. MRI shows a completely torn ACL. What is the SINGLE BEST management?**\nA) Conservative physical therapy\nB) Arthroscopic ACL reconstruction\nC) Knee bracing for 6 months\nD) Meniscectomy\n\n**Answer: B** — **ACL tear** in a young, active patient—**arthroscopic reconstruction** is indicated to restore stability and prevent early osteoarthritis.\n\n---\n\n### Q72. \n**A 60-year-old male presents with a painless, rock-hard lump in the scrotum that does not transilluminate. What is the SINGLE BEST initial investigation?**\nA) Scrotal ultrasound\nB) Inguinal orchiectomy\nC) Fine needle aspiration (FNAC)\nD) Tumor markers\n\n**Answer: A** — **Testicular tumor suspicion**—**ultrasound** differentiates solid from cystic masses. (Never perform FNAC due to seeding risk).\n\n---\n\n# SECTION C — OBSTETRICS & GYNECOLOGY (36 Questions)\n\n---\n\n### Q73. \n**A 28-year-old primigravida at 36 weeks with pre-eclampsia develops a generalized tonic-clonic seizure. What is the FIRST-LINE drug for acute seizure control and prevention of recurrence?**\nA) Lorazepam\nB) Magnesium sulfate\nC) Phenytoin\nD) Diazepam\n\n**Answer: B** — **Eclampsia**—**Magnesium sulfate** IV is unequivocally first-line (loading dose 4g, maintenance 1-2g/h).\n\n---\n\n### Q74. \n**A 32-year-old female immediately after vaginal delivery has continuous vaginal bleeding and a boggy uterus. Uterine massage and oxytocin are given, but bleeding continues. What is the SINGLE BEST next step?**\nA) Misoprostol\nB) Bimanual compression\nC) Bakri balloon tamponade\nD) Hysterectomy\n\n**Answer: B** — **Primary Postpartum Hemorrhage (Uterine atony)**—after oxytocin and fundal massage fail, prompt **bimanual compression** is the immediate physical next step.\n\n---\n\n### Q75. \n**A 35-year-old multipara at 40 weeks presents with acute severe abdominal pain during labor. The fetal heart rate drops, and the uterus is contracting abnormally with a visible Bandl's ring. She has a previous C-section scar. What is the MOST LIKELY diagnosis?**\nA) Uterine rupture\nB) Placental abruption\nC) Cord prolapse\nD) Amniotic fluid embolism\n\n**Answer: A** — **Uterine rupture**—the presence of a previous scar, pathological retraction ring (Bandl's), acute tearing pain, and sudden fetal distress are diagnostic.\n\n---\n\n### Q76. \n**A 30-year-old female in active labor suddenly develops severe dyspnea, cyanosis, profound hypotension, and cardiac arrest. Blood is seen oozing from her IV site. What is the MOST LIKELY cause?**\nA) Amniotic fluid embolism\nB) Pulmonary embolism\nC) Uterine rupture\nD) Anaphylaxis\n\n**Answer: A** — **Amniotic fluid embolism**—classic catastrophic triad of hypoxia, hemodynamic collapse, and sudden DIC.\n\n---\n\n### Q77. \n**A 29-year-old primigravida at 38 weeks is in active labor. The fetal head delivers but retracts tightly against the perineum (\"turtle sign\"). What is the FIRST maneuver to perform?**\nA) McRoberts' maneuver\nB) Woods' screw\nC) Rubin's maneuver\nD) Suprapubic pressure\n\n**Answer: A** — **Shoulder dystocia**—**McRoberts' maneuver** (sharp hyperflexion of maternal thighs) paired with suprapubic pressure is the first-line intervention.\n\n---\n\n### Q78. \n**A 26-year-old primigravida at 32 weeks has a twin pregnancy (diamniotic dichorionic). She presents with a sudden gush of fluid and confirmed premature rupture of membranes. She is afebrile with reassuring fetal tones. What is the MOST APPROPRIATE management?**\nA) Immediate delivery\nB) Expectant management with corticosteroids\nC) Tocolysis\nD) Antibiotics alone\n\n**Answer: B** — **Preterm PROM** with twins—if no signs of chorioamnionitis or fetal distress, **expectant management + corticosteroids** for lung maturity is the standard of care.\n\n---\n\n### Q79. \n**A 30-year-old female at 34 weeks is diagnosed with severe IUGR. Umbilical artery Doppler shows absent end-diastolic flow. What is the MOST APPROPRIATE management?**\nA) Immediate delivery\nB) Conservative management with bi-weekly fetal surveillance\nC) Antenatal corticosteroids + prompt delivery\nD) Bed rest and maternal hyperoxygenation\n\n**Answer: C** — **Severe IUGR with AEDF**—indicates impending fetal demise. Administer **corticosteroids** and proceed to **prompt delivery**.\n\n---\n\n### Q80. \n**A 28-year-old female at 28 weeks is diagnosed with gestational diabetes. Fasting glucose is 110 mg/dL, and 1-hour postprandial is 160 mg/dL. What is the FIRST-LINE treatment?**\nA) Metformin\nB) Insulin\nC) Medical Nutrition Therapy (Diet/Lifestyle)\nD) Glyburide\n\n**Answer: C** — **GDM**—**Medical Nutrition Therapy / lifestyle modification** is strictly the first-line intervention before pharmacotherapy.\n\n---\n\n### Q81. \n**A 32-year-old pregnant woman with known Hashimoto's hypothyroidism is on levothyroxine. She is now at 8 weeks gestation. What should be done with her levothyroxine dose?**\nA) Continue the exact same dose\nB) Decrease the dose by 20%\nC) Increase the dose by 30-50%\nD) Stop medication until the second trimester\n\n**Answer: C** — **Hypothyroidism in pregnancy**—due to estrogen-induced increases in TBG, the levothyroxine dose must be **increased by 30-50%** immediately upon confirming pregnancy.\n\n---\n\n### Q82. \n**A 25-year-old female presents with severe acute pelvic pain, vaginal bleeding, and a positive pregnancy test. Transvaginal ultrasound shows an empty uterus and a 2.5 cm unruptured adnexal mass. Vital signs are completely stable. What is the SINGLE BEST management?**\nA) Laparoscopic salpingectomy\nB) Methotrexate\nC) Expectant management\nD) Laparotomy\n\n**Answer: B** — **Ectopic pregnancy**—in a hemodynamically stable patient with an unruptured mass <3.5 cm and no fetal cardiac activity, **Methotrexate** is the medical treatment of choice.\n\n---\n\n### Q83. \n**A 35-year-old female presents with a missed abortion at 10 weeks. She undergoes D&C. Histopathology shows placental villi with severe hydropic degeneration and circumferential trophoblastic proliferation. No fetal tissue is present. What is the most important follow-up?**\nA) Serial β-hCG levels\nB) Chest X-ray\nC) CT abdomen\nD) Thyroid function tests\n\n**Answer: A** — **Complete Hydatidiform Mole**—carries a high risk of malignant transformation (choriocarcinoma); rigorous follow-up with **serial β-hCG** is mandatory for at least 6 months.\n\n---\n\n### Q84. \n**A 45-year-old female presents with postmenopausal bleeding. Endometrial biopsy shows complex atypical hyperplasia. She has completed her family. What is the SINGLE BEST management?**\nA) High-dose progestin therapy\nB) Total hysterectomy\nC) Hysteroscopy with endometrial ablation\nD) Observation\n\n**Answer: B** — **Complex atypical hyperplasia**—carries a ~30% risk of concurrent endometrial carcinoma; **hysterectomy** is the definitive treatment.\n\n---\n\n### Q85. \n**A 60-year-old female presents with a feeling of something coming out of the vagina. Examination shows the cervix is at the introitus but the uterus is completely everted and hanging outside the vulva. What is the POP-Q stage?**\nA) Stage I\nB) Stage II\nC) Stage III\nD) Stage IV\n\n**Answer: D** — **Pelvic Organ Prolapse**—total procidentia (uterus completely outside the hymen/vulva) is classified as **Stage IV**.\n\n---\n\n### Q86. \n**A 52-year-old female with severe menopausal vasomotor symptoms is considering hormone replacement therapy (HRT). What is the SINGLE MOST important absolute contraindication?**\nA) Osteoporosis\nB) History of breast cancer\nC) Hot flashes\nD) Vaginal atrophy\n\n**Answer: B** — **HRT**—an established history of hormone-receptor-positive malignancies, especially **breast cancer**, is an absolute contraindication.\n\n---\n\n### Q87. \n**A 30-year-old female with a history of recurrent PID presents with chronic pelvic pain and infertility. Hysterosalpingogram reveals bilateral large hydrosalpinges. What is the MOST APPROPRIATE fertility treatment?**\nA) In vitro fertilization (IVF)\nB) Tubal reconstructive surgery\nC) Ovarian stimulation with letrozole\nD) Intrauterine insemination (IUI)\n\n**Answer: A** — **Bilateral hydrosalpinx**—tubal architecture is destroyed; **IVF** (often preceded by salpingectomy to prevent fluid toxicity to embryos) is the only viable option.\n\n---\n\n### Q88. \n**A 28-year-old female with PCOS presents with highly irregular periods and facial hirsutism. She is not currently trying to conceive. What is the FIRST-LINE medical therapy for long-term management?**\nA) Metformin\nB) Combined oral contraceptives (COCs)\nC) Spironolactone\nD) Clomiphene\n\n**Answer: B** — **PCOS**—**COCs** correct menstrual irregularity, provide endometrial protection, and increase SHBG (which decreases free testosterone, treating hirsutism).\n\n---\n\n### Q89. \n**A 25-year-old female presents with purulent vaginal discharge, severe cervical motion tenderness, and fever. What is the MOST APPROPRIATE empiric outpatient treatment?**\nA) Azithromycin alone\nB) Doxycycline + Ceftriaxone\nC) Metronidazole alone\nD) Erythromycin\n\n**Answer: B** — **Pelvic Inflammatory Disease (PID)**—empiric therapy must cover N. gonorrhoeae and C. trachomatis. **Ceftriaxone (IM) + Doxycycline (PO)** is the gold standard regimen.\n\n---\n\n### Q90. \n**A 30-year-old female at 38 weeks presents with a fetus in breech presentation. She desires a trial of vaginal delivery. What is the MOST IMPORTANT anatomical prerequisite for a safe vaginal breech delivery?**\nA) Fetal weight >4000g\nB) Flexed fetal head\nC) Footling breech presentation\nD) Multiparity\n\n**Answer: B** — **Breech vaginal delivery**—a **flexed head** is absolutely required to prevent head entrapment. Deflexed/hyperextended heads and footling breeches are strict contraindications.\n\n---\n\n### Q91. \n**A 25-year-old female presents with massive postpartum hemorrhage immediately following a normal vaginal delivery. The placenta was delivered via strong cord traction. On examination, the uterine fundus is absent abdominally, and a pear-shaped, bleeding mass is protruding from the vagina. What is the SINGLE BEST immediate maneuver?**\nA) Intravenous Oxytocin bolus\nB) Johnson maneuver (manual repositioning)\nC) Immediate hysterectomy\nD) Bakri balloon insertion\n\n**Answer: B** — **Uterine Inversion**—cord traction on an uncontracted uterus causes inversion. The **Johnson maneuver** (pushing the fundus upward through the vagina) must be performed immediately before the cervical ring constricts.\n\n---\n\n### Q92. \n**A 28-year-old female with a history of painless, mid-trimester cervical dilation resulting in two second-trimester losses is now 14 weeks pregnant. Ultrasound shows a cervical length of 18 mm. What is the SINGLE BEST management?**\nA) Cervical cerclage (McDonald procedure)\nB) Intramuscular progesterone supplementation\nC) Strict bed rest\nD) Indomethacin\n\n**Answer: A** — **Cervical incompetence/insufficiency**—a prophylactic **cervical cerclage** placed at 12-14 weeks is highly effective for patients with this classic history.\n\n---\n\n### Q93. \n**A 35-year-old female presents with a painful, swollen, wedge-shaped erythematous area on her left breast, accompanied by a fever of 39°C. She is currently breastfeeding. What is the MOST APPROPRIATE antibiotic choice?**\nA) Amoxicillin-clavulanate / Flucloxacillin\nB) Cephalexin\nC) Clindamycin\nD) Fluconazole\n\n**Answer: A** — **Lactational Mastitis** (S. aureus)—**Amoxicillin-clavulanate** or flucloxacillin is the treatment of choice. The patient must be encouraged to continue breastfeeding/pumping to drain the segment.\n\n---\n\n### Q94. \n**A 30-year-old female at 34 weeks presents with a sudden onset of severe abdominal pain, a \"board-like\" tense uterus, and dark vaginal bleeding. Fetal heart tracing shows recurrent late decelerations. What is the SINGLE BEST management?**\nA) Emergency cesarean section\nB) Vaginal delivery\nC) Tocolytic therapy with nifedipine\nD) Expectant management\n\n**Answer: A** — **Placental abruption** with clear signs of fetal distress mandates an **emergency cesarean section**.\n\n---\n\n### Q95. \n**A 45-year-old female presents with a rapidly growing pelvic mass. Ultrasound shows a complex, multiloculated cystic mass with irregular solid excrescences. CA-125 is 420 U/mL. What is the MOST LIKELY diagnosis?**\nA) Ovarian cystadenoma\nB) Ovarian carcinoma\nC) Endometrioma\nD) Dermoid cyst\n\n**Answer: B** — **Ovarian carcinoma**—complex architecture (solid + cystic components) in a perimenopausal woman with highly elevated CA-125 is the classic presentation.\n\n---\n\n### Q96. \n**A 32-year-old female at 37 weeks is in active labor. The fetal heart rate suddenly drops to 80 bpm and remains there for 5 minutes despite maternal position change, oxygen, and fluid bolus. What is the SINGLE BEST immediate action?**\nA) Continue monitoring for another 10 minutes\nB) Amniotomy to check for meconium\nC) Emergency cesarean section\nD) Oxytocin augmentation\n\n**Answer: C** — **Prolonged decelerations** (>3 minutes) indicating severe, uncorrectable fetal hypoxia require immediate **emergency C-section**.\n\n---\n\n### Q97. \n**A 26-year-old primigravida at 30 weeks presents with a severe frontal headache, visual scotomas, and epigastric pain. BP 170/110, proteinuria 4+. What is the SINGLE BEST definitive treatment?**\nA) Continuous Magnesium sulfate infusion\nB) Delivery of the fetus\nC) Oral Labetalol\nD) Strict bed rest\n\n**Answer: B** — **Severe pre-eclampsia**—while MgSO4 prevents seizures and BP meds prevent stroke, the only *definitive* cure for the disease is **delivery of the placenta/fetus**.\n\n---\n\n### Q98. \n**A 28-year-old female presents with a history of recurrent first-trimester pregnancy loss. Hysteroscopy reveals a thick, avascular band dividing the uterine cavity. What is the MOST APPROPRIATE management?**\nA) Hysteroscopic metroplasty (septum resection)\nB) Cervical cerclage\nC) High-dose Progesterone\nD) Low-dose Aspirin\n\n**Answer: A** — **Uterine septum**—the most common Müllerian anomaly causing recurrent miscarriage. **Hysteroscopic resection** restores normal cavity anatomy and drastically improves live birth rates.\n\n---\n\n### Q99. \n**A 35-year-old female at 32 weeks with twins presents with regular painful contractions and cervical dilation of 3 cm. What is the TOCOLYSIS of choice to delay delivery for 48 hours to administer corticosteroids?**\nA) Nifedipine\nB) Atosiban\nC) Indomethacin\nD) Terbutaline\n\n**Answer: A** — **Preterm labor**—**Nifedipine** (calcium channel blocker) is the first-line tocolytic due to its high efficacy and low maternal side-effect profile.\n\n---\n\n### Q100. \n**A 40-year-old female presents with persistent post-coital bleeding. A Pap smear is performed and shows High-Grade Squamous Intraepithelial Lesion (HSIL). What is the SINGLE BEST next step?**\nA) Colposcopy with directed biopsy\nB) Loop Electrosurgical Excision Procedure (LEEP)\nC) HPV DNA typing\nD) Repeat Pap smear in 6 months\n\n**Answer: A** — **HSIL**—carries a high risk of underlying CIN 2/3 or invasive cancer; immediate **colposcopy** is mandatory.\n\n---\n\n### Q101. \n**A 30-year-old female at 28 weeks is diagnosed with fatigue. Labs show Hb 8.5 g/dL, MCV 72 fL, and serum ferritin 8 ng/mL. She tolerates oral medications well. What is the SINGLE BEST management?**\nA) Oral ferrous sulfate + vitamin C\nB) IV iron sucrose\nC) Blood transfusion\nD) Folate supplementation\n\n**Answer: A** — **Iron deficiency anemia**—**oral iron** is first-line. IV iron is reserved for severe anemia, malabsorption, or complete intolerance to oral preparations.\n\n---\n\n### Q102. \n**A 28-year-old female with a history of PCOS presents with primary infertility. Her BMI is 29, and prolactin is normal. Semen analysis is normal. What is the SINGLE BEST drug to induce ovulation?**\nA) Clomiphene citrate\nB) Letrozole\nC) Metformin\nD) Gonadotropins\n\n**Answer: B** — **PCOS Infertility**—**Letrozole** (aromatase inhibitor) has replaced clomiphene as the superior first-line agent for ovulation induction, yielding higher live birth rates and fewer multiple pregnancies.\n\n---\n\n### Q103. \n**A 45-year-old female presents with heavy menstrual bleeding affecting her quality of life. Ultrasound shows a 4 cm intramural fibroid. She does not desire surgery. What is the SINGLE BEST first-line medical management?**\nA) Tranexamic acid + NSAIDs\nB) GnRH agonists\nC) Ulipristal acetate\nD) Danazol\n\n**Answer: A** — **Menorrhagia secondary to fibroids**—**tranexamic acid (antifibrinolytic) + NSAIDs** are the standard first-line medical therapy for symptomatic relief.\n\n---\n\n### Q104. \n**A 32-year-old female at 20 weeks undergoes a routine anomaly scan. She has had no bleeding. Ultrasound shows a low-lying placenta reaching within 1 cm of the internal os. What is the SINGLE BEST plan?**\nA) Elective cesarean scheduling at 38 weeks\nB) Repeat ultrasound surveillance at 32 weeks\nC) Strict bed rest for the remainder of pregnancy\nD) Immediate hospitalization\n\n**Answer: B** — **Low-lying placenta** at 20 weeks—the majority will migrate upward due to lower uterine segment formation (trophotropism). **Repeat the scan at 32 weeks**.\n\n---\n\n### Q105. \n**A 25-year-old female presents with primary amenorrhea, a webbed neck, widely spaced nipples, and a broad chest. Ultrasound reveals streak ovaries. What is the SINGLE BEST karyotype to confirm the diagnosis?**\nA) 45,XO\nB) 47,XXY\nC) 46,XX\nD) 46,XY\n\n**Answer: A** — **Turner syndrome**—classic clinical features correlate with the **45,XO** karyotype.\n\n---\n\n### Q106. \n**A 65-year-old female with a history of obesity and diabetes is diagnosed with endometrial adenocarcinoma. She undergoes a total hysterectomy with bilateral salpingo-oophorectomy. What is the MOST IMPORTANT prognostic factor?**\nA) Tumor grade\nB) Depth of myometrial invasion\nC) Lymph node metastasis\nD) FIGO Surgical Stage\n\n**Answer: D** — **Endometrial cancer**—while myometrial invasion dictates staging, the overall **FIGO Stage** remains the single most powerful predictor of survival.\n\n---\n\n### Q107. \n**A 28-year-old primigravida at 34 weeks presents with acute severe pre-eclampsia. Her BP is 180/115 mmHg. What is the FIRST-LINE acute antihypertensive?**\nA) Intravenous Labetalol or Hydralazine\nB) Oral Methyldopa\nC) Sublingual Nifedipine\nD) Intravenous Enalaprilat\n\n**Answer: A** — **Hypertensive crisis in pregnancy**—**IV Labetalol** or IV Hydralazine are the gold standards for rapid, safe blood pressure control. (Oral nifedipine is an alternative, but sublingual is contraindicated due to precipitous drops).\n\n---\n\n### Q108. \n**A 30-year-old female presents with a missed abortion at 12 weeks. She undergoes a routine suction curettage. In the immediate recovery room, she is tachycardic and hypotensive. What is the SINGLE MOST important post-operative monitoring priority?**\nA) Serum β-hCG\nB) Complete Blood Count\nC) Pelvic ultrasound\nD) Vital signs and assessment for uterine perforation/hemorrhage\n\n**Answer: D** — **Post-D&C complications**—tachycardia and hypotension immediately post-op highly suggest uterine perforation or massive concealed hemorrhage; **vital signs and physical assessment** are paramount.\n\n---\n\n# SECTION D — PATHOLOGY, PHARMACOLOGY & MICROBIOLOGY (36 Questions)\n\n---\n\n### Q109. [Image-Based — Histopathology]\n**A 45-year-old male with chronic liver disease and ascites. Liver biopsy (Image: extensive ballooning degeneration, eosinophilic Mallory-Denk bodies, and prominent neutrophilic infiltrate). What is the MOST LIKELY diagnosis?**\nA) Viral hepatitis\nB) Alcoholic steatohepatitis\nC) Non-alcoholic fatty liver disease\nD) Primary biliary cholangitis\n\n**Answer: B** — **Alcoholic hepatitis**—characterized classically by Mallory bodies, hepatocyte ballooning, and a PMN (neutrophilic) infiltrate.\n\n---\n\n### Q110. \n**A 55-year-old female presents with jaundice and highly elevated transaminases. She is diagnosed with Type 1 Autoimmune Hepatitis. Which autoantibody is MOST SPECIFIC for this condition?**\nA) Anti-smooth muscle antibody (SMA)\nB) Anti-mitochondrial antibody (AMA)\nC) Anti-LKM1\nD) Anti-SSA/SSB\n\n**Answer: A** — **Type 1 Autoimmune hepatitis**—characterized by ANA and **Anti-smooth muscle antibody (SMA)**.\n\n---\n\n### Q111. \n**A 25-year-old male presents with recurrent hemarthrosis. Labs show a significantly prolonged aPTT but a normal PT and normal bleeding time. What is the MOST LIKELY deficient factor?**\nA) Factor VIII\nB) Factor IX\nC) Factor XI\nD) Factor VII\n\n**Answer: A** — **Hemophilia A**—X-linked recessive deficiency of **Factor VIII**, leading to intrinsic pathway failure (prolonged aPTT).\n\n---\n\n### Q112. \n**A 40-year-old female presents with a lifelong history of heavy menstrual bleeding and mucosal epistaxis. Which laboratory finding is CHARACTERISTIC of her condition?**\nA) Prolonged PT and normal aPTT\nB) Prolonged bleeding time and decreased vWF antigen\nC) Increased platelet count and normal bleeding time\nD) Isolated Factor IX deficiency\n\n**Answer: B** — **von Willebrand Disease (vWD)**—deficiency of vWF impairs platelet adhesion (prolonged bleeding time) and destabilizes Factor VIII (prolonged aPTT).\n\n---\n\n### Q113. \n**A 30-year-old male in the ICU for Gram-negative sepsis develops diffuse oozing from IV sites. Labs show ↑PT, ↑aPTT, ↓fibrinogen, and ↑D-dimer. What is the SINGLE BEST fundamental management?**\nA) High-dose Heparin infusion\nB) Massive platelet transfusion\nC) Aggressive treatment of the underlying sepsis\nD) Tranexamic acid\n\n**Answer: C** — **Disseminated Intravascular Coagulation (DIC)**—DIC is always a secondary phenomenon; the only definitive treatment is to **treat the underlying cause** (sepsis, trauma, malignancy).\n\n---\n\n### Q114. \n**A 35-year-old male returns from a business trip to Sub-Saharan Africa with high-grade cyclical fever, chills, and severe anemia. Peripheral blood smear shows multiple fine ring forms inside RBCs and distinct banana-shaped gametocytes. What is the species?**\nA) Plasmodium vivax\nB) Plasmodium falciparum\nC) Plasmodium malariae\nD) Plasmodium ovale\n\n**Answer: B** — **P. falciparum**—the most severe form of malaria, uniquely characterized by **banana/crescent-shaped gametocytes**.\n\n---\n\n### Q115. \n**A 45-year-old male presents with high fever, severe retro-orbital headache, and a maculopapular rash. Tourniquet test is positive, platelet count is 60,000/μL, and hematocrit is 52%. What is the MOST LIKELY diagnosis?**\nA) Dengue Hemorrhagic Fever\nB) Malaria\nC) Typhoid Fever\nD) Chikungunya\n\n**Answer: A** — **Dengue**—classic presentation of severe bonebreak fever with capillary leak causing hemoconcentration (elevated Hct) and thrombocytopenia.\n\n---\n\n### Q116. \n**A 30-year-old female with chronic hepatitis B infection has a positive HBeAg, elevated ALT, and HBV DNA >20,000 IU/mL. What is the FIRST-LINE oral antiviral therapy?**\nA) Lamivudine\nB) Tenofovir\nC) Ribavirin\nD) Sofosbuvir\n\n**Answer: B** — **Chronic HBV**—**Tenofovir** (or Entecavir) is first-line due to potent viral suppression and a near-zero rate of viral resistance.\n\n---\n\n### Q117. \n**A 25-year-old male presents to the ER after being bitten by an unprovoked street dog. The bite on his calf drew blood. What is the MOST APPROPRIATE post-exposure management?**\nA) Wound washing + rabies vaccine series (day 0, 3, 7, 14, 28)\nB) Wound washing + Rabies Immunoglobulin (RIG) + rabies vaccine series\nC) Rabies vaccine alone\nD) Tetanus toxoid + antibiotics only\n\n**Answer: B** — **Category III Rabies exposure** (transdermal bite with bleeding) → immediate local wound care + active immunity (Vaccine) + passive immunity (**RIG infiltrated into the wound**).\n\n---\n\n### Q118. \n**A 50-year-old agricultural worker presents with a deep puncture wound to his foot. Seven days later, he develops severe jaw stiffness (trismus) and a sustained facial spasm (risus sardonicus). What is the SINGLE BEST pharmacological treatment triad?**\nA) Penicillin G alone\nB) Metronidazole + Tetanus Immunoglobulin (TIG) + Diazepam\nC) Tetanus toxoid + mechanical ventilation\nD) Doxycycline + Dantrolene\n\n**Answer: B** — **Tetanus**—Requires **Metronidazole** (eradicates C. tetani), **TIG** (neutralizes unbound toxin), and **Diazepam** (GABA agonist to control muscle spasms).\n\n---\n\n### Q119. \n**A 65-year-old male in the ICU on intravenous gentamicin for severe sepsis develops acute oliguric renal failure. Which is the MOST SPECIFIC early urinary marker of aminoglycoside-induced proximal tubular damage?**\nA) BUN\nB) Serum creatinine\nC) Urinary RBC casts\nD) Urinary beta-2 microglobulin\n\n**Answer: D** — **Aminoglycoside nephrotoxicity**—damages the proximal convoluted tubule, preventing reabsorption of low-molecular-weight proteins like **urinary β2-microglobulin**.\n\n---\n\n### Q120. \n**A 25-year-old female presents to the dermatology clinic for severe cystic acne. The physician considers prescribing oral minocycline. What is the MOST IMPORTANT contraindication to rule out before prescribing?**\nA) Pregnancy\nB) Penicillin allergy\nC) Renal failure\nD) Hepatic failure\n\n**Answer: A** — **Tetracyclines (Minocycline)**—absolutely contraindicated in **pregnancy** and children <8 years due to irreversible bone growth inhibition and permanent yellow-brown tooth discoloration.\n\n---\n\n### Q121. \n**A 30-year-old female with suspected Herpes Simplex Encephalitis is started on IV acyclovir. What is the specific mechanism of action that makes this drug selectively toxic to infected cells?**\nA) It requires initial phosphorylation by viral thymidine kinase before inhibiting DNA polymerase\nB) It directly inhibits viral RNA polymerase\nC) It blocks viral uncoating via the M2 protein\nD) It acts as a non-nucleoside reverse transcriptase inhibitor\n\n**Answer: A** — **Acyclovir**—a prodrug that is completely inactive until monophosphorylated specifically by **HSV/VZV thymidine kinase**, concentrating the active drug only in infected cells.\n\n---\n\n### Q122. \n**A 45-year-old neutropenic male with invasive pulmonary aspergillosis is started on intravenous Amphotericin B deoxycholate. Which adverse effect is MOST CHARACTERISTIC and requires aggressive IV hydration to mitigate?**\nA) Nephrotoxicity\nB) Hepatotoxicity\nC) Cardiotoxicity\nD) Irreversible ototoxicity\n\n**Answer: A** — **Amphotericin B (\"Ampho-terrible\")**—dose-limiting **nephrotoxicity** (causing severe hypokalemia, hypomagnesemia, and ATN) is almost universal.\n\n---\n\n### Q123. \n**A 55-year-old male recently diagnosed with pulmonary tuberculosis is started on the standard RIPE regimen (Rifampin, Isoniazid, Pyrazinamide, Ethambutol). Which supplement must be co-administered to prevent glove-and-stocking peripheral neuropathy?**\nA) Vitamin B12 (Cobalamin)\nB) Vitamin B6 (Pyridoxine)\nC) Vitamin B1 (Thiamine)\nD) Vitamin B9 (Folic acid)\n\n**Answer: B** — **Isoniazid (INH)**—causes increased excretion of **pyridoxine (B6)**, leading to peripheral neuropathy.\n\n---\n\n### Q124. \n**A 60-year-old male with acute decompensated heart failure is given a large IV bolus of furosemide. He experiences massive diuresis. What is the SINGLE MOST important electrolyte abnormality to monitor for?**\nA) Hyperkalemia\nB) Hypercalcemia\nC) Hypokalemia\nD) Hypernatremia\n\n**Answer: C** — **Loop diuretics**—inhibit the Na-K-2Cl symporter in the thick ascending limb, causing massive loss of potassium, leading to life-threatening **hypokalemia**.\n\n---\n\n### Q125. \n**A 70-year-old male with atrial fibrillation is on chronic warfarin therapy. His routine INR is 5.5. He has absolutely no signs of active bleeding. What is the SINGLE BEST management?**\nA) Hold warfarin entirely until INR is <3.0\nB) Hold one dose of warfarin and give oral vitamin K (1-2.5 mg)\nC) Hold warfarin and give IV vitamin K (10 mg)\nD) Administer Fresh Frozen Plasma (FFP) immediately\n\n**Answer: B** — **Warfarin reversal**—For INR between 4.5 and 10 with *no bleeding*, the standard of care is to hold the drug and administer a small dose of **oral vitamin K**.\n\n---\n\n### Q126. \n**A 45-year-old male who recently underwent PCI with stent placement is taking clopidogrel. Genetic testing reveals he is a CYP2C19 poor metabolizer. Which alternative P2Y12 inhibitor should be used to prevent stent thrombosis?**\nA) Aspirin\nB) Prasugrel or Ticagrelor\nC) Abciximab\nD) Dipyridamole\n\n**Answer: B** — **Clopidogrel resistance**—Clopidogrel is a prodrug requiring CYP2C19 activation. **Ticagrelor or Prasugrel** bypass this enzyme and are the correct alternatives.\n\n---\n\n### Q127. \n**A 30-year-old male undergoing general anesthesia suddenly develops severe muscle rigidity, tachycardia, and a rapid rise in core body temperature (40°C) immediately after succinylcholine administration. What is the SINGLE BEST pharmacological antidote?**\nA) Dantrolene\nB) Intravenous Diazepam\nC) Haloperidol\nD) Sodium bicarbonate\n\n**Answer: A** — **Malignant hyperthermia**—a ryanodine receptor mutation causing massive calcium release. **Dantrolene** directly blocks this calcium release.\n\n---\n\n### Q128. \n**A 45-year-old male camper presents with foul-smelling, fatty diarrhea and excessive flatulence. A fresh stool sample shows flagellated binucleate trophozoites with a characteristic \"falling leaf\" motility. What is the organism?**\nA) Entamoeba histolytica\nB) Giardia lamblia\nC) Cryptosporidium parvum\nD) Balantidium coli\n\n**Answer: B** — **Giardia**—transmitted via contaminated stream water; microscopically looks like an \"old man's face\" with \"falling leaf\" motility.\n\n---\n\n### Q129. \n**A 30-year-old male with a severe burn wound develops a hospital-acquired infection. The wound swab grows Gram-negative, oxidase-positive rods that produce a distinct blue-green pigment and a fruity odor. What is the organism?**\nA) Pseudomonas aeruginosa\nB) Klebsiella pneumoniae\nC) Proteus mirabilis\nD) Serratia marcescens\n\n**Answer: A** — **P. aeruginosa**—classic burn wound pathogen producing **pyocyanin** (blue-green) and pyoverdine.\n\n---\n\n### Q130. \n**A 60-year-old male with a history of severe alcohol use disorder presents with lobar pneumonia and \"currant jelly\" sputum. Sputum culture grows lactose-fermenting Gram-negative rods with a massive polysaccharide capsule, forming highly mucoid colonies. What is the MOST LIKELY organism?**\nA) Klebsiella pneumoniae\nB) Pseudomonas aeruginosa\nC) Haemophilus influenzae\nD) Streptococcus pneumoniae\n\n**Answer: A** — **Klebsiella pneumoniae**—classic presentation in alcoholics; the large capsule results in highly **mucoid colonies**.\n\n---\n\n### Q131. \n**A 25-year-old male suffers a deep crush injury in a farming accident. Three days later, the wound is extremely painful, necrotic, and exudes a foul-smelling brown fluid. Crepitus is palpable. Culture grows strict anaerobic Gram-positive rods. What is the MOST LIKELY organism?**\nA) Clostridium perfringens\nB) Clostridium tetani\nC) Bacillus anthracis\nD) Corynebacterium diphtheriae\n\n**Answer: A** — **Clostridium perfringens**—the causative agent of gas gangrene (clostridial myonecrosis); produces alpha-toxin (lecithinase).\n\n---\n\n### Q132. \n**A 19-year-old college student presents with her third episode of severe Neisseria meningitidis meningitis. She is suspected of having a primary immunodeficiency. Which specific complement component deficiency is MOST STRONGLY associated with this presentation?**\nA) C1 esterase inhibitor\nB) C2\nC) C3\nD) C5-C9 (membrane attack complex)\n\n**Answer: D** — **MAC deficiency (C5-C9)**—the membrane attack complex is critically required to lyse thick encapsulated Neisseria species.\n\n---\n\n### Q133. \n**A 55-year-old male presents with jaundice, splenomegaly, and a family history of anemia. Peripheral smear shows RBCs lacking central pallor. What is the SINGLE BEST diagnostic test to confirm the RBC membrane defect?**\nA) Osmotic fragility test\nB) Direct Coombs test\nC) Hemoglobin electrophoresis\nD) G6PD assay\n\n**Answer: A** — **Hereditary spherocytosis**—defect in ankyrin/spectrin makes RBCs spherical and rigid, causing them to lyse easily in hypotonic solutions (**increased osmotic fragility**).\n\n---\n\n### Q134. \n**A 65-year-old male presents with painless lymphadenopathy. CBC shows a WBC of 65,000/μL with 90% mature lymphocytes. Peripheral smear shows numerous \"smudge cells.\" What is the MOST characteristic flow cytometry immunophenotype?**\nA) CD5+, CD19+, CD23+\nB) CD3+, CD4+, CD8+\nC) CD13+, CD33+, CD117+\nD) CD20+, CD10+, CD19+\n\n**Answer: A** — **Chronic Lymphocytic Leukemia (CLL)**—a B-cell neoplasm that anomalously co-expresses the T-cell marker CD5 (**CD5+, CD19+, CD23+**).\n\n---\n\n### Q135. \n**A 45-year-old female with a breast mass undergoes biopsy. The pathology report confirms invasive ductal carcinoma. The oncologist notes the tumor is highly aggressive. Which of the following receptor profiles is associated with the WORST prognosis (most aggressive)?**\nA) ER positive, PR positive, HER2 negative\nB) ER negative, PR negative, HER2 negative (Triple Negative)\nC) ER positive, PR negative, HER2 positive\nD) Luminal A subtype\n\n**Answer: B** — **Triple-negative breast cancer** lacks targeted therapeutic options (hormonal or Herceptin) and carries the worst prognosis.\n\n---\n\n### Q136. \n**A 50-year-old male undergoes a hemicolectomy for a massive obstructing mass in the descending colon. Biopsy confirms adenocarcinoma. Which tumor marker is MOST USEFUL for monitoring post-operative recurrence?**\nA) CA 19-9\nB) Carcinoembryonic Antigen (CEA)\nC) AFP\nD) CA 125\n\n**Answer: B** — **Colorectal cancer**—**CEA** is not a screening tool but is the gold standard for tracking recurrence and response to therapy.\n\n---\n\n### Q137. \n**A 60-year-old male with chronic Hepatitis C cirrhosis develops a new 4 cm hyperechoic mass in the right lobe of the liver. Which serum tumor marker is MOST LIKELY to be highly elevated?**\nA) Alpha-fetoprotein (AFP)\nB) CA 19-9\nC) CEA\nD) CA 15-3\n\n**Answer: A** — **Hepatocellular Carcinoma (HCC)**—**AFP** is highly specific and sensitive in the context of known cirrhosis.\n\n---\n\n### Q138. \n**A 35-year-old female presents with a solitary thyroid nodule. She has a family history of MEN 2A syndrome. FNAC reveals malignant cells embedded in an amyloid stroma. What is the MOST LIKELY diagnosis?**\nA) Papillary thyroid carcinoma\nB) Follicular thyroid carcinoma\nC) Medullary thyroid carcinoma\nD) Anaplastic thyroid carcinoma\n\n**Answer: C** — **Medullary thyroid carcinoma**—arises from parafollicular C-cells, secretes calcitonin (forming amyloid stroma), and is strongly associated with MEN 2.\n\n---\n\n### Q139. \n**A 25-year-old male presents with a rapidly enlarging, painless testicular mass and severe hemoptysis. Chest X-ray shows multiple \"cannonball\" lung nodules. Serum β-hCG is >100,000 mIU/mL, while AFP is normal. Biopsy shows cytotrophoblasts and syncytiotrophoblasts without villi. What is the MOST LIKELY diagnosis?**\nA) Seminoma\nB) Yolk sac tumor\nC) Choriocarcinoma\nD) Teratoma\n\n**Answer: C** — **Choriocarcinoma**—highly malignant, secretes massive amounts of β-hCG, and spreads hematogenously very early (lungs/brain).\n\n---\n\n### Q140. \n**A 55-year-old male presents with vague upper abdominal pain and melena. Endoscopy reveals a 4 cm submucosal mass in the body of the stomach. Biopsy shows spindle cells. Immunohistochemistry is strongly positive for c-KIT (CD117). What is the MOST LIKELY diagnosis?**\nA) Gastric Adenocarcinoma\nB) Gastrointestinal Stromal Tumor (GIST)\nC) Gastric Lymphoma (MALToma)\nD) Carcinoid Tumor\n\n**Answer: B** — **GIST**—arises from the interstitial cells of Cajal; the defining molecular signature is the c-KIT (CD117) mutation, treatable with Imatinib.\n\n---\n\n### Q141. \n**A 40-year-old female presents with an erythematous, scaling, crusting lesion over the nipple and areola that looks like severe eczema. She has no palpable breast mass. Biopsy of the skin shows large cells with clear halos (mucicarmine positive) in the epidermis. What is the MOST LIKELY diagnosis?**\nA) Basal cell carcinoma\nB) Squamous cell carcinoma\nC) Melanoma\nD) Paget disease of the breast\n\n**Answer: D** — **Paget disease of the breast**—\"pagetoid\" spread of underlying ductal carcinoma cells into the nipple epidermis.\n\n---\n\n### Q142. \n**A 30-year-old male presents with ptosis, diplopia, and proximal muscle weakness that worsens throughout the day. Chest CT reveals an anterior mediastinal mass. What is the MOST LIKELY diagnosis of the mass?**\nA) Thymoma\nB) Lymphoma\nC) Seminoma\nD) Teratoma\n\n**Answer: A** — **Thymoma**—the patient has Myasthenia Gravis; up to 15% of MG patients have an underlying thymoma (the most common anterior mediastinal mass in adults).\n\n---\n\n### Q143. \n**A 30-year-old female presents with thick, white, \"cottage cheese\" vaginal discharge and severe vulvar pruritus. Vaginal pH is 4.0. Wet mount microscopy reveals budding yeast and pseudohyphae. What is the MOST LIKELY etiology?**\nA) Candida albicans\nB) Trichomonas vaginalis\nC) Gardnerella vaginalis\nD) Human Papillomavirus (HPV)\n\n**Answer: A** — **Vulvovaginal Candidiasis**—normal pH (<4.5), cottage cheese discharge, and pseudohyphae are diagnostic.\n\n---\n\n### Q144. \n**A 60-year-old male with a 40-pack-year smoking history presents with hemoptysis, weight loss, and severe hyponatremia. Chest X-ray shows a large central hilar mass. Biopsy shows sheets of small, dark blue cells with scant cytoplasm. Immunohistochemistry is positive for Chromogranin and Synaptophysin. What is the MOST LIKELY diagnosis?**\nA) Adenocarcinoma\nB) Small cell lung carcinoma\nC) Squamous cell carcinoma\nD) Large cell carcinoma\n\n**Answer: B** — **Small Cell Lung Carcinoma (SCLC)**—a central, highly aggressive neuroendocrine tumor strongly linked to smoking and paraneoplastic syndromes (SIADH causing hyponatremia).\n\n---\n\n# SECTION E — PEDIATRICS, COMMUNITY MEDICINE, FORENSIC, ENT, OPHTH, PSYCH, DERMA (36 Questions)\n\n---\n\n### Q145. \n**A 3-day-old neonate presents with lethargy, poor feeding, and hypothermia. Blood culture grows Group B Streptococcus. What is the SINGLE BEST empirical antibiotic regimen for neonatal sepsis?**\nA) Ampicillin + Gentamicin\nB) Cefotaxime + Ampicillin\nC) Vancomycin + Gentamicin\nD) Ceftriaxone alone\n\n**Answer: A** — **Neonatal sepsis**—**Ampicillin + Gentamicin** (or Ampicillin + Cefotaxime) broadly covers the \"Big Three\": GBS, E. coli, and Listeria monocytogenes. (Ceftriaxone is avoided in neonates due to biliary sludging/kernicterus).\n\n---\n\n### Q146. \n**A 5-day-old neonate with jaundice has a total bilirubin of 18 mg/dL with a direct bilirubin of 4.5 mg/dL. The infant has pale stools. What is the MOST LIKELY diagnosis?**\nA) Physiological jaundice\nB) Biliary atresia\nC) Breast milk jaundice\nD) G6PD deficiency\n\n**Answer: B** — **Conjugated (Direct) hyperbilirubinemia** (>1.0 mg/dL or >20% of total) is *never* physiological. Pale stools strongly point to an obstructive cause like **biliary atresia**.\n\n---\n\n### Q147. \n**A 2-year-old child presents with a harsh, holosystolic murmur at the left lower sternal border, a palpable thrill, and a loud S2. Echocardiography shows a ventricular septal defect. What is the MOST COMMON anatomical location for this defect?**\nA) Perimembranous\nB) Muscular\nC) Supracristal\nD) Inlet\n\n**Answer: A** — **VSD**—**perimembranous** defects account for roughly 80% of all ventricular septal defects.\n\n---\n\n### Q148. \n**A 4-year-old child with uncorrected Tetralogy of Fallot presents to the ER crying, deeply cyanotic, and tachypneic (a \"tet spell\"). What is the SINGLE BEST immediate physical maneuver?**\nA) Place the child in a knee-chest position\nB) Administer 100% Oxygen via face mask\nC) Administer IV Propranolol\nD) Perform emergency intubation\n\n**Answer: A** — **TOF hypercyanotic spell**—The **knee-chest position** instantly kinks the femoral arteries, increasing systemic vascular resistance (SVR), which forces blood back across the VSD into the pulmonary circulation.\n\n---\n\n### Q149. \n**A 28-week premature neonate develops a continuous \"machinery\" murmur at the left infraclavicular area, bounding peripheral pulses, and a widened pulse pressure. Echocardiography confirms a Patent Ductus Arteriosus (PDA). What is the pharmacological closure agent of choice?**\nA) Intravenous Indomethacin or Ibuprofen\nB) Prostaglandin E1 (Alprostadil)\nC) Oral Paracetamol\nD) Sildenafil\n\n**Answer: A** — **PDA in a premature infant**—**Indomethacin** or **Ibuprofen** (COX inhibitors) block prostaglandin synthesis, promoting ductal closure. (PGE1 keeps it *open*).\n\n---\n\n### Q150. \n**A 7-year-old child presents with fever, a migrating polyarthritis involving the knees and ankles, and an erythematous rash with pale centers (erythema marginatum). Carditis is suspected. These symptoms fulfill which specific diagnostic criteria?**\nA) Jones criteria\nB) Duke criteria\nC) Centor criteria\nD) Kawasaki criteria\n\n**Answer: A** — **Acute Rheumatic Fever**—diagnosed strictly using the revised **Jones criteria** (Evidence of preceding Strep + 2 Major, or 1 Major + 2 Minor criteria).\n\n---\n\n### Q151. \n**A 9-year-old boy presents with sudden-onset gross hematuria (cola-colored urine), periorbital edema, and hypertension 2 weeks after a severe sore throat. Labs show elevated ASO titers and profoundly low C3 levels. What is the MOST LIKELY diagnosis?**\nA) Post-Streptococcal Glomerulonephritis (PSGN)\nB) IgA Nephropathy\nC) Minimal Change Disease\nD) Membranous Nephropathy\n\n**Answer: A** — **PSGN**—classic nephritic syndrome 1-3 weeks post-strep pharyngitis, marked uniquely by **low C3 complement levels** that recover in 6-8 weeks.\n\n---\n\n### Q152. \n**A 2-month-old male infant presents with recurrent urinary tract infections and a poor urinary stream. Renal ultrasound shows severe bilateral hydronephrosis and a dilated, thick-walled bladder. What is the MOST LIKELY underlying cause?**\nA) Vesicoureteral reflux\nB) Posterior urethral valves\nC) Neurogenic bladder\nD) Ureterocele\n\n**Answer: B** — **Posterior urethral valves (PUV)**—an obstructing mucosal fold in the male urethra causing severe bladder outlet obstruction, bilateral hydroureteronephrosis, and oligohydramnios in utero.\n\n---\n\n### Q153. \n**A 6-month-old infant presents with sudden-onset colicky abdominal pain, drawing legs up to the chest, vomiting, and passing a \"currant jelly\" stool. Palpation reveals a sausage-shaped mass in the right upper quadrant. What is the SINGLE BEST non-operative management?**\nA) Air or contrast enema reduction\nB) Upper GI endoscopy\nC) Emergency exploratory laparotomy\nD) Gastric lavage\n\n**Answer: A** — **Intussusception**—an **air or hydrostatic (barium/saline) enema** serves as both the definitive diagnostic test and the first-line therapeutic reduction method.\n\n---\n\n### Q154. \n**A premature neonate (30 weeks gestation) on enteral feeds suddenly develops abdominal distension, bloody stools, and temperature instability. Abdominal X-ray shows pneumatosis intestinalis (air within the bowel wall). What is the MOST LIKELY diagnosis?**\nA) Meconium ileus\nB) Necrotizing enterocolitis (NEC)\nC) Duodenal atresia\nD) Malrotation with volvulus\n\n**Answer: B** — **Necrotizing Enterocolitis (NEC)**—classic presentation in a premature, formula-fed infant with the pathognomonic radiological sign of **pneumatosis intestinalis**.\n\n---\n\n### Q155. \n**A 30-year-old female presents with a 6-month history of severely depressed mood, anhedonia, 10-pound weight loss, and early morning awakening. She has no history of manic episodes. What is the universally accepted FIRST-LINE pharmacological treatment class for her condition?**\nA) Selective Serotonin Reuptake Inhibitor (e.g., Fluoxetine, Escitalopram)\nB) Tricyclic Antidepressant (e.g., Amitriptyline)\nC) Monoamine Oxidase Inhibitor (e.g., Phenelzine)\nD) Typical Antipsychotic (e.g., Haloperidol)\n\n**Answer: A** — **Major Depressive Disorder**—**SSRIs** (Fluoxetine, Sertraline, Escitalopram) are first-line due to their excellent efficacy and safety/tolerability profile compared to older TCAs.\n\n---\n\n### Q156. \n**A 25-year-old male presents with recurrent, intrusive thoughts about contamination. He washes his hands 40 times a day, causing his skin to crack and bleed. This consumes >3 hours of his day. What is the SINGLE BEST first-line pharmacological treatment?**\nA) Clomipramine or SSRI\nB) Lithium\nC) Haloperidol\nD) Diazepam\n\n**Answer: A** — **Obsessive-Compulsive Disorder (OCD)**—Treatment consists of CBT (exposure and response prevention) plus high-dose SSRIs (Fluoxetine, Fluvoxamine) or the highly serotonergic TCA **Clomipramine**.\n\n---\n\n### Q157. \n**A 35-year-old female survived a severe car crash 3 months ago. She presents with recurrent, intrusive flashback memories of the event, nightmares, hypervigilance, and avoids driving entirely. What is the MOST LIKELY diagnosis?**\nA) Post-Traumatic Stress Disorder (PTSD)\nB) Acute Stress Disorder\nC) Generalized Anxiety Disorder\nD) Panic Disorder\n\n**Answer: A** — **PTSD**—symptoms persist for **>1 month** following a life-threatening trauma. (If <1 month, it is Acute Stress Disorder).\n\n---\n\n### Q158. \n**A 20-year-old female presents with secondary amenorrhea, a BMI of 16.5, and an intense fear of gaining weight. She exercises 4 hours a day and induces vomiting after meals. She has fine lanugo hair on her back. What is the MOST LIKELY diagnosis?**\nA) Anorexia nervosa (binge-eating/purging type)\nB) Bulimia nervosa\nC) Binge eating disorder\nD) Avoidant/restrictive food intake disorder\n\n**Answer: A** — **Anorexia nervosa**—differentiated from bulimia strictly by the low body weight (BMI <18.5) and severe starvation symptoms (amenorrhea, lanugo).\n\n---\n\n### Q159. \n**A 45-year-old male with chronic, heavy alcohol use is admitted for pancreatitis. 48 hours into his admission, he develops severe tremors, diaphoresis, tachycardia, and visual hallucinations (seeing spiders on the wall). What is the SINGLE BEST pharmacological management?**\nA) Intravenous Diazepam or Lorazepam\nB) Intravenous Thiamine alone\nC) Intramuscular Haloperidol\nD) Oral Phenytoin\n\n**Answer: A** — **Delirium Tremens (Severe Alcohol Withdrawal)**—**Benzodiazepines** (chlordiazepoxide, diazepam, or lorazepam if liver impaired) are the gold standard to prevent seizures and death.\n\n---\n\n### Q160. [Forensic]\n**A dead body is found suspended by a rope. Autopsy reveals a ligature mark around the neck that is obliquely placed, highest at the knot site, and does not completely encircle the neck. The tongue is protruded. What is the MOST LIKELY cause of death?**\nA) Suicidal Hanging\nB) Ligature Strangulation (Homicide)\nC) Throttling (Manual strangulation)\nD) Smothering\n\n**Answer: A** — **Hanging**—The ligature mark is classically **oblique, non-continuous, and placed high up on the neck** near the mandible. (In strangulation, the mark is transv
