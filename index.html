arries a balanced reciprocal chromosomal translocation. She desperately wants a biological child. What is the SINGLE BEST technological intervention to ensure a viable, genetically normal pregnancy?**\nA) In Vitro Fertilization (IVF) coupled with Preimplantation Genetic Testing for Structural Rearrangements (PGT-SR)\nB) Intrauterine Insemination (IUI) with aggressive luteal phase progesterone\nC) Surrogacy using a donor egg\nD) Empiric therapy with Low Molecular Weight Heparin and low-dose Aspirin\n\n**Answer: A** — **Balanced Translocation causing recurrent miscarriage**—The patient produces a high percentage of unbalanced, non-viable gametes. **IVF with PGT-SR** allows embryologists to screen and transfer only the chromosomally balanced/normal embryos, practically eliminating the miscarriage risk.\n\n---\n\n### Q97. \n**A 36-year-old female, gravida 4, para 3 (all previous cesarean sections), presents at 34 weeks gestation. A specialized color Doppler ultrasound definitively reveals the placenta completely covering the cervical os, with massive hypervascularity and loss of the normal hypoechoic retroplacental myometrial zone, with vessels invading the bladder wall. What is the SINGLE BEST, life-saving delivery strategy?**\nA) Planned scheduled Cesarean hysterectomy at 34-35 weeks without attempting placental removal\nB) Trial of labor after cesarean (TOLAC) with blood cross-matched on standby\nC) Elective classical Cesarean section followed by aggressive manual extraction of the placenta\nD) Methotrexate injection into the umbilical cord followed by delayed vaginal delivery\n\n**Answer: A** — **Placenta Percreta (Severe Placenta Accreta Spectrum)**—Attempting to detach an abnormally invasive placenta will cause massive, instantly fatal hemorrhage. The absolute gold standard is a **planned Cesarean delivery immediately followed by a total hysterectomy**, leaving the placenta completely untouched *in situ*.\n\n---\n\n### Q98. \n**A 26-year-old female presents with a 1-year history of secondary amenorrhea, bilateral milky nipple discharge, and chronic headaches. Her serum prolactin is markedly elevated at 250 ng/mL. A dedicated pituitary MRI with gadolinium reveals an 8 mm microadenoma in the anterior pituitary. What is the universally accepted FIRST-LINE treatment?**\nA) Transsphenoidal surgical resection of the adenoma\nB) Stereotactic radiosurgery (Gamma Knife)\nC) Oral Cabergoline or Bromocriptine\nD) Combined oral contraceptive pills\n\n**Answer: C** — **Prolactinoma**—Unlike almost all other pituitary tumors, prolactinomas respond dramatically to medical therapy. Dopamine agonists like **Cabergoline** (preferred due to fewer side effects) or Bromocriptine rapidly normalize prolactin and shrink the tumor, rendering surgery unnecessary.\n\n---\n\n### Q99. \n**A 42-year-old female undergoes a routine Pap smear screening. The cytology report returns as \"Atypical Squamous Cells of Undetermined Significance\" (ASC-US). She has no history of abnormal Pap smears. What is the SINGLE BEST, most cost-effective next step in management according to ASCCP guidelines?**\nA) Immediate colposcopy with endocervical curettage\nB) Reflex testing of the liquid cytology sample for high-risk HPV DNA\nC) Perform a Loop Electrosurgical Excision Procedure (LEEP)\nD) Repeat the Pap smear blindly in exactly 3 years\n\n**Answer: B** — **ASC-US Cytology**—Because the cellular changes are ambiguous, performing a **reflex high-risk HPV DNA test** on the same sample is the best triaging step. If HPV is positive, proceed to colposcopy; if negative, repeat co-testing in 3 years.\n\n---\n\n### Q100. \n**A 30-year-old female at 26 weeks gestation has a long history of moderate persistent asthma, currently well-controlled on a medium-dose inhaled corticosteroid (ICS) and a long-acting beta-agonist (LABA). She develops a severe acute exacerbation with wheezing and hypoxemia following a viral URI. She is admitted to the ER. What is the SINGLE BEST, most critical systemic medication to administer?**\nA) Intravenous Magnesium Sulfate\nB) Intravenous or Oral Systemic Corticosteroids (e.g., Methylprednisolone/Prednisone)\nC) Oral Theophylline\nD) Subcutaneous Epinephrine\n\n**Answer: B** — **Severe Asthma Exacerbation in Pregnancy**—The maternal and fetal risks of uncontrolled hypoxemia far outweigh the minimal risks of brief steroid exposure. **Systemic corticosteroids** are the mainstay of life-saving treatment and must not be withheld.\n\n---\n\n### Q101. \n**A 28-year-old primigravida with absolutely no past obstetric history undergoes a routine mid-trimester transvaginal ultrasound at 20 weeks. Her cervical length is incidentally noted to be critically short at 15 mm. She has no contractions. What is the SINGLE BEST intervention to prevent a preterm birth?**\nA) Immediate emergency cervical cerclage\nB) Strict prophylactic bed rest in the Trendelenburg position\nC) Daily administration of vaginal progesterone suppositories\nD) Intramuscular Terbutaline injections\n\n**Answer: C** — **Incidental Short Cervix (<25mm) in a low-risk singleton pregnancy**—Because she has no prior history of preterm birth, cerclage is not the first step. **Vaginal progesterone** is the evidence-based first-line therapy to maintain cervical integrity.\n\n---\n\n### Q102. \n**A 38-year-old nulliparous female presents with severe, heavy, and prolonged menstrual bleeding causing significant anemia. Saline infusion sonography reveals a 3.5 cm solitary fibroid protruding entirely into the endometrial cavity (Type 0 submucosal leiomyoma). She adamantly desires to preserve her uterus for future childbearing. What is the SINGLE BEST definitive surgical treatment?**\nA) Open abdominal myomectomy\nB) Hysteroscopic transcervical myomectomy\nC) Laparoscopic supracervical hysterectomy\nD) Bilateral uterine artery embolization (UAE)\n\n**Answer: B** — **Type 0 Submucosal Fibroid**—Because the lesion is entirely intracavitary, a minimally invasive **hysteroscopic myomectomy** provides direct access to resect the tumor without any abdominal incisions, preserving the myometrium for future pregnancy.\n\n---\n\n### Q103. \n**A 22-year-old female presents to the ER with heavy vaginal bleeding and passage of \"grape-like\" vesicles at 11 weeks gestation. Pelvic ultrasound shows a classic \"snowstorm\" appearance with no fetus. She undergoes a suction dilation and curettage. Pathology confirms a complete hydatidiform mole. What is the SINGLE MOST critical step in her post-operative surveillance?**\nA) Serial quantitative serum β-hCG monitoring for 6 months\nB) A prophylactic course of multi-agent chemotherapy (EMA-CO)\nC) Routine monthly transvaginal ultrasounds to check for myometrial invasion\nD) An immediate baseline PET-CT scan to rule out lung metastasis\n\n**Answer: A** — **Molar Pregnancy Follow-up**—The risk of developing highly malignant choriocarcinoma or persistent gestational trophoblastic disease mandates rigorous tracking of **serial quantitative β-hCG levels** until they hit zero, followed by monthly checks for 6 months.\n\n---\n\n### Q104. \n**A 32-year-old pregnant female is known to be HIV-1 positive. She has been fully compliant with her highly active antiretroviral therapy (HAART) throughout the pregnancy, and her viral load at 38 weeks is undetectable (<50 copies/mL). She presents in spontaneous active labor. What is the SINGLE BEST management strategy to minimize vertical transmission?**\nA) Immediate emergency Cesarean section before membrane rupture\nB) Discontinue HAART during labor to prevent fetal toxicity\nC) Allow a trial of vaginal delivery, continue her oral HAART, and administer postnatal Zidovudine to the infant\nD) Administer high-dose intravenous Nevirapine during labor and perform a vacuum-assisted extraction\n\n**Answer: C** — **HIV in Pregnancy with Undetectable Viral Load**—The risk of vertical transmission is <1%. She should **continue her oral HAART regimen and proceed with a normal vaginal delivery**. (Cesarean section and IV Zidovudine are reserved for women with viral loads >1000 copies/mL).\n\n---\n\n### Q105. \n**A 34-year-old pregnant female with Antiphospholipid Antibody Syndrome (APS) has been receiving therapeutic-dose Low Molecular Weight Heparin (LMWH) and low-dose Aspirin throughout her pregnancy. She is now scheduled for an elective induction of labor at 39 weeks. To allow for safe epidural anesthesia and minimize bleeding risks, what is the SINGLE BEST timing strategy for her anticoagulants?**\nA) Discontinue both LMWH and Aspirin 24 hours prior to the scheduled induction\nB) Continue LMWH through labor but stop Aspirin 7 days prior\nC) Switch LMWH to Warfarin 48 hours prior to induction\nD) Stop all anticoagulants at 36 weeks and switch to strict bed rest\n\n**Answer: A** — **Anticoagulation around Labor**—To mitigate the risk of catastrophic epidural hematoma and severe postpartum hemorrhage, therapeutic-dose **LMWH (and Aspirin) must be withheld for exactly 24 hours** prior to neuraxial blockade or scheduled delivery.\n\n---\n\n### Q106. \n**A 48-year-old perimenopausal female presents with a new-onset, dry, non-productive cough, progressive shortness of breath, and increasing abdominal girth. Chest X-ray reveals a massive right-sided pleural effusion. Abdominal ultrasound shows massive ascites and a solid 8 cm fibroma on the right ovary. What is the MOST LIKELY eponymous diagnosis?**\nA) Meigs' syndrome\nB) Fitz-Hugh-Curtis syndrome\nC) Krukenberg tumor\nD) Pseudo-Meigs' syndrome\n\n**Answer: A** — **Meigs' syndrome**—The classic, pathognomonic triad of a benign solid ovarian tumor (specifically a **fibroma**), massive ascites, and a massive right-sided pleural effusion. Remarkably, resection of the benign fibroma cures the effusions completely.\n\n---\n\n### Q107. \n**A 38-year-old multipara at 39 weeks gestation experiences spontaneous rupture of membranes with a sudden gush of clear fluid. Immediately, the continuous fetal heart monitor demonstrates profound, sustained bradycardia down to 60 bpm. A rapid vaginal exam reveals a soft, pulsating, rope-like structure protruding through the fully dilated cervix into the vagina. What is the SINGLE BEST immediate sequence of actions?**\nA) Immediate emergency Cesarean section while continuously elevating the fetal presenting part manually\nB) Administer high-dose Oxytocin to rapidly force vaginal delivery\nC) Attempt to gently push the prolapsed cord back up into the uterine cavity\nD) Administer intravenous Terbutaline and observe for 15 minutes\n\n**Answer: A** — **Umbilical Cord Prolapse**—A dire obstetric emergency causing lethal cord compression. The examiner must keep their hand in the vagina to **elevate the fetal head off the cord** while the patient is rushed to the OR for an **immediate crash Cesarean section**.\n\n---\n\n### Q108. \n**A 60-year-old female with a strong family history of osteoporosis and a personal history of early-stage, ER-positive breast cancer completed her surgery and radiation 3 years ago. She has been taking daily Tamoxifen since then. She now presents with heavy, unpredictable vaginal bleeding. What is the SINGLE MOST critical complication her gynecologist must immediately rule out via endometrial biopsy?**\nA) Endometrial adenocarcinoma\nB) Primary cervical squamous cell carcinoma\nC) High-grade ovarian serous cystadenocarcinoma\nD) Severe atrophic vaginitis\n\n**Answer: A** — **Tamoxifen-induced Endometrial Changes**—While Tamoxifen acts as a beneficial anti-estrogen in breast tissue, it possesses dangerous *pro-estrogenic* properties in the uterus, significantly increasing the risk of **endometrial hyperplasia and adenocarcinoma**, making biopsy absolutely mandatory.\n\n---\n\n# SECTION D — PATHOLOGY, PHARMACOLOGY & MICROBIOLOGY (36 Questions)\n\n---\n\n### Q109. [Image-Based — Histopathology]\n**A 65-year-old male with a 50-pack-year smoking history presents with hemoptysis and severe hyponatremia. Bronchoscopy yields a biopsy from a central hilar mass. Pathology (Image: dense sheets of small, round, dark blue cells with exceedingly scant cytoplasm, displaying characteristic \"salt and pepper\" stippled chromatin and absent nucleoli). What is the MOST LIKELY diagnosis?**\nA) Squamous cell carcinoma\nB) Adenocarcinoma\nC) Small cell lung carcinoma\nD) Typical Carcinoid tumor\n\n**Answer: C** — **Small cell lung carcinoma (SCLC)**—The description of highly mitotic \"small blue cells\" with \"salt and pepper\" chromatin and a strong association with smoking and paraneoplastic SIADH is pathognomonic.\n\n---\n\n### Q110. \n**A 70-year-old male, a lifelong pipe smoker, presents with a progressively enlarging, ulcerated mass centrally located in the right mainstem bronchus. He develops severe hypercalcemia. Histological examination of the mass reveals sheets of polygonal cells containing distinct concentric whorls of eosinophilic material (\"keratin pearls\") and prominent intercellular bridges. What is the diagnosis?**\nA) Small cell carcinoma\nB) Squamous cell carcinoma\nC) Large cell carcinoma\nD) Bronchioalveolar carcinoma\n\n**Answer: B** — **Squamous cell carcinoma** of the lung—A central tumor characterized universally by the presence of **keratin pearls** and intercellular desmosomal bridges. It is also famous for producing PTHrP, causing hypercalcemia.\n\n---\n\n### Q111. \n**A 50-year-old female presents with a small, firm, non-palpable 0.8 cm density detected purely on screening mammography. Excisional biopsy reveals a well-differentiated, low-grade proliferation of perfectly formed, distinct glandular structures infiltrating a desmoplastic stroma, with an absolute lack of myoepithelial cells. What is the specific diagnosis?**\nA) Tubular carcinoma of the breast\nB) Invasive lobular carcinoma\nC) Medullary carcinoma\nD) Inflammatory breast cancer\n\n**Answer: A** — **Tubular carcinoma**—A highly well-differentiated variant of invasive ductal carcinoma composed almost entirely of angulated **tubular structures**. It carries an exceptionally excellent prognosis.\n\n---\n\n### Q112. \n**A 55-year-old male presents with chronic epigastric pain and indigestion. Upper endoscopy reveals a thickened, hyperemic gastric mucosa. Biopsy of the stomach wall demonstrates an intense, dense infiltration of monoclonal B-lymphocytes forming distinct lymphoid follicles deep in the lamina propria, diagnosing an extranodal marginal zone B-cell lymphoma (MALToma). Eradication of which specific organism can frequently cure this early-stage malignancy?**\nA) Epstein-Barr Virus (EBV)\nB) Helicobacter pylori\nC) Cytomegalovirus (CMV)\nD) Human T-lymphotropic virus type 1 (HTLV-1)\n\n**Answer: B** — **Gastric MALT Lymphoma**—Arises almost exclusively in the setting of chronic inflammation driven by **Helicobacter pylori**. In early stages, simply eradicating the H. pylori with triple therapy can cause complete regression of the lymphoma.\n\n---\n\n### Q113. \n**A 7-year-old boy presents with a massive, rapidly growing, painless swelling in his right jaw and jawbone. Biopsy of the mass reveals sheets of intermediate-sized lymphocytes interspersed with numerous pale, large tingible-body macrophages actively phagocytosing apoptotic debris, creating a striking \"starry sky\" histological appearance. Cytogenetics show a t(8;14) translocation. What is the MOST LIKELY diagnosis?**\nA) Hodgkin Lymphoma\nB) Follicular Lymphoma\nC) Burkitt Lymphoma\nD) Mantle Cell Lymphoma\n\n**Answer: C** — **Burkitt Lymphoma**—An extremely aggressive B-cell non-Hodgkin lymphoma driven by the c-myc translocation t(8;14), famous for its **\"starry sky\"** histology.\n\n---\n\n### Q114. \n**A 60-year-old male with long-standing cirrhosis secondary to chronic Hepatitis B undergoes a liver transplant for a multifocal 8 cm solid liver mass. Histopathological examination of the explanted mass reveals thick, pseudo-glandular cords of cells resembling normal hepatocytes, separated by prominent sinusoids. The cytoplasm is highly eosinophilic and granular. What is the MOST LIKELY diagnosis?**\nA) Cholangiocarcinoma\nB) Hepatic adenoma\nC) Metastatic colorectal adenocarcinoma\nD) Hepatocellular carcinoma (HCC)\n\n**Answer: D** — **HCC**—Microscopically characterized by a **trabecular pattern** composed of atypical, pleomorphic hepatocytes producing bile, set within an intensely vascular sinusoidal network.\n\n---\n\n### Q115. \n**A 55-year-old male presents with a rapid 3-week history of severe headaches, personality changes, and a new-onset seizure. MRI of the brain with gadolinium reveals a massive, 6 cm irregularly enhancing \"butterfly\" mass crossing the corpus callosum. Stereotactic biopsy demonstrates highly pleomorphic astrocytic cells with prominent microvascular proliferation and serpentine zones of necrosis surrounded by densely packed tumor cells (\"pseudopalisading necrosis\"). What is the MOST LIKELY diagnosis?**\nA) Glioblastoma Multiforme (GBM)\nB) Oligodendroglioma\nC) Primary CNS Lymphoma\nD) Meningioma\n\n**Answer: A** — **Glioblastoma (Grade IV Astrocytoma)**—The most common and lethal primary brain tumor in adults. The histological hallmarks are profound vascular proliferation and **pseudopalisading necrosis**.\n\n---\n\n### Q116. \n**A 45-year-old female presents with a distinct, bloody nipple discharge. Ultrasound reveals a 2 cm solid-cystic lesion situated entirely within a major lactiferous duct beneath the areola. Excision reveals a tumor characterized by a complex, branching fibrovascular core lined by malignant epithelial cells, but notably lacking an underlying myoepithelial layer. What is the MOST LIKELY diagnosis?**\nA) Intraductal papilloma\nB) Papillary carcinoma of the breast\nC) Comedo-type DCIS\nD) Fibroadenoma\n\n**Answer: B** — **Papillary carcinoma**—While benign intraductal papillomas also present with bloody discharge and fibrovascular cores, the defining malignant feature here is the **complete absence of a protective myoepithelial cell layer**.\n\n---\n\n### Q117. \n**A 65-year-old male presents with the classic triad of painless gross hematuria, a palpable right flank mass, and dull flank pain. He is a heavy smoker. A radical nephrectomy is performed. Pathology shows solid nests of large cells with distinct, sharp cell borders, small uniform nuclei, and copious amounts of lipid- and glycogen-rich cytoplasm that appears totally transparent on H&E stain. What is the MOST LIKELY diagnosis?**\nA) Papillary renal cell carcinoma\nB) Chromophobe renal carcinoma\nC) Clear cell renal cell carcinoma\nD) Renal Oncocytoma\n\n**Answer: C** — **Clear cell RCC**—The most common subtype of renal cancer, originating from the proximal convoluted tubule, driven by VHL gene mutations, and visually defined by its **transparent, lipid/glycogen-filled cytoplasm**.\n\n---\n\n### Q118. \n**A 74-year-old male with severe congestive heart failure and severe COPD undergoes a routine prostate biopsy for a mildly elevated PSA of 5.2 ng/mL. The biopsy reveals a small focus of adenocarcinoma in one core. The pathologist assigns a Gleason score of 6 (3+3). Staging shows no spread. What is the MOST APPROPRIATE management strategy for this specific patient?**\nA) Immediate Radical Retropubic Prostatectomy\nB) Curative External Beam Radiotherapy\nC) High-dose androgen deprivation therapy (Leuprolide)\nD) Active surveillance (Watchful waiting)\n\n**Answer: D** — **Low-risk prostate cancer in an elderly, highly comorbid patient**—Prostate cancer with a Gleason score of 6 is exceedingly slow-growing. Given his severe competing morbidities (CHF, COPD), he is far more likely to die *with* his cancer than *from* it. **Active surveillance** avoids immense surgical/radiation morbidity.\n\n---\n\n### Q119. [Pharmacology]\n**A 50-year-old male with poorly controlled type 2 diabetes and a history of heart failure is started on Empagliflozin. While it dramatically improves his cardiovascular outcomes and HbA1c, the physician warns him to monitor for a highly specific, common adverse effect. What is the SINGLE MOST important adverse effect associated with this drug class?**\nA) Severe recurrent genitourinary mycotic infections (Candidiasis)\nB) Profound, sudden hypoglycemia\nC) Massive drug-induced weight gain\nD) Hepatotoxicity and jaundice\n\n**Answer: A** — **SGLT2 inhibitors (Empagliflozin, Dapagliflozin)**—Function by dumping massive amounts of glucose into the urine, creating an ideal environment for yeasts, leading to high rates of **genitourinary fungal infections**.\n\n---\n\n### Q120. \n**A 65-year-old male with symptomatic heart failure with reduced ejection fraction (HFrEF) remains highly breathless on maximum doses of an ACE inhibitor. His cardiologist switches him to the breakthrough combination drug Sacubitril/Valsartan (Entresto). What is the exact dual mechanism of action of this medication?**\nA) Direct Renin inhibition + Beta-1 receptor blockade\nB) Neprilysin inhibition (increasing BNP/ANP) + Angiotensin II Receptor Blockade\nC) Aldosterone antagonism + Calcium channel blockade\nD) Phosphodiesterase-3 inhibition + Alpha-1 receptor blockade\n\n**Answer: B** — **Sacubitril/Valsartan (ARNI)**—**Sacubitril inhibits neprilysin**, preventing the breakdown of beneficial natriuretic peptides (BNP) which promote vasodilation and diuresis. **Valsartan blocks the AT1 receptor**, preventing the harmful effects of Angiotensin II.\n\n---\n\n### Q121. \n**A 22-year-old female with newly diagnosed bipolar disorder and a history of partial seizures is started on Lamotrigine as a mood stabilizer and anticonvulsant. The psychiatrist emphasizes that the dose must be titrated upward incredibly slowly over several weeks to avoid a rare but catastrophic, life-threatening complication. What is this SINGLE MOST important adverse effect?**\nA) Agranulocytosis\nB) Fatal hepatotoxicity\nC) Stevens-Johnson Syndrome / Toxic Epidermal Necrolysis\nD) Irreversible retinal toxicity\n\n**Answer: C** — **Lamotrigine**—Carries a prominent black box warning for causing severe, life-threatening mucocutaneous skin reactions, specifically **Stevens-Johnson Syndrome (SJS)**. Slow dose titration minimizes this risk.\n\n---\n\n### Q122. \n**A 68-year-old male with progressive Parkinson's disease is started on standard Sinemet therapy (Levodopa/Carbidopa). He visits a naturopath who prescribes him a high-dose multivitamin. Within a week, the patient notices his Parkinsonian tremors and rigidity have returned to baseline severity despite taking his Sinemet. Which specific vitamin in the supplement is notorious for accelerating the peripheral breakdown of Levodopa, reducing its CNS efficacy?**\nA) Vitamin B12 (Cobalamin)\nB) Vitamin C (Ascorbic acid)\nC) Vitamin B9 (Folic acid)\nD) Vitamin B6 (Pyridoxine)\n\n**Answer: D** — **Levodopa-Vitamin interaction**—**Vitamin B6 (Pyridoxine)** is a critical cofactor for the enzyme DOPA decarboxylase. High doses of B6 can supercharge this enzyme in the periphery, destroying the Levodopa before it can cross the blood-brain barrier, even when Carbidopa is present.\n\n---\n\n### Q123. \n**A 70-year-old male with severe GOLD Stage 3 COPD suffers from persistent, severe dyspnea despite using an Albuterol rescue inhaler. The pulmonologist adds a daily dose of inhaled Tiotropium to his regimen, which provides dramatic relief. What is the specific cellular mechanism of action of Tiotropium?**\nA) Long-Acting Muscarinic Antagonist (LAMA)\nB) Long-Acting Beta-2 Agonist (LABA)\nC) Inhaled Phosphodiesterase-4 (PDE-4) inhibitor\nD) Mast cell stabilizer\n\n**Answer: A** — **Tiotropium**—A highly potent, once-daily **Long-Acting Muscarinic Antagonist (LAMA)**. It blocks M3 acetylcholine receptors in the smooth muscle of the bronchi, preventing vagally mediated bronchoconstriction.\n\n---\n\n### Q124. \n**A 35-year-old female with newly diagnosed systemic lupus erythematosus (SLE) and inflammatory arthritis is started on a daily oral dose of Hydroxychloroquine as baseline disease-modifying therapy. Before she leaves the clinic, the rheumatologist mandates she schedule an appointment with a specialist to monitor for the drug's most feared irreversible toxicity. What is this SINGLE MOST important toxicity?**\nA) Irreversible sensorineural hearing loss\nB) Retinopathy (Bulls-eye maculopathy)\nC) Progressive pulmonary fibrosis\nD) Fulminant hepatic failure\n\n**Answer: B** — **Hydroxychloroquine**—Binds to melanin in the retinal pigment epithelium, causing a potentially blinding **bulls-eye maculopathy**. A baseline comprehensive ophthalmologic exam and annual screening (after 5 years of use) are absolutely mandatory.\n\n---\n\n### Q125. \n**A 28-year-old female with severe, highly active, relapsing-remitting multiple sclerosis (RRMS) has failed initial therapies and is transitioned to intravenous Natalizumab, a highly effective monoclonal antibody against α4-integrin. Which opportunistic, fatal viral brain infection poses the MOST IMPORTANT risk when using this drug?**\nA) Herpes Simplex Virus (HSV) Encephalitis\nB) Cytomegalovirus (CMV) Retinitis\nC) Progressive Multifocal Leukoencephalopathy (PML)\nD) Subacute Sclerosing Panencephalitis (SSPE)\n\n**Answer: C** — **Natalizumab**—By blocking lymphocytes from crossing the blood-brain barrier, it effectively treats MS but leaves the CNS defenseless against the John Cunningham (JC) virus, leading to deadly **PML**.\n\n---\n\n### Q126. \n**A 32-year-old male with severe, medically refractory Crohn's disease is prepped to begin therapy with Infliximab, a powerful anti-TNF-alpha monoclonal antibody. Before the very first infusion can be given, what is the SINGLE MOST important required screening test to prevent a potentially lethal complication?**\nA) Tuberculosis screening (e.g., IGRA or PPD test)\nB) Hepatitis A surface antigen testing\nC) Comprehensive echocardiogram\nD) Fasting lipid panel\n\n**Answer: A** — **Anti-TNF-alpha therapy (Infliximab, Adalimumab)**—TNF-alpha is critical for the maintenance of granulomas. Inhibiting it will cause explosive reactivation of **latent Tuberculosis**. Screening with a PPD/IGRA and CXR is an absolute prerequisite.\n\n---\n\n### Q127. [Microbiology]\n**A 7-year-old girl presents with a sudden high fever, absence of a cough, tender anterior cervical lymphadenopathy, and a fiery red pharynx covered in white exudate. A rapid antigen detection test is strongly positive for Group A Streptococcus (Streptococcus pyogenes). What is the SINGLE BEST antibiotic to administer, primarily to prevent the catastrophic immune complication of Rheumatic Fever?**\nA) Oral Penicillin V or Intramuscular Benzathine Penicillin G\nB) Oral Ciprofloxacin\nC) Intravenous Vancomycin\nD) Oral Trimethoprim-Sulfamethoxazole\n\n**Answer: A** — **GAS Pharyngitis**—S. pyogenes remains universally, 100% susceptible to **Penicillin**. A 10-day course of oral Penicillin (or a single IM shot) is the definitive standard to eradicate the organism before cross-reactive antibodies that cause Rheumatic Fever can form.\n\n---\n\n### Q128. \n**A 45-year-old female with a history of recurrent large staghorn renal calculi presents with dysuria, flank pain, and highly alkaline urine (pH 8.5). A urine culture grows swarming, highly motile Gram-negative rods that produce a strong ammonia odor. What is the MOST LIKELY organism?**\nA) Escherichia coli\nB) Proteus mirabilis\nC) Klebsiella oxytoca\nD) Pseudomonas aeruginosa\n\n**Answer: B** — **Proteus mirabilis**—A highly motile (\"swarming\") Gram-negative rod that produces massive amounts of the enzyme **urease**. Urease splits urea into ammonia, raising the urine pH and precipitating magnesium ammonium phosphate (struvite/staghorn) stones.\n\n---\n\n### Q129. \n**A 60-year-old male intubated in the ICU for a week develops a severe ventilator-associated pneumonia (VAP). His sputum culture rapidly grows strictly aerobic, non-lactose fermenting Gram-negative rods that emit a grape-like sweet odor and test strongly oxidase-positive. What is the MOST LIKELY organism?**\nA) Acinetobacter baumannii\nB) Escherichia coli\nC) Pseudomonas aeruginosa\nD) Serratia marcescens\n\n**Answer: C** — **Pseudomonas aeruginosa**—The classic triad for this notorious nosocomial pathogen is: strictly aerobic Gram-negative rod, **oxidase positive**, and produces a sweet, grape-like or \"corn tortilla\" odor along with blue-green pigments.\n\n---\n\n### Q130. \n**A 22-year-old male presents with a painless, indurated, clean-based ulcer (chancre) on the glans of his penis. He refuses a blood draw. The physician scrapes the base of the ulcer and examines the exudate immediately. Under specialized illumination, thin, tightly coiled, highly motile spirochetes are seen rotating on their longitudinal axis. What is the organism?**\nA) Haemophilus ducreyi\nB) Neisseria gonorrhoeae\nC) Chlamydia trachomatis\nD) Treponema pallidum\n\n**Answer: D** — **Syphilis**—The spirochete **Treponema pallidum** cannot be cultured in vitro and is too thin to be seen on a standard Gram stain; direct visualization of the live organism from a primary chancre requires **dark-field microscopy**.\n\n---\n\n### Q131. \n**A 40-year-old male who underwent a kidney transplant 3 months ago presents with fever, severe fatigue, leukopenia, and worsening pulmonary infiltrates. PCR testing of his blood shows an incredibly high viral load of Cytomegalovirus (CMV). What is the SINGLE BEST intravenous antiviral therapy to treat this life-threatening opportunistic infection?**\nA) Ganciclovir\nB) Oseltamivir\nC) Acyclovir\nD) Lamivudine\n\n**Answer: A** — **Cytomegalovirus (CMV)**—Unlike HSV/VZV, CMV lacks the specific thymidine kinase required to activate acyclovir efficiently. **Ganciclovir** (or oral Valganciclovir) is the specific, highly potent drug of choice for severe systemic CMV infections.\n\n---\n\n### Q132. \n**A 65-year-old male presents to the clinic complaining of agonizing, burning pain wrapping around the right side of his chest. Examination reveals a unilateral, blistering vesicular rash strictly confined to the T6 dermatome, halting abruptly at the midline. What is the SINGLE BEST oral antiviral to accelerate healing if given within 72 hours of rash onset?**\nA) Valacyclovir\nB) Oseltamivir\nC) Ribavirin\nD) Amantadine\n\n**Answer: A** — **Herpes Zoster (Shingles)**—High-dose oral **Valacyclovir** (or Acyclovir/Famciclovir) profoundly accelerates the healing of the zoster rash and reduces the severity of acute neuritis if initiated within the 72-hour therapeutic window.\n\n---\n\n### Q133. \n**A 10-year-old boy is brought to the clinic in late January with a sudden onset of high fever, severe myalgias, dry cough, and profound fatigue. A rapid nasal swab is positive for Influenza A. The pediatrician prescribes an oral 5-day course of Oseltamivir (Tamiflu). What is the exact mechanism of action of this antiviral drug?**\nA) It inhibits viral RNA-dependent RNA polymerase\nB) It blocks viral uncoating by inhibiting the M2 ion channel\nC) It competitively inhibits the viral Neuraminidase enzyme, preventing the release of new virions from the host cell\nD) It acts as a nucleoside analog, causing premature DNA chain termination\n\n**Answer: C** — **Oseltamivir**—A highly selective **Neuraminidase inhibitor**. By blocking neuraminidase, newly formed influenza virions remain tethered to the host cell's sialic acid receptors and clump together, halting viral spread throughout the respiratory tract.\n\n---\n\n### Q134. \n**A 28-year-old male with severe bipolar disorder has been stabilized on Lithium carbonate for 2 years. He visits his primary care doctor complaining of intense, unquenchable thirst and urinating 6-8 liters of dilute urine a day. His blood glucose is perfectly normal. What is the SINGLE BEST physiological explanation for this specific drug-induced side effect?**\nA) Lithium directly destroys the insulin-producing beta cells of the pancreas\nB) Lithium enters the collecting duct cells and irreversibly blocks the intracellular action of Antidiuretic Hormone (ADH)\nC) Lithium acts as a massive osmotic diuretic in the proximal tubule\nD) Lithium destroys the magnocellular neurons of the hypothalamus, preventing ADH synthesis\n\n**Answer: B** — **Lithium-induced Nephrogenic Diabetes Insipidus**—Lithium accumulates in the renal collecting duct and aggressively interferes with the cAMP signaling cascade, **blocking the insertion of aquaporin water channels by ADH**, resulting in massive free water loss.\n\n---\n\n### Q135. \n**A 40-year-old female stabilized on Lithium for bipolar disorder decides to start taking high-dose Ibuprofen daily for knee pain. Two weeks later, she presents to the ER with severe coarse hand tremors, profound ataxia, slurred speech, and confusion. Her serum lithium level is returned at a toxic 2.8 mEq/L (Normal 0.6-1.2). What is the SINGLE BEST immediate management for severe, symptomatic toxicity at this level?**\nA) Immediate Hemodialysis\nB) Administration of Intravenous Flumazenil\nC) Aggressive forced alkaline diuresis\nD) Oral activated charcoal\n\n**Answer: A** — **Severe Lithium Toxicity**—NSAIDs (like Ibuprofen) slash renal blood flow, causing massive lithium retention. Because lithium is a small, un-protein-bound ion, **immediate Hemodialysis** is the absolute most effective way to rapidly clear it from the blood and save the brain when levels exceed 2.5 mEq/L with severe neurologic signs.\n\n---\n\n### Q136. \n**A 50-year-old male with severe COPD is prescribed an oral sustained-release methylxanthine derivative (Theophylline) to help control his severe nocturnal bronchospasm. By what dual mechanism does this classic drug exert its bronchodilatory effects?**\nA) Direct stimulation of Beta-2 receptors and blockade of Alpha-1 receptors\nB) Non-selective inhibition of Phosphodiesterase (PDE) and competitive antagonism of Adenosine receptors\nC) Direct stabilization of the mast cell membrane and blockade of leukotriene synthesis\nD) Direct competitive inhibition of muscarinic acetylcholine receptors\n\n**Answer: B** — **Theophylline**—Achieves bronchodilation primarily by **inhibiting Phosphodiesterase (PDE)**, which increases intracellular cAMP levels in smooth muscle. It also independently blocks bronchoconstricting **Adenosine receptors**.\n\n---\n\n### Q137. \n**A 25-year-old aid worker returns from a rural village in Uganda with severe, high-grade fevers, rigors, and hemolytic anemia. Blood smears confirm a heavy parasitemia of Plasmodium falciparum. The region is known to have near-total resistance to Chloroquine. What is the SINGLE BEST, WHO-recommended first-line oral therapy for uncomplicated resistant P. falciparum?**\nA) Intravenous Artesunate\nB) High-dose Primaquine\nC) Artemisinin-based Combination Therapy (ACT) e.g., Artemether-Lumefantrine\nD) Oral Doxycycline monotherapy\n\n**Answer: C** — **Chloroquine-resistant P. falciparum**—For uncomplicated cases, fast-acting **Artemisinin-based Combination Therapy (ACT)** is the undisputed global standard of care to rapidly clear parasitemia and delay the emergence of resistance. (IV Artesunate is strictly reserved for *severe/complicated* malaria).\n\n---\n\n### Q138. \n**A 30-year-old male healthcare worker undergoes an annual screening. His QuantiFERON-TB Gold blood test returns strongly positive. He is totally asymptomatic. A high-resolution chest X-ray is perfectly crystal clear with no infiltrates, cavities, or adenopathy. What is the SINGLE BEST management strategy for this patient?**\nA) No treatment is necessary; repeat the chest X-ray in one year\nB) Start a 6-to-9 month course of daily oral Isoniazid monotherapy\nC) Start the full RIPE regimen (Rifampin, Isoniazid, Pyrazinamide, Ethambutol) immediately\nD) Administer the BCG vaccine\n\n**Answer: B** — **Latent Tuberculosis Infection (LTBI)**—The positive IGRA confirms infection, but the clear CXR and lack of symptoms rule out active disease. To prevent future reactivation, he must undergo LTBI treatment, classically **Isoniazid monotherapy for 6-9 months** (or Rifampin for 4 months).\n\n---\n\n### Q139. \n**A 12-year-old girl has a lifelong history of unrelenting, severe Candida infections of her oral mucosa, nails, and skin. She does not get unusual viral or bacterial infections. Recently, she was diagnosed with primary hypoparathyroidism. What is the MOST LIKELY specific underlying immunological defect?**\nA) T-cell deficiency specifically involving the Th17 helper cell lineage\nB) Profound B-cell deficiency (Agammaglobulinemia)\nC) A defect in the C5-C9 membrane attack complex\nD) A defect in phagocytic oxidative burst (Chronic Granulomatous Disease)\n\n**Answer: A** — **Chronic Mucocutaneous Candidiasis (CMC)**—Often a part of Autoimmune Polyendocrinopathy-Candidiasis-Ectodermal Dystrophy (APECED) syndrome. The core defect is a failure of **Th17 T-cells** to produce IL-17, a cytokine absolutely critical for recruiting neutrophils to mucosal surfaces to fight fungal elements.\n\n---\n\n### Q140. \n**A 55-year-old male with chronic Hepatitis C (Genotype 1) cirrhosis is prescribed the revolutionary, curative direct-acting antiviral combination pill Ledipasvir/Sofosbuvir (Harvoni). What specific viral replication enzymes do these two molecules target?**\nA) Viral Protease and Viral Integrase\nB) Viral NS5A protein and Viral NS5B RNA-dependent RNA polymerase\nC) Viral Reverse Transcriptase and Viral Neuraminidase\nD) Viral Uncoating protein and Viral Budding complex\n\n**Answer: B** — **Direct-Acting Antivirals (HCV)**—**Ledipasvir inhibits the NS5A** viral phosphoprotein vital for replication assembly, while **Sofosbuvir acts as a false nucleotide, inhibiting the NS5B** RNA-dependent RNA polymerase, causing chain termination.\n\n---\n\n### Q141. \n**A 60-year-old male is prescribed Colchicine to manage an acute, agonizing gout flare in his big toe. Forty-eight hours into the regimen, the joint pain has improved, but he develops severe, voluminous, watery diarrhea and intense abdominal cramping. What is the SINGLE BEST immediate next step?**\nA) Prescribe Loperamide (Imodium) and continue the Colchicine dose to fully resolve the gout\nB) Add a daily dose of Allopurinol to the regimen\nC) Immediately stop taking the Colchicine\nD) Switch the Colchicine to high-dose oral Aspirin\n\n**Answer: C** — **Colchicine toxicity**—Colchicine poisons microtubules, arresting mitosis. The rapidly dividing cells of the GI tract are exquisitely sensitive. The development of severe diarrhea is the classic sign of impending life-threatening toxicity; the drug must be **stopped immediately**.\n\n---\n\n### Q142. \n**A 50-year-old male with a long history of chronic kidney disease (eGFR 25 mL/min) is diagnosed with severe tophaceous gout. The rheumatologist decides to initiate Allopurinol to lower his heavy urate burden. What is the SINGLE BEST pharmacological strategy when starting this specific drug in this specific patient?**\nA) Initiate the drug at a highly reduced dose and titrate upward very slowly\nB) Start at the standard maximum dose because his kidneys cannot excrete urate\nC) Administer the drug intravenously rather than orally\nD) Co-administer it with a thiazide diuretic to force renal excretion\n\n**Answer: A** — **Allopurinol in Chronic Kidney Disease**—The active metabolite of allopurinol (oxypurinol) is cleared purely by the kidneys. In CKD, the drug rapidly accumulates to toxic levels, vastly increasing the risk of the deadly Allopurinol Hypersensitivity Syndrome (SJS/TEN). The dose must be **drastically reduced** based on creatinine clearance.\n\n---\n\n### Q143. \n**A 25-year-old male diagnosed with Hodgkin Lymphoma undergoes curative-intent chemotherapy using the classic ABVD regimen (Adriamycin, Bleomycin, Vinblastine, Dacarbazine). Six months into therapy, he develops a dry, hacking cough and severe progressive dyspnea on exertion. A chest CT reveals diffuse interstitial fibrosis. Which specific drug in the regimen is responsible for this catastrophic side effect?**\nA) Bleomycin\nB) Adriamycin (Doxorubicin)\nC) Vinblastine\nD) Dacarbazine\n\n**Answer: A** — **Bleomycin Toxicity**—A highly potent antitumor antibiotic that generates free radicals to break DNA. Because the lungs lack the enzyme (bleomycin hydrolase) required to inactivate it, it accumulates and causes severe, dose-dependent, and often irreversible **pulmonary fibrosis**.\n\n---\n\n### Q144. \n**A 48-year-old female with aggressive HER2-positive breast cancer is scheduled to begin a year-long course of targeted immunotherapy with Trastuzumab (Herceptin). To ensure she can safely tolerate the treatment, what is the SINGLE MOST important baseline physiological screening test she must undergo prior to her first infusion?**\nA) Comprehensive Pulmonary Function Testing (PFT)\nB) Baseline Audiometry (Hearing test)\nC) An Echocardiogram (or MUGA scan) to assess Left Ventricular Ejection Fraction (LVEF)\nD) A 24-hour urine collection to assess creatinine clearance\n\n**Answer: C** — **Trastuzumab Cardiotoxicity**—Because HER2 signaling is crucial for cardiac muscle repair, blocking it can lead to severe, albeit usually reversible, toxic cardiomyopathy. A baseline **Echocardiogram assessing LVEF** is mandatory, followed by serial imaging throughout the year.\n\n---\n\n# SECTION E — PEDIATRICS, COMMUNITY MEDICINE, FORENSIC, ENT, OPHTH, PSYCH, DERMA (36 Questions)\n\n---\n\n### Q145. \n**A seemingly healthy newborn undergoes routine heel-prick metabolic screening on day 3 of life. The test flags wildly elevated levels of phenylalanine. A diagnosis of classic Phenylketonuria (PKU) is confirmed. To prevent irreversible, severe intellectual disability, what is the SINGLE BEST definitive management strategy?**\nA) Massive, lifelong daily supplementation with Vitamin B12 and Folate\nB) Immediate initiation of enzyme replacement therapy (intravenous phenylalanine hydroxylase)\nC) Strict, lifelong implementation of a specialized low-phenylalanine, tyrosine-supplemented diet\nD) Total dietary elimination of all carbohydrates and sugars\n\n**Answer: C** — **Phenylketonuria (PKU)**—An autosomal recessive deficiency of phenylalanine hydroxylase. Because the toxic accumulation of phenylalanine destroys the developing brain, a **strict low-phenylalanine diet** (eliminating high-protein foods) initiated immediately after birth is absolutely curative.\n\n---\n\n### Q146. \n**A 2-week-old infant is brought to the pediatrician. Examination reveals a flattened nasal bridge, prominent epicanthal folds, a single transverse palmar crease on both hands, and a distinct wide gap between the first and second toes (\"sandal gap\"). A loud heart murmur is heard. An echocardiogram confirms a complete atrioventricular (AV) canal defect. What is the MOST LIKELY chromosomal diagnosis?**\nA) Trisomy 18 (Edwards syndrome)\nB) Trisomy 13 (Patau syndrome)\nC) 45,XO (Turner syndrome)\nD) Trisomy 21 (Down syndrome)\n\n**Answer: D** — **Down syndrome**—The constellation of classic dysmorphic facial features, single palmar crease, sandal gap, and the hallmark cardiac lesion (the **complete AV canal/septal defect**, which occurs in ~40% of Down syndrome patients) definitively points to Trisomy 21.\n\n---\n\n### Q147. \n**A 5-day-old neonate who appeared perfectly healthy at birth begins to feed poorly, vomits persistently, and rapidly becomes lethargic and hypotonic. He then develops alternating episodes of severe hypertonia and seizures. The nurse notes that the infant's urine smells strongly of burnt sugar. What is the MOST LIKELY diagnosis?**\nA) Maple Syrup Urine Disease (MSUD)\nB) Classic Galactosemia\nC) Medium-chain acyl-CoA dehydrogenase (MCAD) deficiency\nD) Isovaleric acidemia\n\n**Answer: A** — **Maple Syrup Urine Disease**—Caused by a defect in branched-chain alpha-keto acid dehydrogenase. The massive buildup of branched-chain amino acids (Isoleucine, Leucine, Valine) causes devastating neurotoxicity and imparts a classic **burnt sugar/maple syrup odor** to the urine.\n\n---\n\n### Q148. \n**An unimmunized 4-year-old child is rushed to the ER with a high fever, severe lethargy, and a bulging anterior fontanelle. A lumbar puncture confirms acute bacterial meningitis. Despite 48 hours of appropriate IV Ceftriaxone, his fever persists and his head circumference abruptly increases. A CT scan of the head reveals a large collection of fluid surrounding the brain in the subdural space. What was the MOST LIKELY causative organism of his original meningitis?**\nA) Streptococcus pneumoniae\nB) Haemophilus influenzae type b (Hib)\nC) Neisseria meningitidis\nD) Listeria monocytogenes\n\n**Answer: B** — **Haemophilus influenzae type b**—While all bacterial meningitides can cause complications, severe, persistent **subdural effusions** occurring days into treatment are a highly classic, signature complication of Hib meningitis in young, unvaccinated children.\n\n---\n\n### Q149. \n**A 6-month-old infant is brought in for a routine checkup. The parents have no complaints and the child is growing well. On auscultation, the pediatrician hears a loud, harsh, continuous \"machinery-like\" murmur loudest at the left infra-clavicular area. The infant has bounding peripheral pulses. What is the MOST LIKELY underlying congenital cardiac anomaly?**\nA) Atrial Septal Defect (ASD)\nB) Ventricular Septal Defect (VSD)\nC) Patent Ductus Arteriosus (PDA)\nD) Coarctation of the Aorta\n\n**Answer: C** — **Patent Ductus Arteriosus (PDA)**—The failure of the ductus to close allows continuous blood flow from the high-pressure aorta to the lower-pressure pulmonary artery during *both* systole and diastole, generating the classic **continuous machinery murmur** and widened pulse pressure (bounding pulses).\n\n---\n\n### Q150. \n**A 2-year-old child with severe cyanosis, clubbing of the fingers, and a \"boot-shaped\" heart on X-ray is diagnosed with severe Tetralogy of Fallot. His pulmonary arteries are deemed far too hypoplastic and small to undergo a definitive, complete surgical repair at this time. What is the SINGLE BEST palliative surgical procedure to immediately increase his pulmonary blood flow and save his life?**\nA) A modified Blalock-Taussig (BT) shunt\nB) A Glenn bidirectional shunt\nC) A Fontan procedure\nD) Percutaneous balloon atrial septostomy\n\n**Answer: A** — **Palliative surgery for Tetralogy of Fallot**—When total repair is impossible, the **modified BT shunt** (a synthetic tube connecting the subclavian artery directly to the pulmonary artery) acts as an artificial ductus arteriosus, bypassing the severe right ventricular outflow tract obstruction to oxygenate blood.\n\n---\n\n### Q151. \n**A 10-year-old boy presents with a 2-day history of painless, gross hematuria. His mother notes that this exact same dark urine occurred twice before, perfectly coinciding with severe viral upper respiratory tract infections. He has no edema, and his blood pressure is normal. Renal biopsy reveals prominent mesangial immune complex deposition. What is the SINGLE BEST long-term management?**\nA) Supportive care, careful blood pressure monitoring, and ACE inhibitors if proteinuria develops\nB) High-dose, long-term oral corticosteroids\nC) Intravenous Cyclophosphamide pulse therapy\nD) Immediate prophylactic bilateral tonsillectomy\n\n**Answer: A** — **IgA Nephropathy (Berger's Disease)**—The most common cause of glomerulonephritis worldwide, classically presenting with episodic gross hematuria *concurrent* with respiratory infections. For patients with normal renal function and isolated hematuria, **conservative supportive care** is the rule.\n\n---\n\n### Q152. \n**A 3-year-old child presents to the pulmonology clinic with a history of severe, recurrent lobar pneumonias and a chronic, relentless, productive cough. A high-resolution chest CT shows massive dilation and thickening of the airways (bronchiectasis). He also has a history of poor weight gain. What is the SINGLE BEST, gold-standard diagnostic test to confirm the underlying genetic etiology?**\nA) Quantitative Pilocarpine Iontophoresis (Sweat Chloride Test)\nB) Comprehensive sputum culture for Pseudomonas aeruginosa\nC) Sweat sodium measurement\nD) Bronchoscopy with ciliary biopsy\n\n**Answer: A** — **Cystic Fibrosis**—The presence of early-onset severe bronchiectasis and failure to thrive mandates ruling out CF. The **Sweat Chloride Test** (chloride >60 mEq/L) remains the robust, gold-standard diagnostic physiological test.\n\n---\n\n### Q153. \n**A 3-week-old firstborn male infant is rushed to the emergency department. Over the past 48 hours, he has developed fierce, non-bilious, projectile vomiting immediately after every feed. He is visibly hungry and aggressively demands the bottle right after vomiting. Physical examination reveals a firm, 2 cm olive-shaped mass palpable deep in the right upper quadrant of his abdomen. An arterial blood gas would MOST LIKELY reveal which profound systemic derangement?**\nA) Severe hyperkalemic, hyperchloremic metabolic acidosis\nB) High anion gap metabolic acidosis\nC) Hypochloremic, hypokalemic metabolic alkalosis\nD) Uncompensated respiratory alkalosis\n\n**Answer: C** — **Hypertrophic Pyloric Stenosis**—The ferocious, repetitive vomiting of pure, acidic gastric juice results in massive losses of hydrochloric acid (HCl) and potassium. This creates a classic, life-threatening **hypochloremic, hypokalemic metabolic alkalosis**.\n\n---\n\n### Q154. \n**A 5-year-old child is brought to the ER screaming in agony, drawing his legs tightly to his chest. The pain vanishes after 10 minutes, leaving him lethargic, only to return violently 20 minutes later. An abdominal ultrasound expertly visualizes a classic \"target sign\" or \"donut sign\" in the right lower quadrant, representing telescoped bowel. What is the SINGLE BEST definitive non-operative treatment?**\nA) Immediate administration of high-dose intravenous steroids\nB) Image-guided, controlled pneumatic (air) or hydrostatic enema\nC) Endoscopic balloon dilation\nD) Administration of a potent prokinetic agent (e.g., Metoclopramide)\n\n**Answer: B** — **Intussusception**—Once diagnosed via the ultrasound target sign, an **air or contrast enema** is administered. The steady, controlled pressure pushes the telescoped bowel back into its normal anatomical position, curing the condition in >80% of cases without surgery.\n\n---\n\n### Q155. \n**A 1-year-old child with a known diagnosis of Cystic Fibrosis is brought to the clinic for severe failure to thrive. Despite eating voraciously, his weight has dropped below the 5th percentile. His diapers are filled with enormous, greasy, incredibly foul-smelling, and difficult-to-flush stools. What is the SINGLE BEST, most accurate diagnostic stool test to confirm the specific physiological cause of his malabsorption?**\nA) Fecal elastase-1 measurement\nB) Stool culture for Clostridium difficile\nC) Microscopic analysis for ova and parasites\nD) Fecal occult blood test\n\n**Answer: A** — **Pancreatic Exocrine Insufficiency (in CF)**—Thick secretions destroy the pancreatic ducts, preventing digestive enzymes from reaching the gut. A severely low **Fecal elastase-1** level conclusively proves profound pancreatic failure, mandating immediate oral pancreatic enzyme replacement therapy.\n\n---\n\n### Q156. \n**An 8-year-old boy is brought to the pediatrician by his frustrated parents. His teacher complains that he cannot stay in his seat, constantly interrupts, loses his homework daily, and acts as if \"driven by a motor.\" These behaviors occur both at home and at school and severely impair his academic performance. What is the universally accepted FIRST-LINE pharmacological treatment class?**\nA) Central Nervous System Stimulants (e.g., Methylphenidate or Amphetamine salts)\nB) Selective Serotonin Reuptake Inhibitors (e.g., Sertraline)\nC) Alpha-2 Adrenergic Agonists (e.g., Clonidine)\nD) Typical Antipsychotics (e.g., Haloperidol)\n\n**Answer: A** — **Attention-Deficit/Hyperactivity Disorder (ADHD)**—**CNS stimulants (Methylphenidate/Adderall)** paradoxically exert a profound calming and focusing effect by increasing dopamine and norepinephrine in the prefrontal cortex, remaining the undisputed first-line therapy.\n\n---\n\n### Q157. \n**A 12-year-old boy presents with a 2-year history of sudden, rapid, non-rhythmic motor movements (excessive eye blinking and violent shoulder shrugging). For the past 14 months, he has also exhibited sudden, uncontrollable bursts of throat clearing and grunting. These actions cause him immense social distress. What is the MOST LIKELY psychiatric diagnosis?**\nA) Chronic Motor Tic Disorder\nB) Obsessive-Compulsive Disorder (OCD)\nC) Tourette Syndrome\nD) Huntington's Disease\n\n**Answer: C** — **Tourette Syndrome**—The diagnosis strictly requires the presence of both **multiple motor tics AND at least one vocal/phonic tic** (e.g., grunting, throat clearing, or coprolalia) persisting for >1 year with onset before age 18.\n\n---\n\n### Q158. [Community Medicine — Biostatistics]\n**A landmark epidemiological cohort study tracks 10,000 heavy smokers and 10,000 non-smokers for exactly 10 years. Over the decade, the raw incidence of developing lung cancer is measured at 20 per 1,000 in the smoking group, and merely 2 per 1,000 in the non-smoking group. What is the exact Relative Risk (RR) of developing lung cancer due to smoking in this study?**\nA) 0.1\nB) 2\nC) 10\nD) 20\n\n**Answer: C** — **Relative Risk (RR)**—Calculated as the Incidence in the Exposed divided by the Incidence in the Unexposed. Here: 20 / 2 = **10**. Smokers have 10 times the risk of non-smokers.\n\n---\n\n### Q159. \n**In a retrospective hospital-based case-control study, researchers gather 200 patients diagnosed with severe lung cancer (Cases) and 200 healthy patients (Controls). Upon reviewing their histories, they determine that the mathematical odds of being a heavy smoker in the Case group is 4, while the odds of being a heavy smoker in the Control group is exactly 1. What is the calculated Odds Ratio (OR)?**\nA) 4\nB) 1\nC) 0.25\nD) 8\n\n**Answer: A** — **Odds Ratio (OR)**—The ratio of the odds of exposure among cases to the odds of exposure among controls. Here: 4 / 1 = **4**. The odds of having been a smoker are 4 times higher in the cancer group.\n\n---\n\n### Q160. \n**A brand new, highly publicized screening test for a lethal virus boasts a Sensitivity of 80% and a Specificity of 90%. However, this virus is extremely rare, with a true population prevalence of only 5%. Based on Bayes' theorem, what is the Negative Predictive Value (NPV) of this test?**\nA) 80.0%\nB) 98.8%\nC) 90.0%\nD) 50.0%\n\n**Answer: B** — **NPV Calculation**—Because the disease is so rare (5%), if a person tests *negative*, they are almost certainly truly negative. NPV = True Negatives / All Negatives. Mathematically: [0.90 × 0.95] / [(0.20 × 0.05) + (0.90 × 0.95)] = 0.855 / 0.865 = **98.8%**. In rare diseases, NPV is exceptionally high.\n\n---\n\n### Q161. \n**The Total Fertility Rate (TFR) represents the average number of children a woman would bear over her lifetime. According to the monumental National Family Health Survey (NFHS-5, 2019-21) data, what vital demographic milestone has the overall TFR of India finally achieved?**\nA) 4.0\nB) 3.2\nC) 2.0 (The critical Replacement Level of fertility)\nD) 1.2\n\n**Answer: C** — **NFHS-5 TFR**—India's TFR officially dropped from 2.2 to **2.0**, successfully hitting and slightly dipping below the recognized population replacement level (2.1), indicating massive demographic stabilization.\n\n---\n\n### Q162. \n**A mother asks the community health worker when her infant should receive the measles-containing vaccines. According to the strict guidelines of the Universal Immunization Programme (UIP) in India, at what exact ages are the FIRST and SECOND doses of the MR (Measles-Rubella) vaccine scheduled to be administered?**\nA) At birth and 6 weeks\nB) At 9 completed months and 16-24 months\nC) At 12 completed months and 4-6 years\nD) At 15 completed months and 5 years\n\n**Answer: B** — **MR Vaccine Schedule (India UIP)**—The first dose of MR is given at **9 completed months** (when maternal antibodies wane), and the critical second booster dose is given at **16-24 months** of age.\n\n---\n\n### Q163. \n**A 55-year-old male with a 40-pack-year chronic smoking history presents with a persistently hoarse voice lasting 4 months. He has no pain or difficulty swallowing. Direct fiberoptic laryngoscopy reveals that his entire left vocal cord is completely paralyzed and fixed in the paramedian position. The right cord moves normally. What is the MOST LIKELY sinister underlying cause of this specific nerve palsy?**\nA) An apical lung tumor (Pancoast tumor) or mediastinal lymphadenopathy compressing the Recurrent Laryngeal Nerve\nB) A benign, massive vocal cord polyp mechanically blocking movement\nC) Chronic severe acid reflux laryngitis\nD) An acoustic neuroma pressing on the brainstem\n\n**Answer: A** — **Unilateral Left Vocal Cord Paralysis**—The left recurrent laryngeal nerve loops deeply down under the aortic arch in the thorax before ascending. Any hoarseness with cord paralysis in a heavy smoker is an **apical/mediastinal lung malignancy** until proven otherwise via chest CT.\n\n---\n\n### Q164. \n**A 60-year-old male with long-standing, poorly controlled hypertension and glaucoma presents to the emergency eye clinic. He woke up this morning with profound, painless loss of vision in his right eye. Fundoscopic examination reveals extensive, massive retinal hemorrhages, severe macular edema, and engorged, tortuous veins, creating a dramatic \"blood and thunder\" appearance. What is the SINGLE BEST diagnosis?**\nA) Central Retinal Artery Occlusion (CRAO)\nB) Central Retinal Vein Occlusion (CRVO)\nC) Acute Angle-Closure Glaucoma\nD) Retinal Detachment\n\n**Answer: B** — **Central Retinal Vein Occlusion (CRVO)**—A classic vascular catastrophe in hypertensive/glaucoma patients. The blockage of venous outflow causes immense back-pressure, bursting the retinal capillaries and producing the pathognomonic **\"blood and thunder\"** hemorrhages.\n\n---\n\n### Q165. \n**A 65-year-old male is newly diagnosed with primary open-angle glaucoma. His ophthalmologist prescribes daily Timolol maleate ophthalmic drops to lower his intraocular pressure. Two days later, he presents to the ER with severe shortness of breath, a tight chest, and diffuse bilateral wheezing. What critical piece of his medical history did the physician likely ignore?**\nA) A history of deep vein thrombosis\nB) A history of mild to moderate Asthma or COPD\nC) A history of peptic ulcer disease\nD) A history of benign prostatic hyperplasia\n\n**Answer: B** — **Timolol Ophthalmic Side Effects**—Timolol is a powerful, non-selective beta-blocker. Eye drops bypass first-pass hepatic metabolism and are absorbed directly into the systemic circulation, where they block pulmonary Beta-2 receptors, precipitating deadly **bronchospasm in asthmatics**.\n\n---\n\n### Q166. \n**A 30-year-old female presents to her primary care doctor in tears. For the past 8 months, she has been crippled by an overwhelming, uncontrollable worry about her job, her health, her children's safety, and her finances. The anxiety causes severe muscle tension, irritability, and chronic insomnia. She has no distinct panic attacks. What is the MOST LIKELY psychiatric diagnosis?**\nA) Social Anxiety Disorder\nB) Obsessive-Compulsive Disorder (OCD)\nC) Generalized Anxiety Disorder (GAD)\nD) Post-Traumatic Stress Disorder (PTSD)\n\n**Answer: C** — **Generalized Anxiety Disorder (GAD)**—Defined precisely by excessive, pervasive, and difficult-to-control worry about multiple everyday domains, persisting for **more than 6 months**, accompanied by somatic symptoms (muscle tension, insomnia).\n\n---\n\n### Q167. \n**A 25-year-old male is brought to the ER by police after a violent altercation. He is violently agitated, aggressively paranoid, and claims he has superhuman strength. Vital signs show a heart rate of 145 bpm and a blood pressure of 210/120 mmHg. Physical exam reveals massively dilated pupils (mydriasis) and severe diaphoresis. What specific substance intoxication is MOST LIKELY driving this sympathetic overdrive?**\nA) Cocaine\nB) Heroin (Opioids)\nC) Alcohol\nD) Benzodiazepines\n\n**Answer: A** — **Cocaine Intoxication**—A potent sympathomimetic that blocks the reuptake of dopamine, norepinephrine, and serotonin. It produces the classic toxidrome of intense euphoria/agitation, massive hypertension, tachycardia, and **mydriasis (dilated pupils)**.\n\n---\n\n### Q168. \n**A 35-year-old female with a long history of severe schizophrenia has been maintained on high-dose Haloperidol. She is brought to the ER completely mute and locked in a state of severe \"lead-pipe\" muscle rigidity. Her core temperature is a staggering 41.5°C (106.7°F). Blood work reveals a massive CPK level of 25,000 U/L. What is the SINGLE BEST, life-saving pharmacological antidote?**\nA) Intravenous Naloxone\nB) Intravenous Dantrolene\nC) High-dose Haloperidol to control the psychosis\nD) Intravenous Flumazenil\n\n**Answer: B** — **Neuroleptic Malignant Syndrome (NMS)**—A lethal, idiosyncratic reaction to dopamine-blocking antipsychotics causing lead-pipe rigidity, hyperthermia, and rhabdomyolysis. **Dantrolene** (a direct muscle relaxant) and Bromocriptine (a dopamine agonist) are the specific antidotes.\n\n---\n\n### Q169. \n**A 50-year-old male resident of a psychiatric facility has been taking first-generation antipsychotics for 20 years. Recently, the nursing staff notes he has developed constant, uncontrollable lip-smacking, tongue darting, and facial grimacing. His psychiatrist diagnoses Tardive Dyskinesia. What is the SINGLE BEST pharmacological strategy to specifically treat these involuntary movements?**\nA) Immediately and abruptly stop all antipsychotic medications\nB) Administer high-dose anticholinergics like Benztropine\nC) Initiate a Vesicular Monoamine Transporter 2 (VMAT2) inhibitor, such as Valbenazine or Tetrabenazine\nD) Increase the dose of his current first-generation antipsychotic\n\n**Answer: C** — **Tardive Dyskinesia**—Caused by long-term dopamine receptor supersensitivity. Abruptly stopping the drug paradoxically worsens the movements. **VMAT2 inhibitors (Valbenazine/Tetrabenazine)** deplete presynaptic dopamine and are the first FDA-approved treatments specifically for TD.\n\n---\n\n### Q170. \n**A 30-year-old male presents to the dermatology clinic frustrated by a chronic facial rash. Examination reveals sharply demarcated, erythematous plaques covered in distinct, greasy, yellowish scales. The rash is perfectly localized to his nasolabial folds, eyebrows, and the glabella. What is the MOST LIKELY diagnosis?**\nA) Plaque Psoriasis\nB) Seborrheic Dermatitis\nC) Atopic Dermatitis\nD) Rosacea\n\n**Answer: B** — **Seborrheic Dermatitis**—An inflammatory reaction to Malassezia yeast thriving in sebum-rich areas. The presence of **greasy, yellow scales strictly on the nasolabial folds and eyebrows** is highly pathognomonic.\n\n---\n\n### Q171. \n**A 65-year-old male presents to the clinic with severe, agonizing, burning pain wrapping around the right side of his rib cage. The pain began one month ago during an acute blistering rash, but the rash has completely healed, leaving only faint scars. The skin is exquisitely sensitive to even the lightest touch of his shirt (allodynia). What is the SINGLE BEST first-line pharmacological treatment for his current complaint?**\nA) A 10-day course of high-dose oral Acyclovir\nB) Daily oral Pregabalin, Gabapentin, or Amitriptyline\nC) Immediate surgical nerve block\nD) High-dose oral Corticosteroids\n\n**Answer: B** — **Post-Herpetic Neuralgia (PHN)**—The acute viral phase is over, so antivirals (Acyclovir) are utterly useless now. This is a severe, chronic neuropathic pain syndrome perfectly managed with neuromodulators like **Gabapentin/Pregabalin or TCAs (Amitriptyline)**.\n\n---\n\n### Q172. \n**A 60-year-old female with a history of diabetes presents with a sudden, widespread eruption of massive, tense, fluid-filled blisters over her lower abdomen and thighs. The blisters are exceptionally tough and do not rupture easily when pressed (Negative Nikolsky sign). A punch biopsy for direct immunofluorescence reveals a smooth, linear band of IgG and C3 deposits perfectly outlining the epidermal basement membrane. What is the diagnosis?**\nA) Pemphigus Vulgaris\nB) Dermatitis Herpetiformis\nC) Bullous Pemphigoid\nD) Erythema Multiforme\n\n**Answer: C** — **Bullous Pemphigoid**—An autoimmune attack against hemidesmosomes (BP180/BP230) anchoring the epidermis to the dermis. This creates deep, **tense bullae (negative Nikolsky)** and the classic **linear IgG deposition** at the basement membrane.\n\n---\n\n### Q173. \n**A 40-year-old male with a known history of Celiac disease presents with a fiercely, agonizingly itchy rash. Examination reveals symmetrically distributed, grouped, crusting vesicles primarily located on the extensor surfaces of his elbows, knees, and buttocks. What is the MOST LIKELY dermatological diagnosis?**\nA) Dermatitis Herpetiformis\nB) Bullous Pemphigoid\nC) Pemphigus Vulgaris\nD) Severe Scabies\n\n**Answer: A** — **Dermatitis Herpetiformis**—A profound cutaneous manifestation of gluten sensitivity (Celiac disease), caused by IgA antibody cross-reaction with epidermal transglutaminase, creating extremely pruritic vesicles on the **extensor surfaces**.\n\n---\n\n### Q174. \n**A 30-year-old female recently diagnosed with Systemic Lupus Erythematosus (SLE) presents to the clinic in July. She complains that her classic \"butterfly\" (malar) facial rash becomes fiercely red and painful every time she goes outside. Aside from systemic hydroxychloroquine therapy, what is the SINGLE BEST, most critical topical lifestyle intervention the physician must prescribe?**\nA) Daily application of high-potency fluorinated topical corticosteroids to the face\nB) Stringent, daily application of broad-spectrum SPF 50+ Sunscreen and strict UV avoidance\nC) Daily topical application of Tacrolimus ointment\nD) Washing the face with harsh salicylic acid scrubs\n\n**Answer: B** — **SLE Malar Rash (Photosensitivity)**—Lupus rashes are intensely driven by ultraviolet light-induced keratinocyte apoptosis. **Strict photoprotection with broad-spectrum sunscreen** and protective clothing is the absolute cornerstone and first-line topical defense against cutaneous lupus flares.\n\n---\n\n### Q175. [Forensic]\n**A dead body is discovered in an alleyway. The forensic pathologist observes a clean, gaping wound across the anterior neck. The wound is completely devoid of tissue bridging, its length on the skin surface is significantly greater than its deep internal penetration, and the edges are sharply defined. What is the precise forensic classification of this wound, and what is the MOST LIKELY weapon?**\nA) A deep stab wound caused by an ice pick\nB) A severe laceration caused by a blunt iron pipe\nC) An incised (slash) wound caused by a sharp-edged weapon like a knife or razor\nD) A chop wound caused by a heavy axe\n\n**Answer: C** — **Incised (Slash) Wound**—Created by drawing a sharp edge (knife/razor) across the skin. By forensic definition, an incised wound's **length is greater than its depth**, and the sharp blade leaves clean edges without tissue bridging (which is seen in blunt lacerations).\n\n---\n\n### Q176. \n**A dead body is brought to the morgue for autopsy following a shooting. The pathologist identifies a circular wound on the anterior chest. The edges of the wound are inverted (pushed inward), and there is a distinct, dark \"collar of abrasion\" ringing the very edge of the hole. There is no soot or gunpowder stippling on the surrounding skin. What is the MOST LIKELY forensic conclusion regarding this specific wound?**\nA) It is a distant-range entrance wound\nB) It is a contact-range exit wound\nC) It is a shrapnel laceration\nD) It is a stab wound disguised as a gunshot\n\n**Answer: A** — **Gunshot Entrance Wound**—The classic features of an entrance wound are **inverted edges and a friction \"abrasion collar\"** caused by the spinning bullet scraping the skin. The lack of soot/stippling indicates it was fired from a **distant range** (beyond 2-3 feet).\n\n---\n\n### Q177. \n**A 25-year-old female is pulled unconscious from a tightly sealed, running car parked in a closed garage. She is brought to the ER with tachycardia, a pounding headache, and notably bright \"cherry-red\" coloration of her lips and mucous membranes. What is the SINGLE BEST, most immediate, life-saving antidote?**\nA) Administration of 100% normobaric or hyperbaric Oxygen\nB) Intravenous infusion of Methylene Blue\nC) Intravenous Naloxone\nD) Intravenous Atropine\n\n**Answer: A** — **Carbon Monoxide (CO) Poisoning**—CO binds hemoglobin with 200x the affinity of oxygen, creating carboxyhemoglobin (cherry-red color). The only antidote is to competitively displace it using massive concentrations of **100% Oxygen** (decreasing the half-life of CO from 5 hours to 1 hour).\n\n---\n\n### Q178. \n**A 45-year-old male with a history of heavy binge drinking presents with agonizing epigastric pain radiating to his back. He is diagnosed with severe acute interstitial pancreatitis. The admitting physician calculates a specific scoring system based on his age, WBC count, blood glucose, LDH, and AST levels taken directly at admission, and plans to recalculate it at 48 hours to predict his mortality risk. What is the name of this classic prognostic scoring system?**\nA) The Ranson Criteria\nB) The MELD Score\nC) The Child-Pugh Score\nD) The Glasgow Coma Scale\n\n**Answer: A** — **The Ranson Criteria**—The oldest, most classic, and frequently tested surgical scoring system used specifically to predict the severity and mortality of **acute pancreatitis**, calculated exactly at admission and then again at 48 hours.\n\n---\n\n### Q179. \n**A 60-year-old male with chronic kidney disease and a mechanical mitral valve is on long-term Warfarin therapy. He trips, falls, and sustains a minor, slowly oozing laceration on his arm. In the ER, his routine INR is checked and returns at a dangerously high 8.5. He has no life-threatening internal bleeding. What is the SINGLE BEST evidence-based pharmacological management to safely lower his INR?**\nA) Continue his normal dose of Warfarin and apply a tight bandage\nB) Hold the Warfarin entirely and administer a small dose of oral Vitamin K (1-2.5 mg)\nC) Administer immediate, massive doses of Fresh Frozen Plasma (FFP)\nD) Administer high-dose Intravenous Protamine Sulfate\n\n**Answer: B** — **Warfarin Reversal (INR >8.0, no severe bleeding)**—Guidelines explicitly dictate to **hold the Warfarin and administer oral Vitamin K**. FFP or Prothrombin Complex Concentrate (PCC) is strictly reserved for *major/life-threatening* bleeding emergencies.\n\n---\n\n### Q180. \n**A 30-year-old male presents to the clinic complaining of recurrent, severe epistaxis since childhood and bleeding heavily after dental extractions. His father suffers from the exact same issue. Lab tests reveal a normal platelet count, a normal PT, a mildly prolonged aPTT, and a profoundly prolonged Bleeding Time. A quantitative assay confirms decreased von Willebrand Factor (vWF) antigen. He is scheduled for a minor tooth extraction tomorrow. What is the SINGLE BEST, non-blood-product prophylactic treatment?**\nA) Intravenous administration of Desmopressin (DDAVP)\nB) Prophylactic infusion of Cryoprecipitate\nC) Immediate transfusion of pooled Platelets\nD) Oral administration of high-dose Vitamin K\n\n**Answer: A** — **von Willebrand Disease (Type 1)**—The most common inherited bleeding disorder. **Desmopressin (DDAVP)** is a synthetic ADH analog that forcefully stimulates endothelial cells (Weibel-Palade bodies) to dump massive, stored reserves of vWF and Factor VIII directly into the blood, providing excellent prophylaxis for minor surgeries.\n\n---\n\n## 📋 PREPRIGA AUDITED ANSWER KEY — SET 3\n\n| Q | Ans | Q | Ans | Q | Ans | Q | Ans | Q | Ans | Q | Ans |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | C | 31 | A | 61 | C | 91 | A | 121 | C | 151 | A |\n| 2 | D | 32 | B | 62 | C | 92 | B | 122 | D | 152 | A |\n| 3 | A | 33 | B | 63 | A | 93 | C | 123 | A | 153 | C |\n| 4 | B | 34 | C | 64 | A | 94 | B | 124 | B | 154 | B |\n| 5 | C | 35 | A | 65 | A | 95 | A | 125 | C | 155 | A |\n| 6 | B | 36 | B | 66 | D | 96 | A | 126 | A | 156 | A |\n| 7 | A | 37 | C | 67 | A | 97 | A | 127 | A | 157 | C |\n| 8 | C | 38 | C | 68 | A | 98 | C | 128 | B | 158 | C |\n| 9 | B | 39 | A | 69 | C | 99 | B | 129 | C | 159 | A |\n| 10 | D | 40 | B | 70 | B | 100 | B | 130 | D | 160 | B |\n| 11 | B | 41 | C | 71 | C | 101 | C | 131 | A | 161 | C |\n| 12 | B | 42 | D | 72 | B | 102 | B | 132 | A | 162 | B |\n| 13 | B | 43 | A | 73 | C | 103 | A | 133 | C | 163 | A |\n| 14 | A | 44 | B | 74 | B | 104 | C | 134 | B | 164 | B |\n| 15 | C | 45 | C | 75 | A | 105 | A | 135 | A | 165 | B |\n| 16 | B | 46 | C | 76 | B | 106 | D | 136 | B | 166 | C |\n| 17 | B | 47 | A | 77 | C | 107 | A | 137 | C | 167 | A |\n| 18 | D | 48 | B | 78 | D | 108 | A | 138 | B | 168 | B |\n| 19 | C | 49 | B | 79 | A | 109 | C | 139 | A | 169 | C |\n| 20 | B | 50 | D | 80 | B | 110 | B | 140 | B | 170 | B |\n| 21 | C | 51 | A | 81 | B | 111 | A | 141 | C | 171 | B |\n| 22 | A | 52 | C | 82 | D | 112 | B | 142 | A | 172 | C |\n| 23 | B | 53 | A | 83 | A | 113 | C | 143 | A | 173 | A |\n| 24 | C | 54 | B | 84 | B | 114 | D | 144 | C | 174 | B |\n| 25 | C | 55 | A | 85 | C | 115 | A | 145 | C | 175 | C |\n| 26 | B | 56 | ext up is Set 4, closing out the entire high-yield curriculum.**","4":"# Prepriga Exclusive: NEET PG 2026 — SET 4: The Nutritional, Infectious & Pediatric Surgery Mastery\n\n> **⚠️ STRATEGIC NOTE:** This Set-4 is built on **the remaining 60% of the syllabus that hasn't been covered yet**—vitamin deficiencies, fungal/parasitic/rickettsial diseases, pediatric surgical emergencies (pyloric stenosis, TEF, imperforate anus), psychopharmacology, biostatistics, medical ethics, and electrolyte disorders. **This is your \"finishing kick.\"**\n\n---\n\n## 📊 THE 2026 SHIFT: WHAT HAS CHANGED (Reminder)\n\n| Parameter | Pre-2026 | NEET PG 2026 |\n|-----------|----------|--------------|\n| Total Questions | 200 | **180** |\n| Total Marks | 800 | **720** |\n| Questions/Section | 40 | **36** |\n| Sections | 5 (A–E) | 5 (A–E)—**unchanged** |\n| Time/Section | 42 min | **42 min—unchanged** |\n| Total Duration | 3.5 hrs | **3.5 hrs—unchanged** |\n\n**Key Insight:** Same time, fewer questions = **~70 seconds per question** (vs ~63 sec earlier). But **each question now carries more relative weight**. Conceptual depth > speed.\n\n---\n\n## 🎯 SET 4 — FULL PAPER (180 Questions | 5 Sections | 720 Marks)\n\n---\n\n# SECTION A — MEDICINE & ALLIED (36 Questions)\n\n---\n\n### Q1. [Image-Based — Fundoscopy]\n**A 45-year-old male with a severe history of alcohol and tobacco use disorder presents with bilateral, painless, progressive visual loss. Fundoscopy (Image: temporal pallor of the optic disc, bilateral). He has a macrocytic anemia. What is the SINGLE BEST immediate management for this toxic-nutritional optic neuropathy?**\nA) IV Thiamine\nB) Intramuscular Vitamin B12 and oral Folic acid\nC) Vitamin A supplementation\nD) IV Vitamin C\n\n**Answer: B** — **Tobacco-Alcohol Amblyopia (Toxic-Nutritional Optic Neuropathy)**—Caused by profound deficiencies in **Vitamin B12 and Folate**, leading to demyelination of the optic nerve (temporal pallor). Thiamine handles Wernicke's, but B12 handles this visual loss.\n\n---\n\n### Q2. \n**A 6-month-old exclusively breastfed infant presents with irritability, a high-pitched cry, and a bulging fontanelle. Serum calcium is 5.5 mg/dL, phosphorus is 2.0 mg/dL, and alkaline phosphatase is 1200 U/L. What is the SINGLE BEST treatment?**\nA) Oral calcium gluconate\nB) IV calcium gluconate\nC) Vitamin D (cholecalciferol) 600,000 IU IM (Stoss therapy)\nD) Magnesium sulfate\n\n**Answer: C** — **Infantile rickets** (hypocalcemia, low phosphorus, high ALP) due to severe Vitamin D deficiency. Treatment is **high-dose Vitamin D (Stoss therapy)**. (IV calcium is strictly for active tetany/seizures).\n\n---\n\n### Q3. \n**A 40-year-old male with a history of gastric bypass surgery presents with paresthesias, glossitis, and a macrocytic anemia. Serum homocysteine is elevated, but methylmalonic acid (MMA) is strictly normal. What is the deficient vitamin?**\nA) Vitamin B12\nB) Vitamin B6\nC) Vitamin B1\nD) Folic acid (Vitamin B9)\n\n**Answer: D** — **Folic acid deficiency**—Presents with macrocytic anemia and ↑homocysteine, but **normal MMA**. (Vitamin B12 deficiency elevates *both* homocysteine and MMA).\n\n---\n\n### Q4. \n**A 45-year-old male with a history of pulmonary tuberculosis currently on the RIPE regimen presents with a new-onset sensory neuropathy in a \"glove and stocking\" distribution. Which vitamin must be supplemented?**\nA) Vitamin B12\nB) Vitamin B6 (Pyridoxine)\nC) Vitamin B1\nD) Vitamin B3\n\n**Answer: B** — **Isoniazid (INH) toxicity**—INH actively depletes **Vitamin B6 (Pyridoxine)**, leading to peripheral neuropathy.\n\n---\n\n### Q5. \n**A 30-year-old female presents with a distinct necklace-like dermatitis (Casal's necklace), chronic diarrhea, and mild dementia. She relies almost entirely on a corn-based diet. What is the SINGLE BEST source to replenish her deficient vitamin?**\nA) Citrus fruits\nB) Milk and eggs\nC) Meat, fish, and enriched grains\nD) Green leafy vegetables\n\n**Answer: C** — **Pellagra (Niacin/B3 deficiency)**—Niacin is synthesized from tryptophan. **Meat, fish, and enriched grains** are the best dietary sources to replenish Niacin/Tryptophan.\n\n---\n\n### Q6. \n**A 55-year-old male with chronic pancreatitis and severe exocrine insufficiency presents with night blindness and dry, thickened conjunctivae (xerophthalmia). Which vitamin deficiency is MOST LIKELY responsible?**\nA) Vitamin E\nB) Vitamin K\nC) Vitamin A\nD) Vitamin D\n\n**Answer: C** — **Vitamin A deficiency**—Fat malabsorption in pancreatic insufficiency leads to deficiency of fat-soluble vitamins (ADEK). Night blindness and xerophthalmia are the hallmarks of Vitamin A loss.\n\n---\n\n### Q7. \n**A 25-year-old male presents with acute pleuritic chest pain that improves when leaning forward. ECG shows diffuse ST-segment elevation with PR-segment depression. Echocardiography shows a trace pericardial effusion. What is the SINGLE BEST pharmacological treatment?**\nA) Corticosteroids\nB) Colchicine + NSAIDs\nC) Broad-spectrum antibiotics\nD) Pericardiocentesis\n\n**Answer: B** — **Acute idiopathic/viral pericarditis**—**NSAIDs + Colchicine** is the gold standard regimen to reduce inflammation and significantly prevent recurrence.\n\n---\n\n### Q8. \n**A 68-year-old male with a 40-pack-year smoking history visits his primary care physician for a routine checkup. He has no abdominal pain. According to USPSTF guidelines, what is the SINGLE BEST screening recommendation for an abdominal aortic aneurysm (AAA) in this patient?**\nA) No screening is indicated if asymptomatic\nB) CT Angiography of the abdomen\nC) One-time screening with abdominal ultrasound\nD) Annual physical palpation of the abdomen\n\n**Answer: C** — **AAA Screening**—The USPSTF strongly recommends a **one-time screening abdominal ultrasound** for AAA in men aged 65 to 75 years who have ever smoked.\n\n---\n\n### Q9. \n**A 45-year-old male with diabetes and end-stage renal disease (ESRD) misses dialysis. He presents with a serum p
