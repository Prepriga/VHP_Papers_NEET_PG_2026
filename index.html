<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#080B10">
<title>Prepriga Exclusive · NEET PG 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=block" rel="stylesheet">
<style>
:root{
  --f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --m:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --red:#E2373F; --orange:#EF8B23; --yellow:#EFC521; --slate:#6C7787;
  --teal:#2F9E8F; --violet:#7A5AF8;
  --bg:#080B10; --bg2:#0E1319; --card:#141A22; --card2:#1A222C;
  --tx:#F2F5F8; --tx2:#A8B4C2; --tx3:#6C7A8A; --line:#232C38; --line2:#313D4C;
  --grad:linear-gradient(90deg,var(--red) 0 24%,var(--orange) 24% 48%,var(--yellow) 48% 72%,var(--slate) 72%);
  --ok:#2E9E63; --no:#D8443C; --mark:#7A4FD1;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:16px;line-height:1.55;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--m)}
.bar{height:4px;background:var(--grad)}
.wrap{max-width:780px;margin:0 auto;padding:24px 18px 120px}
.eyebrow{font-family:var(--m);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--tx3)}
h1{font-weight:900;letter-spacing:-.035em;font-size:clamp(30px,8.2vw,52px);line-height:1.02;margin:10px 0 10px}
h1 i{color:var(--red);font-style:normal}
h2{font-size:clamp(19px,4.6vw,24px);letter-spacing:-.02em;font-weight:800;margin:30px 0 12px}
.lede{color:var(--tx2);font-size:16.5px;line-height:1.62;margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;
  background:var(--red);color:#fff;border:0;border-radius:14px;padding:16px 20px;font-weight:750;
  font-size:17px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.gh{background:transparent;border:1px solid var(--line2);color:var(--tx)}
.btn.ok{background:var(--ok)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px}.row>.btn{flex:1}
.field label{display:block;font-family:var(--m);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:8px}
.field input{width:100%;background:#0B1015;border:1px solid var(--line2);border-radius:12px;
  padding:16px;color:var(--tx);font-size:17px}
.field input::placeholder{color:#4C5867}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:18px}
.note{color:var(--tx3);font-size:13.5px;line-height:1.55}

/* ---------- gate ---------- */
.gate{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:32px 18px calc(32px + env(safe-area-inset-bottom,0px));position:relative;overflow:hidden}
.gate .in{max-width:460px;margin:0 auto;width:100%;position:relative;z-index:2}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
.orb.a{width:340px;height:340px;background:rgba(226,55,63,.34);top:-110px;right:-110px}
.orb.b{width:300px;height:300px;background:rgba(122,90,248,.22);bottom:-120px;left:-110px}

/* ---------- welcome ---------- */
.hello{position:relative;border-radius:22px;overflow:hidden;background:
  radial-gradient(120% 140% at 100% 0%,rgba(226,55,63,.24),transparent 55%),var(--card);
  border:1px solid var(--line);padding:26px 22px;margin-bottom:16px}
.hello .nm{font-weight:900;letter-spacing:-.035em;font-size:clamp(28px,7.4vw,44px);line-height:1.05}
.hello .msg{color:var(--tx2);font-size:16.5px;line-height:1.6;margin:12px 0 0}
.hello .msg b{color:var(--tx)}
.count{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.count div{flex:1;min-width:74px;background:#0C1116;border:1px solid var(--line);
  border-radius:13px;padding:12px 10px;text-align:center}
.count .v{font-weight:900;font-size:23px;letter-spacing:-.02em;line-height:1;font-family:var(--m)}
.count .l{font-family:var(--m);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tx3);margin-top:6px}

/* ---------- set vault ---------- */
.set{position:relative;display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:0;margin-bottom:14px;overflow:hidden;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.set .spine{height:5px;background:var(--sg,var(--grad))}
.set .bd{padding:18px}
.set .no{font-family:var(--m);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--tx3)}
.set h3{font-weight:850;letter-spacing:-.025em;font-size:21px;line-height:1.2;margin:7px 0 6px}
.set p{color:var(--tx2);font-size:14.5px;margin:0 0 14px;line-height:1.5}
.set .meta{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--m);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.set .hook{font-weight:800;letter-spacing:-.015em;font-size:15.5px;line-height:1.35;
  color:var(--tx);margin:-4px 0 14px;padding-left:11px;border-left:3px solid var(--hk,var(--red))}
.pips{display:flex;gap:4px;margin-top:14px}
.pips i{flex:1;height:5px;border-radius:3px;background:#2A3542}
.pips i.on{background:var(--ok)}
.pips i.spent{background:#3A2429}
.set.locked{opacity:.55}
.set.locked .bd::after{content:"Coming soon";display:inline-block;margin-top:10px;font-family:var(--m);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);
  border:1px solid var(--line2);border-radius:20px;padding:5px 11px}
.set.out .pips i{background:#3A2429}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-family:var(--m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:20px;padding:4px 9px;color:var(--tx2)}
.tag.hot{border-color:rgba(226,55,63,.5);color:#F1868B}

/* ---------- exam ---------- */
.exam{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.xhd{flex:none;background:var(--bg2);border-bottom:1px solid var(--line)}
.xr{display:flex;align-items:center;gap:12px;padding:10px 14px}
.xr .nm{font-weight:800;font-size:14.5px;letter-spacing:-.01em;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xr .sb{font-family:var(--m);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.clock{font-family:var(--m);font-weight:700;font-size:17px;background:#0B1015;border:1px solid var(--line2);
  border-radius:10px;padding:7px 11px;flex:none;font-variant-numeric:tabular-nums;text-align:center}
.clock small{display:block;font-size:7.5px;letter-spacing:.18em;color:var(--tx3);font-weight:500}
.clock.warn{border-color:var(--orange);color:var(--orange)}
.clock.crit{border-color:var(--no);color:var(--no);animation:pl 1.1s infinite}
@keyframes pl{50%{opacity:.55}}
.secs{display:flex;overflow-x:auto;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.secs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 15px;
  font-size:12.5px;font-weight:700;color:var(--tx3);white-space:nowrap;cursor:pointer}
.secs button[aria-pressed=true]{color:var(--tx);border-bottom-color:var(--red)}
.secs button.done{color:#3E4A58}
.xb{flex:1;display:flex;min-height:0}
.qp{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.qtop{display:flex;align-items:center;gap:10px;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:10px 16px;position:sticky;top:0;z-index:5}
.qtop .qn{font-weight:750;font-size:14.5px}
.qtop .mk{margin-left:auto;font-family:var(--m);font-size:10.5px;display:flex;gap:8px}
.qtop .p{color:var(--ok)} .qtop .n{color:var(--no)}
.qbox{padding:18px 16px 26px}
.qtag{display:inline-block;font-family:var(--m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:20px;padding:4px 10px;color:var(--tx2);margin-bottom:14px}
.qtag.img{border-color:rgba(122,90,248,.55);color:#B4A2FF}
.stem{font-size:17px;line-height:1.62;margin-bottom:18px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.opts li{border:1.5px solid var(--line2);border-radius:13px;background:var(--card)}
.opts button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;
  border:0;padding:14px 15px;min-height:56px;cursor:pointer;border-radius:12px}
.opts .lt{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);
  display:grid;place-items:center;font-family:var(--m);font-size:12px;font-weight:700;color:var(--tx3)}
.opts .tx{flex:1;font-size:16px;line-height:1.5}
.opts li.sel{border-color:var(--violet);background:rgba(122,90,248,.12)}
.opts li.sel .lt{background:var(--violet);border-color:var(--violet);color:#fff}
.opts li.ok{border-color:var(--ok);background:rgba(46,158,99,.12)}
.opts li.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opts li.bad{border-color:var(--no);background:rgba(216,68,60,.12)}
.opts li.bad .lt{background:var(--no);border-color:var(--no);color:#fff}
.xn{flex:none;background:var(--bg2);border-top:1px solid var(--line);padding:9px 12px;
  padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));display:grid;
  grid-template-columns:46px 1fr 1fr 1fr;gap:7px}
.xn button{border:1px solid var(--line2);background:transparent;border-radius:10px;padding:12px 6px;
  font-size:12.5px;font-weight:700;cursor:pointer;min-width:0}
.xn .next{grid-column:1/-1;background:var(--ok);border-color:var(--ok);color:#fff;padding:15px;font-size:15px}
.xn .mark{color:#B79BF0;border-color:#3A2F55}
.pal{flex:none;width:266px;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.pal .ph{padding:11px 14px;border-bottom:1px solid var(--line);font-family:var(--m);font-size:9.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--tx3)}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.lg div{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--tx2)}
.lg i{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;
  font-weight:700;color:#fff;font-style:normal;font-family:var(--m);flex:none}
.grid{flex:1;overflow-y:auto;padding:12px 14px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;align-content:start}
.grid button{aspect-ratio:1;border:0;border-radius:7px;font-family:var(--m);font-size:12px;font-weight:700;
  cursor:pointer;color:#fff;background:#2A3542;position:relative}
.grid button.nv{background:#1B232D;color:var(--tx3);box-shadow:inset 0 0 0 1px var(--line2)}
.grid button.na{background:var(--no)} .grid button.ans{background:var(--ok)}
.grid button.mark,.grid button.both{background:var(--mark)}
.grid button.both::after{content:"";position:absolute;right:2px;bottom:2px;width:9px;height:9px;
  border-radius:50%;background:var(--ok);box-shadow:0 0 0 1.5px var(--bg2)}
.grid button.cur{outline:2.5px solid var(--tx);outline-offset:1.5px}
.pal .pf{border-top:1px solid var(--line);padding:11px 14px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(4,7,10,.7);display:none}
.sheet.on{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-radius:18px 18px 0 0;
  max-height:80vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
  border-top:1px solid var(--line)}
.hnd{width:38px;height:4px;background:var(--line2);border-radius:3px;margin:9px auto 3px}
@media (max-width:880px){.pal{display:none}}
@media (min-width:881px){.xn .palb{display:none}.xn{grid-template-columns:46px 1fr 1fr 220px}
  .xn .next{grid-column:auto}}

/* ---------- result ---------- */
.score{background:linear-gradient(150deg,#171F2A,#0E141B);border:1px solid var(--line);
  border-radius:20px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.score .v{font-weight:900;font-size:clamp(42px,12vw,64px);letter-spacing:-.04em;line-height:1;font-family:var(--m)}
.score .v span{font-size:22px;color:var(--tx3)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.stat>div{background:var(--card);padding:13px 10px}
.stat .v{font-weight:800;font-size:21px;letter-spacing:-.02em;font-family:var(--m)}
.stat .l{font-family:var(--m);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--tx3);margin-top:4px}
.mtr{height:8px;border-radius:5px;background:#1D2530;overflow:hidden}
.mtr i{display:block;height:100%;background:var(--ok)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.rev .rh{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.rev .rn{font-family:var(--m);font-size:11.5px;font-weight:700;letter-spacing:.1em}
.pill{font-family:var(--m);font-size:9px;letter-spacing:.12em;text-transform:uppercase;border-radius:20px;
  padding:3px 9px;font-weight:700;margin-left:auto}
.pill.ok{background:rgba(46,158,99,.18);color:#5FD196}
.pill.bad{background:rgba(216,68,60,.18);color:#F08A83}
.pill.skip{background:#1D2530;color:var(--tx3)}
.exp{margin-top:13px;border-top:1px solid var(--line);padding-top:12px;font-size:15px;line-height:1.6;color:var(--tx2)}
.exp b{color:var(--tx)}
.filters{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line2);background:transparent;border-radius:20px;
  padding:8px 14px;font-size:13px;font-weight:650;cursor:pointer;color:var(--tx3)}
.filters button[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;background:var(--card2);
  border:1px solid var(--line2);color:var(--tx);padding:13px 18px;border-radius:12px;font-size:14.5px;
  max-width:88vw;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.drop{border:1.5px dashed var(--line2);border-radius:16px;padding:24px 16px;text-align:center}
.drop.hot{border-color:var(--orange)}
table.d{width:100%;border-collapse:collapse;font-size:14px}
table.d th{text-align:left;font-family:var(--m);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tx3);padding:9px 8px;border-bottom:1px solid var(--line2)}
table.d td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.d tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<div class="bar"></div>
<div id="app"></div>

<div class="exam" id="exam" style="display:none">
  <div class="bar"></div>
  <header class="xhd">
    <div class="xr">
      <div style="min-width:0;flex:1">
        <div class="nm" id="xName">Paper</div>
        <div class="sb" id="xWho">Candidate</div>
      </div>
      <div class="clock" id="xClock">--:--<small>SECTION</small></div>
    </div>
    <div class="secs" id="xSecs"></div>
  </header>
  <div class="xb"><div class="qp" id="xPane"></div><aside class="pal" id="xPal"></aside></div>
  <nav class="xn" id="xNav"></nav>
</div>

<div class="sheet" id="sheet"><div class="in"><div class="hnd"></div>
  <div id="sheetIn" style="overflow-y:auto"></div></div></div>
<input type="file" id="fPick" accept=".md,.markdown,.txt,.csv" multiple="" hidden="">
