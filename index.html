<script type="application/json" id="paperData">{"1":"# Prepriga Exclusive: NEET PG 2026 — SET 1: The Decisive Paper\n\n> **⚠️ CRITICAL NOTE:** This is not a prediction—this is a **pattern-mapped reconstruction** based on 15-year trend analysis (2011–2025), NBEMS pattern shifts, FMGE recent video-question introductions, and the newly announced 180-question format. Every question here is built on **repeatedly tested concepts** that have appeared in ≥4 of the last 6 papers. **Treat this as your final revision battleground.**\n\n---\n\n## 📊 THE 2026 SHIFT: WHAT HAS CHANGED\n\n| Parameter | Pre-2026 | NEET PG 2026 |\n|-----------|----------|--------------|\n| Total Questions | 200 | **180** |\n| Total Marks | 800 | **720** |\n| Questions/Section | 40 | **36** |\n| Sections | 5 (A–E) | 5 (A–E)—**unchanged** |\n| Time/Section | 42 min | **42 min—unchanged** |\n| Total Duration | 3.5 hrs | **3.5 hrs—unchanged** |\n\n**Key Insight:** Same time, fewer questions = **~70 seconds per question** (vs ~63 sec earlier). But **each question now carries more relative weight**. Conceptual depth > speed.\n\n**Image-Based Questions:** ~18% of paper = **~32–36 questions** (~144 marks). Radiology, Dermatology, Pathology are the \"Big Three\".\n\n---\n\n## 🎯 SET 1 — FULL PAPER (180 Questions | 5 Sections | 720 Marks)\n\n---\n\n# SECTION A — MEDICINE & ALLIED (36 Questions)\n\n---\n\n### Q1. [Image-Based — ECG] \n**A 55-year-old male with a history of hypertension presents with acute onset chest pain radiating to the left arm. His ECG is shown below (Image: ST-segment elevation in leads V1–V4 with hyperacute T waves). What is the SINGLE BEST next step in management?**\nA) Aspirin + Sublingual nitroglycerin + Wait for troponin\nB) Immediate PCI within 90 minutes\nC) Thrombolytic therapy with tenecteplase\nD) Emergent CABG\n\n**Answer: B** — Anterior STEMI (V1–V4) with symptom onset <12 hours → Primary PCI within 90 minutes is the gold standard. Thrombolysis is an alternative if PCI not available within 120 min.\n\n---\n\n### Q2. [Clinical Vignette — Integrated]\n**A 45-year-old woman presents with a butterfly rash over the malar area, photosensitivity, and polyarthralgia. She has a history of two first-trimester miscarriages. Laboratory evaluation reveals ANA positive (1:640), anti-dsDNA positive, and anticardiolipin antibodies positive. She is already on hydroxychloroquine. Which drug, if added to her regimen, would MOST increase the risk of tendon rupture?**\nA) Prednisone\nB) Methotrexate\nC) Azathioprine\nD) Levofloxacin\n\n**Answer: D** — Fluoroquinolones (levofloxacin) increase the risk of tendon rupture, especially in patients on corticosteroids. This is a classic **multi-subject integration** question—Medicine (SLE/APS diagnosis) + OBG (recurrent miscarriages) + Pharmacology (fluoroquinolone ADR).\n\n---\n\n### Q3. [Image-Based — Fundoscopy]\n**A 28-year-old male with type 1 diabetes mellitus presents for routine screening. Fundoscopy reveals the findings shown (Image: dot-blot hemorrhages, hard exudates, and cotton-wool spots in the posterior pole, no neovascularization). What is the stage of diabetic retinopathy?**\nA) Non-proliferative DR—Mild\nB) Non-proliferative DR—Moderate\nC) Non-proliferative DR—Severe\nD) Proliferative DR\n\n**Answer: B** — Moderate NPDR is characterized by **dot-blot hemorrhages, hard exudates, cotton-wool spots, and venous beading** in ≥1 quadrant but no neovascularization.\n\n---\n\n### Q4. [Video-Based — Neurological Examination]\n**A 65-year-old male is shown in a video (clinical clip) with a resting tremor in the right hand, bradykinesia, rigidity, and a shuffling gait with reduced arm swing. He has a masked facies. What is the SINGLE BEST initial pharmacological therapy?**\nA) Levodopa-Carbidopa\nB) Pramipexole\nC) Selegiline\nD) Amantadine\n\n**Answer: A** — Parkinson's disease presenting with motor symptoms in an elderly patient—Levodopa-Carbidopa remains the **most effective symptomatic therapy**.\n\n---\n\n### Q5. \n**A 32-year-old female presents with palpitations, weight loss despite increased appetite, heat intolerance, and tremors. TSH is <0.01 mIU/L, free T4 is elevated. Thyroid ultrasound shows a diffuse goiter with increased vascularity (\"thyroid inferno\"). What is the MOST APPROPRIATE management?**\nA) Radioactive iodine ablation\nB) Carbimazole titrated to euthyroid state\nC) Propylthiouracil (PTU)\nD) Subtotal thyroidectomy\n\n**Answer: B** — Graves' disease in a young woman—**Carbimazole** (or methimazole) is the first-line medical therapy. PTU is preferred in first-trimester pregnancy.\n\n---\n\n### Q6. \n**A 60-year-old male with known COPD presents with worsening dyspnea, productive cough with purulent sputum, and fever. Arterial blood gas: pH 7.28, PaCO₂ 68 mmHg, PaO₂ 55 mmHg, HCO₃⁻ 28 mEq/L. What is the SINGLE BEST next step?**\nA) Non-invasive ventilation (BiPAP)\nB) Invasive mechanical ventilation\nC) Nebulized bronchodilators + corticosteroids\nD) Antibiotics alone\n\n**Answer: A** — Acute exacerbation of COPD with hypercapnic respiratory failure (pH <7.35, PaCO₂ >45)—**BiPAP** is first-line if the patient is hemodynamically stable and able to protect airway.\n\n---\n\n### Q7. [Image-Based — Chest X-ray]\n**A 45-year-old male with a history of intravenous drug use presents with fever, chills, and dyspnea. Chest X-ray (Image: multiple bilateral nodular opacities with cavitation, predominantly in the lower lobes). Blood cultures grow Gram-positive cocci in clusters. What is the MOST LIKELY diagnosis?**\nA) Tuberculosis\nB) Septic pulmonary emboli\nC) Fungal pneumonia\nD) Wegener's granulomatosis\n\n**Answer: B** — Septic pulmonary emboli in the setting of IV drug use (tricuspid valve endocarditis)—**Staphylococcus aureus** is the most common organism.\n\n---\n\n### Q8. \n**A 25-year-old woman presents with acute onset of severe headache, photophobia, and neck stiffness. CSF analysis shows: WBC 450/μL (90% lymphocytes), protein 120 mg/dL, glucose 35 mg/dL (serum glucose 110 mg/dL). Gram stain is negative. What is the MOST LIKELY etiology?**\nA) Streptococcus pneumoniae\nB) Neisseria meningitidis\nC) Mycobacterium tuberculosis\nD) Herpes simplex virus\n\n**Answer: C** — **Tuberculous meningitis**—lymphocytic pleocytosis, elevated protein, **low CSF glucose** (<40% of serum glucose).\n\n---\n\n### Q9. \n**A 55-year-old male with a history of hypertension and type 2 diabetes presents with acute onset of right-sided weakness, facial droop, and aphasia. Symptoms began 2 hours ago. NIHSS score = 16. CT head shows no hemorrhage. What is the SINGLE BEST management?**\nA) Aspirin 325 mg\nB) IV Alteplase (tPA) within 4.5 hours\nC) Mechanical thrombectomy\nD) Anticoagulation with heparin\n\n**Answer: B** — Acute ischemic stroke within **4.5 hours** of symptom onset with no contraindications—**IV tPA** is indicated.\n\n---\n\n### Q10. \n**A 70-year-old male presents with progressive dyspnea on exertion, orthopnea, and PND. On examination: JVP elevated, S3 gallop, bilateral basal crackles, and pedal edema. Echo shows LVEF 30%. What is the FIRST-LINE pharmacotherapy that has been shown to REDUCE MORTALITY?**\nA) Digoxin\nB) Furosemide\nC) Carvedilol + ACE inhibitor\nD) Ivabradine\n\n**Answer: C** — Heart failure with reduced EF—**β-blocker (carvedilol/bisoprolol/metoprolol succinate) + ACE inhibitor/ARB** is the mortality-reducing cornerstone.\n\n---\n\n### Q11. \n**A 34-year-old woman presents with episodic palpitations, sweating, headache, and tachycardia. During an episode, BP is 200/110 mmHg. Urinary vanillylmandelic acid (VMA) and metanephrines are elevated. CT abdomen reveals a 4 cm right adrenal mass. What is the PREOPERATIVE medication of choice?**\nA) Propranolol\nB) Prazosin\nC) Phenoxybenzamine\nD) Metoprolol\n\n**Answer: C** — **Pheochromocytoma**—**Phenoxybenzamine** (irreversible α-blocker) for 10–14 days preoperatively. α-blockade must precede β-blockade to prevent hypertensive crisis.\n\n---\n\n### Q12. \n**A 48-year-old male presents with fatigue, pruritus, and jaundice. Labs: alkaline phosphatase 450 U/L, bilirubin 3.2 mg/dL (direct 2.5), ALT 65 U/L. Anti-mitochondrial antibody (AMA) is positive. What is the MOST LIKELY diagnosis?**\nA) Autoimmune hepatitis\nB) Primary biliary cholangitis\nC) Primary sclerosing cholangitis\nD) Viral hepatitis\n\n**Answer: B** — **Primary biliary cholangitis**—middle-aged woman (though can be male), **AMA positive**, cholestatic pattern (↑ALP > ↑ALT).\n\n---\n\n### Q13. \n**A 22-year-old male presents with acute onset of severe colicky abdominal pain, bilious vomiting, and abdominal distension. Erect abdominal X-ray (Image: dilated small bowel loops with air-fluid levels, no gas in the colon). What is the SINGLE BEST next step?**\nA) Nasogastric decompression + conservative management\nB) Emergency exploratory laparotomy\nC) CT abdomen with contrast\nD) Water-soluble contrast enema\n\n**Answer: C** — **Small bowel obstruction**—CT abdomen with contrast is the **investigation of choice** to identify the cause and site of obstruction.\n\n---\n\n### Q14. \n**A 65-year-old male with chronic kidney disease (eGFR 25 mL/min) presents with anemia. Hb 9.2 g/dL, MCV 88 fL, ferritin 450 ng/mL, transferrin saturation 22%. What is the MOST APPROPRIATE management?**\nA) Oral iron supplementation\nB) IV iron supplementation\nC) Erythropoiesis-stimulating agent (ESA)\nD) Blood transfusion\n\n**Answer: C** — Anemia of CKD—**ESA** (erythropoietin) is indicated when Hb <10 g/dL, especially with adequate iron stores (ferritin >100, TSAT >20%).\n\n---\n\n### Q15. \n**A 30-year-old woman presents with amenorrhea, galactorrhea, and headache. MRI (Image: pituitary macroadenoma). Serum prolactin is 850 ng/mL. What is the FIRST-LINE medical therapy?**\nA) Transsphenoidal surgery\nB) Bromocriptine\nC) Cabergoline\nD) Octreotide\n\n**Answer: C** — **Prolactinoma**—**Cabergoline** is the dopamine agonist of choice (more effective, better tolerated than bromocriptine).\n\n---\n\n### Q16. \n**A 40-year-old male presents with acute severe epigastric pain radiating to the back, associated with nausea and vomiting. Serum amylase 1200 U/L, lipase 4500 U/L. CT abdomen (Image: peripancreatic fluid collections, no necrosis). What is the SINGLE BEST management?**\nA) NPO + IV fluids + analgesia\nB) ERCP\nC) Antibiotics\nD) Surgical debridement\n\n**Answer: A** — **Acute pancreatitis**—**supportive care** (NPO, aggressive IV fluids, analgesia) is the mainstay. Antibiotics only if infected necrosis.\n\n---\n\n### Q17. \n**A 28-year-old male presents with recurrent epistaxis, bleeding gums, and easy bruising. CBC: platelets 15,000/μL, Hb 10.5 g/dL, WBC 4,200/μL. Peripheral smear shows large platelets with few megakaryocyte fragments. What is the MOST LIKELY diagnosis?**\nA) Aplastic anemia\nB) ITP (Immune thrombocytopenic purpura)\nC) TTP (Thrombotic thrombocytopenic purpura)\nD) DIC\n\n**Answer: B** — **ITP**—isolated thrombocytopenia with **large platelets** in a young patient.\n\n---\n\n### Q18. \n**A 55-year-old male with known cirrhosis presents with confusion, asterixis, and fetor hepaticus. Serum ammonia is 180 μmol/L. What is the FIRST-LINE treatment?**\nA) Neomycin\nB) Rifaximin\nC) Lactulose\nD) L-ornithine L-aspartate\n\n**Answer: C** — **Hepatic encephalopathy**—**Lactulose** is first-line (acidifies gut, traps ammonia).\n\n---\n\n### Q19. [Image-Based — Skin]\n**A 45-year-old male presents with a skin lesion (Image: asymmetrical, irregular borders, variegated color >6 mm, ulcerated) on the back. What is the SINGLE BEST next step?**\nA) Topical chemotherapy\nB) Excisional biopsy with 2 cm margin\nC) Punch biopsy\nD) Observation\n\n**Answer: B** — **Malignant melanoma**—**Excisional biopsy** with 2 cm margin for lesions >1 mm Breslow thickness.\n\n---\n\n### Q20. \n**A 32-year-old woman with systemic lupus erythematosus presents with acute onset of severe headache, confusion, and seizures. What is the MOST LIKELY diagnosis?**\nA) Stroke\nB) CNS lupus\nC) Infection\nD) Drug-induced\n\n**Answer: B** — **CNS lupus**—neuropsychiatric manifestations include headache, confusion, seizures, and psychosis.\n\n---\n\n### Q21. \n**A 60-year-old male with type 2 diabetes presents with a non-healing ulcer on the plantar aspect of the right foot. The ulcer extends to bone. MRI shows osteomyelitis. What is the MOST APPROPRIATE antibiotic regimen?**\nA) Vancomycin + Piperacillin-Tazobactam\nB) Ciprofloxacin + Clindamycin\nC) Ampicillin-Sulbactam\nD) Linezolid alone\n\n**Answer: A** — **Diabetic foot osteomyelitis**—broad-spectrum coverage (MRSA + Gram-negative + anaerobes).\n\n---\n\n### Q22. \n**A 25-year-old female presents with acute onset of shortness of breath and chest pain. She is 6 weeks postpartum. ECG shows S1Q3T3 pattern. What is the MOST LIKELY diagnosis?**\nA) Myocardial infarction\nB) Pulmonary embolism\nC) Pericarditis\nD) Aortic dissection\n\n**Answer: B** — **Pulmonary embolism**—postpartum state is a hypercoagulable risk factor. S1Q3T3 is classic though not sensitive.\n\n---\n\n### Q23. \n**A 68-year-old male with known Parkinson's disease on long-term levodopa presents with fluctuations—\"wearing off\" phenomena. What is the BEST ADD-ON therapy?**\nA) Entacapone\nB) Amantadine\nC) Selegiline\nD) Pramipexole\n\n**Answer: A** — **Entacapone** (COMT inhibitor)—reduces \"off\" time by prolonging levodopa half-life.\n\n---\n\n### Q24. \n**A 50-year-old female presents with proximal muscle weakness, weight loss, and a heliotrope rash on the eyelids. Creatine kinase is 4500 U/L. What is the MOST LIKELY diagnosis?**\nA) Polymyositis\nB) Dermatomyositis\nC) Inclusion body myositis\nD) Duchenne muscular dystrophy\n\n**Answer: B** — **Dermatomyositis**—**heliotrope rash** + Gottron's papules + proximal muscle weakness.\n\n---\n\n### Q25. [Image-Based — CT Head]\n**A 75-year-old male with a history of falls presents with progressive confusion and urinary incontinence. CT head (Image: bilateral frontal lobe hypodensities, ventriculomegaly out of proportion to sulcal atrophy). What is the SINGLE BEST management?**\nA) Acetazolamide\nB) Ventriculoperitoneal shunt\nC) High-dose corticosteroids\nD) Observation\n\n**Answer: B** — **Normal pressure hydrocephalus**—**ventriculoperitoneal shunt** is the definitive treatment.\n\n---\n\n### Q26. \n**A 35-year-old male presents with recurrent episodes of watery diarrhea, flushing, and wheezing. 24-hour urinary 5-HIAA is elevated. What is the MOST LIKELY diagnosis?**\nA) Zollinger-Ellison syndrome\nB) Carcinoid syndrome\nC) VIPoma\nD) Glucagonoma\n\n**Answer: B** — **Carcinoid syndrome**—diarrhea, flushing, wheezing, and ↑5-HIAA.\n\n---\n\n### Q27. \n**A 42-year-old female with rheumatoid arthritis presents with a painless, non-pitting edema of the right hand with a peau d'orange appearance. What is the MOST LIKELY diagnosis?**\nA) Rheumatoid nodule\nB) Carpal tunnel syndrome\nC) Scleroderma (CREST)\nD) Amyloidosis\n\n**Answer: C** — **Scleroderma**—peau d'orange, non-pitting edema.\n\n---\n\n### Q28. \n**A 55-year-old male presents with fever, chills, productive cough, and pleuritic chest pain. Chest X-ray (Image: right lower lobe consolidation with air bronchograms). What is the MOST COMMON causative organism?**\nA) Streptococcus pneumoniae\nB) Mycoplasma pneumoniae\nC) Chlamydophila pneumoniae\nD) Legionella pneumophila\n\n**Answer: A** — **Community-acquired pneumonia**—**S. pneumoniae** is the most common cause in adults.\n\n---\n\n### Q29. \n**A 30-year-old female presents with painful menstruation, dyspareunia, and infertility. Pelvic examination reveals tenderness and nodularity in the cul-de-sac. What is the GOLD STANDARD for diagnosis?**\nA) Transvaginal ultrasound\nB) MRI pelvis\nC) Diagnostic laparoscopy\nD) CA-125\n\n**Answer: C** — **Endometriosis**—**diagnostic laparoscopy** with biopsy is the gold standard.\n\n---\n\n### Q30. \n**A 65-year-old male with a history of alcohol use disorder presents with confusion, ataxia, and ophthalmoplegia. What is the MOST LIKELY diagnosis?**\nA) Wernicke's encephalopathy\nB) Korsakoff's psychosis\nC) Cerebellar degeneration\nD) Hepatic encephalopathy\n\n**Answer: A** — **Wernicke's encephalopathy**—confusion + ataxia + ophthalmoplegia. Thiamine deficiency.\n\n---\n\n### Q31. \n**A 28-year-old male presents with an acute episode of severe, colicky flank pain radiating to the groin. Urinalysis shows microscopic hematuria. CT (Image: 4 mm stone at the UVJ). What is the MOST APPROPRIATE management?**\nA) SWL (Shock wave lithotripsy)\nB) Ureteroscopy\nC) Conservative (hydration, analgesics, tamsulosin)\nD) PCNL\n\n**Answer: C** — **Distal ureteral stone <5 mm**—**medical expulsive therapy** with tamsulosin + hydration + analgesics.\n\n---\n\n### Q32. \n**A 52-year-old female presents with a palpable breast lump. Mammography (Image: spiculated mass with microcalcifications). Biopsy confirms invasive ductal carcinoma. ER/PR positive, HER2 negative. What is the MOST APPROPRIATE first-line systemic therapy?**\nA) Tamoxifen\nB) Aromatase inhibitor\nC) Trastuzumab\nD) Chemotherapy\n\n**Answer: B** — **Postmenopausal woman** with ER/PR-positive breast cancer—**aromatase inhibitor** (letrozole/anastrozole/exemestane).\n\n---\n\n### Q33. \n**A 34-year-old female presents with exertional dyspnea, palpitations, and a systolic murmur that increases with Valsalva. Echo shows asymmetric septal hypertrophy with LVOT gradient. What is the FIRST-LINE medical therapy?**\nA) Digoxin\nB) Verapamil\nC) β-blockers\nD) Amiodarone\n\n**Answer: C** — **Hypertrophic cardiomyopathy**—**β-blockers** (or verapamil) reduce symptoms and LVOT gradient.\n\n---\n\n### Q34. \n**A 48-year-old male with chronic hepatitis B presents with elevated liver enzymes and detectable HBV DNA. What is the FIRST-LINE antiviral therapy?**\nA) Ribavirin\nB) Interferon\nC) Tenofovir/Entecavir\nD) Lamivudine\n\n**Answer: C** — **Chronic HBV**—**Tenofovir** or **Entecavir** are first-line (high barrier to resistance).\n\n---\n\n### Q35. \n**A 22-year-old female presents with a painless, non-tender, firm mass in the right breast that is mobile. Ultrasound shows a well-circumscribed, hypoechoic mass. What is the MOST LIKELY diagnosis?**\nA) Fibroadenoma\nB) Breast carcinoma\nC) Phyllodes tumor\nD) Lipoma\n\n**Answer: A** — **Fibroadenoma**—most common benign breast tumor in young women, well-circumscribed, mobile.\n\n---\n\n### Q36. \n**A 65-year-old male with a history of smoking presents with a non-healing ulcer on the tongue. Biopsy shows squamous cell carcinoma. What is the SINGLE MOST IMPORTANT prognostic factor?**\nA) Tumor size\nB) Lymph node involvement\nC) Depth of invasion\nD) Distant metastasis\n\n**Answer: C** — **Depth of invasion**—most important predictor of nodal metastasis and survival in oral cavity cancers.\n\n---\n\n# SECTION B — SURGERY & ORTHOPEDICS (36 Questions)\n\n---\n\n### Q37. [Image-Based — CT Head]\n**A 45-year-old male presents after a fall from height with a GCS of 14. CT head (Image: biconvex, hyperdense, lenticular-shaped extra-axial collection with no crossing of suture lines). What is the MOST APPROPRIATE management?**\nA) Observation\nB) Burr hole evacuation\nC) Craniotomy\nD) Mannitol + hyperventilation\n\n**Answer: C** — **Epidural hematoma**—biconvex/lenticular shape, does NOT cross suture lines. Surgical evacuation (craniotomy) if >30 cm³ or GCS <9.\n\n---\n\n### Q38. \n**A 60-year-old male presents with acute onset of severe abdominal pain, vomiting, and absolute constipation. Erect abdominal X-ray (Image: distended large bowel with a \"coffee bean\" sign in the right upper quadrant). What is the diagnosis?**\nA) Sigmoid volvulus\nB) Cecal volvulus\nC) Intestinal obstruction\nD) Perforation\n\n**Answer: B** — **Cecal volvulus**—\"coffee bean\" sign in the right upper quadrant.\n\n---\n\n### Q39. \n**A 32-year-old male presents after a road traffic accident with a deformed right thigh. X-ray shows a comminuted fracture of the midshaft femur. What is the INDICATION for intramedullary nailing?**\nA) All femoral shaft fractures in adults\nB) Only open fractures\nC) Only pathological fractures\nD) Only fractures with vascular injury\n\n**Answer: A** — **Intramedullary nailing** is the **treatment of choice** for most femoral shaft fractures in adults.\n\n---\n\n### Q40. \n**A 50-year-old female presents with a painless lump in the right breast. Triple assessment: examination—firm, fixed mass; mammography—spiculated mass; FNAC—malignant cells. What is the SINGLE BEST next step?**\nA) Modified radical mastectomy\nB) Neoadjuvant chemotherapy\nC) Core needle biopsy + hormonal receptor testing\nD) Radiotherapy\n\n**Answer: C** — **Core needle biopsy** for histopathological grading, ER/PR/HER2 status before definitive surgery.\n\n---\n\n### Q41. \n**A 25-year-old male presents with acute scrotal pain, swelling, and nausea. On examination, the right testis is tender, elevated, and there is an absent cremasteric reflex. What is the SINGLE BEST next step?**\nA) Antibiotics\nB) Scrotal exploration within 4-6 hours\nC) Doppler ultrasound\nD) Conservative management\n\n**Answer: B** — **Testicular torsion**—**surgical exploration** is emergent (within 4-6 hours to salvage testis). Do not delay for imaging.\n\n---\n\n### Q42. [Image-Based — X-ray]\n**A 70-year-old female presents after a fall from standing height with hip pain and inability to bear weight. X-ray (Image: displaced fracture of the femoral neck). What is the SINGLE BEST management?**\nA) Internal fixation with cannulated screws\nB) Hemiarthroplasty\nC) Total hip replacement\nD) Traction + bed rest\n\n**Answer: B** — **Displaced femoral neck fracture** in elderly—**hemiarthroplasty**.\n\n---\n\n### Q43. \n**A 45-year-old male presents with an acute abdomen. Examination reveals guarding and rigidity in the right lower quadrant. CT shows a thickened appendix with periappendiceal fat stranding and a 2 cm abscess. What is the MOST APPROPRIATE management?**\nA) Emergency appendectomy\nB) Antibiotics alone\nC) Percutaneous drainage + interval appendectomy\nD) Laparoscopic drainage\n\n**Answer: C** — **Appendicular abscess** (≤3 cm)—**percutaneous drainage** + antibiotics, interval appendectomy after 6-8 weeks.\n\n---\n\n### Q44. \n**A 55-year-old male presents with progressive dysphagia to solids, weight loss. Barium swallow (Image: \"bird's beak\" appearance of the lower esophageal sphincter). What is the diagnosis?**\nA) Esophageal carcinoma\nB) Achalasia cardia\nC) Plummer-Vinson syndrome\nD) Diffuse esophageal spasm\n\n**Answer: B** — **Achalasia**—\"bird's beak\" appearance on barium swallow.\n\n---\n\n### Q45. \n**A 30-year-old male presents with a painless swelling in the right groin that reduces spontaneously on lying down but increases on coughing. On examination, the swelling is above and medial to the pubic tubercle. What is the MOST LIKELY diagnosis?**\nA) Femoral hernia\nB) Direct inguinal hernia\nC) Indirect inguinal hernia\nD) Hydrocele\n\n**Answer: C** — **Indirect inguinal hernia**—above and medial to the pubic tubercle, most common in young males.\n\n---\n\n### Q46. [Image-Based — Intraoperative]\n**A 40-year-old female is undergoing a cholecystectomy. The intraoperative image shows a structure that appears to be the common bile duct being mistaken for the cystic duct. What is the MOST IMPORTANT step to prevent this complication?**\nA) Routine intraoperative cholangiography\nB) Dissection close to the gallbladder wall (Critical View of Safety)\nC) Preoperative ERCP\nD) Routine ultrasound\n\n**Answer: B** — **Critical View of Safety**—dissection at the gallbladder neck to identify **cystic duct, cystic artery, and CBD** clearly before clipping.\n\n---\n\n### Q47. \n**A 28-year-old male presents with acute onset of severe abdominal pain, vomiting, and abdominal distension. He has a history of two previous laparotomies. Erect abdominal X-ray shows multiple air-fluid levels with dilated small bowel loops. What is the MOST LIKELY diagnosis?**\nA) Paralytic ileus\nB) Adhesive small bowel obstruction\nC) Large bowel obstruction\nD) Perforation\n\n**Answer: B** — **Adhesive SBO**—most common cause of small bowel obstruction in patients with prior abdominal surgery.\n\n---\n\n### Q48. \n**A 60-year-old male presents with painless hematuria. Ultrasound shows a 3 cm solid mass in the right kidney. CT shows enhancing renal mass. What is the SINGLE BEST management?**\nA) Radical nephrectomy\nB) Partial nephrectomy\nC) Nephron-sparing surgery\nD) Biopsy\n\n**Answer: B** — **Renal cell carcinoma** ≤4 cm—**partial nephrectomy** is preferred (nephron-sparing).\n\n---\n\n### Q49. \n**A 35-year-old female presents with a painful, erythematous, swollen left breast with fever and chills. She is breastfeeding a 2-month-old infant. What is the MOST APPROPRIATE management?**\nA) Stop breastfeeding\nB) Antibiotics (flucloxacillin) + continue breastfeeding\nC) Incision and drainage\nD) NSAIDs alone\n\n**Answer: B** — **Mastitis**—**antibiotics** + **continue breastfeeding** (to drain the breast).\n\n---\n\n### Q50. \n**A 65-year-old male presents with lower abdominal pain, tenesmus, and blood in stool. Colonoscopy shows a circumferential, ulcerated mass in the rectosigmoid junction. Biopsy confirms adenocarcinoma. What is the SINGLE BEST preoperative investigation?**\nA) CEA\nB) CT chest/abdomen/pelvis\nC) MRI pelvis\nD) PET-CT\n\n**Answer: C** — **Rectal cancer**—**MRI pelvis** is essential for local staging (TNM) and CRM assessment. CT for distant metastasis.\n\n---\n\n### Q51. \n**A 22-year-old male presents with acute onset of severe abdominal pain, nausea, and vomiting. Examination reveals a swollen, tender, erythematous scrotum with a \"blue dot\" sign. What is the diagnosis?**\nA) Testicular torsion\nB) Torsion of the testicular appendage\nC) Epididymitis\nD) Strangulated hernia\n\n**Answer: B** — **Torsion of testicular appendage**—\"blue dot\" sign (necrotic appendage visible through skin).\n\n---\n\n### Q52. [Image-Based — Clinical]\n**A 45-year-old male presents with a swelling in the midline of the neck that moves upward on tongue protrusion. Ultrasound (Image: cystic lesion in the midline, just above the hyoid). What is the diagnosis?**\nA) Thyroglossal duct cyst\nB) Branchial cleft cyst\nC) Dermoid cyst\nD) Lipoma\n\n**Answer: A** — **Thyroglossal duct cyst**—midline, **moves with tongue protrusion**, most common congenital neck mass.\n\n---\n\n### Q53. \n**A 50-year-old male with a history of smoking presents with hoarseness of voice for 3 months. Laryngoscopy shows a vocal cord lesion. Biopsy confirms squamous cell carcinoma. What is the SINGLE MOST IMPORTANT prognostic factor?**\nA) Tumor size\nB) Lymph node metastasis\nC) Stage at presentation\nD) Histological grade\n\n**Answer: C** — **Stage at presentation**—most important prognostic factor in laryngeal cancer.\n\n---\n\n### Q54. \n**A 30-year-old male presents after a fall with pain and swelling over the left clavicle. X-ray shows a midshaft clavicle fracture with 2 cm shortening and 100% displacement. What is the INDICATION for surgery?**\nA) All clavicle fractures\nB) Shortening >2 cm or displacement >100%\nC) Only open fractures\nD) Only in athletes\n\n**Answer: B** — **Clavicle fracture**—surgery if >2 cm shortening or >100% displacement.\n\n---\n\n### Q55. \n**A 25-year-old male presents with a painful, swollen knee after a twisting injury. Examination reveals a positive anterior drawer test and Lachman test. What is the MOST LIKELY diagnosis?**\nA) MCL tear\nB) ACL tear\nC) Meniscal tear\nD) PCL tear\n\n**Answer: B** — **ACL tear**—anterior drawer test and Lachman test are specific for ACL.\n\n---\n\n### Q56. \n**A 70-year-old male presents with sudden onset of severe abdominal pain, vomiting, and hematochezia. He has atrial fibrillation. CT shows pneumatosis intestinalis. What is the diagnosis?**\nA) Acute pancreatitis\nB) Mesenteric ischemia\nC) Diverticulitis\nD) Perforated peptic ulcer\n\n**Answer: B** — **Acute mesenteric ischemia**—atrial fibrillation (embolic source) + pneumatosis intestinalis (necrosis).\n\n---\n\n### Q57. \n**A 45-year-old female presents with a swelling in the right breast with skin dimpling and nipple retraction. Mammography shows a spiculated mass. What is the SINGLE BEST investigation for staging?**\nA) Ultrasound breast\nB) MRI breast\nC) CT chest/abdomen/pelvis\nD) Bone scan\n\n**Answer: C** — **Breast cancer staging**—CT chest/abdomen/pelvis for distant metastasis.\n\n---\n\n### Q58. \n**A 32-year-old male presents with acute scrotal pain after vigorous exercise. Examination reveals a tender, swollen left testis with a \"high-riding\" testis. Doppler shows absent flow. What is the SINGLE BEST management?**\nA) Analgesics + ice\nB) Antibiotics\nC) Emergency scrotal exploration\nD) Ultrasound-guided aspiration\n\n**Answer: C** — **Testicular torsion**—emergency surgical exploration (do NOT delay for imaging).\n\n---\n\n### Q59. \n**A 55-year-old male with a history of smoking presents with a painless swelling in the right neck, just above the clavicle. Biopsy shows metastatic squamous cell carcinoma. What is the MOST LIKELY primary site?**\nA) Lung\nB) Head and neck (tonsil/base of tongue)\nC) Esophagus\nD) Thyroid\n\n**Answer: B** — **Head and neck primary**—most common occult primary for cervical lymphadenopathy with squamous cell carcinoma.\n\n---\n\n### Q60. [Image-Based — X-ray]\n**A 25-year-old male presents after a road traffic accident with pain and deformity of the right forearm. X-ray (Image: fracture of both bones of the forearm with angulation). What is the INDICATION for operative management?**\nA) All forearm fractures\nB) Angulation >10° or displacement >50%\nC) Only open fractures\nD) Only in adults\n\n**Answer: B** — **Forearm fracture**—operative fixation (DCP) if >10° angulation or >50% displacement.\n\n---\n\n### Q61. \n**A 40-year-old female presents with a palpable thyroid nodule. Ultrasound shows a 3 cm solitary nodule with microcalcifications and irregular margins. What is the SINGLE BEST next step?**\nA) Thyroid function tests\nB) FNAC (Fine needle aspiration cytology)\nC) Thyroid scan\nD) Observation\n\n**Answer: B** — **Solitary thyroid nodule** with suspicious features—**FNAC** is the investigation of choice.\n\n---\n\n### Q62. \n**A 60-year-old male presents with lower abdominal pain, fever, and change in bowel habits. CT shows diverticulitis with a 4 cm abscess. What is the MOST APPROPRIATE management?**\nA) Antibiotics alone\nB) Percutaneous drainage + antibiotics\nC) Emergency surgery\nD) Observation\n\n**Answer: B** — **Diverticular abscess >3 cm**—**percutaneous drainage** + antibiotics.\n\n---\n\n### Q63. \n**A 28-year-old male presents with acute onset of severe testicular pain, nausea, and vomiting. Examination reveals a tender, swollen testis with an absent cremasteric reflex. Doppler ultrasound is not available. What is the SINGLE BEST next step?**\nA) Empirical antibiotics\nB) Surgical exploration\nC) CT abdomen\nD) Scrotal ultrasound\n\n**Answer: B** — **Testicular torsion**—**surgical exploration** without delay (do not wait for Doppler if not available).\n\n---\n\n### Q64. \n**A 50-year-old male presents with a painless lump in the right groin that is irreducible and has been present for 2 years. On examination, the swelling is below and lateral to the pubic tubercle. What is the MOST LIKELY diagnosis?**\nA) Indirect inguinal hernia\nB) Direct inguinal hernia\nC) Femoral hernia\nD) Saphena varix\n\n**Answer: C** — **Femoral hernia**—below and lateral to the pubic tubercle, more common in females but can occur in males.\n\n---\n\n### Q65. \n**A 35-year-old female presents with a painful, swollen left knee after a fall. X-ray is normal. MRI shows a tear of the medial meniscus. What is the SINGLE BEST management?**\nA) Conservative (rest, ice, physiotherapy)\nB) Arthroscopic meniscectomy\nC) Meniscal repair\nD) Knee replacement\n\n**Answer: A** — **Medial meniscus tear** in a young patient without locking—**conservative management** first.\n\n---\n\n### Q66. \n**A 65-year-old male presents with acute onset of severe abdominal pain, vomiting, and abdominal distension. He has a history of a previous laparotomy. Erect abdominal X-ray shows dilated small bowel loops with air-fluid levels and a \"transition point.\" What is the SINGLE BEST investigation?**\nA) Water-soluble contrast study\nB) CT abdomen with contrast\nC) Plain X-ray\nD) Ultrasound\n\n**Answer: B** — **SBO**—**CT abdomen with contrast** is the investigation of choice.\n\n---\n\n### Q67. \n**A 25-year-old male presents with a painless swelling in the anterior triangle of the neck that is pulsatile and has a bruit. What is the MOST LIKELY diagnosis?**\nA) Carotid body tumor\nB) Branchial cyst\nC) Thyroglossal cyst\nD) Lymph node\n\n**Answer: A** — **Carotid body tumor**—pulsatile, bruit, in the anterior triangle at the carotid bifurcation.\n\n---\n\n### Q68. \n**A 55-year-old male presents with a painless hematuria. Cystoscopy shows a papillary tumor on the lateral wall of the bladder. Biopsy shows transitional cell carcinoma, Ta, low grade. What is the SINGLE BEST management?**\nA) TURBT (Transurethral resection of bladder tumor)\nB) Radical cystectomy\nC) Radiotherapy\nD) Chemotherapy\n\n**Answer: A** — **Ta low-grade TCC**—**TURBT** is curative.\n\n---\n\n### Q69. \n**A 30-year-old female presents with a painful, swollen right ankle after a twisting injury. X-ray shows a Weber B fracture of the lateral malleolus with medial clear space widening. What is the MOST APPROPRIATE management?**\nA) Cast immobilization\nB) ORIF (Open reduction internal fixation)\nC) Closed reduction\nD) Traction\n\n**Answer: B** — **Weber B** with medial clear space widening (unstable)—**ORIF**.\n\n---\n\n### Q70. \n**A 40-year-old male presents with a painless lump in the right scrotum that transilluminates. What is the MOST LIKELY diagnosis?**\nA) Hydrocele\nB) Varicocele\nC) Epididymal cyst\nD) Testicular tumor\n\n**Answer: A** — **Hydrocele**—transilluminates (fluid-filled).\n\n---\n\n### Q71. \n**A 60-year-old female presents with a palpable breast lump. Mammography shows a spiculated mass. Biopsy shows invasive lobular carcinoma. What is the characteristic feature of invasive lobular carcinoma?**\nA) \"Indian file\" pattern\nB) Comedonecrosis\nC) Tubular structures\nD) Mucinous background\n\n**Answer: A** — **Invasive lobular carcinoma**—**\"Indian file\"** arrangement of cells.\n\n---\n\n### Q72. \n**A 28-year-old male presents with a painless swelling in the posterior triangle of the neck. Ultrasound shows a cystic lesion. What is the MOST LIKELY diagnosis?**\nA) Branchial cleft cyst\nB) Thyroglossal duct cyst\nC) Cystic hygroma\nD) Lymph node\n\n**Answer: A** — **Branchial cleft cyst**—most common in the posterior triangle (2nd branchial cleft).\n\n---\n\n# SECTION C — OBSTETRICS & GYNECOLOGY (36 Questions)\n\n---\n\n### Q73. \n**A 28-year-old primigravida at 32 weeks of gestation presents with generalized edema, headache, and blurring of vision. BP 160/100 mmHg, urine protein 4+ (3.5 g/24h). Platelets 80,000/μL, AST 150 U/L, ALT 120 U/L. What is the MOST LIKELY diagnosis?**\nA) Pre-eclampsia\nB) Eclampsia\nC) HELLP syndrome\nD) Acute fatty liver of pregnancy\n\n**Answer: C** — **HELLP syndrome**—Hemolysis (↑LDH), Elevated Liver enzymes, Low Platelets.\n\n---\n\n### Q74. [Image-Based — CTG]\n**A 30-year-old primigravida at 40 weeks of gestation is in active labor. CTG (Image: late decelerations with reduced variability and baseline tachycardia). What is the SINGLE BEST next step?**\nA) Continue labor with close monitoring\nB) Administer oxygen and IV fluids\nC) Emergency cesarean section\nD) Amniotomy\n\n**Answer: C** — **Late decelerations** (uteroplacental insufficiency)—**emergency cesarean section** if cannot be corrected.\n\n---\n\n### Q75. \n**A 25-year-old woman with a history of two first-trimester miscarriages presents with a missed abortion at 10 weeks. She undergoes evacuation. Histopathology shows hydropic villi with trophoblastic proliferation. What is the diagnosis?**\nA) Complete mole\nB) Partial mole\nC) Invasive mole\nD) Choriocarcinoma\n\n**Answer: A** — **Complete mole**—hydropic villi + trophoblastic proliferation (no fetal tissue).\n\n---\n\n### Q76. \n**A 32-year-old primigravida at 28 weeks of gestation presents with vaginal bleeding, abdominal pain, and a tense, tender uterus. Fetal heart rate is 160 bpm. Ultrasound shows a retroplacental clot. What is the MOST LIKELY diagnosis?**\nA) Placenta previa\nB) Placental abruption\nC) Vasa previa\nD) Uterine rupture\n\n**Answer: B** — **Placental abruption**—painful vaginal bleeding + tense uterus + retroplacental clot.\n\n---\n\n### Q77. \n**A 26-year-old primigravida at 34 weeks presents with severe epigastric pain, nausea, and vomiting. BP 170/110 mmHg, proteinuria 4+. Platelets 60,000/μL, AST 200 U/L. What is the SINGLE BEST management?**\nA) Antihypertensives + steroids\nB) Emergency cesarean section\nC) Magnesium sulfate + antihypertensives + delivery\nD) Plasma exchange\n\n**Answer: C** — **HELLP syndrome**—**delivery is the definitive treatment** (after stabilizing mother).\n\n---\n\n### Q78. [Image-Based — Ultrasound]\n**A 28-year-old woman at 20 weeks of gestation undergoes routine anomaly scan. Ultrasound (Image: placenta covering the internal os completely). What is the ACOG recommended management plan for delivery if she remains asymptomatic?**\nA) Vaginal delivery\nB) Elective cesarean section at 36-37 weeks\nC) Emergency cesarean section\nD) Induction of labor at 39 weeks\n\n**Answer: B** — **Complete placenta previa**—international consensus guidelines dictate an **elective cesarean section at 36 0/7 to 37 0/7 weeks** to balance the risk of severe bleeding with fetal maturity.\n\n---\n\n### Q79. \n**A 30-year-old woman presents with failure to lactate and secondary amenorrhea for 6 months following a complicated vaginal delivery that required massive blood transfusion. She reports severe fatigue and cold intolerance. What is the MOST LIKELY diagnosis?**\nA) Prolactinoma\nB) Sheehan syndrome\nC) Asherman syndrome\nD) Empty sella syndrome\n\n**Answer: B** — **Sheehan syndrome**—postpartum pituitary necrosis due to severe hemorrhage and hypovolemia, leading to panhypopituitarism (failure to lactate, amenorrhea, hypothyroidism).\n\n---\n\n### Q80. \n**A 34-year-old woman presents with infertility for 3 years. She has oligomenorrhea, hirsutism, and acne. Ultrasound shows polycystic ovaries. What is the SINGLE BEST first-line treatment for ovulation induction?**\nA) Clomiphene citrate\nB) Letrozole\nC) Gonadotropins\nD) Laparoscopic ovarian drilling\n\n**Answer: B** — **PCOS**—**Letrozole** is now the first-line ovulation induction agent (better live birth rates than clomiphene).\n\n---\n\n### Q81. \n**A 28-year-old primigravida at 36 weeks presents with painless vaginal bleeding. Ultrasound shows placenta previa. What is the MOST APPROPRIATE management?**\nA) Vaginal examination\nB) Emergency cesarean section\nC) Conservative management + corticosteroids\nD) Induction of labor\n\n**Answer: C** — **Placenta previa** at 36 weeks—**conservative** (if hemodynamically stable) + corticosteroids for fetal lung maturity; plan elective LSCS.\n\n---\n\n### Q82. \n**A 32-year-old woman in labor has an arrest of descent at 7 cm cervical dilatation with a persistent occiput posterior position. What is the MOST APPROPRIATE management?**\nA) Oxytocin augmentation\nB) Manual rotation\nC) Emergency cesarean section\nD) Vacuum extraction\n\n**Answer: C** — **Arrest of descent** with malposition—**emergency cesarean section**.\n\n---\n\n### Q83. \n**A 40-year-old woman presents with postmenopausal bleeding for 3 months. Transvaginal ultrasound shows an endometrial thickness of 12 mm. What is the SINGLE BEST next step?**\nA) Hormonal therapy\nB) Endometrial biopsy\nC) Hysteroscopy\nD) Observation\n\n**Answer: B** — **Postmenopausal bleeding**—**endometrial biopsy** is the gold standard diagnostic step to rule out endometrial carcinoma.\n\n---\n\n### Q84. \n**A 28-year-old woman at 38 weeks of gestation presents with spontaneous rupture of membranes for 12 hours without contractions. What is the MOST APPROPRIATE management?**\nA) Expectant management\nB) Induction of labor\nC) Emergency cesarean section\nD) Antibiotics alone\n\n**Answer: B** — **PROM at term**—**induction of labor** is recommended over expectant management to reduce infection risk.\n\n---\n\n### Q85. [Image-Based — Hysteroscopy]\n**A 45-year-old woman presents with menorrhagia. Hysteroscopy (Image: submucous fibroid). What is the SINGLE BEST management?**\nA) Myomectomy\nB) Hysterectomy\nC) Tranexamic acid\nD) GnRH agonists\n\n**Answer: A** — **Submucous fibroid** causing menorrhagia—**hysteroscopic myomectomy** is the treatment of choice.\n\n---\n\n### Q86. \n**A 30-year-old woman presents with a history of recurrent pregnancy loss. She is found to have antiphospholipid antibody syndrome. What is the MOST APPROPRIATE management in subsequent pregnancy?**\nA) Aspirin alone\nB) Low molecular weight heparin + Aspirin\nC) Corticosteroids\nD) IVIG\n\n**Answer: B** — **Antiphospholipid syndrome**—**LMWH + Aspirin** is the standard of care for secondary prophylaxis.\n\n---\n\n### Q87. \n**A 28-year-old primigravida at 30 weeks presents with a painless vaginal bleeding. Ultrasound shows placenta previa. What is the CONTRAINDICATION in the management of this patient?**\nA) Pelvic examination\nB) Ultrasound\nC) Fetal heart rate monitoring\nD) Corticosteroids\n\n**Answer: A** — **Placenta previa**—**pelvic/vaginal examination is absolutely contraindicated** as it can precipitate life-threatening massive hemorrhage.\n\n---\n\n### Q88. \n**A 26-year-old woman presents with primary amenorrhea. Examination reveals short stature, webbed neck, and a shield chest. Karyotype shows 45,XO. What is the MOST LIKELY diagnosis?**\nA) Turner syndrome\nB) Klinefelter syndrome\nC) Androgen insensitivity syndrome\nD) Mayer-Rokitansky-Küster-Hauser syndrome\n\n**Answer: A** — **Turner syndrome**—45,XO, short stature, webbed neck, shield chest, primary amenorrhea.\n\n---\n\n### Q89. \n**A 32-year-old primigravida at 37 weeks presents with severe headache, visual disturbances, and epigastric pain. BP 160/100 mmHg, proteinuria 3+. What is the SINGLE BEST management?**\nA) Magnesium sulfate + antihypertensives\nB) Delivery\nC) Corticosteroids\nD) Anticonvulsants\n\n**Answer: B** — **Pre-eclampsia with severe features at 37 weeks**—**delivery** is the definitive treatment.\n\n---\n\n### Q90. \n**A 40-year-old woman presents with a pelvic mass and ascites. CA-125 is 850 U/mL. Ultrasound shows a complex ovarian mass with solid components and septations. What is the MOST LIKELY diagnosis?**\nA) Ovarian cystadenoma\nB) Ovarian carcinoma\nC) Endometrioma\nD) Dermoid cyst\n\n**Answer: B** — **Ovarian carcinoma**—complex mass + highly elevated CA-125 + ascites.\n\n---\n\n### Q91. \n**A 25-year-old woman presents with severe dysmenorrhea, dyspareunia, and chronic pelvic pain. Laparoscopy shows endometriotic implants. What is the FIRST-LINE medical therapy?**\nA) GnRH agonists\nB) Danazol\nC) NSAIDs + COC\nD) Progestins\n\n**Answer: C** — **Endometriosis**—**NSAIDs + COC** (Combined Oral Contraceptives) are first-line for pain relief and disease suppression.\n\n---\n\n### Q92. \n**A 28-year-old woman at 39 weeks of gestation is in active labor. The fetal heart rate shows variable decelerations. What is the MOST COMMON cause?**\nA) Uteroplacental insufficiency\nB) Cord compression\nC) Fetal head compression\nD) Maternal hypotension\n\n**Answer: B** — **Variable decelerations**—**cord compression** is the most common etiology.\n\n---\n\n### Q93. \n**A 30-year-old woman presents with infertility. Hysterosalpingography shows bilateral tubal blockage. What is the MOST APPROPRIATE management?**\nA) IVF (In vitro fertilization)\nB) Tubal surgery\nC) Ovulation induction\nD) IUI\n\n**Answer: A** — **Bilateral tubal blockage**—**IVF** bypasses the fallopian tubes entirely and is the definitive treatment of choice.\n\n---\n\n### Q94. \n**A 35-year-old woman presents with a cervical smear showing high-grade squamous intraepithelial lesion (HSIL). What is the SINGLE BEST next step?**\nA) Repeat Pap smear\nB) HPV testing\nC) Colposcopy\nD) LEEP procedure\n\n**Answer: C** — **HSIL**—immediate **colposcopy** with directed biopsy is required.\n\n---\n\n### Q95. \n**A 28-year-old primigravida at 28 weeks presents with a sudden onset of severe abdominal pain, vaginal bleeding, and a tense uterus. Fetal heart rate is 140 bpm. Ultrasound shows a retroplacental clot. What is the SINGLE BEST management?**\nA) Conservative management\nB) Emergency cesarean section\nC) Vaginal delivery\nD) Tocolytic therapy\n\n**Answer: B** — **Placental abruption** with evidence of fetal distress or instability—**emergency cesarean section**.\n\n---\n\n### Q96. \n**A 32-year-old woman at 34 weeks presents with preterm labor. She is having regular contractions 3 in 10 minutes, cervical dilatation 3 cm. What is the TOCOLYSIS of choice?**\nA) Nifedipine\nB) Magnesium sulfate\nC) Indomethacin\nD) Atosiban\n\n**Answer: A** — **Preterm labor**—**Nifedipine** (calcium channel blocker) is the tocolytic of choice due to high efficacy and favorable side effect profile.\n\n---\n\n### Q97. \n**A 45-year-old woman presents with heavy menstrual bleeding. Ultrasound shows a 5 cm submucous fibroid. What is the SINGLE BEST management?**\nA) Hysteroscopic myomectomy\nB) Hysterectomy\nC) Uterine artery embolization\nD) GnRH agonists\n\n**Answer: A** — **Submucous fibroid**—**hysteroscopic myomectomy** provides direct surgical resolution while preserving the uterus.\n\n---\n\n### Q98. \n**A 26-year-old primigravida at 36 weeks presents with a painless vaginal bleeding. Ultrasound shows a low-lying placenta. What is the management plan?**\nA) Vaginal delivery\nB) Cesarean section\nC) Conservative management\nD) Induction of labor\n\n**Answer: C** — **Low-lying placenta**—**conservative management** initially, with planned reassessment and likely elective delivery at term.\n\n---\n\n### Q99. \n**A 30-year-old woman at 30 weeks of gestation presents with a sudden gush of clear fluid from the vagina. She is not having any uterine contractions. Nitrazine test is positive. What is the MOST APPROPRIATE initial management?**\nA) Immediate induction of labor\nB) Expectant management with corticosteroids and prophylactic antibiotics\nC) Emergency cesarean section\nD) Tocolysis with Terbutaline\n\n**Answer: B** — **Preterm PROM (PPROM)**—At 30 weeks, **expectant management** with administration of corticosteroids (for fetal lungs) and prophylactic antibiotics (to prolong latency and reduce infection) is indicated to avoid extreme prematurity complications.\n\n---\n\n### Q100. \n**A 28-year-old woman presents with secondary infertility and hirsutism. Ultrasound shows polycystic ovaries. What is the FIRST-LINE treatment for ovulation induction?**\nA) Metformin\nB) Clomiphene citrate\nC) Letrozole\nD) Gonadotropins\n\n**Answer: C** — **PCOS**—**Letrozole** remains the first-line ovulation induction agent.\n\n---\n\n### Q101. \n**A 35-year-old woman at 32 weeks of gestation presents with painless vaginal bleeding immediately following artificial rupture of membranes. The fetal heart rate drops to 80 bpm. Apt test on the vaginal blood is positive for fetal hemoglobin. What is the MOST LIKELY diagnosis?**\nA) Placenta previa\nB) Vasa previa\nC) Placental abruption\nD) Uterine rupture\n\n**Answer: B** — **Vasa previa**—The classic triad of membrane rupture, painless vaginal bleeding, and fetal bradycardia/distress is highly characteristic. The positive Apt test confirms the blood is of fetal origin.\n\n---\n\n### Q102. \n**A 40-year-old woman presents with postmenopausal bleeding. Endometrial biopsy shows endometrial adenocarcinoma. What is the SINGLE BEST management?**\nA) Hysterectomy + BSO\nB) Radiotherapy\nC) Chemotherapy\nD) Hormonal therapy\n\n**Answer: A** — **Endometrial carcinoma**—Total abdominal **hysterectomy + bilateral salpingo-oophorectomy (BSO)** is the standard primary surgical treatment.\n\n---\n\n### Q103. \n**A 28-year-old primigravida at 32 weeks presents with pre-eclampsia. BP 150/95 mmHg, proteinuria 2+. What is the FIRST-LINE antihypertensive?**\nA) Labetalol\nB) Methyldopa\nC) Nifedipine\nD) Hydralazine\n\n**Answer: B** — **Pre-eclampsia**—**Methyldopa** or Labetalol are first-line antihypertensives in pregnancy. (Note: Labetalol and Methyldopa are both highly acceptable; Methyldopa has the longest safety record, but Labetalol is equally first-line clinically).\n\n---\n\n### Q104. \n**A 26-year-old woman presents with a history of recurrent pregnancy loss. She is found to have a bicornuate uterus on hysteroscopy. What is the MOST APPROPRIATE management?**\nA) Metroplasty\nB) Cervical cerclage\nC) Progesterone supplementation\nD) Aspirin\n\n**Answer: C** — **Bicornuate uterus**—**progesterone supplementation** is often used for early pregnancy support; surgical metroplasty is rarely performed today.\n\n---\n\n### Q105. \n**A 30-year-old woman at 39 weeks of gestation is in active labor. The fetal heart rate shows early decelerations. What is the MOST COMMON cause?**\nA) Cord compression\nB) Fetal head compression\nC) Uteroplacental insufficiency\nD) Maternal hypotension\n\n**Answer: B** — **Early decelerations**—**fetal head compression** is the most common cause and is considered a benign vagal response.\n\n---\n\n### Q106. \n**A 28-year-old primigravida at 28 weeks presents with a sudden onset of severe abdominal pain and vaginal bleeding. She has a history of hypertension. Ultrasound shows a retroplacental clot. What is the MOST LIKELY diagnosis?**\nA) Placenta previa\nB) Placental abruption\nC) Uterine rupture\nD) Vasa previa\n\n**Answer: B** — **Placental abruption**—painful bleeding + retroplacental clot, strongly associated with maternal hypertension.\n\n---\n\n### Q107. \n**A 32-year-old woman presents with infertility and chronic pelvic pain. Laparoscopy shows endometriosis. What is the SECOND-LINE medical therapy?**\nA) NSAIDs\nB) GnRH agonists\nC) COC\nD) Danazol\n\n**Answer: B** — **Endometriosis**—**GnRH agonists** serve as second-line therapy for profound ovarian suppression when NSAIDs/COCs fail.\n\n---\n\n### Q108. \n**A 35-year-old woman at 34 weeks of gestation presents with preterm labor. She is given tocolysis. What is the CONTRAINDICATION to tocolysis?**\nA) Preterm labor\nB) Chorioamnionitis\nC) Cervical dilatation <4 cm\nD) Fetal distress\n\n**Answer: B** — **Chorioamnionitis**—constitutes an **absolute contraindication to tocolysis**, mandating immediate delivery regardless of gestational age.\n\n---\n\n# SECTION D — PATHOLOGY, PHARMACOLOGY & MICROBIOLOGY (36 Questions)\n\n---\n\n### Q109. [Image-Based — Histopathology]\n**A 45-year-old man presents with a persistent cough and weight loss. A lung biopsy is shown (Image: granulomas with caseous necrosis, Langhans giant cells). What is the MOST LIKELY diagnosis?**\nA) Sarcoidosis\nB) Tuberculosis\nC) Wegener's granulomatosis\nD) Fungal infection\n\n**Answer: B** — **Tuberculosis**—caseating granulomas with Langhans giant cells are characteristic.\n\n---\n\n### Q110. \n**A 55-year-old male with a history of smoking presents with hemoptysis. Biopsy from a lung mass shows squamous cell carcinoma. Which of the following is the MOST COMMON mutation associated with this tumor?**\nA) EGFR mutation\nB) KRAS mutation\nC) ALK rearrangement\nD) TP53 mutation\n\n**Answer: D** — **Squamous cell carcinoma**—**TP53** mutation is heavily linked to smoking and is most common.\n\n---\n\n### Q111. \n**A 60-year-old male with a history of chronic hepatitis B presents with a liver mass. Biopsy shows hepatocellular carcinoma. Which tumor marker is MOST ELEVATED?**\nA) CA 19-9\nB) AFP (Alpha-fetoprotein)\nC) CEA\nD) CA 125\n\n**Answer: B** — **HCC**—**AFP** is the most highly specific serum tumor marker for hepatocellular carcinoma.\n\n---\n\n### Q112. \n**A 30-year-old female presents with a breast mass. Biopsy shows cells arranged in a \"Indian file\" pattern. What is the diagnosis?**\nA) Invasive ductal carcinoma\nB) Invasive lobular carcinoma\nC) Medullary carcinoma\nD) Mucinous carcinoma\n\n**Answer: B** — **Invasive lobular carcinoma**—cells lacking E-cadherin organize in the classic **\"Indian file\"** arrangement.\n\n---\n\n### Q113. \n**A 25-year-old male presents with a testicular mass. Biopsy shows a tumor with Schiller-Duval bodies. What is the diagnosis?**\nA) Seminoma\nB) Embryonal carcinoma\nC) Yolk sac tumor\nD) Teratoma\n\n**Answer: C** — **Yolk sac tumor**—**Schiller-Duval bodies** (glomeruloid-like structures) are pathognomonic.\n\n---\n\n### Q114. \n**A 50-year-old female presents with a neck mass. Biopsy shows a tumor with Orphan Annie eye nuclei. What is the diagnosis?**\nA) Papillary thyroid carcinoma\nB) Follicular thyroid carcinoma\nC) Medullary thyroid carcinoma\nD) Anaplastic thyroid carcinoma\n\n**Answer: A** — **Papillary thyroid carcinoma**—optically clear, overlapping nuclei known as **Orphan Annie eye nuclei**.\n\n---\n\n### Q115. \n**A 60-year-old male presents with a stomach mass. Biopsy shows a tumor with signet ring cells. What is the diagnosis?**\nA) Intestinal-type adenocarcinoma\nB) Diffuse-type adenocarcinoma\nC) Gastrointestinal stromal tumor\nD) Lymphoma\n\n**Answer: B** — **Diffuse-type gastric adenocarcinoma**—composed of **signet ring cells** that diffusely infiltrate the gastric wall (linitis plastica).\n\n---\n\n### Q116. \n**A 35-year-old female presents with a breast mass. Biopsy shows comedonecrosis. What is the diagnosis?**\nA) Invasive ductal carcinoma\nB) DCIS (Ductal carcinoma in situ)\nC) LCIS\nD) Papillary carcinoma\n\n**Answer: B** — **DCIS**—**comedonecrosis** is the hallmark of high-grade Ductal Carcinoma In Situ.\n\n---\n\n### Q117. \n**A 45-year-old male with HIV presents with a brain lesion. Biopsy shows a tumor with \"small blue cells.\" What is the MOST LIKELY diagnosis?**\nA) Glioblastoma\nB) Primary CNS lymphoma\nC) Toxoplasmosis\nD) Tuberculoma\n\n**Answer: B** — **Primary CNS lymphoma**—highly associated with EBV in immunocompromised (HIV) patients.\n\n---\n\n### Q118. \n**A 55-year-old male presents with hematuria. Biopsy from a bladder tumor shows \"koilocytes.\" What is the etiology?**\nA) HPV\nB) EBV\nC) HSV\nD) CMV\n\n**Answer: A** — **HPV**—**koilocytes** (squamous cells with perinuclear halos) are pathognomonic of HPV infection.\n\n---\n\n### Q119. \n**A 50-year-old female with a history of ulcerative colitis presents with a colonic mass. Biopsy shows dysplasia. What is the MOST LIKELY diagnosis?**\nA) Adenocarcinoma\nB) Lymphoma\nC) Carcinoid\nD) Stromal tumor\n\n**Answer: A** — **Ulcerative colitis** (long-standing) carries a significantly increased risk of developing **colorectal adenocarcinoma**.\n\n---\n\n### Q120. \n**A 40-year-old male presents with a neck mass. Biopsy shows a tumor with \"Reed-Sternberg cells.\" What is the diagnosis?**\nA) Hodgkin lymphoma\nB) Non-Hodgkin lymphoma\nC) Burkitt lymphoma\nD) Mantle cell lymphoma\n\n**Answer: A** — **Hodgkin lymphoma**—owl-eyed, binucleated **Reed-Sternberg cells** are diagnostic.\n\n---\n\n### Q121. \n**A 35-year-old female presents with a breast mass. Biopsy shows a tumor that is ER/PR positive, HER2 negative. What is the BEST targeted therapy?**\nA) Trastuzumab\nB) Tamoxifen/Aromatase inhibitor\nC) Pertuzumab\nD) Lapatinib\n\n**Answer: B** — **ER/PR-positive breast cancer**—**hormonal therapy** (tamoxifen in premenopausal, aromatase inhibitors in postmenopausal).\n\n---\n\n### Q122. \n**A 60-year-old male presents with a lung mass. Biopsy shows adenocarcinoma. Which mutation is most commonly associated with never-smokers?**\nA) EGFR mutation\nB) KRAS mutation\nC) ALK rearrangement\nD) ROS1 rearrangement\n\n**Answer: A** — **EGFR mutation**—most common specific mutation found in **never-smokers** and females with lung adenocarcinoma.\n\n---\n\n### Q123. \n**A 45-year-old male presents with a colon mass. Biopsy shows adenocarcinoma with microsatellite instability. What is the MOST LIKELY genetic syndrome?**\nA) FAP\nB) Lynch syndrome (HNPCC)\nC) Peutz-Jeghers syndrome\nD) Gardner syndrome\n\n**Answer: B** — **Lynch syndrome**—caused by mismatch repair (MMR) gene mutations leading to microsatellite instability.\n\n---\n\n### Q124. \n**A 50-year-old female presents with a breast mass. Biopsy shows a tumor that is HER2 positive. What is the BEST targeted therapy?**\nA) Tamoxifen\nB) Trastuzumab\nC) Letrozole\nD) Anastrozole\n\n**Answer: B** — **HER2-positive breast cancer**—**Trastuzumab** (monoclonal antibody targeting the HER2/neu receptor).\n\n---\n\n### Q125. \n**A 60-year-old male presents with a lung mass. Biopsy shows a tumor with \"squamous pearls.\" What is the diagnosis?**\nA) Adenocarcinoma\nB) Squamous cell carcinoma\nC) Small cell carcinoma\nD) Large cell carcinoma\n\n**Answer: B** — **Squamous cell carcinoma**—intracellular bridges and **squamous (keratin) pearls** are characteristic microscopic findings.\n\n---\n\n### Q126. \n**A 40-year-old female presents with a cervical smear showing koilocytes. What is the MOST LIKELY etiology?**\nA) HPV\nB) HSV\nC) EBV\nD) CMV\n\n**Answer: A** — **HPV**—**koilocytes** indicate HPV-induced cytopathic effect on squamous cells.\n\n---\n\n### Q127. [Pharmacology — ANS]\n**A 65-year-old male with glaucoma is started on a medication that causes miosis and reduces intraocular pressure by increasing aqueous outflow. Which drug is MOST LIKELY prescribed?**\nA) Timolol\nB) Pilocarpine\nC) Latanoprost\nD) Dorzolamide\n\n**Answer: B** — **Pilocarpine**—a direct-acting cholinergic agonist that causes ciliary muscle contraction, leading to miosis and increased trabecular outflow.\n\n---\n\n### Q128. \n**A 55-year-old male with hypertension is started on a medication that causes cough as a side effect. What is the drug?**\nA) Losartan\nB) Enalapril\nC) Amlodipine\nD) Hydrochlorothiazide\n\n**Answer: B** — **ACE inhibitors** (enalapril)—the accumulation of bradykinin leads to a characteristic dry **cough**.\n\n---\n\n### Q129. \n**A 50-year-old female with diabetes is started on a medication that causes weight gain and fluid retention. Which drug is MOST LIKELY?**\nA) Metformin\nB) Pioglitazone\nC) Glipizide\nD) Sitagliptin\n\n**Answer: B** — **Pioglitazone** (thiazolidinedione)—activates PPAR-γ, causing **weight gain** and peripheral **fluid retention**.\n\n---\n\n### Q130. \n**A 60-year-old male with heart failure is started on a medication that is contraindicated in patients with asthma. What is the drug?**\nA) Carvedilol\nB) Metoprolol\nC) Bisoprolol\nD) Propranolol\n\n**Answer: D** — **Propranolol** (non-selective β-blocker)—**contraindicated in asthma** because β2 receptor blockade triggers bronchospasm.\n\n---\n\n### Q131. \n**A 45-year-old female with rheumatoid arthritis is started on a medication that requires monitoring for hepatotoxicity. What is the drug?**\nA) Methotrexate\nB) Hydroxychloroquine\nC) Sulfasalazine\nD) Leflunomide\n\n**Answer: A** — **Methotrexate**—an antifolate disease-modifying antirheumatic drug (DMARD) that requires routine LFT monitoring for **hepatotoxicity**.\n\n---\n\n### Q132. \n**A 30-year-old male with epilepsy is started on a medication that causes gingival hyperplasia. What is the drug?**\nA) Phenytoin\nB) Valproate\nC) Carbamazepine\nD) Lamotrigine\n\n**Answer: A** — **Phenytoin**—chronic use famously causes **gingival hyperplasia**, hirsutism, and coarse facial features.\n\n---\n\n### Q133. \n**A 55-year-old male with tuberculosis is started on a medication that causes red-orange discoloration of body fluids. What is the drug?**\nA) Isoniazid\nB) Rifampicin\nC) Ethambutol\nD) Pyrazinamide\n\n**Answer: B** — **Rifampicin**—a potent CYP450 inducer that turns urine, sweat, and tears a benign red-orange color.\n\n---\n\n### Q134. \n**A 40-year-old male with HIV is started on a medication that causes fat redistribution (lipodystrophy). What is the drug?**\nA) Zidovudine\nB) Efavirenz\nC) Protease inhibitors\nD) Tenofovir\n\n**Answer: C** — **Protease inhibitors** (e.g., ritonavir, lopinavir)—associated with metabolic syndrome, insulin resistance, and **lipodystrophy** (buffalo hump).\n\n---\n\n### Q135. \n**A 60-year-old female with osteoporosis is started on a medication that must be taken on an empty stomach with a full glass of water. What is the drug?**\nA) Calcium\nB) Vitamin D\nC) Alendronate\nD) Raloxifene\n\n**Answer: C** — **Alendronate** (bisphosphonate)—poorly absorbed; must be taken on an **empty stomach** with a full glass of water, remaining upright for 30 minutes to prevent erosive esophagitis.\n\n---\n\n### Q136. \n**A 25-year-old female with acne is started on isotretinoin. What is the SINGLE MOST IMPORTANT monitoring parameter?**\nA) LFT\nB) Lipids\nC) Pregnancy test\nD) CBC\n\n**Answer: C** — **Isotretinoin**—highly teratogenic; a negative **pregnancy test** must be confirmed before initiation and monitored monthly.\n\n---\n\n### Q137. [Microbiology]\n**A 45-year-old male with pneumonia has a sputum culture growing Gram-positive cocci in chains, optochin sensitive, bile soluble. What is the organism?**\nA) Staphylococcus aureus\nB) Streptococcus pneumoniae\nC) Streptococcus pyogenes\nD) Enterococcus faecalis\n\n**Answer: B** — **S. pneumoniae**—alpha-hemolytic, Gram-positive diplococci/chains that are uniquely **optochin sensitive** and **bile soluble**.\n\n---\n\n### Q138. \n**A 30-year-old female with a urinary tract infection has a urine culture growing Gram-negative rods that are lactose fermenters on MacConkey agar. What is the MOST LIKELY organism?**\nA) Escherichia coli\nB) Proteus mirabilis\nC) Pseudomonas aeruginosa\nD) Salmonella typhi\n\n**Answer: A** — **E. coli**—the single most common UTI pathogen; it is a fast **lactose fermenter** (pink colonies on MacConkey).\n\n---\n\n### Q139. \n**A 60-year-old male with a diabetic foot ulcer has a wound culture growing Gram-positive cocci in clusters, coagulase positive. What is the organism?**\nA) Staphylococcus aureus\nB) Staphylococcus epidermidis\nC) Streptococcus pyogenes\nD) Enterococcus\n\n**Answer: A** — **S. aureus**—Gram-positive cocci in clusters that are uniquely **coagulase positive**.\n\n---\n\n### Q140. \n**A 25-year-old male with a sore throat has a throat swab culture growing Gram-positive cocci in chains, β-hemolytic on blood agar, bacitracin sensitive. What is the organism?**\nA) Streptococcus pneumoniae\nB) Streptococcus pyogenes\nC) Enterococcus faecalis\nD) Staphylococcus aureus\n\n**Answer: B** — **S. pyogenes** (Group A Strep)—distinguished from Group B Strep by being **bacitracin sensitive**.\n\n---\n\n### Q141. \n**A 40-year-old female with a vaginal discharge has a wet mount showing \"clue cells.\" What is the MOST LIKELY diagnosis?**\nA) Candidiasis\nB) Trichomoniasis\nC) Bacterial vaginosis\nD) Gonorrhea\n\n**Answer: C** — **Bacterial vaginosis**—vaginal epithelial cells studded with Gardnerella bacilli, appearing as granular **clue cells** on wet mount.\n\n---\n\n### Q142. \n**A 30-year-old male with diarrhea has a stool culture growing Gram-negative rods that are non-lactose fermenters on MacConkey agar and produce H2S on TSI agar. What is the MOST LIKELY organism?**\nA) E. coli\nB) Salmonella typhi\nC) Shigella\nD) Campylobacter\n\n**Answer: B** — **Salmonella**—non-lactose fermenter, motile, and highly characteristic H2S producer.\n\n---\n\n### Q143. \n**A 50-year-old male with a skin infection has a wound culture growing Gram-positive rods that are catalase positive. What is the organism?**\nA) Bacillus anthracis\nB) Corynebacterium diphtheriae\nC) Listeria monocytogenes\nD) Nocardia\n\n**Answer: A** — **B. anthracis**—spore-forming, Gram-positive rods, catalase positive.\n\n---\n\n### Q144. \n**A 35-year-old female with a sexually transmitted infection has a cervical culture growing Gram-negative diplococci. What is the organism?**\nA) Neisseria gonorrhoeae\nB) Neisseria meningitidis\nC) Chlamydia trachomatis\nD) Treponema pallidum\n\n**Answer: A** — **N. gonorrhoeae**—intracellular Gram-negative **diplococci** on cervical gram stain.\n\n---\n\n# SECTION E — PEDIATRICS, COMMUNITY MEDICINE, FORENSIC & OTHERS (36 Questions)\n\n---\n\n### Q145. \n**A 2-year-old child presents with fever, cough, and stridor. Neck X-ray (Image: \"steeple sign\"). What is the MOST LIKELY diagnosis?**\nA) Epiglottitis\nB) Croup\nC) Bacterial tracheitis\nD) Foreign body aspiration\n\n**Answer: B** — **Croup** (Laryngotracheobronchitis)—subglottic narrowing creates the classic **\"steeple sign\"** on an AP neck X-ray.\n\n---\n\n### Q146. \n**A 6-month-old infant presents with fever, irritability, and a bulging fontanelle. Lumbar puncture shows WBC 800/μL (80% neutrophils), protein 150 mg/dL, glucose 20 mg/dL (serum glucose 80 mg/dL). If a Gram-negative bacillus is isolated, what is the MOST LIKELY organism?**\nA) Group B Streptococcus\nB) Escherichia coli\nC) Listeria monocytogenes\nD) Neisseria meningitidis\n\n**Answer: B** — **Neonatal/Infant meningitis**—among Gram-negative bacilli in this age bracket, **E. coli** (K1 capsular antigen strain) is the predominant cause.\n\n---\n\n### Q147. \n**A 4-year-old child presents with fever, cough, and difficulty breathing. Chest X-ray shows a \"round pneumonia.\" What is the MOST LIKELY organism?**\nA) Streptococcus pneumoniae\nB) Mycoplasma pneumoniae\nC) Chlamydophila pneumoniae\nD) Viral\n\n**Answer: A** — **S. pneumoniae**—the most common cause of bacterial round pneumonia in the pediatric population.\n\n---\n\n### Q148. \n**A newborn presents with jaundice on day 2 of life. Bilirubin is 12 mg/dL (direct 0.5). The baby is otherwise well, feeding well, and passing meconium. What is the MOST LIKELY diagnosis?**\nA) Physiological jaundice\nB) Breastfeeding jaundice\nC) Crigler-Najjar syndrome\nD) Biliary atresia\n\n**Answer: A** — **Physiological jaundice**—appears after 24 hours, unconjugated, completely benign with a well infant.\n\n---\n\n### Q149. \n**A 5-year-old child presents with fever, sore throat, and a strawberry tongue. What is the MOST LIKELY diagnosis?**\nA) Scarlet fever\nB) Kawasaki disease\nC) Viral pharyngitis\nD) Diphtheria\n\n**Answer: A** — **Scarlet fever** (Streptococcus pyogenes)—strawberry tongue + exudative sore throat + fever + sandpaper rash.\n\n---\n\n### Q150. \n**A 3-year-old child presents with fever, conjunctivitis, oral mucosal changes, and a polymorphous rash. There is unilateral cervical lymphadenopathy. What is the MOST LIKELY diagnosis?**\nA) Kawasaki disease\nB) Scarlet fever\nC) Measles\nD) Stevens-Johnson syndrome\n\n**Answer: A** — **Kawasaki disease**—diagnostic criteria require fever >5 days plus ≥4 clinical features (conjunctivitis, oral changes, rash, extremity changes, lymphadenopathy).\n\n---\n\n### Q151. [Image-Based — X-ray]\n**A 6-month-old infant presents with a cough and respiratory distress. Chest X-ray (Image: hyperinflation with peribronchial cuffing). What is the MOST LIKELY diagnosis?**\nA) Bronchiolitis\nB) Pneumonia\nC) Croup\nD) Asthma\n\n**Answer: A** — **Bronchiolitis** (RSV)—air trapping leading to hyperinflation + peribronchial cuffing.\n\n---\n\n### Q152. \n**A 10-year-old child presents with a sudden onset of severe headache, vomiting, and photophobia. CSF shows WBC 1500/μL (90% neutrophils), protein 100 mg/dL, glucose 50 mg/dL (serum glucose 100 mg/dL). What is the MOST LIKELY organism?**\nA) Neisseria meningitidis\nB) Streptococcus pneumoniae\nC) Enterovirus\nD) Mumps virus\n\n**Answer: A** — **Meningococcal meningitis**—neutrophilic predominance, severe acute presentation in a child/adolescent.\n\n---\n\n### Q153. \n**A 2-year-old child presents with fever, ear pain, and irritability. Otoscopy shows a bulging, erythematous tympanic membrane with loss of landmarks. What is the FIRST-LINE antibiotic?**\nA) Amoxicillin\nB) Azithromycin\nC) Cefuroxime\nD) Co-amoxiclav\n\n**Answer: A** — **Acute otitis media**—high-dose **Amoxicillin** is universally first-line for uncomplicated presentations.\n\n---\n\n### Q154. \n**A newborn presents with vomiting, abdominal distension, and failure to pass meconium in the first 48 hours. Abdominal X-ray shows a \"double bubble\" sign. What is the diagnosis?**\nA) Hypertrophic pyloric stenosis\nB) Duodenal atresia\nC) Intestinal malrotation\nD) Meconium ileus\n\n**Answer: B** — **Duodenal atresia**—bilious vomiting on day 1 with the classic **\"double bubble\"** sign (distended stomach and proximal duodenum).\n\n---\n\n### Q155. \n**A 3-week-old infant presents with progressive jaundice, pale stools, and dark urine. Direct bilirubin is 5 mg/dL. What is the MOST LIKELY diagnosis?**\nA) Biliary atresia\nB) Physiological jaundice\nC) Breast milk jaundice\nD) Crigler-Najjar syndrome\n\n**Answer: A** — **Biliary atresia**—conjugated (direct) hyperbilirubinemia, acholic pale stools, and dark urine indicating obstructive pathology.\n\n---\n\n### Q156. \n**A 4-year-old child presents with fever, cough, and a \"whooping\" sound after coughing. What is the MOST LIKELY diagnosis?**\nA) Pertussis\nB) Croup\nC) Pneumonia\nD) Asthma\n\n**Answer: A** — **Pertussis** (Bordetella pertussis)—paroxysmal cough ending in a high-pitched inspiratory **\"whoop.\"**\n\n---\n\n### Q157. [Community Medicine]\n**A 45-year-old male presents with a blood pressure of 150/95 mmHg on two separate occasions. According to the JNC-8 guidelines, what is the SINGLE BEST next step for this patient?**\nA) Lifestyle modification alone\nB) Start antihypertensive therapy\nC) 24-hour ambulatory BP monitoring\nD) Repeat BP in 3 months\n\n**Answer: B** — **Stage 1 hypertension** (≥140/90 by JNC-8 criteria)—**antihypertensive therapy** combined with lifestyle modification is indicated.\n\n---\n\n### Q158. \n**A 55-year-old female with diabetes has a BP of 135/85 mmHg. What is the target BP for this patient?**\nA) <140/90\nB) <130/80\nC) <120/80\nD) <150/90\n\n**Answer: B** — **Diabetes mellitus**—stringent target BP **<130/80 mmHg** is standard to delay microvascular complications.\n\n---\n\n### Q159. \n**A 60-year-old male with hyperlipidemia is started on a statin. What is the target LDL for this patient with established cardiovascular disease?**\nA) <100 mg/dL\nB) <70 mg/dL\nC) <130 mg/dL\nD) <160 mg/dL\n\n**Answer: B** — **Established CVD** (secondary prevention)—intensive lipid lowering targets an LDL **<70 mg/dL** (or even <55 mg/dL in newer ESC guidelines).\n\n---\n\n### Q160. \n**A 50-year-old male is found to have a fasting blood glucose of 130 mg/dL on two occasions. What is the diagnosis?**\nA) Normal\nB) Impaired fasting glucose\nC) Diabetes mellitus\nD) Impaired glucose tolerance\n\n**Answer: C** — **Diabetes mellitus**—fasting plasma glucose strictly ≥126 mg/dL on two distinct occasions confirms the diagnosis.\n\n---\n\n### Q161. \n**A 65-year-old female with osteoporosis is started on vitamin D and calcium. What is the target 25-hydroxyvitamin D level?**\nA) >20 ng/mL\nB) >30 ng/mL\nC) >50 ng/mL\nD) >10 ng/mL\n\n**Answer: B** — **Target 25(OH)D**—levels **>30 ng/mL** are required for optimal bone health and fracture prevention.\n\n---\n\n### Q162. [Forensic Medicine]\n**A dead body is found with rigor mortis that is well-established and present in all muscles. Approximately how many hours since death?**\nA) 1-2 hours\nB) 4-6 hours\nC) 12-24 hours\nD) 36-48 hours\n\n**Answer: C** — **Rigor mortis**—begins at 1-2 hours, is **well-established systemically at 12-24 hours**, and eventually disappears over 36-48 hours.\n\n---\n\n### Q163. \n**A dead body is found with lividity that is fixed and does not blanch on pressure. Approximately how many hours since death?**\nA) 1-2 hours\nB) 4-6 hours\nC) 8-12 hours\nD) 24-36 hours\n\n**Answer: C** — **Hypostasis/lividity**—appears within 1-2 hours but structurally **fixes at 8-12 hours**.\n\n---\n\n### Q164. \n**A 30-year-old male is brought dead. Autopsy shows a bruise that is greenish-yellow in color. How old is the injury?**\nA) 1-2 days\nB) 3-4 days\nC) 5-6 days\nD) 7-10 days\n\n**Answer: C** — **Bruise color chronology**—red (fresh) → blue (1-2d) → green (3-5d) → **yellow (5-7d)** → normal.\n\n---\n\n### Q165. \n**A 40-year-old male presents with a history of consuming unknown substance. He has miosis, bradycardia, and excessive salivation. What is the MOST LIKELY poisoning?**\nA) Organophosphate poisoning\nB) Atropine poisoning\nC) Opioid poisoning\nD) Cyanide poisoning\n\n**Answer: A** — **Organophosphate poisoning**—classic cholinergic toxidrome **SLUDGE** (Salivation, Lacrimation, Urination, Defecation, GI upset, Emesis) + miosis + bradycardia.\n\n---\n\n### Q166. \n**A 25-year-old female presents with a history of consuming a substance. She has cherry-red lips, headache, and dizziness. What is the MOST LIKELY poisoning?**\nA) Carbon monoxide poisoning\nB) Cyanide poisoning\nC) Methanol poisoning\nD) Organophosphate poisoning\n\n**Answer: A** — **CO poisoning**—carboxyhemoglobin formation causes the classic **cherry-red lips** and skin (though clinically seen only in severe toxicity).\n\n---\n\n### Q167. \n**A 35-year-old male presents with a history of consuming a substance. He has garlic odor on breath, abdominal pain, and vomiting. What is the MOST LIKELY poisoning?**\nA) Arsenic poisoning\nB) Phosphorus poisoning\nC) Organophosphate poisoning\nD) Methanol poisoning\n\n**Answer: A** — **Arsenic poisoning**—acute ingestion triggers severe gastroenteritis accompanied by a distinct **garlic odor** on breath.\n\n---\n\n### Q168. \n**A 50-year-old male presents with a history of consuming a substance. He has a bitter almond odor on breath. What is the MOST LIKELY poisoning?**\nA) Cyanide poisoning\nB) Arsenic poisoning\nC) Organophosphate poisoning\nD) Methanol poisoning\n\n**Answer: A** — **Cyanide poisoning**—disrupts cellular respiration (cytochrome C oxidase), marked uniquely by a **bitter almond odor**.\n\n---\n\n### Q169. \n**A 45-year-old male presents with acute pancreatitis after consuming a substance. What is the MOST LIKELY poisoning?**\nA) Methanol\nB) Ethanol\nC) Organophosphate\nD) Arsenic\n\n**Answer: B** — **Alcohol (Ethanol) poisoning**—acute pancreatitis is a known major complication of severe binge drinking or chronic alcohol abuse.\n\n---\n\n### Q170. \n**A 30-year-old male presents with a history of consuming a substance. He has optic neuritis and visual disturbances. What is the MOST LIKELY poisoning?**\nA) Methanol poisoning\nB) Ethanol poisoning\nC) Organophosphate poisoning\nD) Arsenic poisoning\n\n**Answer: A** — **Methanol poisoning**—toxic metabolite (formic acid) specifically targets the retina and optic nerve, causing \"snowstorm\" vision and **optic neuritis**.\n\n---\n\n### Q171. [ENT — Image-Based]\n**A 40-year-old male presents with a painless neck mass that moves with swallowing. Ultrasound (Image: thyroid nodule). What is the SINGLE BEST investigation?**\nA) FNAC\nB) Thyroid scan\nC) CT neck\nD) Thyroid function tests\n\n**Answer: A** — **Solitary thyroid nodule**—Fine Needle Aspiration Cytology (**FNAC**) remains the definitive initial diagnostic investigation of choice.\n\n---\n\n### Q172. [Ophthalmology — Image-Based]\n**A 60-year-old male presents with gradual loss of peripheral vision. Fundoscopy (Image: cupping of the optic disc with a cup-to-disc ratio of 0.8). What is the MOST LIKELY diagnosis?**\nA) Glaucoma\nB) Diabetic retinopathy\nC) Age-related macular degeneration\nD) Optic neuritis\n\n**Answer: A** — **Glaucoma**—progressive optic neuropathy classically characterized by pathological **cupping of the optic disc** and peripheral field loss.\n\n---\n\n### Q173. \n**A 25-year-old female presents with acute onset of eye pain, redness, and photophobia. A corneal ulcer is seen with a dendritic pattern. What is the MOST LIKELY organism?**\nA) Herpes simplex virus\nB) Varicella-zoster virus\nC) Adenovirus\nD) Bacteria\n\n**Answer: A** — **HSV keratitis**—the **dendritic ulcer** with terminal bulbs is highly specific and stains brilliantly with fluorescein.\n\n---\n\n### Q174. \n**A 55-year-old female presents with sudden onset of painless loss of vision in the right eye. Fundoscopy shows a cherry-red spot at the macula. What is the MOST LIKELY diagnosis?**\nA) Central retinal artery occlusion\nB) Central retinal vein occlusion\nC) Age-related macular degeneration\nD) Optic neuritis\n\n**Answer: A** — **CRAO**—ischemic opacification of the retina spares the fovea (supplied by the choroid), creating the pathognomonic **cherry-red spot**.\n\n---\n\n### Q175. [Psychiatry]\n**A 30-year-old female presents with alternating episodes of depression and mania. During manic episodes, she has decreased need for sleep, grandiosity, and excessive talking. What is the MOST LIKELY diagnosis?**\nA) Bipolar disorder\nB) Schizophrenia\nC) Major depressive disorder\nD) Cyclothymic disorder\n\n**Answer: A** — **Bipolar disorder**—classic alternating cycles of severe depression and full-blown mania.\n\n---\n\n### Q176. \n**A 25-year-old male presents with delusions, hallucinations, and disorganized speech. He has been experiencing these symptoms for 8 months. What is the MOST LIKELY diagnosis?**\nA) Schizophrenia\nB) Schizophreniform disorder\nC) Brief psychotic disorder\nD) Delusional disorder\n\n**Answer: A** — **Schizophrenia**—requires the continuous presence of psychotic symptoms for **>6 months**.\n\n---\n\n### Q177. \n**A 40-year-old male presents with recurrent episodes of panic attacks. What is the FIRST-LINE pharmacological treatment?**\nA) Benzodiazepines\nB) SSRIs\nC) Beta-blockers\nD) Tricyclic antidepressants\n\n**Answer: B** — **Panic disorder**—**SSRIs** are universally first-line for chronic management (while benzodiazepines are strictly reserved for acute abortive use).\n\n---\n\n### Q178. [Dermatology — Image-Based]\n**A 25-year-old female presents with a rash (Image: erythematous, scaly plaques with silvery scales on the elbows and knees). What is the MOST LIKELY diagnosis?**\nA) Psoriasis\nB) Eczema\nC) Pityriasis rosea\nD) Lichen planus\n\n**Answer: A** — **Psoriasis**—classic extensor surface involvement with erythematous plaques overlaid by **silvery scales** (Auspitz sign positive).\n\n---\n\n### Q179. \n**A 30-year-old male presents with a rash (Image: target lesions on the palms and soles). He has a history of recurrent herpes labialis. What is the MOST LIKELY diagnosis?**\nA) Erythema multiforme\nB) Stevens-Johnson syndrome\nC) Toxic epidermal necrolysis\nD) Urticaria\n\n**Answer: A** — **Erythema multiforme**—classic **target lesions**; HSV infection is the most common viral trigger.\n\n---\n\n### Q180. \n**A 40-year-old female presents with a skin rash (Image: violaceous, polygonal, flat-topped papules with Wickham's striae on the wrists). What is the MOST LIKELY diagnosis?**\nA) Lichen planus\nB) Psoriasis\nC) Eczema\nD) Pityriasis rosea\n\n**Answer: A** — **Lichen planus**—the 6 P's: Planar (flat-topped), Purple (violaceous), Polygonal, Pruritic, Papules, and Plaques with lacy white lines (**Wickham's striae**).\n\n---\n\n## 📋 PREPRIGA AUDITED ANSWER KEY — SET 1\n\n| Q | Ans | Q | Ans | Q | Ans | Q | Ans | Q | Ans | Q | Ans |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | B | 31 | C | 61 | B | 91 | C | 121 | B | 151 | A |\n| 2 | D | 32 | B | 62 | B | 92 | B | 122 | A | 152 | A |\n| 3 | B | 33 | C | 63 | B | 93 | A | 123 | B | 153 | A |\n| 4 | A | 34 | C | 64 | C | 94 | C | 124 | B | 154 | B |\n| 5 | B | 35 | A | 65 | A | 95 | B | 125 | B | 155 | A |\n| 6 | A | 36 | C | 66 | B | 96 | A | 126 | A | 156 | A |\n| 7 | B | 37 | C | 67 | A |
