otassium of 7.2 mEq/L. ECG shows absent P waves and a widened QRS complex. What is the SINGLE BEST immediate cardioprotective therapy?**\nA) IV Insulin + Glucose\nB) IV Calcium gluconate\nC) IV Sodium bicarbonate\nD) Urgent Hemodialysis\n\n**Answer: B** — **Severe Hyperkalemia** with dangerous ECG changes—**IV Calcium gluconate** acts within minutes to stabilize the myocardial resting membrane potential, preventing lethal arrhythmias.\n\n---\n\n### Q10. \n**A 55-year-old female presents with severe proximal muscle weakness (cannot comb her hair or rise from a chair) and a violaceous rash over her upper eyelids. Creatine kinase is 8000 U/L. What is the MOST LIKELY diagnosis?**\nA) Polymyositis\nB) Inclusion body myositis\nC) Dermatomyositis\nD) Steroid myopathy\n\n**Answer: C** — **Dermatomyositis**—Characterized by proximal muscle weakness plus classic skin findings: the **heliotrope rash** (eyelids) and Gottron's papules (knuckles).\n\n---\n\n### Q11. \n**A 30-year-old male presents 10 days after a hiking trip with a slowly expanding, target-like rash with central clearing (erythema migrans) on his thigh. He also has a mild fever and arthralgias. What is the SINGLE BEST treatment?**\nA) Amoxicillin\nB) Cefuroxime\nC) Doxycycline\nD) Azithromycin\n\n**Answer: C** — **Lyme disease (early localized)**—**Doxycycline** is the undisputed first-line treatment for adults.\n\n---\n\n### Q12. \n**A 25-year-old farmer presents with high fever, severe calf myalgia, conjunctival suffusion, and jaundice. He reports wading through floodwaters a week ago. Leptospirosis is suspected. What is the gold standard serological diagnostic test?**\nA) Blood culture\nB) Microscopic Agglutination Test (MAT)\nC) ELISA for IgM\nD) Dark-field microscopy\n\n**Answer: B** — **Leptospirosis**—The **Microscopic Agglutination Test (MAT)** is the definitive gold standard for serodiagnosis.\n\n---\n\n### Q13. \n**A 45-year-old male with a prosthetic mitral valve presents with fever, splinter hemorrhages, and Osler's nodes. Three consecutive routine blood cultures are negative. What is the SINGLE BEST next diagnostic step to visualize vegetations?**\nA) Transthoracic echocardiography (TTE)\nB) Serology for Coxiella burnetii\nC) Transesophageal echocardiography (TEE)\nD) Cardiac MRI\n\n**Answer: C** — **Culture-negative endocarditis / Prosthetic valve**—**TEE** is significantly more sensitive than TTE for detecting vegetations, especially on prosthetic valves or in the presence of severe shadowing.\n\n---\n\n### Q14. \n**A 60-year-old female with multiple sclerosis presents with rapidly progressive, painful loss of vision in her right eye. She has pain specifically with eye movement. A relative afferent pupillary defect (RAPD) is present. What is the MOST LIKELY diagnosis?**\nA) Central Retinal Artery Occlusion (CRAO)\nB) Optic Neuritis\nC) Acute Angle-Closure Glaucoma\nD) Retinal Detachment\n\n**Answer: B** — **Optic Neuritis**—Highly associated with Multiple Sclerosis; classic triad is unilateral visual loss, pain with eye movement, and an RAPD.\n\n---\n\n### Q15. \n**A 55-year-old male with decompensated cirrhosis presents with severe lethargy, confusion, and a \"flapping tremor\" (asterixis) of the hands. What is the SINGLE BEST pharmacological treatment to reduce his symptoms?**\nA) IV Thiamine\nB) Oral Lactulose and Rifaximin\nC) IV Magnesium\nD) IV Haloperidol\n\n**Answer: B** — **Hepatic Encephalopathy**—**Lactulose** (acidifies gut to trap ammonia as NH4+) and **Rifaximin** (kills ammonia-producing gut bacteria) are the mainstays of therapy.\n\n---\n\n### Q16. \n**A 65-year-old male with Parkinson's disease has been managed well on Levodopa/Carbidopa for 5 years. He now reports unpredictable, sudden returns of his rigidity and tremor before his next dose is due (\"wearing-off\" phenomenon). What is the BEST add-on therapy to prolong the half-life of Levodopa?**\nA) Amantadine\nB) Selegiline\nC) Entacapone\nD) Pramipexole\n\n**Answer: C** — **Entacapone**—A peripheral COMT inhibitor. It strictly blocks the peripheral degradation of Levodopa, increasing its half-life and brain penetration, reducing \"off\" time.\n\n---\n\n### Q17. \n**A 30-year-old male with severe persistent asthma presents with an acute exacerbation. Despite 3 back-to-back Albuterol/Ipratropium nebulizer treatments, he remains tachypneic with a PEF of 40% of predicted. What is the SINGLE BEST next systemic step?**\nA) Increase his home inhaled corticosteroids\nB) Start intravenous Theophylline\nC) Administer systemic Corticosteroids (IV Methylprednisolone or Oral Prednisone)\nD) Prepare for immediate intubation\n\n**Answer: C** — **Acute severe asthma exacerbation**—**Systemic corticosteroids** are critical to reverse the severe, underlying airway inflammation and prevent relapse.\n\n---\n\n### Q18. \n**A 40-year-old male with ESRD misses two consecutive hemodialysis sessions. He presents to the ER with severe orthopnea, hypoxemia, and pink frothy sputum. Chest X-ray shows bilateral fluffy perihilar infiltrates (\"bat-wing\" appearance). What is the MOST LIKELY diagnosis?**\nA) Dialysis-related ARDS\nB) Massive Pulmonary Embolism\nC) Acute cardiogenic pulmonary edema (Fluid overload)\nD) Uremic pneumonitis\n\n**Answer: C** — **Fluid overload / Pulmonary edema**—Missing dialysis leads to massive volume retention, pushing the patient into acute hydrostatic pulmonary edema.\n\n---\n\n### Q19. \n**A 25-year-old camper presents with high fever, severe headache, and a distinct petechial rash. The rash initially appeared on his wrists and ankles before spreading inward toward his trunk. What is the MOST LIKELY causative organism?**\nA) Neisseria meningitidis\nB) Dengue virus\nC) Rickettsia rickettsii (Rocky Mountain spotted fever)\nD) Streptococcus pneumoniae\n\n**Answer: C** — **Rocky Mountain Spotted Fever (RMSF)**—The rash classically has a **centripetal spread** (starts on the extremities/palms/soles and moves centrally to the trunk), distinguishing it from meningococcemia.\n\n---\n\n### Q20. \n**A 35-year-old male with untreated HIV (CD4 45) presents with headache, confusion, and right-sided weakness. MRI of the brain reveals multiple ring-enhancing lesions in the basal ganglia with surrounding edema. What is the SINGLE BEST empirical treatment?**\nA) Amphotericin B\nB) High-dose Corticosteroids\nC) Pyrimethamine + Sulfadiazine + Leucovorin\nD) Intravenous Acyclovir\n\n**Answer: C** — **CNS Toxoplasmosis**—The most common cause of multiple ring-enhancing lesions in advanced HIV. **Pyrimethamine + Sulfadiazine** is the specific antimicrobial therapy.\n\n---\n\n### Q21. \n**A 50-year-old male with a 30-year history of installing pipe insulation presents with a chronic, dry cough and significant weight loss. CT reveals marked unilateral pleural thickening, nodularity, and a large pleural effusion. What is the MOST LIKELY histology of this malignancy?**\nA) Adenocarcinoma\nB) Malignant Mesothelioma\nC) Squamous cell carcinoma\nD) Small cell carcinoma\n\n**Answer: B** — **Malignant Mesothelioma**—A highly lethal cancer of the pleura directly and almost exclusively linked to chronic **asbestos exposure** (insulation work).\n\n---\n\n### Q22. \n**A 65-year-old female with a history of atrial fibrillation presents with sudden, agonizing abdominal pain \"out of proportion to physical exam findings.\" She has mild bloody diarrhea. A CT scan of the abdomen shows focal bowel wall thickening and \"thumbprinting\" in the descending colon. What is the MOST LIKELY diagnosis?**\nA) Ulcerative Colitis flare\nB) Toxic Megacolon\nC) Ischemic Colitis\nD) Diverticulitis\n\n**Answer: C** — **Ischemic Colitis**—Pain out of proportion to exam + AFib (embolic source) + radiological **thumbprinting** (submucosal edema/hemorrhage in the bowel wall).\n\n---\n\n### Q23. \n**A 45-year-old male with a history of medication non-compliance presents with a BP of 230/130 mmHg. He has papilledema on fundoscopy and a rising serum creatinine. What is the SINGLE BEST acute parenteral antihypertensive to administer in the ICU?**\nA) Oral Clonidine\nB) Intravenous Labetalol or Nicardipine\nC) Sublingual Nifedipine\nD) Intravenous Furosemide\n\n**Answer: B** — **Hypertensive Emergency** (malignant hypertension with end-organ damage)—Requires easily titratable IV agents like **Labetalol or Nicardipine** to safely lower Mean Arterial Pressure by ~25% in the first hour.\n\n---\n\n### Q24. \n**A 60-year-old female with a history of treated breast cancer presents with a new-onset dull, aching chest pain and dyspnea. Chest X-ray reveals a massive, unilateral, right-sided pleural effusion. What is the SINGLE BEST initial diagnostic test?**\nA) Diagnostic Thoracentesis with cytological analysis\nB) Contrast CT of the chest\nC) Video-Assisted Thoracoscopic Surgery (VATS)\nD) Bronchoscopy\n\n**Answer: A** — **Malignant pleural effusion**—A **diagnostic thoracentesis** to evaluate the fluid (Light's criteria) and send for cytology is the definitive first step to confirm metastatic spread.\n\n---\n\n### Q25. \n**A 35-year-old male with a history of intravenous heroin use is admitted for fever and a new heart murmur. On day 3, he suddenly develops acute left-sided weakness. CT head shows a wedge-shaped hemorrhagic infarct in the right MCA territory. What is the MOST LIKELY pathogenesis?**\nA) Hypertensive intracerebral hemorrhage\nB) Septic embolization from infectious endocarditis\nC) Cerebral vasculitis\nD) Rupture of an Arteriovenous Malformation (AVM)\n\n**Answer: B** — **Septic emboli**—Infective endocarditis (especially left-sided or paradoxical right-sided) throws highly infectious, friable emboli to the brain, causing mycotic aneurysms and hemorrhagic strokes.\n\n---\n\n### Q26. \n**A 25-year-old female with SLE presents with severe peripheral edema, hypertension, and \"frothy\" urine. Renal biopsy confirms Class IV Diffuse Proliferative Lupus Nephritis. What is the SINGLE BEST induction immunosuppressive therapy?**\nA) Cyclosporine\nB) Mycophenolate mofetil (MMF) or IV Cyclophosphamide\nC) Rituximab monotherapy\nD) Oral Prednisone alone\n\n**Answer: B** — **Lupus Nephritis (Class IV)**—The most severe form. Induction therapy universally requires high-dose steroids combined with either **MMF** (preferred for better side effect profile) or **IV Cyclophosphamide**.\n\n---\n\n### Q27. \n**A 55-year-old male with a known history of chronic, inactive Hepatitis B (HBsAg positive, normal liver enzymes) is given high-dose chemotherapy for a new lymphoma. Two weeks later, he develops severe jaundice. AST is 1800, ALT 2100. What is the SINGLE BEST physiological explanation?**\nA) Acute superimposed Hepatitis A infection\nB) Direct chemotherapy-induced hepatotoxicity\nC) Reactivation of Hepatitis B due to profound immunosuppression\nD) Acute Hepatitis C coinfection\n\n**Answer: C** — **HBV Reactivation**—Immunosuppressive therapy (especially anti-CD20 agents or severe chemo) can cause massive, fulminant reactivation of latent HBV. Prophylactic antivirals (Tenofovir/Entecavir) should have been given.\n\n---\n\n### Q28. \n**A 45-year-old female with rheumatoid arthritis has been taking Methotrexate for 2 years. She develops a progressive, dry, non-productive cough, low-grade fever, and progressive dyspnea. Chest X-ray shows diffuse, bilateral interstitial infiltrates. What is the SINGLE BEST next step in management?**\nA) Stop the Methotrexate immediately and evaluate for drug-induced pneumonitis\nB) Double the dose of Methotrexate to treat the extra-articular RA flare\nC) Perform a diagnostic Bronchoalveolar lavage (BAL) before stopping any drugs\nD) Administer high-dose Folic acid\n\n**Answer: A** — **Methotrexate-induced pneumonitis**—A life-threatening hypersensitivity reaction. The offending drug must be **stopped immediately**, and systemic corticosteroids are often required.\n\n---\n\n### Q29. \n**A 60-year-old male with severe COPD is admitted for an acute exacerbation. He is drowsy. ABG on room air: pH 7.22, PaCO₂ 82 mmHg, PaO₂ 48 mmHg, HCO₃⁻ 31 mEq/L. He is hemodynamically stable. What is the SINGLE BEST initial ventilatory strategy?**\nA) Immediate endotracheal intubation\nB) Non-invasive positive pressure ventilation (NIV / BiPAP)\nC) High-flow nasal cannula oxygen at 15 L/min\nD) Emergency tracheostomy\n\n**Answer: B** — **Acute hypercapnic respiratory failure in COPD**—As long as the patient is protecting their airway and hemodynamically stable, a trial of **BiPAP** is the gold standard to blow off CO2 and avoid intubation.\n\n---\n\n### Q30. \n**A 30-year-old female with a seizure disorder has been perfectly controlled on Phenytoin for 5 years. She is unhappy with her severe gingival hyperplasia, facial hirsutism, and coarsening of her facial features. She wants to switch to a drug with a better cosmetic side-effect profile that is also safe for future pregnancy. What is the SINGLE BEST alternative?**\nA) Valproic Acid\nB) Carbamazepine\nC) Lamotrigine\nD) Topiramate\n\n**Answer: C** — **Lamotrigine** (or Levetiracetam)—Both lack the severe cosmetic side effects of Phenytoin and are considered among the safest antiepileptics for women of childbearing age (lowest teratogenic risk compared to Valproate).\n\n---\n\n### Q31. \n**A 50-year-old male with persistent atrial fibrillation has been taking Amiodarone for 2 years. He presents with severe palpitations, a 15-pound weight loss, severe heat intolerance, and a suppressed TSH (<0.01). What is the SINGLE BEST initial pharmacological treatment for this specific drug-induced complication?**\nA) Immediate Radioactive Iodine ablation\nB) High-dose Glucocorticoids and Thionamides (e.g., Methimazole)\nC) Total thyroidectomy\nD) Switch Amiodarone to Sotalol\n\n**Answer: B** — **Amiodarone-Induced Thyrotoxicosis (AIT)**—Because Amiodarone is packed with iodine and can cause destructive thyroiditis, treatment often requires a combination of **Thionamides** (to block synthesis) and **Glucocorticoids** (to halt inflammation and block T4 to T3 conversion).\n\n---\n\n### Q32. \n**A 65-year-old male with a 20-year history of poorly controlled diabetes presents with a deep, painless, highly exudative ulcer on the plantar surface of his foot beneath the first metatarsal head. The physician can effortlessly probe the ulcer base with a sterile blunt metal instrument until it hits hard bone. What is the SINGLE BEST imaging investigation to assess the extent of the underlying pathology?**\nA) Plain X-ray of the foot\nB) Three-phase Technetium-99m bone scan\nC) MRI of the foot\nD) CT scan with IV contrast\n\n**Answer: C** — **Diabetic foot osteomyelitis**—The \"probe-to-bone\" test is highly predictive. **MRI** is the gold standard imaging modality, offering unmatched sensitivity and specificity for differentiating osteomyelitis from soft tissue infection/Charcot arthropathy.\n\n---\n\n### Q33. \n**A 40-year-old female presents to the ER with a severe, acute asthma exacerbation, massive nasal congestion, and a flushed face. Her husband notes she took a pill for a headache an hour ago. Her medical records show a long history of recurrent nasal polyposis requiring multiple surgeries. What is the classical name for this exact clinical triad?**\nA) Samter's Triad (Aspirin-Exacerbated Respiratory Disease)\nB) Kartagener's Syndrome\nC) Churg-Strauss Syndrome\nD) Atopic March\n\n**Answer: A** — **Samter's Triad (AERD)**—The classic combination of **Aspirin/NSAID hypersensitivity, Asthma, and severe Nasal Polyps**. Inhibition of COX shifts arachidonic acid entirely to the leukotriene pathway, causing explosive bronchospasm.\n\n---\n\n### Q34. \n**A 55-year-old male with a 50-pack-year smoking history is diagnosed with Small Cell Lung Cancer (SCLC). He presents with severe proximal muscle weakness that paradoxically *improves* with repeated use, and decreased deep tendon reflexes. What is the specific paraneoplastic syndrome he is exhibiting?**\nA) Myasthenia Gravis\nB) Lambert-Eaton Myasthenic Syndrome (LEMS)\nC) Polymyalgia Rheumatica\nD) Paraneoplastic Cerebellar Degeneration\n\n**Answer: B** — **Lambert-Eaton Myasthenic Syndrome**—Caused by autoantibodies against presynaptic voltage-gated calcium channels. Distinct from MG, the weakness in LEMS strictly **improves with repetitive nerve stimulation/muscle use**.\n\n---\n\n### Q35. \n**A 30-year-old male returns from a 2-month stay in rural West Africa. He presents with a temperature of 40.5°C, severe rigors, jaundice, altered mental status, and a serum creatinine of 3.2 mg/dL. Blood smears confirm a heavy parasitemia (>10%) of Plasmodium falciparum. What is the SINGLE BEST, life-saving initial treatment?**\nA) Oral Chloroquine\nB) Intravenous Artesunate\nC) Oral Artemether-Lumefantrine (ACT)\nD) Intravenous Quinine + Doxycycline\n\n**Answer: B** — **Severe/Complicated P. falciparum Malaria**—The presence of organ failure (CNS, renal) or hyperparasitemia (>5%) demands immediate administration of **Intravenous Artesunate** (far superior to IV Quinine in preventing mortality).\n\n---\n\n### Q36. \n**A 60-year-old female with a history of hypertension and diabetes presents to the ER. Exactly 2 hours ago, she experienced a sudden onset of dense right-sided hemiplegia, aphasia, and forced leftward gaze deviation. Non-contrast CT head shows a prominent \"hyperdense MCA sign\" on the left, but absolutely no hemorrhage. What is the SINGLE BEST, most definitive acute management?**\nA) Intravenous Alteplase (tPA) alone\nB) Immediate Mechanical Thrombectomy (often combined with IV tPA)\nC) High-dose Aspirin and Clopidogrel\nD) Therapeutic Heparin infusion\n\n**Answer: B** — **Large Vessel Occlusion (LVO) Ischemic Stroke**—The \"hyperdense MCA sign\" represents a massive clot in the proximal Middle Cerebral Artery. While IV tPA is given, **Mechanical Thrombectomy** is the definitive, life-altering intervention for LVO strokes within 24 hours of onset.\n\n---\n\n# SECTION B — SURGERY & ORTHOPEDICS (36 Questions)\n\n---\n\n### Q37. \n**A 4-week-old firstborn male infant presents with fierce, projectile, non-bilious vomiting immediately after every feed. He is visibly dehydrated. Palpation reveals a firm \"olive\" mass in the right upper quadrant. Labs show Na 133, K 3.0, Cl 88, HCO3 36. What is the SINGLE BEST metabolic step that MUST be completed before surgery?**\nA) Administer IV Sodium Bicarbonate\nB) Correct the Hypochloremic Metabolic Alkalosis with IV Normal Saline and Potassium\nC) Immediate emergent Ramstedt pyloromyotomy\nD) Administer IV Calcium gluconate\n\n**Answer: B** — **Pyloric Stenosis**—This is a medical emergency, not a surgical one. The severe **hypochloremic, hypokalemic metabolic alkalosis** must be completely corrected with IV fluids before general anesthesia is safe.\n\n---\n\n### Q38. \n**A newborn infant has severe excessive drooling, choking, coughing, and cyanosis immediately upon attempting the very first breastfeed. An attempted insertion of a stiff nasogastric tube fails, and an X-ray shows the tube coiled entirely in the upper esophageal pouch. Air is visible in the stomach and intestines. What is the exact anatomical diagnosis?**\nA) Esophageal Atresia with a Distal Tracheoesophageal Fistula (Type C)\nB) Pure Esophageal Atresia without a fistula (Type A)\nC) Pure Tracheoesophageal Fistula without atresia (H-type)\nD) Esophageal Atresia with a Proximal Tracheoesophageal Fistula (Type B)\n\n**Answer: A** — **Esophageal Atresia with Distal TEF (Type C)**—The most common variant (85%). The atresia prevents the NG tube from passing, while the distal fistula from the trachea to the lower esophagus allows air to fill the stomach.\n\n---\n\n### Q39. \n**A 3-day-old full-term neonate has completely failed to pass any meconium. He has a massively distended abdomen and begins bilious vomiting. A diagnostic water-soluble contrast enema demonstrates a tiny, narrow distal rectum (microcolon) that abruptly transitions into a massively dilated proximal sigmoid colon. What is the SINGLE BEST definitive diagnostic test?**\nA) Suction rectal biopsy\nB) Anorectal manometry\nC) Plain abdominal X-ray\nD) Exploratory laparotomy\n\n**Answer: A** — **Hirschsprung Disease**—The **suction rectal biopsy** is the absolute gold standard. It must demonstrate a complete absence of ganglion cells in the submucosal (Meissner's) plexus.\n\n---\n\n### Q40. \n**A newborn male is noted by the pediatrician to have a completely absent anal opening (Imperforate Anus). Meconium is observed passing through the urethral meatus. What is the SINGLE BEST initial imaging study to determine if the rectal pouch is \"high\" or \"low\" relative to the puborectalis sling?**\nA) Prone cross-table lateral X-ray (Invertogram)\nB) High-resolution Abdominal Ultrasound\nC) Pelvic MRI\nD) CT scan of the pelvis without contrast\n\n**Answer: A** — **Imperforate Anus**—Historically, the **Invertogram (prone cross-table lateral X-ray)** taken after 24 hours (allowing swallowed air to reach the distal rectum) defines the distance between the air bubble and the perineal skin, guiding surgical approach.\n\n---\n\n### Q41. [Image-Based — X-ray]\n**A 12-year-old overweight boy presents with a 3-week history of a painless, dull aching limp and right groin/knee pain. X-ray of the hips (Image: the right femoral epiphysis appears to have \"slipped\" posteriorly and inferiorly off the femoral neck, resembling ice cream slipping off a cone). What is the SINGLE BEST surgical management?**\nA) Immediate in-situ single screw fixation (Pinning)\nB) Open surgical reduction and derotational osteotomy\nC) Placement in a spica cast for 6 weeks\nD) Total hip arthroplasty\n\n**Answer: A** — **Slipped Capital Femoral Epiphysis (SCFE)**—To prevent devastating avascular necrosis of the femoral head, immediate **in-situ pinning** across the physis to halt further slippage is the gold standard.\n\n---\n\n### Q42. \n**A 10-year-old child presents with a low-grade fever, severe unrelenting thoracic back pain, and a distinct refusal to walk. Physical examination reveals a sharp, angular kyphosis (\"gibbus\" deformity) of the mid-thoracic spine. MRI shows severe destruction of two adjacent vertebral bodies and the intervening disc space, with a large paraspinal \"cold\" abscess. What is the MOST LIKELY organism?**\nA) Staphylococcus aureus\nB) Mycobacterium tuberculosis\nC) Brucella melitensis\nD) Salmonella enterica\n\n**Answer: B** — **Pott's Disease (Spinal Tuberculosis)**—TB famously destroys the anterior aspect of the vertebral bodies, causing them to collapse forward into the classic **gibbus deformity**, often accompanied by a psoas \"cold abscess\".\n\n---\n\n### Q43. \n**A 16-year-old male presents with a rapidly growing, fiercely painful, hard mass in his distal femur. X-ray shows aggressive, destructive bone lysis, a \"sunburst\" spiculated periosteal reaction, and elevation of the periosteum at the margins (Codman's triangle). Core biopsy confirms malignant osteoblasts producing chaotic osteoid matrix. What is the SINGLE BEST modern management sequence for non-metastatic disease?**\nA) Neoadjuvant systemic chemotherapy followed by surgical limb salvage\nB) Immediate above-knee amputation\nC) Curative external beam radiotherapy alone\nD) Observation with serial X-rays\n\n**Answer: A** — **Osteosarcoma**—The standard of care is **Neoadjuvant chemotherapy** (to shrink the tumor and kill micrometastases) followed by **limb-salvage surgical resection** (with negative margins), significantly avoiding the need for amputation.\n\n---\n\n### Q44. \n**A 72-year-old female with a known history of advanced metastatic breast cancer trips on a carpet and sustains a complete, displaced, pathological fracture through the surgical neck of her right femur. Her life expectancy is estimated at 6 to 12 months. What is the SINGLE BEST palliative surgical management to immediately eliminate her pain and allow early mobilization?**\nA) Bipolar Hemiarthroplasty\nB) Total Hip Replacement\nC) Internal fixation with a Dynamic Hip Screw (DHS)\nD) Strict bed rest with skeletal traction\n\n**Answer: A** — **Pathological Femoral Neck Fracture in the elderly**—Because the bone is diseased and healing is unlikely, internal fixation (DHS) will fail. A **Hemiarthroplasty** removes the broken, cancerous femoral head entirely, allowing immediate weight-bearing and excellent pain relief.\n\n---\n\n### Q45. \n**A 22-year-old male is playing basketball. He jumps for a rebound, his arm is forced into extreme abduction and external rotation, and he feels a violent \"pop.\" He presents to the ER with his arm held slightly abducted and externally rotated. There is a visible loss of the normal shoulder contour (squared-off shoulder). What is the MOST COMMON anatomical type of this dislocation?**\nA) Anterior (Subcoracoid) Dislocation\nB) Posterior Dislocation\nC) Inferior Dislocation (Luxatio Erecta)\nD) Superior Dislocation\n\n**Answer: A** — **Anterior Shoulder Dislocation**—Accounts for >95% of all shoulder dislocations. The mechanism of forced abduction + external rotation levers the humeral head anteriorly, risking axillary nerve injury.\n\n---\n\n### Q46. \n**A 68-year-old male presents for a routine checkup. An ultrasound detects an asymptomatic infrarenal abdominal aortic aneurysm (AAA). A follow-up CT scan perfectly maps the aneurysm, measuring it exactly at 5.7 cm in maximum diameter. The proximal aortic neck is long and healthy. What is the SINGLE BEST management?**\nA) Endovascular Aneurysm Repair (EVAR)\nB) Open surgical repair with a Dacron graft\nC) Medical surveillance with ultrasound every 6 months\nD) Initiation of high-dose beta-blockers\n\n**Answer: A** — **AAA ≥5.5 cm**—This size breaches the threshold for intervention to prevent rupture. Because the anatomy is suitable (good proximal neck), **EVAR** is the preferred, less invasive first-line modality compared to open surgery.\n\n---\n\n### Q47. \n**A 35-year-old male is brought to the trauma bay after a severe high-speed motorcycle crash. He is gasping for air, profoundly hypotensive (BP 70/40), and tachycardic (HR 140). Examination shows distended neck veins, absent breath sounds on the right, and the trachea is visibly deviated to the left. What is the SINGLE BEST, life-saving immediate action?**\nA) Needle thoracostomy (decompression) in the 2nd intercostal space, midclavicular line\nB) Immediate portable Chest X-ray\nC) Insertion of a 36F chest tube in the 5th intercostal space, midaxillary line\nD) Emergency intubation and mechanical ventilation\n\n**Answer: A** — **Tension Pneumothorax**—A clinical diagnosis. Awaiting an X-ray is lethal. **Immediate needle decompression** converts it to a simple pneumothorax, restoring venous return and cardiac output, buying time for definitive chest tube placement.\n\n---\n\n### Q48. \n**A 50-year-old male with a 20-year history of severe, unrelenting GERD presents with progressive dysphagia to solid foods. Endoscopy reveals a nodular stricture in the lower third of the esophagus. Multiple biopsies confirm Barrett's esophagus with definitive High-Grade Dysplasia. There is no invasive carcinoma yet. What is the SINGLE BEST definitive management?**\nA) Endoscopic mucosal resection (EMR) or Radiofrequency Ablation (RFA)\nB) Radical Esophagectomy\nC) Nissen Fundoplication\nD) High-dose twice-daily Proton Pump Inhibitors and annual surveillance\n\n**Answer: A** — **Barrett's Esophagus with High-Grade Dysplasia**—Historically treated with esophagectomy, the modern, preferred, highly successful, and less morbid definitive treatment is **endoscopic eradication therapy (EMR for nodules + RFA for flat dysplasia)**. (Note: Esophagectomy is acceptable but overly aggressive if endotherapy is available).\n\n---\n\n### Q49. \n**A 55-year-old female with known symptomatic gallstones presents with a high fever, severe right upper quadrant pain, and overt scleral icterus (jaundice). Ultrasound shows a dilated common bile duct (CBD) measuring 12 mm with a visible echogenic stone lodged at the ampulla of Vater. What is the SINGLE BEST definitive therapeutic procedure?**\nA) Endoscopic Retrograde Cholangiopancreatography (ERCP) with sphincterotomy\nB) Immediate open cholecystectomy with CBD exploration\nC) Magnetic Resonance Cholangiopancreatography (MRCP)\nD) Percutaneous Transhepatic Cholangiography (PTC)\n\n**Answer: A** — **Choledocholithiasis causing ascending cholangitis**—**ERCP with sphincterotomy and stone extraction** is the gold standard therapeutic maneuver to decompress the infected biliary tree immediately.\n\n---\n\n### Q50. \n**A 70-year-old male with a 40-pack-year smoking history presents with painless, gross hematuria with blood clots. Cystoscopy reveals a 3 cm papillary, \"seaweed-like\" tumor on the right lateral bladder wall. A biopsy confirms Transitional Cell Carcinoma, Stage Ta, Low Grade. What is the SINGLE BEST management?**\nA) Transurethral Resection of Bladder Tumor (TURBT) alone\nB) TURBT followed by a 6-week induction course of intravesical BCG\nC) Radical Cystoprostatectomy\nD) Systemic chemotherapy\n\n**Answer: A** — **Ta, Low-Grade Bladder Cancer**—This is a superficial, non-invasive, low-risk tumor. Complete resection via **TURBT alone** is curative. Intravesical BCG is strictly reserved for High-Grade or T1 (lamina propria invading) tumors.\n\n---\n\n### Q51. \n**A 30-year-old male presents with a painless, heavy, fluid-filled swelling in his right scrotum. The examiner can easily palpate the normal spermatic cord above the swelling. In a darkened room, a penlight placed against the posterior scrotum brilliantly illuminates the entire mass. What is the MOST LIKELY diagnosis?**\nA) Varicocele\nB) Testicular tumor\nC) Epididymal cyst\nD) Primary Hydrocele\n\n**Answer: D** — **Hydrocele**—A collection of fluid within the tunica vaginalis. The hallmark physical sign is **brilliant transillumination** due to the clear serous fluid.\n\n---\n\n### Q52. \n**A 40-year-old male unrestrained driver hits a concrete wall at 60 mph. He sustains fractures to ribs 4, 5, 6, and 7 in two separate places along the anterolateral right chest wall. Upon inspiration, that segment of the chest wall paradoxically sucks inward. He is hypoxemic and in severe pain. What is the SINGLE BEST definitive management to correct the underlying physiology?**\nA) Application of tight chest binders/sandbags over the flail segment\nB) Adequate pain control (epidural) and Positive End-Expiratory Pressure (PEEP) ventilation\nC) Immediate surgical plating of the fractured ribs\nD) Insertion of bilateral chest tubes\n\n**Answer: B** — **Flail Chest**—The paradoxical movement impairs ventilation, but the true cause of hypoxia is the underlying lung contusion. **Aggressive pain control** and internal pneumatic splinting using **PEEP (via CPAP or intubation)** is the definitive standard of care.\n\n---\n\n### Q53. \n**A 25-year-old female undergoes a total thyroidectomy for a rapidly growing, painless 3 cm thyroid mass. Histopathological examination of the excised gland reveals branching fibrovascular cores lined by cuboidal epithelial cells with empty, optically clear nuclei (\"Orphan Annie\" eyes), and scattered concentrically calcified structures (Psammoma bodies). What is the specific diagnosis?**\nA) Papillary thyroid carcinoma\nB) Follicular thyroid carcinoma\nC) Medullary thyroid carcinoma\nD) Anaplastic thyroid carcinoma\n\n**Answer: A** — **Papillary Thyroid Carcinoma**—The most common thyroid cancer. It is definitively diagnosed by its nuclear features (Orphan Annie eyes, nuclear grooves) and the pathognomonic presence of **Psammoma bodies**.\n\n---\n\n### Q54. \n**A 55-year-old male with a history of severe acute alcoholic pancreatitis 8 weeks ago presents with persistent early satiety, nausea, and a palpable, smooth epigastric mass. A CT scan confirms a massive 10 cm, thick-walled fluid collection entirely filling the lesser sac, severely compressing the stomach. What is the SINGLE BEST definitive management?**\nA) Endoscopic cystogastrostomy (Internal drainage)\nB) Open surgical cystojejunostomy\nC) Percutaneous CT-guided external catheter drainage\nD) Observation with total parenteral nutrition\n\n**Answer: A** — **Symptomatic Pancreatic Pseudocyst**—Because the cyst is mature (>6 weeks), thick-walled, and firmly adherent to the stomach causing outlet obstruction, a minimally invasive **endoscopic cystogastrostomy** provides superb internal drainage.\n\n---\n\n### Q55. \n**A 60-year-old male with long-standing hypertension presents with a transient episode of sudden left-sided weakness and aphasia (a TIA) that resolves completely in 2 hours. A carotid duplex ultrasound reveals a severe, 85% atherosclerotic stenosis of the right internal carotid artery. What is the SINGLE BEST intervention to prevent a massive stroke?**\nA) Right Carotid Endarterectomy (CEA) within 2 weeks\nB) Placement of a Carotid artery stent\nC) High-dose Aspirin and Clopidogrel indefinitely\nD) Systemic anticoagulation with Warfarin\n\n**Answer: A** — **Symptomatic severe carotid stenosis (>70%)**—**Carotid Endarterectomy (CEA)** is the undisputed gold standard surgical intervention to remove the plaque and significantly reduce the risk of a major ipsilateral ischemic stroke.\n\n---\n\n### Q56. \n**A 40-year-old male is involved in a bar fight and sustains a single stab wound to the right upper quadrant of his abdomen. Upon arrival at the trauma center, his heart rate is 85 bpm, and his blood pressure is a rock-solid 125/80 mmHg. He has mild local tenderness but no diffuse peritonitis. FAST ultrasound is negative. What is the SINGLE BEST immediate management?**\nA) Local wound exploration under local anesthesia\nB) Emergency exploratory laparotomy\nC) CT scan of the abdomen and pelvis with intravenous contrast\nD) Discharge with oral antibiotics\n\n**Answer: C** — **Hemodynamically stable penetrating abdominal trauma**—While unstable patients go straight to the OR, perfectly stable patients should undergo a triple-contrast **CT scan** to definitively rule out occult solid organ or hollow viscous injuries.\n\n---\n\n### Q57. \n**A 30-year-old male soccer player plants his foot, violently twists his right knee, and feels a tearing sensation. Two days later, he presents with a swollen knee that frequently \"locks\" in a flexed position and \"gives way\" when walking down stairs. The McMurray test elicits a painful mechanical click over the medial joint line. What is the SINGLE BEST management for this pathology in this young athlete?**\nA) Arthroscopic meniscal repair\nB) Complete open total meniscectomy\nC) Strict conservative management with physical therapy\nD) Intra-articular corticosteroid injection\n\n**Answer: A** — **Acute Meniscal Tear in a young patient**—If the tear is in the vascularized (red-red) outer zone, **arthroscopic meniscal repair** is strongly indicated to preserve the meniscus and prevent early-onset osteoarthritis.\n\n---\n\n### Q58. \n**A 65-year-old female presents to the surgical clinic with a painless, rock-hard, non-mobile, 3 cm mass located squarely in the left supraclavicular fossa (Virchow's node). She has no other symptoms. A core needle biopsy of the node reveals metastatic adenocarcinoma. What is the MOST LIKELY primary anatomical source of this cancer?**\nA) Stomach (Gastric Adenocarcinoma)\nB) Lung\nC) Breast\nD) Thyroid\n\n**Answer: A** — **Virchow's Node (Left supraclavicular adenopathy)**—The thoracic duct drains the entire abdomen and terminates at the left subclavian vein. A malignant node here is the classic hallmark of metastatic intra-abdominal malignancy, most famously **Gastric Adenocarcinoma** (Troisier's sign).\n\n---\n\n### Q59. \n**A 55-year-old male with a 40-pack-year smoking history presents with severe, radiating pain down the medial aspect of his right arm, wasting of the intrinsic hand muscles, and right-sided ptosis, miosis, and anhidrosis. A chest CT confirms a massive tumor in the absolute apex of the right lung, directly invading the lower brachial plexus (C8-T1) and the cervical sympathetic chain. What is the SINGLE BEST multimodal treatment protocol for localized disease?**\nA) Concurrent chemoradiotherapy followed by radical surgical resection\nB) Immediate surgical resection alone\nC) Palliative external beam radiotherapy alone\nD) High-dose targeted biological therapy (e.g., Erlotinib)\n\n**Answer: A** — **Pancoast Tumor (Superior Sulcus Tumor)**—Due to extensive local neural/vascular invasion, upfront surgery is impossible. The standard of care is **neoadjuvant concurrent chemoradiotherapy** to shrink the margins, followed by complex en bloc surgical resection.\n\n---\n\n### Q60. \n**A 2-year-old child presents with a massive, firm, irregular abdominal mass that clearly crosses the midline of the abdomen. The child appears chronically ill and has periorbital ecchymoses (\"raccoon eyes\"). 24-hour urine collection reveals massively elevated levels of Homovanillic acid (HVA) and Vanillylmandelic acid (VMA). What is the MOST LIKELY diagnosis?**\nA) Wilms tumor (Nephroblastoma)\nB) Neuroblastoma\nC) Hepatoblastoma\nD) Rhabdomyosarcoma\n\n**Answer: B** — **Neuroblastoma**—A neural crest tumor of the adrenal medulla or sympathetic chain. It characteristically **crosses the midline**, causes paraneoplastic \"raccoon eyes\" (from orbital metastases), and secretes catecholamine metabolites (**VMA/HVA**).\n\n---\n\n### Q61. \n**A 5-year-old otherwise healthy child is brought to the pediatrician because the mother noticed a huge, smooth, firm mass on the left side of his abdomen while bathing him. The mass does NOT cross the midline. Urinalysis shows microscopic hematuria, and his blood pressure is elevated at 130/85 mmHg. What is the SINGLE BEST initial surgical management?**\nA) Immediate Radical Nephrectomy\nB) Open surgical biopsy to confirm the diagnosis\nC) Placement of a percutaneous nephrostomy tube\nD) Core needle biopsy followed by observation\n\n**Answer: A** — **Wilms Tumor (Nephroblastoma)**—A smooth renal mass that strictly stays on one side of the abdomen. If the tumor is unilateral and appears resectable on imaging, **upfront radical nephrectomy** (without prior biopsy, to prevent tumor spillage) is the standard in North America.\n\n---\n\n### Q62. \n**A 55-year-old obese female presents with a 24-hour history of unrelenting, severe right upper quadrant (RUQ) abdominal pain, nausea, and a fever of 38.5°C. She exhibits a sharp inspiratory arrest when the physician palpates under her right costal margin (positive Murphy's sign). Ultrasound shows a 6 mm thickened gallbladder wall, pericholecystic fluid, and an impacted stone in the gallbladder neck. What is the SINGLE BEST management?**\nA) Early Laparoscopic Cholecystectomy within 72 hours\nB) Intravenous antibiotics and elective surgery in 6 weeks\nC) Percutaneous Cholecystostomy tube placement\nD) ERCP to remove the stone\n\n**Answer: A** — **Acute Cholecystitis**—The gold standard management is an **early laparoscopic cholecystectomy** (performed during the same hospital admission, ideally within 72 hours of symptom onset) to definitively resolve the infection and prevent gangrene/perforation.\n\n---\n\n### Q63. \n**A 75-year-old male with a long history of a multi-nodular goiter presents with a terrifyingly rapid, visible enlargement of his neck over the past 3 weeks. He has severe hoarseness, dysphagia, and stridor. FNAC of the hard, fixed mass reveals wildly pleomorphic, undifferentiated spindle and giant cells with massive necrosis. What is the SINGLE BEST management?**\nA) Palliative external beam radiotherapy and secure the airway (Tracheostomy)\nB) Emergency total thyroidectomy with radical neck dissection\nC) High-dose radioactive iodine (I-131) ablation\nD) Curative systemic chemotherapy\n\n**Answer: A** — **Anaplastic Thyroid Carcinoma**—The most aggressive and lethal of all solid tumors. It is almost universally unresectable at presentation and does not take up iodine. Treatment is purely **palliative (airway protection and radiotherapy)**.\n\n---\n\n### Q64. \n**A 30-year-old male presents with severe, progressive bilateral hearing loss. His medical history is notable for suffering over 15 bone fractures during his childhood from minimal trauma. Physical examination reveals strikingly distinctly blue-tinted sclerae. What is the MOST LIKELY genetic diagnosis?**\nA) Osteogenesis Imperfecta\nB) Ehlers-Danlos syndrome\nC) Marfan syndrome\nD) Achondroplasia\n\n**Answer: A** — **Osteogenesis Imperfecta (Type I)**—An autosomal dominant defect in Type I collagen synthesis, resulting in the classic triad of brittle bones (multiple fractures), **blue sclerae** (thin sclera revealing underlying choroid veins), and early-onset conductive hearing loss.\n\n---\n\n### Q65. \n**A 60-year-old male presents with a slow-growing, painless lump situated precisely at the anterior border of the sternocleidomastoid muscle at the level of the hyoid bone. Examination reveals it is rubbery and mobile side-to-side, but absolutely immobile vertically. A distinct bruit is heard over the mass, and it exhibits an expansile pulsation. What is the MOST LIKELY diagnosis?**\nA) Carotid Body Tumor (Chemodectoma)\nB) Branchial Cleft Cyst\nC) Thyroglossal Duct Cyst\nD) Tuberculous Lymphadenitis\n\n**Answer: A** — **Carotid Body Tumor**—A highly vascular paraganglioma nestled exactly in the carotid bifurcation. The classic signs are side-to-side mobility only (Fontaine's sign), an expansile pulsation, and a bruit.\n\n---\n\n### Q66. \n**A 35-year-old male presents with a painful, swollen, red right calf 5 days after returning from a 14-hour trans-Pacific flight. A venous duplex ultrasound confirms a massive occlusive DVT in the femoral and popliteal veins. He is started on appropriate therapeutic anticoagulation. What is the SINGLE BEST intervention to prevent the long-term complication of Post-Thrombotic Syndrome (PTS)?**\nA) Early, consistent use of graduated compression stockings\nB) Lifelong Warfarin therapy\nC) Complete, strict bed rest for 2 weeks\nD) Insertion of an Inferior Vena Cava (IVC) filter\n\n**Answer: A** — **Post-Thrombotic Syndrome**—Caused by venous valvular destruction from the clot, leading to chronic leg swelling, pain, and venous ulcers. The daily use of knee-high **graduated compression stockings** significantly reduces the incidence and severity of PTS.\n\n---\n\n### Q67. \n**A 25-year-old female presents with a painless, smooth, spherical 2 cm swelling on the dorsal aspect of her right wrist. It becomes more prominent when she maximally flexes her wrist. It is completely immobile. In a dark room, placing a penlight against the mass causes it to brilliantly transilluminate. What is the MOST LIKELY diagnosis?**\nA) Ganglion Cyst\nB) Lipoma\nC) Epidermal Inclusion Cyst\nD) Rheumatoid Nodule\n\n**Answer: A** — **Ganglion Cyst**—A benign, mucin-filled synovial cyst arising from the joint capsule or tendon sheath. Its classic location (dorsum of the wrist) and **brilliant transillumination** confirm the diagnosis.\n\n---\n\n### Q68. \n**A 55-year-old male with a 20-year history of poorly controlled diabetes and severe peripheral neuropathy presents with a massive, foul-smelling, necrotic ulcer enveloping his entire left heel. The calcaneus bone is widely exposed, black, and crumbling. He has severe systemic sepsis. What is the SINGLE BEST life-saving surgical management?**\nA) Aggressive local wound debridement and prolonged IV antibiotics\nB) Emergency Below-Knee Amputation (BKA)\nC) Endovascular revascularization bypass\nD) Daily Hyperbaric Oxygen Therapy\n\n**Answer: B** — **Wagner Grade 4/5 Diabetic Foot (Extensive Gangrene/Osteomyelitis)**—When the entire heel is necrotic, the bone is destroyed, and the patient is septic, limb salvage is impossible and lethal. A major **amputation (Below-Knee)** is required to remove the dead tissue and save the patient's life.\n\n---\n\n### Q69. \n**A 40-year-old female complains of palpitations, heat intolerance, and severe weight loss. Her TSH is completely suppressed (<0.01) and Free T4 is wildly elevated. Physical exam reveals a solitary 3 cm nodule in the right thyroid lobe. A Technetium-99m thyroid scan shows intense, focal, blazing uptake entirely in the nodule, with complete suppression of the rest of the gland (a \"hot\" nodule). What is the SINGLE BEST definitive, curative management?**\nA) High-dose Radioactive Iodine (I-131) ablation\nB) Total Thyroidectomy\nC) Lifelong Methimazole therapy\nD) Observation\n\n**Answer: A** — **Toxic Adenoma (Plummer's Disease)**—A solitary \"hot\" nodule autonomously producing massive amounts of thyroid hormone. Because the rest of the gland is suppressed, **Radioactive Iodine (I-131)** specifically targets and destroys only the hyperactive nodule, sparing normal tissue.\n\n---\n\n### Q70. \n**A 60-year-old male smoker with a history of claudication presents with sudden, agonizing, paralyzing pain in his right lower leg. Examination reveals the leg is pale, cold, entirely pulseless, and he cannot move his toes (paralysis). Doppler signals are absent. He has a known history of atrial fibrillation but is not on anticoagulation. What is the SINGLE BEST immediate surgical intervention?**\nA) Emergency Fogarty balloon catheter embolectomy\nB) Endovascular stent placement in the superficial femoral artery\nC) Intramuscular injection of Alteplase (tPA)\nD) Immediate Below-Knee Amputation\n\n**Answer: A** — **Acute Limb Ischemia (Embolic)**—The classic \"6 P's\" (Pain, Pallor, Pulselessness, Paresthesia, Paralysis, Poikilothermia). Because the leg is paralyzed, ischemia is profound and irreversible damage is imminent. An **emergency Fogarty balloon embolectomy** via cutdown is the gold standard to rapidly extract the clot.\n\n---\n\n### Q71. \n**A 6-year-old boy presents with a painless, spherical 2 cm swelling located perfectly in the midline of the anterior neck, positioned exactly over the thyrohyoid membrane. When the examiner asks the child to stick his tongue out, the mass distinctly rapidly darts upward. What is the specific embryological diagnosis?**\nA) Thyroglossal Duct Cyst\nB) Branchial Cleft Cyst\nC) Dermoid Cyst\nD) Enlarged Delphian Lymph Node\n\n**Answer: A** — **Thyroglossal Duct Cyst**—A remnant of the descending thyroid gland. Because the tract connects to the base of the tongue (foramen cecum), the pathognomonic physical sign is that the mass **moves vertically with tongue protrusion**.\n\n---\n\n### Q72. \n**A 30-year-old male motorcyclist is brought to the trauma center after a high-speed collision. He has a massive \"open-book\" pelvic fracture. His blood pressure is a rock-solid 115/75 mmHg and heart rate is 90 bpm. A FAST ultrasound demonstrates a large stripe of free anechoic fluid perfectly outlining the hepatorenal recess (Morrison's Pouch). What is the SINGLE BEST next step in management?**\nA) Immediate emergency exploratory laparotomy\nB) Contrast-enhanced CT scan of the abdomen and pelvis\nC) Diagnostic Peritoneal Lavage (DPL)\nD) Blind application of a pelvic binder and discharge\n\n**Answer: B** — **Hemodynamically STABLE blunt abdominal trauma with a positive FAST**—Because his vitals are perfectly normal, he is stable enough to proceed to the scanner. A **CT scan with IV contrast** is essential to explicitly define the grade of solid organ injury and map the complex pelvic fracture before any surgery.\n\n---\n\n# SECTION C — OBSTETRICS & GYNECOLOGY (36 Questions)\n\n---\n\n### Q73. \n**A 30-year-old G2P2 female strongly desires a highly effective, long-acting, hormone-free contraceptive method. She elects to have a Copper T380A Intrauterine Device inserted. What is the SINGLE BEST description of the primary mechanism of action by which this device prevents pregnancy?**\nA) It exerts a massive spermicidal effect by releasing copper ions that incite a sterile inflammatory reaction, fundamentally destroying sperm motility and viability\nB) It powerfully thickens the cervical mucus, creating an impenetrable plug against sperm\nC) It completely completely shuts down the hypothalamic-pituitary-ovarian axis, preventing ovulation\nD) It causes profound endometrial atrophy\n\n**Answer: A** — **Copper IUD**—The copper ions create a hostile, highly cytotoxic, sterile inflammatory environment in the uterus and tubes. This massive **spermicidal effect** destroys sperm before they can ever reach or fertilize the ovum.\n\n---\n\n### Q74. \n**A 25-year-old female who has been taking a combined oral contraceptive pill (COC) perfectly for 3 years develops a sudden onset of a severe, unrelenting headache unlike any she has ever had, accompanied by a left visual field deficit. A STAT MRI/MRV of the brain confirms a massive thrombosis in the superior sagittal venous sinus. What is the SINGLE BEST pharmacological management?**\nA) Immediately stop the COC and initiate full-dose systemic anticoagulation with LMWH or Heparin\nB) Stop the COC and administer a high-dose Aspirin regimen\nC) Proceed directly to systemic thrombolysis with IV Alteplase (tPA)\nD) Maintain the COC to prevent withdrawal bleeding, but add Warfarin\n\n**Answer: A** — **Cerebral Venous Sinus Thrombosis (CVST)**—A known, rare, and devastating hypercoagulable complication of estrogen therapy. The inciting agent (COC) must be **stopped instantly**, and despite the location in the brain, **systemic therapeutic anticoagulation (Heparin/LMWH)** is the international standard of care to arrest clot growth.\n\n---\n\n### Q75. \n**A 35-year-old female with a long history of debilitating dysmenorrhea and severe, heavy menstrual bleeding (menorrhagia) due to diffuse adenomyosis has a Levonorgestrel-Releasing Intrauterine System (LNG-IUS / Mirena) inserted. Over the next 6 months, her bleeding dramatically reduces to amenorrhea. What is the PRIMARY mechanism of action achieving this therapeutic effect?**\nA) Severe, profound local down-regulation and atrophy of the endometrial lining\nB) Massive systemic suppression of FSH and LH, halting ovulation completely\nC) Direct apoptosis of the adenomyotic tissue\nD) Complete mechanical blockage of the fallopian tubes\n\n**Answer: A** — **LNG-IUS (Mirena)**—Releases a continuous, high local concentration of progestin directly into the uterine cavity, driving the glandular tissue into severe **endometrial decidualization and profound atrophy**, which physically eliminates the source of the bleeding.\n\n---\n\n### Q76. \n**A 28-year-old female with a lifelong history of severe, generalized epilepsy requires Valproic Acid for seizure control. She is now actively planning her first pregnancy. Recognizing the massive teratogenic risks, the neurologist switches her to Levetiracetam, but insists she begins a specific, high-dose vitamin supplement 3 months prior to conception. What is the SINGLE BEST dose of this critical supplement?**\nA) Folic Acid 0.4 mg/day\nB) Folic Acid 4.0 mg/day\nC) Folic Acid 1.0 mg/day\nD) Folic Acid 5.0 mg/day\n\n**Answer: B** — **High-Risk Neural Tube Defect Prophylaxis**—Women with a history of taking powerful anti-folate antiepileptics (like Valproate or Carbamazepine), or those with a prior NTD-affected pregnancy, are in the highest risk category and strictly require **Folic Acid 4.0 mg (or 5.0 mg) daily** starting months before conception.\n\n---\n\n### Q77. \n**A 32-year-old primigravida at 12 weeks gestation presents for her first prenatal visit. Routine screening returns a highly positive VDRL (1:64) and a reactive FTA-ABS test, confirming active Syphilis. The patient states she has a severe, documented anaphylactic allergy to Penicillin. What is the SINGLE BEST, definitive management to treat her and prevent congenital syphilis?**\nA) Admit her to the ICU, perform rapid oral Penicillin desensitization, and administer Intramuscular Benzathine Penicillin G\nB) Prescribe a 14-day course of oral Doxycycline\nC) Administer a single dose of Intravenous Ceftriaxone\nD) Prescribe a 14-day course of oral Erythromycin\n\n**Answer: A** — **Syphilis in Pregnancy with Penicillin Allergy**—There is NO acceptable alternative to Penicillin in pregnancy to guarantee the prevention of devastating congenital syphilis. The patient MUST undergo **formal Penicillin desensitization** followed by the standard **Benzathine Penicillin G injection**.\n\n---\n\n### Q78. \n**A 40-year-old female undergoes a routine Pap smear which returns as High-Grade Squamous Intraepithelial Lesion (HSIL). A subsequent colposcopy demonstrates a dense acetowhite lesion with coarse punctation. A directed punch biopsy confirms Cervical Intraepithelial Neoplasia grade 3 (CIN-3). What is the SINGLE BEST definitive management?**\nA) Loop Electrosurgical Excision Procedure (LEEP) or Cold Knife Cone Biopsy\nB) Total Abdominal Hysterectomy\nC) Topical application of Imiquimod cream\nD) Observation with a repeat Pap smear in 6 months\n\n**Answer: A** — **CIN-3 (Severe Dysplasia)**—This is a direct precursor to invasive cervical cancer. The entire transformation zone must be excised to both treat the lesion and provide a complete pathological specimen to rule out occult invasive cancer. **LEEP or Cone biopsy** is the gold standard.\n\n---\n\n### Q79. \n**A 30-year-old female presents to the STI clinic with a 5-day history of copious, foul-smelling, purulent yellow vaginal discharge and severe dysuria. A nucleic acid amplification test (NAAT) of an endocervical swab returns wildly positive for Neisseria gonorrhoeae. Assuming her Chlamydia status is currently unknown, what is the SINGLE BEST empiric pharmacological treatment?**\nA) Intramuscular Ceftriaxone (500 mg) plus Oral Doxycycline (100 mg twice daily for 7 days)\nB) Intramuscular Ceftriaxone alone\nC) Oral Azithromycin (1 gram) alone\nD) Oral Cefixime plus Intramuscular Penicillin\n\n**Answer: A** — **Uncomplicated Gonococcal Cervicitis**—Due to notoriously high rates of co-infection, if Chlamydia has not been explicitly ruled out, the CDC strictly mandates dual therapy: **Ceftriaxone** (to eradicate Gonorrhea) **PLUS Doxycycline** (to definitively eradicate Chlamydia).\n\n---\n\n### Q80. \n**A 28-year-old female presents with a 4-week history of amenorrhea, mild breast tenderness, and a positive home pregnancy test. She is deeply anxious. A transvaginal ultrasound is performed and perfectly visualizes a small intrauterine gestational sac containing a distinct yolk sac, a 3 mm fetal pole, and a visible, rhythmic fetal heartbeat. She has no bleeding or cramping. What is the SINGLE BEST next step in her care?**\nA) Reassurance, congratulation, and scheduling of routine prenatal care\nB) Drawing serial quantitative β-hCG levels every 48 hours to ensure a normal rise\nC) Immediate prescription of vaginal progesterone suppositories to prevent miscarriage\nD) Genetic counseling for amniocentesis\n\n**Answer: A** — **Confirmed Normal Early Intrauterine Pregnancy**—The presence of a yolk sac, fetal pole, and heartbeat inside the uterus definitively confirms a live, normal intrauterine pregnancy. Zero medical interventions (hCGs or progesterone) are indicated; the patient simply requires **reassurance and standard obstetric care**.\n\n---\n\n### Q81. \n**A 35-year-old female with a known, biopsy-proven diagnosis of Antiphospholipid Antibody Syndrome (APS) presents for pre-conception counseling. She has suffered three consecutive, devastating fetal losses at 14, 16, and 20 weeks due to massive placental thrombosis. She is now actively trying to conceive again. What is the SINGLE BEST pharmacological management strategy throughout her next pregnancy to ensure a live birth?**\nA) Daily administration of Low Molecular Weight Heparin (LMWH) combined with Low-Dose Aspirin\nB) Daily high-dose Aspirin monotherapy\nC) Warfarin therapy for the first two trimesters, switching to Heparin in the third\nD) Daily high-dose systemic Corticosteroids\n\n**Answer: A** — **Antiphospholipid Syndrome (Obstetric)**—The standard of care to prevent placental thrombosis and recurrent late miscarriage in a patient with a definitive APS history is the synergistic combination of **prophylactic-dose LMWH and low-dose Aspirin** starting early in pregnancy.\n\n---\n\n### Q82. \n**A 40-year-old female with a 5-year history of taking Tamoxifen for breast cancer presents with heavy postmenopausal vaginal bleeding. A diagnostic hysteroscopy with biopsy confirms Grade 1, highly well-differentiated Endometrioid Adenocarcinoma. A staging MRI confirms the tumor is strictly confined to the endometrium with absolutely zero myometrial invasion. What is the SINGLE BEST definitive surgical management?**\nA) Total Abdominal Hysterectomy with Bilateral Salpingo-Oophorectomy (TAH+BSO)\nB) Radical Hysterectomy with complete pelvic lymphadenectomy\nC) Simple Vaginal Hysterectomy leaving the ovaries intact\nD) High-dose continuous progestin therapy (Mirena)\n\n**Answer: A** — **Early-Stage Endometrial Cancer (Stage IA)**—The undisputed gold standard, curative primary surgical treatment is a **Total Extra-fascial Hysterectomy combined with Bilateral Salpingo-Oophorectomy (TAH+BSO)**. (Radical hysterectomy is an aggressive over-treatment reserved for cervical cancer).\n\n---\n\n### Q83. \n**A 25-year-old primigravida at 34 weeks gestation presents to the labor ward complaining of a severe, unremitting frontal headache, visual scotomas, and agonizing right upper quadrant abdominal pain. Her blood pressure is a staggering 185/115 mmHg, and she has 3+ proteinuria on dipstick. She is rapidly stabilized with IV Labetalol and a Magnesium Sulfate infusion. What is the SINGLE BEST definitive management?**\nA) Immediate delivery of the fetus via induction or Cesarean section\nB) Maintain the Magnesium infusion and attempt to push the pregnancy to 37 weeks\nC) Administer a heavy dose of IV Furosemide to reduce blood pressure\nD) Perform an emergency plasmapheresis\n\n**Answer: A** — **Severe Pre-eclampsia (with severe features)**—The presence of extreme hypertension (>160/110) coupled with end-organ damage (headache, RUQ pain/liver capsule distension) mandates **immediate, expedited delivery** regardless of gestational age, as it is the only definitive cure.\n\n---\n\n### Q84. \n**A 30-year-old female presents to the ER with agonizing, sudden-onset left lower quadrant abdominal pain and syncope. She missed her last menstrual period 6 weeks ago. Her heart rate is 130 bpm, and blood pressure is 85/50 mmHg. Transvaginal ultrasound demonstrates a massive 5 cm complex adnexal mass on the left, an empty uterus, and copious amounts of free echogenic fluid (blood) filling the Pouch of Douglas. What is the SINGLE BEST immediate management?**\nA) Emergency exploratory laparotomy or laparoscopy for salpingectomy\nB) Immediate intramuscular injection of Methotrexate\nC) Aggressive fluid resuscitation and close observation in the ICU\nD) Ultrasound-guided culdocentesis to drain the blood\n\n**Answer: A** — **Ruptured Ectopic Pregnancy in Hemorrhagic Shock**—The patient is actively bleeding to death. Methotrexate is absolutely contraindicated in ruptured/unstable patients. She must be rushed to the OR for an **emergency surgical intervention (salpingectomy)** to clamp the bleeding vessels.\n\n---\n\n### Q85. \n**A 35-year-old obese female with classic Polycystic Ovarian Syndrome (PCOS) presents for infertility treatment. She suffers from severe oligo-ovulation, cystic acne, and hirsutism. Her partner's semen analysis is normal, and her fallopian tubes are widely patent. What is the SINGLE BEST, evidence-based first-line oral medication to successfully induce ovulation and achieve a live birth?**\nA) Letrozole (an Aromatase Inhibitor)\nB) Clomiphene Citrate (a SERM)\nC) Metformin\nD) Exogenous Gonadotropin injections (FSH/LH)\n\n**Answer: A** — **PCOS Infertility**—Massive, randomized controlled trials have definitively proven that **Letrozole** yields significantly higher ovulation, pregnancy, and live-birth rates in women with PCOS compared to the historical standard, Clomiphene.\n\n---\n\n### Q86. \n**A 45-year-old nulliparous female presents with increasing abdominal girth, early satiety, and vague pelvic heaviness. A transvaginal ultrasound reveals a massive, 12 cm complex cystic mass replacing the right ovary, completely filled with thick, irregular solid components, highly vascular papillary projections, and thick septations. Serum CA-125 is 650 U/mL. What is the SINGLE BEST initial management?**\nA) Exploratory laparotomy for complete surgical staging and primary cytoreductive debulking\nB) Immediate initiation of Carboplatin/Paclitaxel systemic chemotherapy\nC) Curative whole-pelvis external beam radiotherapy\nD) Ultrasound-guided fine needle aspiration (FNA) of the cyst fluid for cytology\n\n**Answer: A** — **Epithelial Ovarian Carcinoma**—The mass is highly suspicious for malignancy. FNA is strictly contraindicated due to the massive risk of rupturing the capsule and spilling cancer cells throughout the abdomen. The gold standard is an **upfront exploratory laparotomy for surgical staging and maximum debulking**.\n\n---\n\n### Q87. \n**A 28-year-old primigravida at 28 weeks gestation with a twin pregnancy (diamniotic-dichorionic) presents with regular, painful uterine contractions occurring every 4 minutes. Her cervix is 3 cm dilated and 80% effaced. The physician decides to administer corticosteroids for fetal lung maturity and needs to delay delivery for 48 hours. What is the SINGLE BEST, safest first-line tocolytic agent to administer?**\nA) Oral Nifedipine (Calcium Channel Blocker)\nB) Intravenous Atosiban (Oxytocin antagonist)\nC) Continuous Magnesium Sulfate infusion\nD) Oral Indomethacin\n\n**Answer: A** — **Preterm Labor Tocolysis**—**Nifedipine** is the overwhelmingly preferred first-line tocolytic globally due to its excellent efficacy in halting contractions and its highly favorable maternal/fetal side-effect profile compared to beta-agonists or indomethacin.\n\n---\n\n### Q88. \n**A 32-year-old female with a history of a previous classical (vertical) cesarean section presents at 7 weeks gestation with mild spotting. A highly detailed transvaginal ultrasound reveals an empty uterine cavity, but a distinct gestational sac is seen implanted incredibly deep within the anterior myometrium, exactly nestled within the fibrous defect of her old surgical scar. Fetal cardiac activity is present. She is hemodynamically stable. What is the SINGLE BEST treatment to prevent a catastrophic uterine rupture?**\nA) Intramuscular or intra-sac injection of Methotrexate\nB) Immediate sharp Dilation and Curettage (D&C)\nC) Bilateral Uterine Artery Embolization (UAE)\nD) Emergency total hysterectomy\n\n**Answer: A** — **Cesarean Scar Ectopic Pregnancy**—This is a ticking time bomb for fatal hemorrhage. Because she is early and perfectly stable, medical termination using **Methotrexate** is the preferred uterus-sparing treatment. (D&C is contraindicated as scraping the scar will cause massive, uncontrollable hemorrhage).\n\n---\n\n### Q89. \n**A 30-year-old nulliparous female with a long history of crippling dysmenorrhea and dyspareunia presents for infertility evaluation. A pelvic ultrasound reveals a massive, 7 cm thick-walled, unilocular cystic mass in the left ovary filled with uniform, low-level homogeneous echoes (classic \"ground glass\" appearance). What is the SINGLE BEST surgical procedure to treat her pain and optimize her chances of natural conception?**\nA) Laparoscopic ovarian cystectomy (stripping of the cyst capsule from the ovary)\nB) Ultrasound-guided percutaneous drainage of the cyst fluid\nC) Left salpingo-oophorectomy\nD) Total Abdominal Hysterectomy\n\n**Answer: A** — **Endometrioma (\"Chocolate Cyst\") >4 cm**—Medical management will not shrink large endometriomas. To preserve her fertility while removing the pathology, a delicate **laparoscopic cystectomy** (excising the capsule while saving the healthy ovarian cortex) is the gold standard.\n\n---\n\n### Q90. \n**A 25-year-old female presents to the clinic 8 weeks after a confirmed complete hydatidiform molar pregnancy was evacuated via suction D&C. Her serial β-hCG levels had been dropping, but over the last 3 weeks, they have violently plateaued and are now rising rapidly, hitting 45,000 mIU/mL. She develops a sudden, severe bout of hemoptysis. A chest X-ray shows multiple, distinct \"cannonball\" nodules in both lung fields. What is the MOST LIKELY diagnosis?**\nA) Invasive mole (Chorioadenoma destruens)\nB) Gestational Choriocarcinoma\nC) Placental site trophoblastic tumor (PSTT)\nD) Primary squamous cell carcinoma of the lung\n\n**Answer: B** — **Gestational Choriocarcinoma**—A highly aggressive, fully malignant epithelial tumor of the trophoblast that rapidly invades the blood vessels. The combination of a wildly rising hCG following a molar pregnancy plus early, massive hematogenous spread to the lungs (hemoptysis) is practically pathognomonic.\n\n---\n\n### Q91. \n**A 68-year-old female presents to the dermatology clinic complaining of severe, unrelenting vulvar pruritus and exquisite pain during intercourse. Examination of the vulva reveals striking, paper-thin, stark-white, \"parchment-like\" plaques with severe atrophy of the labia minora, causing the introitus to significantly narrow. The vagina itself is completely spared. What is the SINGLE BEST, highly potent topical therapy?**\nA) Ultra-high-potency topical corticosteroids (e.g., Clobetasol propionate)\nB) Topical Estrogen cream\nC) Topical Clotrimazole\nD) Topical 5-Fluorouracil\n\n**Answer: A** — **Lichen Sclerosus**—A chronic, debilitating autoimmune inflammatory dermatosis of the anogenital skin. It carries a 4-5% risk of malignant transformation to Vulvar Squamous Cell Carcinoma. The absolute gold-standard therapy to halt progression and relieve itching is an **ultra-high-potency topical steroid like Clobetasol**.\n\n---\n\n### Q92. \n**A 40-year-old female with a known history of large, symptomatic intramural uterine fibroids presents with heavy, prolonged periods leading to a profound iron-deficiency anemia (Hb 7.2 g/dL). She absolutely desires to retain her uterus for future childbearing and refuses a hysterectomy. What is the SINGLE BEST definitive, uterus-sparing surgical management?**\nA) Open abdominal or laparoscopic Myomectomy\nB) Total Abdominal Hysterectomy\nC) Bilateral Uterine Artery Embolization (UAE)\nD) Global Endometrial Ablation\n\n**Answer: A** — **Symptomatic Fibroids in a patient desiring fertility**—While UAE and ablation treat the bleeding, they are strongly contraindicated if the patient wishes to conceive, as they destroy the uterine lining and blood supply. A **Myomectomy** physically removes the tumors while meticulously reconstructing the uterus for a future pregnancy.\n\n---\n\n### Q93. \n**A 28-year-old primigravida at 39 weeks gestation arrives at the labor ward in early labor. The physician performs Leopold maneuvers and a sterile vaginal exam, diagnosing a pure frank Footling Breech presentation (one foot protruding through the cervix). The fetal heart rate is reassuring. What is the SINGLE BEST, most absolute contraindication to attempting a vaginal delivery in this specific scenario?**\nA) A perfectly flexed fetal head\nB) The Footling breech presentation itself\nC) An estimated fetal weight of 3200 grams\nD) The patient being a multipara\n\n**Answer: B** — **Footling Breech Presentation**—While a *frank* breech (hips flexed, knees extended) or *complete* breech can sometimes be delivered vaginally by an expert, a **footling breech is an absolute, non-negotiable contraindication** due to the massive, deadly risk of umbilical cord prolapse past the small presenting foot.\n\n---\n\n### Q94. \n**A 30-year-old female with a BMI of 32 and a strong family history of Type 2 Diabetes presents for her first prenatal visit at 8 weeks gestation. A baseline fasting glucose is strictly normal. According to standard universal screening guidelines (ACOG/DIPSI), at what specific gestational age window MUST she undergo the definitive 75-gram, 2-hour Oral Glucose Tolerance Test (OGTT) to screen for Gestational Diabetes Mellitus (GDM)?**\nA) Between 24 and 28 weeks of gestation\nB) Between 12 and 16 weeks of gestation\nC) At exactly 36 weeks of gestation\nD) Immediately upon confirmation of pregnancy\n\n**Answer: A** — **GDM Screening Window**—Because insulin resistance peaks in the late second and early third trimesters due to maximum placental lactogen secretion, the universal, mandatory window to screen for GDM is **between 24 and 28 weeks of gestation**.\n\n---\n\n### Q95. \n**A 45-year-old female underwent radical pelvic radiotherapy 5 years ago for Stage IIB Cervical Cancer. She now presents with a 3-month history of severe, chronic, painless, bright red bleeding occurring exclusively from her rectum with every bowel movement. Colonoscopy reveals pale, friable rectal mucosa with dense networks of prominent telangiectatic vessels. What is the MOST LIKELY diagnosis?**\nA) Acute infectious colitis\nB) Ulcerative Colitis\nC) Chronic Radiation Proctitis\nD) An undiagnosed primary Rectal Adenocarcinoma\n\n**Answer: C** — **Chronic Radiation Proctitis**—A classic, dreaded late complication of pelvic radiation therapy. The radiation causes obliterative endarteritis, leading to chronic ischemia, mucosal friability, and the formation of fragile, bleeding **telangiectasias** in the rectum.\n\n---\n\n### Q96. \n**A 25-year-old primigravida at 32 weeks gestation with a known, severe history of Homozygous Sickle Cell Disease (HbSS) presents to the high-risk obstetrics triage. She complains of agonizing, unrelenting pain in her chest, back, and bilateral thighs. Her oxygen saturation is 96% on room air, and she has no fever or lung infiltrates. What is the SINGLE BEST, immediate multi-modal management strategy?**\nA) Immediate prophylactic Exchange Transfusion to drop HbS below 30%\nB) Aggressive IV Hydration + Supplemental Oxygen + potent IV Opioid Analgesia\nC) Initiation of high-dose oral Hydroxyurea\nD) Broad-spectrum IV Antibiotics\n\n**Answer: B** — **Acute Vaso-Occlusive Pain Crisis in Pregnancy**—The absolute bedrock of treating a sickle cell pain crisis is aggressive **supportive care: IV hydration (to reverse sickling), oxygen, and heavy opioid analgesia**. Exchange transfusion is reserved for life-threatening complications (e.g., severe acute chest syndrome or stroke).\n\n---\n\n### Q97. \n**A 30-year-old female undergoes a routine cervical cancer screening. The Pap smear cytology returns as \"Atypical Glandular Cells\" (AGC). This finding is far more concerning than typical squamous abnormalities. What is the SINGLE BEST, mandatory next step in the clinical evaluation of this specific result?**\nA) Immediate Colposcopy combined with Endocervical Curettage (ECC)\nB) Reflex testing for high-risk HPV DNA only\nC) Repeat the Pap smear in exactly 12 months\nD) Perform a Loop Electrosurgical Excision Procedure (LEEP) blindly\n\n**Answer: A** — **Atypical Glandular Cells (AGC)**—Glandular abnormalities strongly hint at severe occult pathology lurking higher up in the endocervical canal or endometrium (e.g., endocervical adenocarcinoma). Thus, a **colposcopy PLUS an endocervical curettage (ECC)** is absolutely mandatory to sample the canal.\n\n---\n\n### Q98. \n**A 60-year-old parous female who underwent a total vaginal hysterectomy 10 years ago for prolapse now presents complaining of a massive bulge protruding from her vagina. Examination reveals a complete, total eversion of the vaginal vault. The patient is highly active, healthy, and engages in regular sexual intercourse. What is the SINGLE BEST, most durable surgical management?**\nA) Abdominal or Laparoscopic Sacrocolpopexy\nB) Complete Colpocleisis (Le Fort procedure)\nC) Manchester repair\nD) Insertion of a Gellhorn pessary\n\n**Answer: A** — **Vaginal Vault Prolapse in a sexually active female**—The **Sacrocolpopexy** (suspending the vaginal apex to the anterior longitudinal ligament of the sacrum using synthetic mesh) is the absolute gold standard for achieving a durable, deep, and sexually functional vagina. (Colpocleisis surgically obliterates the vagina and is strictly for elderly, frail women who no longer desire intercourse).\n\n---\n\n### Q99. \n**A 28-year-old primigravida at 29 weeks gestation presents to labor and delivery triage complaining of vague lower abdominal cramping and increased pelvic pressure. She has had no bleeding or fluid leakage. The fetal monitor shows mild, irregular contractions. A sterile speculum exam reveals the cervix is visibly closed. A rapid, bedside biochemical swab of the cervicovaginal secretions is performed to assess the risk of imminent preterm delivery. What specific glycoprotein is being tested for its incredibly high Negative Predictive Value?**\nA) Fetal Fibronectin (fFN)\nB) Alpha-Fetoprotein (AFP)\nC) Human Placental Lactogen (hPL)\nD) Pregnancy-Associated Plasma Protein A (PAPP-A)\n\n**Answer: A** — **Fetal Fibronectin (fFN)**—A biological \"glue\" binding the fetal sac to the uterine lining. If the test is strictly *negative* between 22 and 34 weeks, there is a **>99% Negative Predictive Value** that the woman will NOT deliver within the next 7 to 14 days, safely allowing her to be discharged home.\n\n---\n\n### Q100. \n**A 35-year-old female presents to the ER with a high fever (39.5°C), severe lower pelvic pain, tachycardia, and a distinctly foul-smelling, purulent vaginal discharge. Three days ago, she underwent a routine suction Dilation and Curettage (D&C) in an outpatient clinic for a missed abortion at 9 weeks. On bimanual exam, the uterus is exquisitely tender to palpation. What is the MOST LIKELY diagnosis?**\nA) Post-abortal Endometritis\nB) Severe pelvic inflammatory disease (PID) from Chlamydia\nC) Systemic toxic shock syndrome\nD) Retained products of conception (RPOC) without infection\n\n**Answer: A** — **Post-abortal Endometritis**—A classic ascending polymicrobial infection of the decidua occurring a few days after an invasive instrumental procedure (like a D&C), presenting with the triad of **fever, severe uterine tenderness, and foul lochia/discharge**.\n\n---\n\n### Q101. \n**A 30-year-old female with primary infertility is undergoing aggressive ovulation induction with high-dose exogenous gonadotropins (FSH/LH injections) in preparation for IVF. Three days after the final \"trigger\" injection of hCG, she presents to the ER with massive, sudden abdominal distension, severe nausea, vomiting, dyspnea, and oliguria. Ultrasound reveals massive, bilaterally enlarged ovaries (15 cm) and massive ascites. What is the specific, life-threatening iatrogenic syndrome she has developed?**\nA) Ovarian Hyperstimulation Syndrome (OHSS)\nB) Ruptured bilateral endometriomas\nC) Meigs' syndrome\nD) Acute severe Pelvic Inflammatory Disease (PID)\n\n**Answer: A** — **Ovarian Hyperstimulation Syndrome (OHSS)**—A severe, potentially fatal complication of aggressive IVF stimulation. The trigger dose of hCG causes massive overproduction of VEGF, resulting in explosive capillary leak, massive ascites, pleural effusions, hypovolemic shock, and renal failure.\n\n---\n\n### Q102. \n**A 25-year-old female with a history of a previous ectopic pregnancy presents at 6 weeks gestation with mild spotting. She is anxious. To definitively rule out an ectopic pregnancy at this ultra-early stage, what is the SINGLE BEST, most reliable combined diagnostic protocol?**\nA) Serial quantitative β-hCG blood levels paired with a high-resolution Transvaginal Ultrasound (TVS)\nB) A single serum Progesterone level\nC) Blind ultrasound-guided Culdocentesis to check for blood\nD) Immediate Diagnostic Laparoscopy\n\n**Answer: A** — **Early Pregnancy Location**—The absolute gold standard is tracking **serial β-hCG levels** (which should appropriately double every 48 hours) and correlating them with a **Transvaginal Ultrasound**. Once the β-hCG hits the discriminatory zone (~1500-2000 mIU/mL), an intrauterine sac MUST be visible on TVS; if it is missing, an ectopic is highly suspected.\n\n---\n\n### Q103. \n**A 55-year-old female presents with a 2-month history of painless, spontaneous postmenopausal bleeding. She has a BMI of 38 and a history of Type 2 Diabetes. A transvaginal ultrasound reveals an abnormally thickened endometrial stripe measuring 12 mm. What is the SINGLE BEST, mandatory next diagnostic step?**\nA) In-office Endometrial Biopsy (Pipelle)\nB) Diagnostic Hysteroscopy under general anesthesia\nC) Routine observation and repeat ultrasound in 6 months\nD) Immediate initiation of high-dose cyclical hormonal therapy\n\n**Answer: A** — **Postmenopausal Bleeding**—Any bleeding after menopause is endometrial cancer until proven otherwise. An ultrasound thickness >4 mm mandates histological sampling. An **in-office endometrial biopsy (Pipelle)** is highly sensitive, fast, and the absolute required next step.\n\n---\n\n### Q104. \n**A 25-year-old female, G1P1, just delivered a healthy 9 lb baby via a rapid, spontaneous vaginal delivery. During the active management of the third stage of labor, the resident pulls firmly and aggressively on the umbilical cord while the uterus is fully relaxed. Suddenly, the patient screams in agony, experiences massive hemorrhage, and goes into profound hemorrhagic shock. The nurse shouts that a large, purplish, bleeding, pear-shaped mass is now protruding fully out of the vagina. What is the SINGLE BEST, immediate, life-saving physical maneuver?**\nA) The Johnson Maneuver (Manual replacement of the inverted uterus)\nB) Immediate administration of a massive 40-unit IV Oxytocin bolus\nC) The McRoberts Maneuver\nD) Bimanual uterine massage\n\n**Answer: A** — **Uterine Inversion**—An iatrogenic disaster caused by cord traction on an uncontracted uterus. The uterus has turned inside out. The absolute first, life-saving step is the **Johnson maneuver**: forming a fist and forcefully punching the fundus upward through the vagina back into its normal anatomical position BEFORE the cervical ring clamps shut. (Oxytocin must NOT be given until the uterus is replaced).\n\n---\n\n### Q105. \n**A 28-year-old primigravida at 40 weeks is in active labor. The continuous fetal monitor shows a perfectly smooth, undulating, sine-wave-like baseline pattern with a frequency of 3-5 cycles per minute. There is an absolute loss of all beat-to-beat variability, and there are no accelerations. This pattern persists for 30 minutes. What does this ominous \"sinusoidal pattern\" almost universally indicate, requiring an emergency delivery?**\nA) Severe, profound fetal anemia or severe fetal hypoxia/asphyxia\nB) Fetal head compression during a contraction\nC) Normal, benign fetal sleep cycles\nD) Transient umbilical cord compression\n\n**Answer: A** — **Sinusoidal Fetal Heart Rate Pattern**—A terrifying, highly specific sign. It almost exclusively indicates impending fetal death due to **severe fetal anemia (e.g., massive fetomaternal hemorrhage, ruptured vasa previa, Rh alloimmunization)** or profound, terminal fetal asphyxia. Immediate emergency delivery is mandatory.\n\n---\n\n### Q106. \n**A 30-year-old female with a known history of a symptomatic 1.5 cm pituitary macroadenoma causing severe hyperprolactinemia, galactorrhea, and amenorrhea has been successfully treated with oral Cabergoline for 2 years. She joyfully returns to the clinic reporting a positive home pregnancy test. To minimize fetal drug exposure while managing her tumor, what is the SINGLE BEST pharmacological management step upon confirmation of pregnancy?**\nA) Immediately stop the Cabergoline and monitor her clinically for tumor expansion\nB) Continue the Caber
